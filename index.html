    const qty = sales.reduce((s, o) => s + o.qty, 0);
    const sum = sales.reduce((s, o) => s + Number(o.amount || 0), 0);
    const bonus = Math.round(sum * CFG.bonusPercent / 100);
    const missing = rack.items.reduce((s, i) => s + (i.max - i.qty), 0);
    const income = todayOps.filter(o => o.type === 'restock' || o.type === 'delivery')
      .reduce((s, o) => s + o.qty, 0);

    $('side').innerHTML =
      '<section class="card shift-card stack-sm" style="gap:18px">' +
        '<span class="display" style="font-size:14px;font-weight:600">Итоги смены</span>' +
        '<div><div class="label">Продано</div>' +
          '<div class="mono" style="font-size:30px;font-weight:600">' + qty +
          ' <span style="font-size:16px;color:#6B5F3A">шт</span></div></div>' +
        '<div><div class="label">Выручка</div>' +
          '<div class="mono" style="font-size:24px;font-weight:600">' + UI.money(sum) + '</div></div>' +
        (income ? '<div><div class="label">Принято за смену</div>' +
          '<div class="mono" style="font-size:18px;font-weight:600;color:#3DDC84">+' + income + ' шт</div></div>' : '') +
        '<div class="row-between" style="border-top:1px solid #2A2412;padding-top:14px">' +
          '<span style="font-size:13px;color:#B9C6DA">Ваш бонус ' + CFG.bonusPercent + '%</span>' +
          '<span class="mono" style="font-size:16px;font-weight:600;color:#F2B705">' + UI.money(bonus) + '</span>' +
        '</div>' +
      '</section>' +

      '<section class="card stack-sm" style="gap:14px">' +
        '<span class="display" style="font-size:14px;font-weight:600">Пополнение</span>' +
        (() => {
          const s = supplyState();
          return '<div class="supply ' + s.cls + '">' +
            '<span class="ic">' + UI.icon(s.icon, 17, s.color) + '</span>' +
            '<div style="min-width:0"><b>' + UI.esc(s.title) + '</b>' +
            '<small>' + UI.esc(s.sub) + '</small></div></div>';
        })() +
        (packedItems()
          ? '<button class="btn btn-primary btn-block" id="btnDelivery">' + UI.esc(CFG.texts.deliveryBtn) + '</button>'
          : '<button class="btn btn-ghost btn-block" id="btnDelivery" disabled>' + UI.esc(CFG.texts.deliveryBtn) + '</button>' +
            '<span style="font-size:11px;color:#64748B;text-align:center">Кнопка оживёт, когда администратор соберёт поставку</span>') +
      '</section>' +

      UI.contactsCard({ chat: true, unread: window.LC_CHAT.unread() }) +

      '<section class="card flat stack-sm" style="gap:9px">' +
        '<span style="font-size:12px;font-weight:600;color:#F2B705;letter-spacing:.06em;text-transform:uppercase">Подсказка</span>' +
        '<span style="font-size:13px;color:#8494AC;line-height:1.55">' + UI.esc(CFG.texts.hint) + '</span>' +
      '</section>';
  }

  /* ---------------- действия ---------------- */

  async function act(fn, okText) {
    if (busy) return;
    busy = true;
    try {
      const res = await fn();
      await refresh();
      if (okText) UI.toast(typeof okText === 'function' ? okText(res) : okText, 'ok');
    } catch (err) {
      UI.toast(err.message || 'Не получилось', 'err');
    } finally {
      busy = false;
    }
  }

  const itemById = (id) => rack.items.find(i => i.id === id) || null;

  async function sell(itemId) {
    const it = itemById(itemId);
    if (!it) return;
    await act(
      () => STORE.changeQty(itemId, -1, { type: 'sale', user_login: user.login, user_name: user.name }),
      'Продажа записана: ' + it.name + ' · ' + UI.money(it.price)
    );
  }

  async function requestRestock(preselect) {
    if (openRequest) { UI.toast('Заявка уже отправлена, администратор её видит', 'ok'); return; }
    const low = rack.items.filter(i => UI.itemStatus(i) !== 'ok');
    const listed = (preselect ? rack.items.filter(i => i.id === preselect) : low);
    const names = (listed.length ? listed : rack.items)
      .map(i => [i.name, i.brand].filter(Boolean).join(' ') + ' (' + i.qty + '/' + i.max + ')');

    await UI.modal({
      title: 'Запросить пополнение',
      subtitle: rack.code + ' · ' + rack.station,
      body:
        '<div class="stack-sm" style="gap:14px">' +
        '<div style="font-size:13px;color:#8494AC">Администратор увидит заявку сразу и добавит вашу точку в маршрут.</div>' +
        '<div class="card flat stack-sm" style="gap:7px;padding:13px 14px">' +
          names.map(n => '<div style="font-size:13px">• ' + UI.esc(n) + '</div>').join('') +
        '</div>' +
        '<div class="field"><label for="req-note">Комментарий (не обязательно)</label>' +
        '<input class="input sm" id="req-note" placeholder="Например: нужно до пятницы"></div>' +
        '</div>',
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Отправить заявку', kind: 'btn-warn',
          onClick: (root) => {
            const note = root.querySelector('#req-note').value.trim() || names.slice(0, 3).join(', ');
            act(() => STORE.createRequest(rack.code, note, user), 'Заявка отправлена администратору');
            return true;
          }
        }
      ]
    });
  }

  /** Что администратор собрал для этой точки. null — принимать нечего. */
  function packedItems() {
    return openRequest && openRequest.status === 'packed' && Array.isArray(openRequest.packed_items) &&
      openRequest.packed_items.some(x => Number(x.qty) > 0) ? openRequest.packed_items : null;
  }

  /** Приём поставки — то же окно со счётчиками, что у администратора. */
  async function acceptDelivery() {
    // если администратор отметил, что именно собрал, — подставляем эти цифры и не даём принять больше
    // Принять можно ТОЛЬКО то, что администратор отметил собранным. Из ниоткуда товар на полку не попадёт:
    // склад и закупки ведёт администратор, продавец лишь подтверждает, что привезли.
    const packed = packedItems();
    if (!packed) {
      UI.toast(openRequest && openRequest.status === 'packed'
        ? 'В сборке не указано, что везут. Попросите администратора заново нажать «Поставка собрана».'
        : 'Принимать нечего: администратор ещё не собрал поставку для вашей точки.', 'err');
      return;
    }
    const cap = {};
    if (packed) packed.forEach(x => { cap[x.item_id] = (cap[x.item_id] || 0) + (Number(x.qty) || 0); });
    const plan = await window.LC_ADMIN.fillModal({
      rack,
      title: 'Принять поставку',
      subtitle: 'Администратор собрал ' + packed.reduce((s, x) => s + (Number(x.qty) || 0), 0) +
        ' шт. Проверьте, что привезли, — если меньше, уменьшите число. Больше собранного принять нельзя.',
      okLabel: 'Принял, всё на полке',
      initial: cap,
      cap: cap,
      hideCost: true
    });
    if (!plan) return;
    await act(
      () => STORE.restock(rack.code, plan, { type: 'delivery', user_login: user.login, user_name: user.name }),
      (res) => 'Поставка принята: +' + res.qty + ' шт'
    );
  }

  async function auditModal() {
    await UI.modal({
      title: 'Сверка остатков',
      subtitle: 'Пересчитайте канистры и впишите, сколько на самом деле. Если канистр БОЛЬШЕ, чем в системе, — скажите администратору.',
      wide: true,
      noFocus: true,
      body: '<div class="stack-sm" style="gap:0">' + rack.items.map(i =>
        '<div class="fill-row">' +
          '<div class="t"><b>' + UI.esc(i.name) + '</b>' +
            '<small>' + UI.esc([i.brand, i.volume].filter(Boolean).join(' · ')) + '</small></div>' +
          '<div class="have">в системе<br><span style="color:#B9C6DA">' + i.qty + ' из ' + i.max + '</span></div>' +
          UI.stepper(i.id, i.qty, i.qty) +
        '</div>').join('') + '</div>',
      onOpen: (root) => { UI.bindSteppers(root); },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Сохранить факт', kind: 'btn-primary',
          onClick: (root) => {
            const vals = UI.stepperValues(root);
            act(async () => {
              let changed = 0;
              for (const id of Object.keys(vals)) {
                const item = itemById(id);
                if (!item || vals[id] === item.qty) continue;
                await STORE.setQty(id, vals[id], {
                  type: 'audit', user_login: user.login, user_name: user.name, note: 'сверка'
                });
                changed++;
              }
              if (!changed) throw new Error('Расхождений нет — всё сходится');
              return changed;
            }, (n) => 'Сверка сохранена, исправлено позиций: ' + n);
            return true;
          }
        }
      ]
    });
  }

  /* ---------------- события ---------------- */

  function bind() {
    $('btnRequest').innerHTML = UI.icon('warn', 15) + '<span>' + UI.esc(CFG.texts.requestBtn) + '</span>';
    $('btnRequest').addEventListener('click', () => rack && requestRestock(null));
    $('btnAudit').addEventListener('click', () => rack && auditModal());

    $('rackPhoto').addEventListener('click', () => {
      if (rack && rack.photo) UI.photoModal(rack.photo, rack.code + ' · ' + rack.station);
    });

    $('goods').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'sell') sell(b.dataset.item);
      if (b.dataset.act === 'request') requestRestock(b.dataset.item);
    });

    $('log').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act="cancel"]');
      if (!b) return;
      act(() => STORE.cancelOp(b.dataset.op, user), 'Продажа отменена, товар вернулся на полку');
    });

    $('side').addEventListener('click', (e) => {
      if (e.target.closest('#btnDelivery')) acceptDelivery();
      if (e.target.closest('[data-open-chat]')) window.LC_CHAT.openDrawer();
    });
  }

  /* ---------------- разметка страницы ---------------- */

  const template = () =>
    '<main class="page">' +
      '<div class="page-head">' +
        '<div><h1>' + UI.esc(CFG.texts.sellerTitle) + '</h1>' +
        '<p>' + UI.esc(CFG.texts.sellerSubtitle) + '</p></div>' +
        '<div class="page-actions">' +
          '<button class="btn btn-ghost" id="btnAudit">' + UI.esc(CFG.texts.auditBtn) + '</button>' +
          '<button class="btn btn-warn" id="btnRequest"></button>' +
        '</div>' +
      '</div>' +
      '<div class="split">' +
        '<div class="stack">' +
          '<div class="section-head">' +
            '<h2 id="rackTitle">Мой стеллаж</h2>' +
            '<span class="mono" style="font-size:12px;color:#64748B" id="rackMeta"></span>' +
          '</div>' +
          '<div id="rackPhoto"></div>' +
          '<div class="goods-grid" id="goods"></div>' +
          '<section class="card stack-sm" style="margin-top:4px">' +
            '<div class="row-between">' +
              '<span class="display" style="font-size:15px;font-weight:600">Продажи за смену</span>' +
              '<span style="font-size:12px;color:#64748B" id="todayDate"></span>' +
            '</div>' +
            '<div id="log"></div>' +
          '</section>' +
        '</div>' +
        '<aside class="stack" id="side"></aside>' +
      '</div>' +
    '</main>';

  /* ---------------- запуск ---------------- */

  async function mount(currentUser) {
    user = currentUser;
    UI.applyTheme();
    document.title = CFG.texts.sellerTitle + ' — ' + CFG.texts.brand;
    $('view').innerHTML = template();
    UI.renderTopbar($('topbar'), user, {
      rackLabel: user.rack || '—',
      rackTitle: '',
      right: '<div class="row shift-chip" style="gap:8px;height:30px;padding:0 12px;border-radius:999px;' +
        'background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.24)">' +
        '<span style="width:7px;height:7px;border-radius:999px;background:var(--green)"></span>' +
        '<span style="font-size:12px;font-weight:600;color:var(--green);white-space:nowrap">' +
        UI.esc(CFG.texts.shiftOpen) + '</span></div>'
    });
    UI.modeBanner(user);
    bind();
    await refresh();
    if (rack) {
      const el = $('topbar').querySelector('.row span[style*="ellipsis"]');
      if (el) el.textContent = rack.station + (rack.address ? ' · ' + rack.address : '');
    }
    STORE.onChange(refresh);
    setInterval(renderLog, 30000);
    window.LC_CHAT.init(user, { fab: true, onBadge: () => { if (rack) renderSide(); else render(); } }).catch(() => {});
  }

  return { mount };
})();



/* ============================================================
   Lube Control — РАБОЧЕЕ МЕСТО КУРЬЕРА
   Видит все точки и склад в штуках. Собирает поставку (не больше, чем
   свободно на складе и влезает на полку), везёт и ставит на полку.
   Денег не видит: ни закупочных цен, ни выручки. Продавать не может.
   ============================================================ */

window.LC_COURIER = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;
  const $ = (id) => document.getElementById(id);

  let user = null;
  let racks = [], requests = [], catalog = [];
  let stock = {};
  let stockErr = '';
  let busy = false;

  async function load() {
    const [r, q, c] = await Promise.all([STORE.getRacks(), STORE.getRequests(true), STORE.getCatalog()]);
    racks = r; requests = q; catalog = c;
    try { stock = (await STORE.getStock()).qty; stockErr = ''; }
    catch (e) { stock = {}; stockErr = e.message; }
  }

  async function refresh() {
    try { await load(); render(); }
    catch (err) { UI.toast('Не удалось обновить данные: ' + err.message, 'err'); }
  }

  /** Свободно на складе, не считая сборку точки exceptRack. */
  function free(exceptRack) {
    const res = STORE.reservedFrom(requests, racks, exceptRack);
    const out = {};
    Object.keys(stock).forEach(k => { out[k] = stock[k] - (res[k] || 0); });
    return out;
  }

  const packedOf = (code) => requests.find(r => r.rack_code === code && r.status === 'packed') || null;
  const requestOf = (code) => requests.find(r => r.rack_code === code && r.status !== 'packed') || null;
  const packedList = (req) => (req && Array.isArray(req.packed_items) ? req.packed_items.filter(x => Number(x.qty) > 0) : []);
  const mapLink = (r) => 'https://yandex.ru/maps/?text=' + encodeURIComponent([r.address, r.station].filter(Boolean).join(', '));

  /* ---------------- отрисовка ---------------- */

  function render() {
    const fr = free();
    const van = racks.map(r => ({ r, req: packedOf(r.code) })).filter(x => x.req && packedList(x.req).length);
    const todo = racks.map(r => ({
      r,
      req: requestOf(r.code),
      need: r.items.reduce((s, i) => s + (i.max - i.qty), 0),
      empty: r.items.filter(i => i.qty <= 0).length,
      st: UI.rackStatus(r)
    })).filter(x => !packedOf(x.r.code) && (x.req || x.st !== 'ok'))
      .sort((a, b) => (b.req ? 1 : 0) - (a.req ? 1 : 0) || b.empty - a.empty || b.need - a.need);

    const vanQty = van.reduce((s, x) => s + packedList(x.req).reduce((t, y) => t + (Number(y.qty) || 0), 0), 0);
    const freeQty = Object.keys(fr).reduce((s, k) => s + Math.max(0, fr[k]), 0);

    // что взять со склада в машину — всё по всем собранным точкам
    const load = {};
    van.forEach(x => packedList(x.req).forEach(y => {
      const k = y.name || y.item_id;
      load[k] = (load[k] || 0) + (Number(y.qty) || 0);
    }));

    $('view').innerHTML =
      '<main class="page">' +
        '<div class="page-head"><div><h1>Доставка</h1>' +
          '<p>Соберите поставку со склада, отвезите и поставьте на полку — продавец и администратор увидят сразу.</p></div></div>' +
        (stockErr ? '<div class="card flat" style="font-size:13px;color:var(--red)">' + UI.esc(stockErr) + '</div>' : '') +
        '<section class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">' +
          kpi('В машине', vanQty + '<small> шт</small>', vanQty ? 'var(--amber)' : '') +
          kpi('Точек отвезти', van.length) +
          kpi('Ждут сборки', todo.length, todo.length ? 'var(--orange)' : '') +
          kpi('Свободно на складе', freeQty + '<small> шт</small>', freeQty ? 'var(--green)' : 'var(--red)') +
        '</section>' +
        '<div id="courierContacts">' + UI.contactsCard({ chat: true, unread: window.LC_CHAT.unread() }) + '</div>' +

        '<section class="stack-sm" style="gap:10px">' +
          '<div class="section-head"><h2>Везу — поставить на полку</h2></div>' +
          (van.length
            ? '<div class="courier-grid">' + van.map(x => vanCard(x.r, x.req)).join('') + '</div>' +
              '<details class="card flat" style="font-size:13px"><summary style="cursor:pointer;color:var(--amber)">' +
                'Что взять со склада — всего ' + vanQty + ' шт</summary><div class="stack-sm" style="gap:5px;margin-top:10px">' +
                Object.keys(load).sort().map(k => '<div class="row-between"><span>' + UI.esc(k) + '</span><b class="mono">' + load[k] + ' шт</b></div>').join('') +
              '</div></details>'
            : '<div class="empty-state" style="padding:22px">Собранных поставок нет. Соберите из списка ниже.</div>') +
        '</section>' +

        '<section class="stack-sm" style="gap:10px">' +
          '<div class="section-head"><h2>Нужно собрать</h2><span style="font-size:12px;color:#64748B">сначала заявки и пустые полки</span></div>' +
          (todo.length
            ? '<div class="courier-grid">' + todo.map(x => todoCard(x, fr)).join('') + '</div>'
            : '<div class="empty-state" style="padding:22px">Все полки в порядке — везти никуда не нужно.</div>') +
        '</section>' +

        '<section class="stack-sm" style="gap:10px">' +
          '<div class="section-head"><h2>Склад</h2><span style="font-size:12px;color:#64748B">свободно = на складе минус уже собранное</span></div>' +
          stockTable(fr) +
        '</section>' +
      '</main>';
  }

  function kpi(label, value, color) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span></div>';
  }

  function head(r, pill) {
    return '<div class="row-between" style="gap:10px;align-items:flex-start">' +
      '<div class="row" style="gap:10px;min-width:0;align-items:flex-start"><span class="rack-code">' + UI.esc(r.code) + '</span>' +
        '<div style="min-width:0"><b style="font-size:14px">' + UI.esc(r.station) + '</b>' +
          (r.address ? '<div style="font-size:12px;color:#8494AC">' + UI.esc(r.address) + ' · ' +
            '<a href="' + mapLink(r) + '" target="_blank" rel="noopener" style="color:var(--amber)">на карте</a></div>' : '') +
          (r.operator ? '<div style="font-size:11px;color:#64748B">продавец: ' + UI.esc(r.operator) + '</div>' : '') +
        '</div></div>' + (pill || '') + '</div>';
  }

  function vanCard(r, req) {
    const list = packedList(req);
    return '<article class="card stack-sm" style="gap:12px;border-color:rgba(242,183,5,.35)">' +
      head(r, '<span class="pill sm ok">в машине</span>') +
      '<div class="stack-sm" style="gap:5px">' + list.map(x =>
        '<div class="row-between" style="font-size:13px"><span>' + UI.esc(x.name || '—') + '</span><b class="mono">' + x.qty + ' шт</b></div>').join('') +
      '</div>' +
      '<div style="font-size:11px;color:#64748B">Собрано ' + UI.ago(req.packed_at) + (req.packed_by ? ' · ' + UI.esc(req.packed_by) : '') + '</div>' +
      '<div class="row" style="gap:8px">' +
        '<button class="btn btn-ghost btn-sm" data-act="pack" data-rack="' + UI.esc(r.code) + '">Изменить сборку</button>' +
        '<button class="btn btn-primary btn-sm grow" data-act="deliver" data-rack="' + UI.esc(r.code) + '">Поставил на полку</button>' +
      '</div>' +
    '</article>';
  }

  function todoCard(x, fr) {
    const r = x.r;
    const rows = r.items.filter(i => i.max > i.qty);
    const canAny = rows.some(i => (fr[i.catalog_id] || 0) > 0);
    return '<article class="card stack-sm" style="gap:12px">' +
      head(r, x.req ? '<span class="pill sm empty">заявка</span>' : '<span class="pill sm ' + x.st + '">' + UI.RACK_LABEL[x.st] + '</span>') +
      (x.req && x.req.note ? '<div style="font-size:12px;color:#B9C6DA">«' + UI.esc(x.req.note) + '»</div>' : '') +
      '<div class="stack-sm" style="gap:5px">' + rows.map(i => {
        const f = Math.max(0, fr[i.catalog_id] || 0);
        return '<div class="row-between" style="font-size:13px;gap:10px"><span class="ellipsis">' + UI.esc(i.name) +
          ' <small style="color:#64748B">' + i.qty + '/' + i.max + '</small></span>' +
          '<span class="mono" style="white-space:nowrap">+' + (i.max - i.qty) +
            ' <small style="color:' + (f ? '#64748B' : 'var(--red)') + '">склад ' + f + '</small></span></div>';
      }).join('') + '</div>' +
      '<button class="btn ' + (canAny ? 'btn-warn' : 'btn-ghost') + ' btn-sm btn-block" data-act="pack" data-rack="' + UI.esc(r.code) + '"' +
        (canAny ? '' : ' disabled') + '>' + (canAny ? 'Собрать поставку' : 'На складе нет нужного') + '</button>' +
    '</article>';
  }

  function stockTable(fr) {
    const res = STORE.reservedFrom(requests, racks);
    const rows = catalog.filter(c => !c.archived && ((stock[c.id] || 0) > 0 || (res[c.id] || 0) > 0))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!rows.length) return '<div class="empty-state" style="padding:22px">Склад пустой.</div>';
    return '<div class="grid-wrap"><table class="grid" style="min-width:520px"><thead><tr>' +
      '<th>Товар</th><th>Объём</th><th class="r">На складе</th><th class="r">Собрано</th><th class="r">Свободно</th>' +
      '</tr></thead><tbody>' + rows.map(c =>
        '<tr><td><div class="prod"><b>' + UI.esc(c.name) + '</b><small>' + UI.esc(c.brand || '') + '</small></div></td>' +
        '<td>' + UI.esc(c.volume || '—') + '</td>' +
        '<td class="r">' + Math.max(0, stock[c.id] || 0) + '</td>' +
        '<td class="r" style="color:var(--amber)">' + (res[c.id] || '—') + '</td>' +
        '<td class="r"><b style="color:' + ((fr[c.id] || 0) > 0 ? 'var(--green)' : '#4B5A75') + '">' + Math.max(0, fr[c.id] || 0) + '</b></td></tr>').join('') +
      '</tbody></table></div>';
  }

  /* ---------------- действия ---------------- */

  async function act(fn, okText) {
    if (busy) return;
    busy = true;
    try {
      const res = await fn();
      await refresh();
      if (okText) UI.toast(typeof okText === 'function' ? okText(res) : okText, 'ok');
    } catch (err) {
      UI.toast(err.message || 'Не получилось', 'err');
    } finally { busy = false; }
  }

  async function pack(code) {
    const r = racks.find(x => x.code === code);
    if (!r) return;
    const cur = packedOf(code);
    const avail = free(code);
    const initial = {};
    if (cur) packedList(cur).forEach(x => { initial[x.item_id] = Number(x.qty) || 0; });
    else r.items.forEach(i => { initial[i.id] = Math.min(i.max - i.qty, Math.max(0, avail[i.catalog_id] || 0)); });
    const plan = await window.LC_ADMIN.fillModal({
      rack: r,
      title: (cur ? 'Изменить сборку для ' : 'Собрать поставку для ') + r.code,
      subtitle: r.station + ' · положите в машину и отметьте, сколько взяли. Больше, чем свободно на складе, собрать нельзя.',
      okLabel: 'Собрано, везу',
      stock: avail, initial, hideCost: true
    });
    if (!plan) return;
    const items = plan.map(p => {
      const it = r.items.find(i => i.id === p.item_id);
      return { item_id: p.item_id, catalog_id: it ? it.catalog_id : null, name: it ? it.name : '', qty: p.add };
    });
    await act(() => STORE.markPacked(code, user, null, items, !!cur),
      'Собрано ' + items.reduce((s, x) => s + x.qty, 0) + ' шт для ' + code + ' — продавец видит «везём к вам»');
  }

  async function deliver(code) {
    const r = racks.find(x => x.code === code);
    const req = packedOf(code);
    if (!r || !req) return;
    const cap = {};
    packedList(req).forEach(x => { cap[x.item_id] = (cap[x.item_id] || 0) + (Number(x.qty) || 0); });
    const plan = await window.LC_ADMIN.fillModal({
      rack: r,
      title: 'Поставить на полку · ' + r.code,
      subtitle: r.station + ' · отметьте, сколько реально поставили. Не поместилось или разбилось — уменьшите число.',
      okLabel: 'Поставил на полку',
      initial: cap, cap, hideCost: true
    });
    if (!plan) return;
    await act(() => STORE.restock(code, plan, { type: 'delivery', user_login: user.login, user_name: user.name, note: 'доставил курьер' }),
      (res) => 'На полке ' + code + ': +' + res.qty + ' шт');
  }

  function bind() {
    $('view').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'pack') pack(b.dataset.rack);
      if (b.dataset.act === 'deliver') deliver(b.dataset.rack);
    });
    $('view').addEventListener('click', (e) => {
      if (e.target.closest('[data-open-chat]')) window.LC_CHAT.openDrawer();
    });
  }

  async function mount(currentUser) {
    user = currentUser;
    UI.applyTheme();
    document.title = 'Доставка — ' + CFG.texts.brand;
    UI.renderTopbar($('topbar'), user, {
      right: '<span class="pill sm neutral" style="color:#7C8CF8">курьер</span>'
    });
    UI.modeBanner(user);
    bind();
    await refresh();
    STORE.onChange(refresh);
    window.LC_CHAT.init(user, {
      fab: true,
      onBadge: () => {
        const box = $('courierContacts');
        if (box) box.innerHTML = UI.contactsCard({ chat: true, unread: window.LC_CHAT.unread() });
      }
    }).catch(() => {});
  }

  return { mount };
})();



/* ============================================================
   Lube Control — переключение экранов
   ============================================================ */

(function () {
  const UI = window.LC_UI;
  const AUTH = window.LC_AUTH;
  const STORE = window.LC_STORE;
  const $ = (id) => document.getElementById(id);

  const loginScreen = $('loginScreen');
  const shell = $('shell');
  const form = $('loginForm');
  const loginInput = $('login');
  const pwInput = $('password');
  const errBox = $('loginError');
  const submitBtn = $('submitBtn');
  const pwToggle = $('pwToggle');

  /* ---------- цвета и название из настроек ---------- */

  UI.applyTheme();

  /* ---------- показать / скрыть пароль ---------- */

  let shown = false;
  const paintToggle = () => { pwToggle.innerHTML = UI.icon(shown ? 'eyeOff' : 'eye', 17); };
  paintToggle();
  pwToggle.addEventListener('click', () => {
    shown = !shown;
    pwInput.type = shown ? 'text' : 'password';
    pwToggle.setAttribute('aria-label', shown ? 'Скрыть пароль' : 'Показать пароль');
    paintToggle();
    pwInput.focus();
  });

  /* ---------- ошибки ---------- */

  function showError(text) { errBox.textContent = text; errBox.classList.remove('hidden'); }
  function hideError() { errBox.classList.add('hidden'); }
  loginInput.addEventListener('input', hideError);
  pwInput.addEventListener('input', hideError);

  /* ---------- вход ---------- */

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const login = loginInput.value.trim();
    const pass = pwInput.value;
    if (!login || !pass) { showError('Заполните логин и пароль'); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>';
    try {
      const user = await AUTH.signIn(login, pass);
      enter(user);
    } catch (err) {
      showError(err.message || 'Не удалось войти');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Войти';
      pwInput.select();
    }
  });

  /* ---------- экраны ---------- */

  async function enter(user) {
    // общие настройки (бонус, пороги, надписи) — из базы, одинаковые у всех
    try { await AUTH.withTimeout(STORE.loadSettings(user), 6000, 'настройки'); } catch (e) { /* работаем на config.js */ }
    UI.applyTheme();
    loginScreen.classList.add('hidden');
    shell.classList.remove('hidden');
    pwInput.value = '';
    if (user.role === 'admin') window.LC_ADMIN.mount(user);
    else if (user.role === 'courier') window.LC_COURIER.mount(user);
    else window.LC_SELLER.mount(user);
  }

  function showLogin() {
    shell.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Войти';
    setTimeout(() => loginInput.focus(), 60);
  }

  /* ---------- старт ---------- */

  AUTH.current()
    .then(user => { if (user) enter(user); else showLogin(); })
    .catch(() => showLogin());

  void STORE;
})();

</script>
