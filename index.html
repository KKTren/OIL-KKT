  /* ---------------- тема из настроек ---------------- */

  /** Красит сайт по CFG.colors и подставляет надписи. Зовётся при старте и после правок. */
  function applyTheme() {
    const root = document.documentElement.style;
    const c = CFG.colors || {};
    const map = {
      '--amber': c.amber, '--green': c.green, '--orange': c.orange, '--red': c.red,
      '--bg': c.bg, '--card': c.card, '--line': c.line
    };
    Object.keys(map).forEach(k => { if (map[k]) root.setProperty(k, map[k]); });
    if (c.amber) root.setProperty('--amber-2', lighten(c.amber, 14));

    const brand = (CFG.texts && CFG.texts.brand) || 'Lube Control';
    document.querySelectorAll('#brandName, [data-brand]').forEach(el => { el.textContent = brand; });
    if (!document.title || /Lube Control|—/.test(document.title)) {
      const tail = document.title.split('—')[0].trim();
      document.title = tail && tail !== document.title ? tail + ' — ' + brand : brand;
    }
  }

  function lighten(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const up = (v) => Math.min(255, Math.round(v + (255 - v) * amount / 100));
    const r = up((n >> 16) & 255), g = up((n >> 8) & 255), b = up(n & 255);
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* ---------------- фото стеллажа ---------------- */

  /** Ужимает выбранный файл до ширины maxW и возвращает data:image/jpeg. */
  function compressImage(file, maxW, quality) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error('Файл не выбран'));
      if (!/^image\//.test(file.type)) return reject(new Error('Это не картинка'));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Не удалось открыть картинку'));
        img.onload = () => {
          const w = Math.min(img.width, maxW || 900);
          const h = Math.round(img.height * (w / img.width));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const g = cv.getContext('2d');
          g.fillStyle = '#0E1626';
          g.fillRect(0, 0, w, h);
          g.drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', Math.min(0.95, Math.max(0.3, (quality || 72) / 100))));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const photoSize = (dataUrl) =>
    dataUrl ? Math.round(dataUrl.length * 0.75 / 1024) + ' КБ' : '';

  /** Показать фото во весь экран. */
  function photoModal(src, title) {
    if (!src) return;
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = '<div class="photo-full">' +
      '<img src="' + src + '" alt="' + esc(title || 'Фото стеллажа') + '">' +
      '<div class="row-between" style="margin-top:12px">' +
        '<span style="font-size:13px;color:#B9C6DA">' + esc(title || '') + '</span>' +
        '<button class="btn btn-ghost btn-sm" data-close>Закрыть</button>' +
      '</div></div>';
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
  }

  /* ---------------- прочее ---------------- */

  function downloadFile(name, text, mime) {
    const blob = new Blob(['﻿' + text], { type: (mime || 'text/csv') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function csvCell(v) {
    const s = String(v == null ? '' : v).replace(/"/g, '""').replace(/[\r\n]+/g, ' ');
    return /[;"]/.test(s) ? '"' + s + '"' : s;
  }
  function csv(rows) {
    return rows.map(r => r.map(csvCell).join(';')).join('\n');
  }
  const today = () => new Date().toISOString().slice(0, 10);

  /**
   * Остаток квадратиками: сколько стоит на полке — цветные,
   * сколько не хватает до полного стеллажа — серые.
   * При большой вместимости квадратики мельчают, чтобы не расползались.
   */
  function pips(item) {
    const st = itemStatus(item);
    const max = Math.max(0, Number(item.max) || 0);
    const qty = Math.max(0, Math.min(max, Number(item.qty) || 0));
    const dense = max > 24;
    const cells = [];
    for (let i = 0; i < max; i++) cells.push('<i' + (i < qty ? ' class="on"' : '') + '></i>');
    return '<div class="pips ' + st + (dense ? ' dense' : '') +
      '" title="' + qty + ' из ' + max + ' шт">' + cells.join('') + '</div>';
  }

  const bar = pips;   // старое имя оставлено для совместимости

  function field(label, id, placeholder, type, value, hint) {
    return '<div class="field"><label for="' + id + '">' + label + '</label>' +
      '<input class="input sm" id="' + id + '" type="' + (type || 'text') + '" placeholder="' + esc(placeholder || '') + '"' +
      (value === undefined || value === null || value === '' ? '' : ' value="' + esc(value) + '"') + '>' +
      (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</div>';
  }

  window.LC_UI = {
    icon, esc, money, num, time, dateShort, dateTime, dateFull, ago, csv, csvCell, today,
    itemStatus, itemPct, rackStatus, bar, pips, field,
    catOf, catBadge, opInfo, OPS,
    STATUS_LABEL, RACK_LABEL, ITEM_LABEL,
    toast, modal, confirmBox, renderTopbar, modeBanner, downloadFile,
    stepper, bindSteppers, stepperValues,
    applyTheme, lighten, compressImage, photoSize, photoModal
  };
})();



/* ============================================================
   Lube Control — вход и сессия
   ============================================================ */

(function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const SESSION_KEY = 'lc_session_v1';

  const findAccount = (login) =>
    CFG.accounts.find(a => a.login.toLowerCase() === String(login || '').trim().toLowerCase()) || null;

  const emailOf = (login) => login.toLowerCase() + '@' + CFG.emailDomain;

  function profileFrom(acc, extra) {
    return {
      login: acc.login,
      role: (extra && extra.role) || acc.role,
      rack: (extra && extra.rack_code) || acc.rack || null,
      name: (extra && extra.name) || acc.name,
      title: (extra && extra.title) || acc.title || (acc.role === 'admin' ? 'Администратор' : 'Продавец')
    };
  }

  function saveLocalSession(user) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) { /* нет доступа */ }
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) { /* нет доступа */ }
  }
  function readLocalSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function clearLocalSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* нет доступа */ }
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* нет доступа */ }
  }

  /**
   * Не даём запросу к базе висеть вечно: если сети нет или ключи чужие,
   * человек должен увидеть внятную надпись, а не крутящийся кружок.
   */
  function withTimeout(promise, ms, what) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(
        () => reject(new Error('База не ответила за ' + Math.round(ms / 1000) + ' с (' + what + '). ' +
          'Проверьте supabaseUrl и ключ в config.js и доступ к сети.')), ms))
    ]);
  }

  /** Вход. Возвращает профиль пользователя либо бросает ошибку с понятным текстом. */
  async function signIn(login, password) {
    const acc = findAccount(login);

    if (!STORE.cloud) {
      if (!acc || acc.password !== password) throw new Error('Неверный логин или пароль');
      const user = profileFrom(acc);
      saveLocalSession(user);
      return user;
    }

    const { data, error } = await withTimeout(STORE.sb.auth.signInWithPassword({
      email: emailOf(String(login || '').trim()),
      password: password
    }), 20000, 'вход');
    if (error) {
      if (/invalid login/i.test(error.message)) throw new Error('Неверный логин или пароль');
      if (/email not confirmed/i.test(error.message)) {
        throw new Error('Пользователь не подтверждён. В Supabase → Authentication → Users ' +
          'откройте его и включите Auto Confirm User.');
      }
      if (/failed to fetch|networkerror/i.test(error.message)) {
        throw new Error('Не достучались до базы. Проверьте supabaseUrl в config.js и интернет.');
      }
      throw new Error(error.message);
    }

    let profile = null;
    try {
      const res = await withTimeout(
        STORE.sb.from('profiles').select('*').eq('id', data.user.id).single(), 15000, 'профиль');
      profile = res.data;
    } catch (e) { /* профиля может не быть — возьмём данные из конфига */ }

    if (!acc && !profile) throw new Error('Пользователь не заведён в системе');
    const user = profileFrom(acc || { login: login, role: 'seller', name: login, rack: null }, profile);
    // без строки в profiles база не поймёт, кто это, и откажет в любой записи (RLS)
    user.noProfile = !profile;
    saveLocalSession(user);
    return user;
  }

  /** Текущий пользователь или null. */
  async function current() {
    if (!STORE.cloud) return readLocalSession();
    const { data } = await withTimeout(STORE.sb.auth.getSession(), 15000, 'сессия');
    if (!data || !data.session) { clearLocalSession(); return null; }
    const cached = readLocalSession();
    if (cached) return cached;
    const login = (data.session.user.email || '').split('@')[0];
    const acc = findAccount(login);
    let profile = null;
    try {
      const res = await withTimeout(
        STORE.sb.from('profiles').select('*').eq('id', data.session.user.id).single(), 15000, 'профиль');
      profile = res.data;
    } catch (e) { /* без профиля */ }
    if (!acc && !profile) return null;
    const user = profileFrom(acc || { login, role: 'seller', name: login, rack: null }, profile);
    user.noProfile = !profile;
    saveLocalSession(user);
    return user;
  }

  async function signOut() {
    clearLocalSession();
    if (STORE.cloud) { try { await STORE.sb.auth.signOut(); } catch (e) { /* уже вышли */ } }
    location.reload();
  }

  window.LC_AUTH = { signIn, current, signOut, findAccount, emailOf, withTimeout };
})();



/* ============================================================
   Lube Control — панель администратора
   Три страницы: «Стеллажи», «Прайс», «Движения товара».
   ============================================================ */

window.LC_ADMIN = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;
  const $ = (id) => document.getElementById(id);

  const ctx = {
    user: null,
    racks: [], ops: [], requests: [], catalog: [], purchases: [],
    page: 'racks'
  };

  let filter = 'all';
  let query = '';

  /* ---------------- загрузка ---------------- */

  async function load() {
    const since = new Date(Date.now() - 180 * 864e5).toISOString();
    const [racks, ops, requests, catalog, purchases] = await Promise.all([
      STORE.getRacks(),
      STORE.getOps({ since, limit: 4000 }),
      STORE.getRequests(true),
      STORE.getCatalog(),
      STORE.getPurchases()
    ]);
    ctx.racks = racks; ctx.ops = ops; ctx.requests = requests;
    ctx.catalog = catalog; ctx.purchases = purchases;

    // админ открыл панель — значит, заявки он увидел; продавцу это покажется сразу
    const fresh = requests.filter(r => !r.seen_at).map(r => r.id);
    if (fresh.length) {
      try {
        await STORE.markRequestsSeen(fresh);
        ctx.requests = await STORE.getRequests(true);
      } catch (e) { /* не критично */ }
    }
  }

  async function refresh() {
    try {
      await load();
      renderPage();
    } catch (err) {
      UI.toast('Не удалось обновить данные: ' + err.message, 'err');
    }
  }
  ctx.refresh = refresh;

  /** Выполнить действие, обновить экран, показать сообщение. */
  async function act(fn, okText) {
    try {
      const res = await fn();
      await load();
      renderPage();
      if (okText) UI.toast(typeof okText === 'function' ? okText(res) : okText, 'ok');
      return res;
    } catch (err) {
      UI.toast(err.message || 'Не получилось', 'err');
      throw err;
    }
  }
  ctx.act = (fn, okText) => act(fn, okText).catch(() => {});

  /* ---------------- расчёты ---------------- */

  const allItems = () => ctx.racks.reduce((acc, r) => acc.concat(r.items), []);
  const sales = () => ctx.ops.filter(o => o.type === 'sale' && !o.cancelled);

  function salesSince(days) {
    const from = Date.now() - days * 864e5;
    return sales().filter(o => new Date(o.created_at).getTime() >= from);
  }

  function visibleRacks() {
    const q = query.trim().toLowerCase();
    return ctx.racks.filter(r => {
      if (filter !== 'all' && UI.rackStatus(r) !== filter) return false;
      if (!q) return true;
      return (r.code + ' ' + r.station + ' ' + (r.address || '') + ' ' + (r.operator || ''))
        .toLowerCase().includes(q);
    });
  }
  ctx.salesSince = salesSince;

  /* ---------------- роутер ---------------- */

  function go(page) {
    ctx.page = page;
    renderTopbar();
    renderPage();
    window.scrollTo({ top: 0 });
  }

  const navItems = () => [
    { key: 'racks', label: 'Стеллажи', active: ctx.page === 'racks' },
    { key: 'price', label: 'Прайс', active: ctx.page === 'price' },
    { key: 'buys', label: 'Закупки', active: ctx.page === 'buys' },
    { key: 'moves', label: 'Движения', active: ctx.page === 'moves' },
    { key: 'settings', label: 'Настройки', active: ctx.page === 'settings' }
  ];

  function renderTopbar() {
    UI.renderTopbar($('topbar'), ctx.user, {
      nav: navItems()
    });
    bindTopbar();
  }

  function bindTopbar() {
    $('topbar').addEventListener('click', (e) => {
      const b = e.target.closest('[data-nav]');
      if (b) go(b.dataset.nav);
    });
    const sel = $('topbar').querySelector('[data-nav-select]');
    if (sel) sel.addEventListener('change', (e) => go(e.target.value));
  }

  function renderPage() {
    if (ctx.page === 'price') { window.LC_PRICE.render($('view'), ctx); return; }
    if (ctx.page === 'buys') { window.LC_BUYS.render($('view'), ctx); return; }
    if (ctx.page === 'moves') { window.LC_MOVES.render($('view'), ctx); return; }
    if (ctx.page === 'settings') { window.LC_SETTINGS.render($('view'), ctx); return; }
    renderRacksPage();
  }

  /** Перерисовать текущий экран, не трогая настройки самой панели. */
  ctx.repaint = () => {
    UI.renderTopbar($('topbar'), ctx.user, {
      nav: navItems()
    });
    bindTopbar();
    if (ctx.page === 'racks') { $('view').innerHTML = ''; renderRacksPage(); }
  };

  /* ---------------- страница «Стеллажи» ---------------- */

  const racksTemplate = () =>
    '<main class="page">' +
      '<div class="page-head">' +
        '<div><h1>' + UI.esc(CFG.texts.adminTitle) + '</h1><p id="subLine">' +
          UI.esc(CFG.texts.adminSubtitle) + '</p></div>' +
        '<div class="page-actions">' +
          '<button class="btn btn-ghost" id="btnExport"></button>' +
          '<button class="btn btn-primary" id="btnAddRack"></button>' +
        '</div>' +
      '</div>' +
      '<section class="kpi-grid five" id="kpis"></section>' +
      '<div class="split">' +
        '<div class="stack" id="leftCol">' +
          '<div class="section-head">' +
            '<h2>Точки</h2>' +
            '<div class="row" style="gap:10px;flex-wrap:wrap">' +
              '<div class="search"><span id="searchIcon"></span>' +
              '<input id="search" type="search" placeholder="СТО, адрес или код…" aria-label="Поиск по стеллажам"></div>' +
              '<div class="filters" id="filters"></div>' +
            '</div>' +
          '</div>' +
          '<div class="stack" id="racks"></div>' +
        '</div>' +
        '<aside class="stack" id="rightCol"></aside>' +
      '</div>' +
    '</main>';

  function renderRacksPage() {
    const host = $('view');
    if (!host.querySelector('#racks')) {
      host.innerHTML = racksTemplate();
      bindRacksPage();
    }
    renderKpis();
    renderFilters();
    renderRacks();
    renderRight();
    const s = $('search');
    if (s && s.value !== query) s.value = query;
    $('subLine').textContent = CFG.texts.adminSubtitle + ' · обновлено ' +
      new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function renderKpis() {
    const items = allItems();
    const total = items.reduce((s, i) => s + i.qty, 0);
    const lowRacks = ctx.racks.filter(r => UI.rackStatus(r) === 'low').length;
    const emptyItems = items.filter(i => i.qty <= 0).length;
    const emptyRacks = new Set(items.filter(i => i.qty <= 0).map(i => i.rack_code)).size;
    const okRacks = ctx.racks.filter(r => UI.rackStatus(r) === 'ok').length;
    const week = salesSince(7);
    const weekQty = week.reduce((s, o) => s + o.qty, 0);

    const left = STORE.warehouse(ctx.purchases, ctx.ops);
    const byId = {};
    (ctx.catalog || []).forEach(c => { byId[c.id] = c; });
    let whQty = 0, whSum = 0;
    Object.keys(left).forEach(id => {
      const n = left[id];
      if (n > 0) { whQty += n; whSum += n * (Number((byId[id] || {}).cost) || 0); }
    });

    $('kpis').innerHTML = [
      card('Стеллажей в норме', okRacks + '<small> / ' + ctx.racks.length + '</small>', '', spark()),
      card('Общий остаток', UI.num(total) + '<small> шт</small>',
        '<span style="font-size:12px;color:#64748B">продано за 7 дней: ' + UI.num(weekQty) + ' шт</span>'),
      card('Требуют пополнения', String(lowRacks + ctx.requests.length), '', UI.icon('warn', 22, '#FFA726', 1.6), 'warn', '#FFA726'),
      card('Пустые позиции', String(emptyItems),
        '<span style="font-size:12px;color:#64748B">на ' + emptyRacks + ' СТО</span>', '', 'danger', '#FF5A5F'),
      card('На складе', UI.num(whQty) + '<small> шт</small>',
        '<span style="font-size:12px;color:#64748B">' + (whSum ? UI.money(whSum) : 'закупок нет') + '</span>')
    ].join('');
  }

  function card(label, value, sub, right, cls, color) {
    return '<div class="card kpi ' + (cls || '') + '">' +
      '<span class="label">' + label + '</span>' +
      '<div class="row" style="align-items:flex-end;justify-content:space-between;gap:10px">' +
        '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
        (right || sub || '') +
      '</div></div>';
  }

  function spark() {
    const days = [6, 5, 4, 3, 2, 1, 0].map(d => {
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - d);
      const to = new Date(from); to.setDate(to.getDate() + 1);
      return sales().filter(o => {
        const t = new Date(o.created_at).getTime();
        return t >= from.getTime() && t < to.getTime();
      }).reduce((s, o) => s + o.qty, 0);
    });
    const max = Math.max(1, ...days);
    return '<div style="display:flex;align-items:flex-end;gap:3px;height:26px">' +
      days.map((v, i) => '<div style="width:6px;height:' + Math.max(3, Math.round(v / max * 26)) +
        'px;background:' + (i === 6 ? '#3DDC84' : '#26543D') + ';border-radius:2px"></div>').join('') +
      '</div>';
  }

  function renderFilters() {
    const counts = { all: ctx.racks.length, ok: 0, low: 0, empty: 0 };
    ctx.racks.forEach(r => { counts[UI.rackStatus(r)]++; });
    const defs = [
      { key: 'all', label: 'Все', cls: '' },
      { key: 'ok', label: 'Норма', cls: '' },
      { key: 'low', label: 'Низкий', cls: 'low' },
      { key: 'empty', label: 'Критично', cls: 'empty' }
    ];
    $('filters').innerHTML = defs.map(d =>
      '<button class="chip ' + d.cls + (filter === d.key ? ' active' : '') + '" data-filter="' + d.key + '">' +
      d.label + ' · ' + counts[d.key] + '</button>').join('');
  }

  function renderRacks() {
    const list = visibleRacks();
    if (!list.length) {
      $('racks').innerHTML = ctx.racks.length
        ? '<div class="empty-state">Ничего не найдено. Измените фильтр или поиск.</div>'
        : '<div class="empty-state">Стеллажей пока нет.<br><br>' +
          'Порядок такой: заведите товар в <b>Прайсе</b>, внесите поставку в <b>Закупках</b>, ' +
          'потом добавьте стеллаж и поставьте на него позиции.</div>';
      return;
    }
    $('racks').innerHTML = list.map(rackCard).join('');
  }

  function rackCard(r) {
    const st = UI.rackStatus(r);
    const cls = st === 'empty' ? ' danger' : (st === 'low' ? ' warn' : '');
    const lastOp = ctx.ops.find(o => o.rack_code === r.code);
    const req = ctx.requests.find(x => x.rack_code === r.code);
    const days = Number(CFG.rules.routeDays) || 7;
    const soldQty = salesSince(days).filter(o => o.rack_code === r.code).reduce((s, o) => s + o.qty, 0);
    const missing = r.items.reduce((s, i) => s + (i.max - i.qty), 0);
    const packed = req && req.status === 'packed';
    const code = UI.esc(r.code);

    let foot;
    if (packed) {
      foot = '<span style="font-size:12px;color:var(--green)">Поставка собрана · ' +
        UI.dateTime(req.packed_at) + (req.packed_by ? ' · ' + UI.esc(req.packed_by) : '') +
        ' — точка это видит</span>';
    } else if (req) {
      foot = '<span style="font-size:12px;color:var(--red)">Заявка от продавца · ' +
        UI.dateTime(req.created_at) + (req.note ? ' · ' + UI.esc(req.note) : '') + '</span>';
    } else {
      foot = '<span style="font-size:12px;color:#64748B">Продано за ' + days + ' дн: ' + soldQty +
        ' шт · до полного стеллажа ' + missing + ' шт</span>';
    }

    return '<article class="card rack-card' + cls + '" data-rack="' + code + '">' +
      '<div class="rack-head">' +
        '<div class="row" style="gap:12px;min-width:0">' +
          (r.photo
            ? '<img class="rack-photo" src="' + r.photo + '" alt="Фото ' + code + '" data-act="photo" data-rack="' + code + '">'
            : '<button class="rack-photo" data-act="edit" data-rack="' + code + '" title="Добавить фото" ' +
              'style="display:flex;align-items:center;justify-content:center;color:var(--dim)">' +
              UI.icon('camera', 20) + '</button>') +
          '<span class="rack-code">' + code + '</span>' +
          '<div class="rack-title" style="min-width:0"><b>' + UI.esc(r.station) + '</b>' +
          '<small>' + UI.esc([r.address, r.post, r.operator].filter(Boolean).join(' · ')) + '</small></div>' +
        '</div>' +
        '<div class="row" style="gap:12px">' +
          '<span style="font-size:12px;color:#64748B">' +
            (lastOp ? 'обновлено ' + UI.ago(lastOp.created_at) : 'операций не было') + '</span>' +
          (packed ? '<span class="pill ok">Поставка собрана</span>' : '') +
          '<span class="pill ' + st + '">' + UI.RACK_LABEL[st] + '</span>' +
          '<button class="icon-btn sm" data-act="edit" data-rack="' + code + '" title="Изменить стеллаж">' +
            UI.icon('edit', 14) + '</button>' +
        '</div>' +
      '</div>' +

      (r.items.length
        ? '<div class="stack-sm">' + r.items.map(itemRow).join('') + '</div>'
        : '<div class="empty-state" style="padding:22px">На стеллаже пока нет позиций. Добавьте их из прайса.</div>') +

      '<div class="rack-foot">' + foot +
        '<div class="row" style="gap:10px">' +
          '<button class="btn btn-ghost btn-sm" data-act="history" data-rack="' + code + '">Движения</button>' +
          '<button class="btn btn-ghost btn-sm" data-act="add-item" data-rack="' + code + '">+ Позиция</button>' +
          (packed
            ? ''
            : '<button class="btn btn-warn btn-sm" data-act="packed" data-rack="' + code + '"' +
              (missing ? '' : ' disabled') + ' title="Отметить, что товар для этой точки собран">' +
              'Поставка собрана</button>') +
          '<button class="btn btn-primary btn-sm" data-act="restock" data-rack="' + code + '"' +
            (missing ? '' : ' disabled') + '>Пополнить</button>' +
        '</div>' +
      '</div></article>';
  }

  function itemRow(i) {
    const st = UI.itemStatus(i);
    return '<div class="item-row">' +
      '<span class="name">' + UI.esc(i.name) +
        '<small>' + UI.esc([i.brand, i.volume].filter(Boolean).join(' · ')) + '</small></span>' +
      '<span class="qty">' + i.qty + ' / ' + i.max + ' шт</span>' +
      UI.pips(i) +
      '<span class="pct">' + UI.itemPct(i) + '%</span>' +
      '<span class="status-text ' + st + '">' + UI.ITEM_LABEL[st] + '</span>' +
      '<button class="step-btn" data-act="minus" data-item="' + i.id + '"' +
        (i.qty <= 0 ? ' disabled' : '') + ' title="Списать 1 шт">−1</button>' +
    '</div>';
  }

  /* ---------------- правая колонка ---------------- */

  function renderRight() {
    const route = ctx.racks
      .map(r => ({
        r,
        st: UI.rackStatus(r),
        need: r.items.reduce((s, i) => s + (i.max - i.qty), 0),
        req: ctx.requests.some(x => x.rack_code === r.code)
      }))
      .filter(x => x.st !== 'ok' || x.req)
      .sort((a, b) => (a.st === 'empty' ? -1 : 1) - (b.st === 'empty' ? -1 : 1) || b.need - a.need);

    const week = salesSince(7);
    const byDay = [6, 5, 4, 3, 2, 1, 0].map(d => {
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - d);
      const to = new Date(from); to.setDate(to.getDate() + 1);
      return {
        label: ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'][from.getDay()],
        qty: week.filter(o => {
          const t = new Date(o.created_at).getTime();
          return t >= from.getTime() && t < to.getTime();
        }).reduce((s, o) => s + o.qty, 0)
      };
    });
    const maxDay = Math.max(1, ...byDay.map(d => d.qty));

    const top = {};
    week.forEach(o => { top[o.item_name] = (top[o.item_name] || 0) + o.qty; });
    const topList = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);

    $('rightCol').innerHTML =
      '<section class="card stack-sm">' +
        '<div class="row-between"><span class="display" style="font-size:14px;font-weight:600">Маршрут пополнения</span>' +
        '<span style="font-size:12px;color:#F2B705;font-weight:500">' + route.length + ' точек</span></div>' +
        (route.length
          ? '<div class="stack-sm" style="gap:12px;margin-top:6px">' + route.map((x, n) =>
              '<div class="row" style="gap:12px">' +
                '<span style="width:24px;height:24px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;' +
                  'font-family:var(--mono);font-size:11px;font-weight:600;' +
                  (x.st === 'empty'
                    ? 'background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.3);color:#FF5A5F'
                    : 'background:rgba(255,167,38,.12);border:1px solid rgba(255,167,38,.3);color:#FFA726') +
                  '">' + (n + 1) + '</span>' +
                '<div class="grow" style="min-width:0">' +
                  '<div style="font-size:13px;font-weight:500">' + UI.esc(x.r.station) + '</div>' +
                  '<div style="font-size:11px;color:#64748B">' + UI.esc(x.r.address || x.r.code) + ' · ' + x.need + ' шт</div>' +
                '</div>' +
                (x.req ? '<span class="pill empty" style="height:22px;font-size:11px">заявка</span>' : '') +
              '</div>').join('') + '</div>'
          : '<div style="font-size:13px;color:#64748B;padding:8px 0">Все стеллажи заполнены — ехать некуда.</div>') +
        '<button class="btn btn-primary btn-block" id="btnRoute" style="margin-top:6px"' +
          (route.length ? '' : ' disabled') + '>Собрать маршрут</button>' +
      '</section>' +

      '<section class="card stack-sm">' +
        '<div class="row-between"><span class="display" style="font-size:14px;font-weight:600">Продажи за 7 дней</span>' +
        '<span class="mono" style="font-size:12px;color:#3DDC84">' +
          week.reduce((s, o) => s + o.qty, 0) + ' шт</span></div>' +
        '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:96px;margin-top:8px">' +
          byDay.map((d, i) => '<div title="' + d.label + ': ' + d.qty + ' шт" style="height:' +
            Math.max(4, Math.round(d.qty / maxDay * 100)) + '%;background:' +
            (i === 6 ? '#F2B705' : '#22304A') + ';border-radius:4px 4px 2px 2px"></div>').join('') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;font-family:var(--mono);font-size:10px;color:#4B5A75;text-align:center">' +
          byDay.map(d => '<span>' + d.label + '</span>').join('') +
        '</div>' +
      '</section>' +

      '<section class="card stack-sm">' +
        '<span class="display" style="font-size:14px;font-weight:600">Лидеры продаж</span>' +
        (topList.length
          ? topList.map(([name, qty]) =>
              '<div class="row-between"><span style="font-size:13px;color:#B9C6DA" class="ellipsis">' + UI.esc(name) + '</span>' +
              '<span class="mono" style="font-size:12px">' + qty + ' шт</span></div>').join('')
          : '<span style="font-size:13px;color:#64748B">Продаж за неделю пока нет.</span>') +
      '</section>' +

      '<section class="card flat stack-sm">' +
        '<span class="display" style="font-size:14px;font-weight:600">Последние операции</span>' +
        (ctx.ops.length
          ? '<div class="log-list">' + ctx.ops.slice(0, 6).map(logRow).join('') + '</div>' +
            '<button class="btn btn-ghost btn-sm btn-block" id="btnFullLog" style="margin-top:4px">Все движения</button>'
          : '<span style="font-size:13px;color:#64748B">Пока пусто.</span>') +
      '</section>';
  }

  function logRow(o) {
    const info = UI.opInfo(o.type);
    return '<div class="log-row">' +
      '<span class="mono" style="font-size:12px;color:#64748B">' + UI.time(o.created_at) + '</span>' +
      '<span class="ellipsis">' +
        UI.esc(o.item_name || o.note || o.rack_code) +
        (o.rack_code ? '<span style="color:#4B5A75"> · ' + UI.esc(o.rack_code) + '</span>' : '') + '</span>' +
      '<span style="font-size:12px;color:' + info.color + '">' +
        (o.cancelled ? '<s style="color:#4B5A75">' : '') +
        info.label + (o.qty ? ' ' + o.qty + ' шт' : '') +
        (o.cancelled ? '</s>' : '') + '</span>' +
    '</div>';
  }

  /* ---------------- пополнение по штукам ---------------- */

  function itemById(id) {
    for (const r of ctx.racks) {
      const it = r.items.find(i => i.id === id);
      if (it) return it;
    }
    return null;
  }

  /**
   * Общее окно пополнения — им же пользуется продавец («Принять поставку»).
   * opts: { rack, title, subtitle, okLabel, opType, user }
   */
  async function fillModal(opts) {
    const rack = opts.rack;
    const rows = rack.items.filter(i => i.max > i.qty);
    if (!rows.length) { UI.toast('Стеллаж уже полный', 'err'); return null; }

    let applied = null;

    await UI.modal({
      title: opts.title,
      subtitle: opts.subtitle,
      wide: true,
      noFocus: true,
      body:
        '<div class="stack-sm" style="gap:0">' +
          rows.map(i =>
            '<div class="fill-row">' +
              '<div class="t"><b>' + UI.esc(i.name) + '</b>' +
                '<small>' + UI.esc([i.brand, i.volume].filter(Boolean).join(' · ')) +
                (i.cost ? ' · закупка ' + UI.money(i.cost) : '') + '</small></div>' +
              '<div class="have">' + i.qty + ' / ' + i.max + ' шт<br>' +
                '<span style="color:#4B5A75">можно +' + (i.max - i.qty) + '</span></div>' +
              UI.stepper(i.id, 0, i.max - i.qty, true) +
            '</div>').join('') +
          '<div class="row-between" style="padding-top:14px">' +
            '<b style="font-size:13px">Итого</b>' +
            '<b class="mono" id="fillTotal">0 шт</b>' +
          '</div>' +
        '</div>',
      onOpen: (root) => {
        const total = root.querySelector('#fillTotal');
        const recalc = () => {
          const vals = UI.stepperValues(root);
          let qty = 0, sum = 0;
          rows.forEach(i => { const v = vals[i.id] || 0; qty += v; sum += v * (i.cost || 0); });
          total.innerHTML = qty + ' шт' + (sum ? ' <span style="color:#64748B">· ' + UI.money(sum) + '</span>' : '');
          const ok = root.querySelector('[data-fill-ok]');
          if (ok) ok.disabled = qty === 0;
        };
        UI.bindSteppers(root, recalc);
        recalc();
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Заполнить всё до максимума', kind: 'btn-ghost',
          onClick: (root) => {
            root.querySelectorAll('[data-stepper]').forEach(box => {
              box.querySelector('input').value = box.dataset.max;
              box.dispatchEvent(new Event('input', { bubbles: true }));
            });
            return false; // окно не закрываем — пусть человек увидит числа и нажмёт «Пополнить»
          }
        },
        {
          label: opts.okLabel || 'Пополнить', kind: 'btn-primary',
          onClick: (root) => {
            const vals = UI.stepperValues(root);
            const plan = Object.keys(vals).filter(id => vals[id] > 0).map(id => ({ item_id: id, add: vals[id] }));
            if (!plan.length) { UI.toast('Укажите, сколько добавить', 'err'); return false; }
            applied = plan;
            return true;
          }
        }
      ]
    });

    return applied;
  }

  async function restockRack(code) {
    const rack = ctx.racks.find(r => r.code === code);
    if (!rack) return;
    const plan = await fillModal({
      rack,
      title: 'Пополнить ' + rack.code,
      subtitle: rack.station + (rack.address ? ' · ' + rack.address : ''),
      okLabel: 'Пополнить'
    });
    if (!plan) return;
    await act(
      () => STORE.restock(code, plan, { type: 'restock', user_login: ctx.user.login, user_name: ctx.user.name }),
      (res) => 'Пополнено: +' + res.qty + ' шт на ' + UI.money(res.sum)
    ).catch(() => {});
  }

          const s = (q || '').trim().toLowerCase();
          const rows = list.filter(c => !s ||

  /* ---------------- маршрут и выгрузка ---------------- */

  async function routeModal() {
    const route = ctx.racks
      .map(r => ({ r, st: UI.rackStatus(r), need: r.items.reduce((s, i) => s + (i.max - i.qty), 0) }))
      .filter(x => x.st !== 'ok')
      .sort((a, b) => (a.st === 'empty' ? -1 : 1) - (b.st === 'empty' ? -1 : 1) || b.need - a.need);

    const ok = await UI.modal({
      title: 'Маршрут на сегодня',
      subtitle: route.length + ' точек · ' + route.reduce((s, x) => s + x.need, 0) + ' шт к загрузке',
      wide: true,
      body: route.length
        ? '<div class="stack-sm">' + route.map((x, n) =>
            '<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            '<div class="row" style="gap:12px"><span class="mono" style="color:#64748B;width:18px">' + (n + 1) + '</span>' +
            '<div><div style="font-size:13px;font-weight:500">' + UI.esc(x.r.station) + ' · ' + UI.esc(x.r.code) + '</div>' +
            '<div style="font-size:12px;color:#64748B">' + UI.esc(x.r.address || '') + '</div></div></div>' +
            '<span class="mono" style="font-size:13px;color:' + (x.st === 'empty' ? '#FF5A5F' : '#FFA726') + '">' +
            x.need + ' шт</span></div>').join('') + '</div>'
        : '<div class="empty-state">Все стеллажи заполнены.</div>',
      actions: [
        { label: 'Закрыть', value: null },
        { label: 'Скачать список', kind: 'btn-ghost', value: 'csv' },
        { label: 'Всё собрано — уведомить точки', kind: 'btn-primary', value: 'packed' }
      ]
    });

    if (ok === 'csv') {
      const rows = [['№', 'Код', 'СТО', 'Адрес', 'К загрузке, шт']]
        .concat(route.map((x, n) => [n + 1, x.r.code, x.r.station, x.r.address || '', x.need]));
      UI.downloadFile('marshrut-' + UI.today() + '.csv', UI.csv(rows));
      UI.toast('Список маршрута скачан', 'ok');
    }

    if (ok === 'packed') {
      const codes = route.map(x => x.r.code);
      if (!codes.length) return;
      ctx.act(async () => {
        let n = 0;
        for (const c of codes) {
          try { await STORE.markPacked(c, ctx.user, 'собрано по маршруту'); n++; }
          catch (e) { /* уже отмечено — пропускаем */ }
        }
        if (!n) throw new Error('Все точки маршрута уже отмечены');
        return n;
      }, (n) => 'Отмечено точек: ' + n + ' — продавцы видят «везём»');
    }
  }

  function exportCsv() {
    const head = ['Код', 'СТО', 'Адрес', 'Продавец', 'Позиция', 'Фирма', 'Объём', 'Артикул',
      'Закупка', 'Продажа', 'Остаток', 'Вместимость', 'Заполнено,%', 'Статус', 'Сумма закупки'];
    const rows = [head];
    ctx.racks.forEach(r => r.items.forEach(i => {
      rows.push([
        r.code, r.station, r.address || '', r.operator || '',
        i.name, i.brand || '', i.volume || '', i.sku || '',
        i.cost || 0, i.price || 0, i.qty, i.max,
        UI.itemPct(i), UI.STATUS_LABEL[UI.itemStatus(i)], (i.qty * (i.cost || 0))
      ]);
    }));
    UI.downloadFile('ostatki-' + UI.today() + '.csv', UI.csv(rows));
    UI.toast('Отчёт по остаткам скачан', 'ok');

  /* ---------------- запуск ---------------- */
