    [salePts, costPts].forEach(list => { if (list.length && list[0].t > t0) list.unshift({ t: t0, v: list[0].v }); });
    // «круглые» деления по цене: 50, 100, 250, 500…
    let v0 = Math.min.apply(null, all.map(x => x.v)), v1 = Math.max.apply(null, all.map(x => x.v));
    const raw = Math.max(1, (v1 - v0) / 4);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const stepV = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= raw) || raw;
    v0 = Math.max(0, Math.floor(v0 / stepV) * stepV - (v0 % stepV === 0 ? stepV : 0));
    v1 = Math.ceil(v1 / stepV) * stepV + (v1 % stepV === 0 ? stepV : 0);
    const ticks = Math.round((v1 - v0) / stepV);
    const W = 760, H = 230, L = 58, R = 14, TOP = 12, B = 28;
    const X = (t) => L + (t - t0) / (t1 - t0) * (W - L - R);
    const Y = (v) => TOP + (1 - (v - v0) / (v1 - v0)) * (H - TOP - B);
    const step = (list) => list.map((p, i) => (i ? 'H' + X(p.t).toFixed(1) + 'V' + Y(p.v).toFixed(1)
      : 'M' + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1))).join('');
    let g = '';
    for (let i = 0; i <= ticks; i++) {
      const v = v0 + stepV * i, y = Y(v).toFixed(1);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#1E293D" stroke-width="1"/>' +
        '<text x="' + (L - 8) + '" y="' + (Number(y) + 4) + '" text-anchor="end" font-size="11" fill="#64748B" font-family="IBM Plex Mono, monospace">' +
        Math.round(v).toLocaleString('ru-RU') + '</text>';
    }
    for (let i = 0; i <= 3; i++) {
      const t = t0 + (t1 - t0) * i / 3;
      g += '<text x="' + X(t).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === 3 ? 'end' : 'middle') +
        '" font-size="11" fill="#64748B">' + new Date(t).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' }) + '</text>';
    }
    const buyLine = pts.length > 1 ? '<path d="' + pts.slice().sort((a, b) => a.t - b.t).map((p, i) =>
      (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('') + '" fill="none" stroke="#7C8CF8" stroke-width="1.6" stroke-opacity=".55"/>' : '';
    const dots = pts.map(p => '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="4.2" fill="#7C8CF8" stroke="#111A2C" stroke-width="1.5">' +
      '<title>' + UI.esc(fmtD(p.p.date) + ' · ' + (p.p.supplier || 'поставщик не указан') + ' · ' + UI.num(p.v) + ' ₽ × ' + p.p.qty + ' шт') + '</title></circle>').join('');
    return '<svg class="hist-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="График цен">' + g +
      '<path d="' + step(costPts) + '" fill="none" stroke="#8494AC" stroke-width="1.4" stroke-dasharray="4 4"/>' +
      '<path d="' + step(salePts) + '" fill="none" stroke="#3DDC84" stroke-width="2"/>' +
      buyLine + dots + '</svg>';
  }

  function historyModal(c) {
    const buys = (ctx.purchases || []).filter(p => p.catalog_id === c.id)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.created_at).localeCompare(String(b.created_at)));
    const steps = priceSteps(c);
    const last = buys[buys.length - 1] || null;
    const first = buys[0] || null;
    const cheapest = buys.slice().sort((a, b) => Number(a.cost) - Number(b.cost))[0] || null;
    const dearest = buys.slice().sort((a, b) => Number(b.cost) - Number(a.cost))[0] || null;
    const since = first && last && Number(first.cost) ? Math.round((Number(last.cost) - Number(first.cost)) / Number(first.cost) * 1000) / 10 : 0;

    // по поставщикам
    const sup = {};
    buys.forEach(p => {
      const k = p.supplier || 'не указан';
      const x = sup[k] = sup[k] || { name: k, n: 0, qty: 0, sum: 0, min: Infinity, max: 0, last: null };
      x.n++; x.qty += Number(p.qty) || 0; x.sum += Number(p.amount) || 0;
      x.min = Math.min(x.min, Number(p.cost) || 0); x.max = Math.max(x.max, Number(p.cost) || 0); x.last = p;
    });
    const supList = Object.keys(sup).map(k => sup[k]).sort((a, b) => (a.sum / a.qty) - (b.sum / b.qty));
    const bestSup = supList.length > 1 ? supList[0] : null;

    const kpi = (label, value, sub) => '<div class="card flat"><span class="label">' + label + '</span><b>' + value + '</b><small>' + sub + '</small></div>';
    const margin = (Number(c.price) || 0) - (Number(c.cost) || 0);

    const buyRows = buys.slice().reverse().map((p, i, arr) => {
      const prev = arr[i + 1];
      const d = prev ? Number(p.cost) - Number(prev.cost) : 0;
      const pct = prev && Number(prev.cost) ? Math.round(d / Number(prev.cost) * 1000) / 10 : 0;
      return '<tr><td class="num">' + fmtD(p.date) + '</td>' +
        '<td>' + (p.supplier ? UI.esc(p.supplier) : '<span style="color:#4B5A75">не указан</span>') + '</td>' +
        '<td class="r"><b>' + UI.num(p.cost) + '</b></td>' +
        '<td class="r">' + (!prev ? '<span style="color:#4B5A75">первая</span>'
          : d ? '<span class="trend ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲ +' : '▼ −') + UI.num(Math.abs(d)) + ' · ' + signedPct(pct) + '</span>'
          : '<span style="color:#4B5A75">без изменений</span>') + '</td>' +
        '<td class="r">' + UI.num(p.qty) + ' шт</td><td class="r">' + UI.num(p.amount) + '</td>' +
        '<td>' + (p.payment ? '<span class="pill sm neutral">' + UI.esc(p.payment) + '</span>' : '—') + '</td></tr>';
    }).join('');

    const stepRows = steps.slice().reverse().map(s => {
      const m = s.price ? Math.round((s.price - s.cost) / s.price * 100) : 0;
      // закупка подорожала — плохо (красным), продажа подросла — хорошо (зелёным)
      const pair = (o, n, upIsGood) => (o !== null && o !== undefined && o !== n)
        ? UI.num(o) + ' → <b>' + UI.num(n) + '</b> <span class="trend ' + ((n > o) !== !!upIsGood ? 'up' : 'down') + '">' +
          (n > o ? '▲' : '▼') + '</span>'
        : '<b>' + UI.num(n) + '</b>';
      return '<tr><td class="num">' + UI.dateFull(s.t) + '</td>' +
        '<td class="r">' + pair(s.costOld, s.cost) + '</td>' +
        '<td class="r">' + pair(s.priceOld, s.price, true) + '</td>' +
        '<td class="r" style="color:' + (m < (Number((CFG.rules || {}).minMargin) || 0) ? 'var(--orange)' : '#8494AC') + '">' + m + '%</td>' +
        '<td style="font-size:12px;color:#8494AC">' + UI.esc([s.source, s.user].filter(Boolean).join(' · ')) + '</td></tr>';
    }).join('');

    UI.modal({
      title: c.name,
      subtitle: [c.brand, c.volume, c.sku].filter(Boolean).join(' · ') + ' · в прайсе: закупка ' + UI.money(c.cost) +
        ', продажа ' + UI.money(c.price) + ', с 1 шт ' + (margin >= 0 ? '+' : '') + UI.money(margin),
      cls: 'xwide',
      body:
        '<div class="stack-sm" style="gap:16px">' +
          (buys.length
            ? '<div class="hist-kpis">' +
                kpi('Последняя закупка', UI.money(last.cost), fmtD(last.date) + ' · ' + UI.esc(last.supplier || 'поставщик не указан')) +
                kpi('Дешевле всего', UI.money(cheapest.cost), fmtD(cheapest.date) + ' · ' + UI.esc(cheapest.supplier || 'не указан')) +
                kpi('Дороже всего', UI.money(dearest.cost), fmtD(dearest.date) + ' · ' + UI.esc(dearest.supplier || 'не указан')) +
                kpi('С первой закупки', buys.length > 1 ? '<span class="trend ' + (since > 0 ? 'up' : since < 0 ? 'down' : '') +
                    '" style="font-size:17px">' + signedPct(since) + '</span>' : '—',
                  buys.length > 1 ? 'было ' + UI.money(first.cost) + ' · ' + fmtD(first.date) : 'пока одна закупка') +
              '</div>'
            : '<div class="card flat" style="font-size:13px;color:#8494AC">Закупок этого товара ещё не было — ниже только изменения цен в прайсе.</div>') +

          '<div class="card flat stack-sm" style="gap:8px">' +
            '<div class="legend">' +
              '<span><i style="background:#7C8CF8"></i>закупки (точка — одна поставка)</span>' +
              '<span><i style="background:#3DDC84"></i>цена продажи в прайсе</span>' +
              '<span><i style="background:#8494AC"></i>закупка в прайсе</span>' +
            '</div>' +
            chartSvg(c, buys, steps) +
          '</div>' +

          (bestSup ? '<div style="font-size:13px;color:#B9C6DA">Выгоднее всего брать у <b>' + UI.esc(bestSup.name) + '</b>: в среднем ' +
            UI.money(bestSup.sum / bestSup.qty) + ' за шт.</div>' : '') +

          (supList.length
            ? '<div class="section-head"><h2>По поставщикам</h2></div>' +
              '<div class="grid-wrap"><table class="grid" style="min-width:640px"><thead><tr>' +
                '<th>Поставщик</th><th class="r">Раз</th><th class="r">Взяли</th><th class="r">Средняя</th>' +
                '<th class="r">Мин</th><th class="r">Макс</th><th class="r">Последняя</th></tr></thead><tbody>' +
              supList.map(x => '<tr><td><b>' + UI.esc(x.name) + '</b></td><td class="r">' + x.n + '</td>' +
                '<td class="r">' + UI.num(x.qty) + ' шт</td><td class="r"><b>' + UI.num(Math.round(x.sum / x.qty)) + '</b></td>' +
                '<td class="r" style="color:var(--green)">' + UI.num(x.min) + '</td><td class="r" style="color:var(--red)">' + UI.num(x.max) + '</td>' +
                '<td class="r">' + UI.num(x.last.cost) + ' <span style="color:#4B5A75">· ' + fmtD(x.last.date) + '</span></td></tr>').join('') +
              '</tbody></table></div>'
            : '') +

          (buys.length
            ? '<div class="section-head"><h2>Все закупки</h2><span style="font-size:12px;color:#64748B">новые сверху</span></div>' +
              '<div class="grid-wrap" style="max-height:340px;overflow:auto"><table class="grid" style="min-width:680px"><thead><tr>' +
                '<th>Дата</th><th>Поставщик</th><th class="r">Цена</th><th class="r">К прошлой</th><th class="r">Кол-во</th><th class="r">Сумма</th><th>Оплата</th>' +
              '</tr></thead><tbody>' + buyRows + '</tbody></table></div>'
            : '') +

          '<div class="section-head"><h2>Изменения цен в прайсе</h2></div>' +
          (steps.length
            ? '<div class="grid-wrap" style="max-height:300px;overflow:auto"><table class="grid" style="min-width:640px"><thead><tr>' +
                '<th>Когда</th><th class="r">Закупка</th><th class="r">Продажа</th><th class="r">Наценка</th><th>Откуда · кто</th>' +
              '</tr></thead><tbody>' + stepRows + '</tbody></table></div>'
            : '<div class="empty-state" style="padding:16px">Цены в прайсе не менялись' +
                (c.created_at ? ' с ' + UI.dateFull(c.created_at) : '') + '.</div>') +
        '</div>',
      actions: [
        { label: 'Закрыть', value: null },
        { label: 'Изменить цены', kind: 'btn-primary', value: 'edit' }
      ]
    }).then(v => { if (v === 'edit') editModal(c); });
  }

  /* ---------------- выгрузка ---------------- */

  function exportCsv() {
    const list = rows();
    const out = [['Категория', 'Название', 'Фирма', 'Объём', 'Артикул', 'Закупка', 'Продажа',
      'Маржа ₽', 'Маржа %', 'На складе шт', 'На стеллажах шт', 'Вместимость шт', 'Точек',
      'Закуплено всего шт', 'Продано 30д', 'Выручка 30д', 'В прайсе с', 'Статус']];
    list.forEach(x => out.push([
      UI.catOf(x.c.category).label, x.c.name, x.c.brand || '', x.c.volume || '', x.c.sku || '',
      x.c.cost || 0, x.c.price || 0, x.s.margin, x.s.marginPct,
      x.s.stock, x.s.onRacksQty, x.s.capacity, x.s.points, x.s.boughtQty, x.s.soldQty, x.s.revenue,
      x.c.created_at ? UI.dateFull(x.c.created_at) : '',
      x.c.archived ? 'архив' : 'в работе'
    ]));
    UI.downloadFile('prays-' + UI.today() + '.csv', UI.csv(out));
    UI.toast('Прайс выгружен', 'ok');
  }

  return { render };
})();


/* ============================================================
   Lube Control — ЗАКУПКИ
   Что привезли на склад: дата, товар, поставщик, цена, количество, оплата.
   Со склада товар потом уезжает на стеллажи.
   ============================================================ */

window.LC_BUYS = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let ctx = null;
  let period = 90;          // дней; 0 — за всё время
  let cat = 'all';
  let supplier = 'all';
  let payment = 'all';
  let query = '';
  let sort = { key: 'date', dir: -1 };

  const PERIODS = [
    { key: 30, label: '30 дней' },
    { key: 90, label: '3 месяца' },
    { key: 365, label: 'Год' },
    { key: 0, label: 'Всё время' }
  ];

  /* ---------------- отбор ---------------- */

  function from() {
    if (!period) return 0;
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (period - 1));
    return d.getTime();
  }

  function rows() {
    const q = query.trim().toLowerCase();
    const since = from();
    const list = (ctx.purchases || []).filter(p => {
      if (period && new Date(p.date + 'T00:00:00').getTime() < since) return false;
      if (cat !== 'all' && p.category !== cat) return false;
      if (supplier !== 'all' && (p.supplier || '') !== supplier) return false;
      if (payment !== 'all' && (p.payment || '') !== payment) return false;
      if (!q) return true;
      return ((p.name || '') + ' ' + (p.brand || '') + ' ' + (p.sku || '') + ' ' +
        (p.supplier || '') + ' ' + (p.payment || '') + ' ' + (p.note || '')).toLowerCase().includes(q);
    });

    const get = {
      date: x => String(x.date || ''),
      name: x => (x.name + ' ' + (x.brand || '')).toLowerCase(),
      supplier: x => (x.supplier || '').toLowerCase(),
      category: x => UI.catOf(x.category).label,
      cost: x => Number(x.cost) || 0,
      qty: x => Number(x.qty) || 0,
      amount: x => Number(x.amount) || 0,
      payment: x => (x.payment || '').toLowerCase()
    }[sort.key] || (x => x.date);

    return list.sort((a, b) => {
      const va = get(a), vb = get(b);
      if (va < vb) return -sort.dir;
      if (va > vb) return sort.dir;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  }

  const suppliers = () => [...new Set((ctx.purchases || []).map(p => (p.supplier || '').trim())
    .concat((ctx.suppliers || []).map(s => s.name)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));

  const payments = () => {
    const used = (ctx.purchases || []).map(p => (p.payment || '').trim()).filter(Boolean);
    return [...new Set((CFG.payments || []).concat(used))];
  };

  /* ---------------- отрисовка ---------------- */

  const TH = [
    { key: 'date', label: 'Дата поставки' },
    { key: 'name', label: 'Товар' },
    { key: 'supplier', label: 'Поставщик' },
    { key: 'category', label: 'Категория' },
    { key: null, label: 'Объём' },
    { key: null, label: 'Артикул' },
    { key: 'cost', label: 'Цена закуп. ₽', cls: 'r' },
    { key: 'qty', label: 'Кол-во', cls: 'r' },
    { key: 'amount', label: 'Сумма ₽', cls: 'r' },
    { key: 'payment', label: 'Оплата' },
    { key: null, label: '', cls: 'r' }
  ];

  function render(host, context) {
    ctx = context;
    const list = rows();

    const qty = list.reduce((s, p) => s + (Number(p.qty) || 0), 0);
    const sum = list.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const avg = qty ? Math.round(sum / qty) : 0;

    // остаток склада — по всем закупкам, а не только по выбранному периоду
    const left = STORE.warehouse(ctx.purchases, ctx.ops);
    const byId = {};
    (ctx.catalog || []).forEach(c => { byId[c.id] = c; });
    let stockQty = 0, stockSum = 0;
    Object.keys(left).forEach(id => {
      const n = left[id];
      if (n > 0) { stockQty += n; stockSum += n * (Number((byId[id] || {}).cost) || 0); }
    });

    // разбивка по способам оплаты
    const byPay = {};
    list.forEach(p => {
      const k = p.payment || 'не указан';
      byPay[k] = (byPay[k] || 0) + (Number(p.amount) || 0);
    });
    const payList = Object.entries(byPay).sort((a, b) => b[1] - a[1]);

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Закупки</h1>' +
            '<p>Что и почём привезли на склад. Отсюда товар уезжает на стеллажи.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="bImport">' + UI.icon('up', 15) + '<span>Закупка из файла</span></button>' +
            '<button class="btn btn-ghost" id="bExport">' + UI.icon('down', 15) + '<span>Выгрузить в CSV</span></button>' +
            '<button class="btn btn-primary" id="bAdd">' + UI.icon('plus', 15, '#12161F', 2) + '<span>Новая закупка</span></button>' +
          '</div>' +
        '</div>' +

        '<section class="kpi-grid five">' +
          kpi('Закуплено', UI.num(qty) + '<small> шт</small>') +
          kpi('Потрачено', UI.money(sum), 'var(--amber)') +
          kpi('Средняя цена', UI.money(avg), '#8494AC') +
          kpi('Поставщиков', String(suppliers().length)) +
          kpi('Сейчас на складе', UI.num(stockQty) + '<small> шт</small>',
            stockQty ? 'var(--green)' : '#8494AC', stockSum ? 'на ' + UI.money(stockSum) : 'всё разъехалось') +
        '</section>' +

        (payList.length
          ? '<div class="card flat row" style="gap:18px;flex-wrap:wrap">' +
              '<span style="font-size:12px;color:#64748B;letter-spacing:.08em;text-transform:uppercase;font-weight:600">' +
                'По оплате</span>' +
              payList.map(([k, v]) =>
                '<span class="row" style="gap:7px"><span style="font-size:13px;color:#B9C6DA">' + UI.esc(k) + '</span>' +
                '<b class="mono" style="font-size:13px">' + UI.money(v) + '</b></span>').join('') +
            '</div>'
          : '') +

        '<div class="toolbar">' +
          '<div class="filters" id="bPeriod">' +
            PERIODS.map(p => '<button class="chip' + (period === p.key ? ' active' : '') +
              '" data-period="' + p.key + '">' + p.label + '</button>').join('') +
          '</div>' +
          '<div class="grow"></div>' +
          select('bCat', cat, [{ v: 'all', t: 'Все категории' }]
            .concat(CFG.categories.map(c => ({ v: c.key, t: c.label })))) +
          select('bSupplier', supplier, [{ v: 'all', t: 'Все поставщики' }]
            .concat(suppliers().map(s => ({ v: s, t: s })))) +
          select('bPay', payment, [{ v: 'all', t: 'Любая оплата' }]
            .concat(payments().map(s => ({ v: s, t: s })))) +
          '<div class="search">' + UI.icon('search', 15, '#64748B', 1.8) +
            '<input id="bSearch" type="search" placeholder="Товар, поставщик, артикул…" value="' + UI.esc(query) + '"></div>' +
        '</div>' +

        (list.length
          ? '<div class="grid-wrap"><table class="grid"><thead><tr>' +
              TH.map(t => '<th class="' + (t.cls || '') + (t.key ? ' sortable' : '') +
                (sort.key === t.key ? ' sorted' : '') + '"' +
                (t.key ? ' data-sort="' + t.key + '"' : '') + '>' + t.label +
                (sort.key === t.key ? (sort.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>').join('') +
            '</tr></thead><tbody>' + list.map(row).join('') + '</tbody></table></div>' +
            '<p style="margin:0;font-size:12px;color:#64748B">Закупок: ' + UI.num(list.length) +
              ' · на сумму ' + UI.money(sum) + '</p>'
          : '<div class="empty-state">' +
              ((ctx.purchases || []).length
                ? 'За выбранный период закупок нет — смените период или фильтр.'
                : 'Закупок пока нет. Нажмите «Новая закупка» и внесите первую поставку.') +
            '</div>') +
      '</main>';

    bind(host);
  }

  function kpi(label, value, color, sub) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
      (sub ? '<span style="font-size:11px;color:#64748B">' + UI.esc(sub) + '</span>' : '') + '</div>';
  }

  function select(id, value, options) {
    return '<select class="input sm" id="' + id + '" style="width:auto;min-width:160px">' +
      options.map(o => '<option value="' + UI.esc(o.v) + '"' +
        (String(o.v) === String(value) ? ' selected' : '') + '>' + UI.esc(o.t) + '</option>').join('') +
      '</select>';
  }

  function row(p) {
    return '<tr data-id="' + UI.esc(p.id) + '">' +
      '<td class="num" style="white-space:nowrap">' + UI.esc(fmtDate(p.date)) + '</td>' +
      '<td><div class="prod"><b>' + UI.esc(p.name) + '</b>' +
        '<small>' + UI.esc(p.brand || '—') + '</small></div></td>' +
      '<td>' + (p.supplier
        ? UI.esc(p.supplier)
        : '<span style="color:#4B5A75">не указан</span>') + '</td>' +
      '<td>' + UI.catBadge(p.category) + '</td>' +
      '<td class="num">' + UI.esc(p.volume || '—') + '</td>' +
      '<td><span class="sku">' + UI.esc(p.sku || '—') + '</span></td>' +
      '<td class="r">' + UI.num(p.cost) + '</td>' +
      '<td class="r pos">+' + UI.num(p.qty) + '</td>' +
      '<td class="r"><b>' + UI.num(p.amount) + '</b></td>' +
      '<td>' + (p.payment
        ? '<span class="pill sm neutral">' + UI.esc(p.payment) + '</span>'
        : '<span style="color:#4B5A75">—</span>') +
        (() => {
          const owe = (Number(p.amount) || 0) - STORE.paidOf(p);
          if (owe <= 0.009) return '';
          return ' <span class="pill sm empty" title="Не оплачено сразу. Долг гасится оплатами в «Деньгах» → «Поставщики»">' +
            (STORE.paidOf(p) ? 'частично, долг ' : 'в долг ') + UI.num(Math.round(owe)) + '</span>';
        })() +
        (p.note ? '<div style="font-size:11px;color:#4B5A75;margin-top:3px">' + UI.esc(p.note) + '</div>' : '') + '</td>' +
      '<td class="r"><div class="row-act">' +
        '<button class="icon-btn sm" data-act="edit" title="Изменить">' + UI.icon('edit', 14) + '</button>' +
        '<button class="icon-btn sm danger" data-act="del" title="Удалить">' + UI.icon('trash', 14) + '</button>' +
      '</div></td>' +
    '</tr>';
  }

  function fmtDate(d) {
    if (!d) return '—';
    const p = String(d).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : d;
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const rerender = () => render(host, ctx);

    host.querySelector('#bPeriod').addEventListener('click', (e) => {
      const b = e.target.closest('[data-period]');
      if (!b) return;
      period = Number(b.dataset.period);
      rerender();
    });

    host.querySelector('#bCat').addEventListener('change', e => { cat = e.target.value; rerender(); });
    host.querySelector('#bSupplier').addEventListener('change', e => { supplier = e.target.value; rerender(); });
    host.querySelector('#bPay').addEventListener('change', e => { payment = e.target.value; rerender(); });

    host.querySelector('#bSearch').addEventListener('input', (e) => {
      query = e.target.value;
      rerender();
      const el = host.querySelector('#bSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });

    host.querySelector('#bAdd').addEventListener('click', () => editModal(null));
    host.querySelector('#bExport').addEventListener('click', exportCsv);
    host.querySelector('#bImport').addEventListener('click', () => window.LC_IMPORT.open('buys', ctx));

    const table = host.querySelector('.grid');
    if (!table) return;

    table.querySelectorAll('[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sort.key === key) sort.dir = -sort.dir;
        else sort = { key, dir: key === 'name' || key === 'supplier' || key === 'payment' || key === 'category' ? 1 : -1 };
        rerender();
      });
    });

    table.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.closest('tr').dataset.id;
      const p = (ctx.purchases || []).find(x => x.id === id);
      if (!p) return;
      if (b.dataset.act === 'edit') editModal(p);
      if (b.dataset.act === 'del') remove(p);
    });
  }

  async function remove(p) {
    const ok = await UI.confirmBox(
      'Удалить закупку «' + p.name + '»?',
      fmtDate(p.date) + ' · ' + p.qty + ' шт на ' + UI.money(p.amount) +
      '. Остаток склада пересчитается.', 'Удалить', 'btn-danger');
    if (!ok) return;
    ctx.act(() => STORE.deletePurchase(p.id, ctx.user), 'Закупка удалена');
  }

  /* ---------------- окно закупки ---------------- */

  function editModal(p) {
    const isNew = !p;
    const active = (ctx.catalog || []).filter(c => !c.archived);

    if (!active.length) {
      UI.confirmBox('Прайс пустой',
        'Закупка заводится на товар из прайса. Сначала добавьте позицию в прайсе — ' +
        'название, фирму, объём и артикул.', 'Понятно').then(() => {});
      return;
    }

    let chosen = isNew ? null : p.catalog_id;
    const today = new Date().toISOString().slice(0, 10);
    const known = suppliers();
    const pays = payments();

    UI.modal({
      title: isNew ? 'Новая закупка' : 'Изменить закупку',
      subtitle: isNew ? 'Что привезли на склад' : p.name + ' · ' + fmtDate(p.date),
      wide: true,
      noFocus: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +

          '<div class="field"><label>Товар из прайса</label>' +
            '<div class="search" style="margin-bottom:8px"><input id="bPick" type="search" ' +
              'placeholder="Поиск: название, фирма, артикул…"></div>' +
            '<div class="picker" id="bPicker"></div>' +
            '<div id="bChosen" style="font-size:12px;color:#64748B;margin-top:6px"></div>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            UI.field('Дата поставки', 'b-date', '', 'date', isNew ? today : p.date) +
            '<div class="field"><label for="b-supplier">Поставщик</label>' +
              '<input class="input sm" id="b-supplier" list="bSuppliers" placeholder="ООО «Смазка»" value="' +
                UI.esc(isNew ? '' : (p.supplier || '')) + '">' +
              '<datalist id="bSuppliers">' + known.map(s => '<option value="' + UI.esc(s) + '">').join('') + '</datalist>' +
            '</div>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end">' +
            UI.field('Цена закупки, ₽', 'b-cost', '320', 'number', isNew ? '' : p.cost) +
            UI.field('Количество, шт', 'b-qty', '10', 'number', isNew ? '' : p.qty) +
            '<div class="field"><label>Сумма</label>' +
              '<div class="input sm mono" id="b-sum" style="display:flex;align-items:center;color:var(--amber)">—</div></div>' +
          '</div>' +

          '<div class="field"><label>Оплата поставщику</label>' +
            '<div class="pay-mode" id="b-paymode">' +
              '<label data-mode="full"><input type="radio" name="b-pm" value="full">Оплачено сразу</label>' +
              '<label data-mode="debt"><input type="radio" name="b-pm" value="debt">В долг</label>' +
              '<label data-mode="part"><input type="radio" name="b-pm" value="part">Частично</label>' +
            '</div>' +
            '<div id="b-partbox" style="display:none;margin-top:8px">' +
              UI.field('Сколько заплатили сразу, ₽', 'b-paid', '0', 'number', '', 'остаток станет долгом поставщику') +
            '</div>' +
            '<span class="hint" id="b-payhint"></span>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            '<div class="field"><label for="b-payment">Способ оплаты</label>' +
              '<select class="input sm" id="b-payment">' +
                pays.map(s => '<option value="' + UI.esc(s) + '"' +
                  (!isNew && p.payment === s ? ' selected' : '') + '>' + UI.esc(s) + '</option>').join('') +
                '<option value="">— не указан —</option>' +
              '</select></div>' +
            UI.field('Комментарий', 'b-note', 'номер накладной, договорённости…', 'text', isNew ? '' : (p.note || '')) +
          '</div>' +

          (isNew
            ? '<label class="row" style="gap:9px;cursor:pointer;font-size:13px;color:#B9C6DA">' +
                '<input type="checkbox" id="b-upd" checked style="width:16px;height:16px;accent-color:var(--amber)">' +
                '<span>Обновить цену закупки в прайсе по этой поставке</span></label>'
            : '') +
        '</div>',

      onOpen: (root) => {
        const picker = root.querySelector('#bPicker');
        const chosenBox = root.querySelector('#bChosen');
        const sumBox = root.querySelector('#b-sum');

        const showChosen = () => {
          const c = active.find(x => x.id === chosen);
          chosenBox.innerHTML = c
            ? 'Категория: <b style="color:#B9C6DA">' + UI.esc(UI.catOf(c.category).label) + '</b> · ' +
              'объём: <b style="color:#B9C6DA">' + UI.esc(c.volume || '—') + '</b> · ' +
              'артикул: <b style="color:#B9C6DA">' + UI.esc(c.sku || '—') + '</b> · ' +
              'в прайсе закупка ' + UI.money(c.cost)
            : 'Выберите товар — категория, объём и артикул подставятся из прайса.';
        };

        const paint = (q) => {
          const s = (q || '').trim().toLowerCase();
          const list = active.filter(c => !s ||
            (c.name + ' ' + (c.brand || '') + ' ' + (c.sku || '') + ' ' + (c.volume || '')).toLowerCase().includes(s));
          picker.innerHTML = list.length
            ? list.map(c =>
                '<button type="button" class="pick' + (chosen === c.id ? ' on' : '') + '" data-pick="' + c.id + '">' +
                  '<i class="cat-dot" style="background:' + UI.catOf(c.category).color + '"></i>' +
                  '<span class="t"><b>' + UI.esc(c.name) + '</b>' +
                    '<small>' + UI.esc([c.brand, c.volume, c.sku].filter(Boolean).join(' · ')) + '</small></span>' +
                  '<span class="p">' + UI.money(c.cost) + '</span>' +
                '</button>').join('')
            : '<div class="empty-state" style="padding:18px">Ничего не найдено</div>';
        };

        const recalc = () => {
          const cost = Number(root.querySelector('#b-cost').value) || 0;
          const qty = Number(root.querySelector('#b-qty').value) || 0;
          sumBox.textContent = cost && qty ? UI.money(cost * qty) : '—';
        };

        paint('');
        showChosen();
        recalc();

        root.querySelector('#bPick').addEventListener('input', e => paint(e.target.value));
        picker.addEventListener('click', (e) => {
          const b = e.target.closest('[data-pick]');
          if (!b) return;
          chosen = b.dataset.pick;
          picker.querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x.dataset.pick === chosen));
          showChosen();
          const costEl = root.querySelector('#b-cost');
          const c = active.find(x => x.id === chosen);
          if (c && !costEl.value) { costEl.value = c.cost || ''; recalc(); }
        });
        root.querySelector('#b-cost').addEventListener('input', recalc);
        root.querySelector('#b-qty').addEventListener('input', recalc);

        // как оплатили: у старой закупки — как было, у новой — по способу оплаты
        const pm = root.querySelector('#b-paymode');
        const partBox = root.querySelector('#b-partbox');
        const payHint = root.querySelector('#b-payhint');
        const paySel = root.querySelector('#b-payment');
        const setMode = (m) => {
          pm.querySelectorAll('label').forEach(l => {
            const on = l.dataset.mode === m;
            l.classList.toggle('on', on);
            l.querySelector('input').checked = on;
          });
          pm.dataset.mode = m;
          partBox.style.display = m === 'part' ? '' : 'none';
          payHint.textContent = m === 'debt' ? 'Вся сумма станет долгом поставщику — оплатите потом в «Деньгах» → «Поставщики».'
            : m === 'part' ? '' : '';
        };
        let start = /отсроч|долг/i.test(paySel.value) ? 'debt' : 'full';
        if (!isNew) {
          const paid = STORE.paidOf(p), amount = Number(p.amount) || 0;
          start = paid >= amount - 0.009 ? 'full' : (paid > 0 ? 'part' : 'debt');
          if (start === 'part') root.querySelector('#b-paid').value = paid;
        }
        setMode(start);
        pm.addEventListener('click', (e) => {
          const l = e.target.closest('[data-mode]');
          if (l) { e.preventDefault(); setMode(l.dataset.mode); }
        });
        paySel.addEventListener('change', () => {
          if (/отсроч|долг/i.test(paySel.value)) setMode('debt');
          else if (pm.dataset.mode === 'debt') setMode('full');
        });
      },

      actions: [
        { label: 'Отмена', value: null },
        {
          label: isNew ? 'Записать закупку' : 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            if (!chosen) { UI.toast('Выберите товар из прайса', 'err'); return false; }
            const get = (id) => root.querySelector('#' + id).value.trim();
            const qty = Number(get('b-qty'));
            if (!qty || qty <= 0) { UI.toast('Укажите количество', 'err'); return false; }
            if (!get('b-date')) { UI.toast('Укажите дату поставки', 'err'); return false; }
            const mode = root.querySelector('#b-paymode').dataset.mode || 'full';
            const amount = (Number(get('b-cost')) || 0) * qty;
            let paid = mode === 'full' ? amount : 0;
            if (mode === 'part') {
              paid = Number(get('b-paid')) || 0;
              if (paid <= 0 || paid >= amount) { UI.toast('Частично — это больше нуля и меньше суммы ' + UI.money(amount), 'err'); return false; }
            }
            if (mode !== 'full' && !get('b-supplier')) {
              UI.toast('Закупка в долг — укажите поставщика, иначе долг некому будет оплатить', 'err'); return false;
            }
            const data = {
              catalog_id: chosen, date: get('b-date'), supplier: get('b-supplier'),
              cost: get('b-cost'), qty: qty, payment: get('b-payment'), note: get('b-note'), paid: paid,
              updateCost: isNew && root.querySelector('#b-upd') && root.querySelector('#b-upd').checked
            };
            ctx.act(
              () => isNew ? STORE.addPurchase(data, ctx.user) : STORE.updatePurchase(p.id, data, ctx.user),
              (r) => isNew ? 'Закупка записана: +' + r.qty + ' шт на ' + UI.money(r.amount) : 'Закупка обновлена'
            );
            return true;
          }
        }
      ]
    });
  }

  /* ---------------- выгрузка ---------------- */

  function exportCsv() {
    const list = rows();
    const out = [['Дата поставки', 'Товар', 'Фирма', 'Поставщик', 'Категория', 'Объём', 'Артикул',
      'Цена закупки', 'Количество', 'Сумма', 'Способ оплаты', 'Оплачено сразу', 'Долг', 'Комментарий', 'Кто внёс']];
    list.forEach(p => out.push([
      fmtDate(p.date), p.name, p.brand || '', p.supplier || '', UI.catOf(p.category).label,
      p.volume || '', p.sku || '', p.cost || 0, p.qty || 0, p.amount || 0,
      p.payment || '', STORE.paidOf(p), Math.round(((Number(p.amount) || 0) - STORE.paidOf(p)) * 100) / 100,
      p.note || '', p.user_name || ''
    ]));
    UI.downloadFile('zakupki-' + UI.today() + '.csv', UI.csv(out));
    UI.toast('Закупки выгружены: ' + list.length + ' записей', 'ok');
  }

  return { render };
})();



/* ============================================================
   Lube Control — ДВИЖЕНИЯ ТОВАРА
   Что, когда, откуда и куда уехало. С фильтрами и итогами.
   ============================================================ */

window.LC_MOVES = (function () {
  const UI = window.LC_UI;
  const STORE = window.LC_STORE;

  let ctx = null;
  const selected = new Set();   // отмеченные записи для удаления
  let period = 7;          // дней; 0 — за всё время
  let rackCode = 'all';
  let kind = 'move';       // move | sale | in | audit | setup | price | all
  let query = '';
  let who = 'all';         // логин сотрудника

  const KINDS = [
    { key: 'move',  label: 'Товар' },
    { key: 'sale',  label: 'Продажи' },
    { key: 'in',    label: 'Приход' },
    { key: 'buy',   label: 'Закупки' },
    { key: 'audit', label: 'Сверки' },
    { key: 'setup', label: 'Стеллажи' },
    { key: 'price', label: 'Прайс' },
    { key: 'users', label: 'Сотрудники' },
    { key: 'money', label: 'Оплаты' },
    { key: 'history', label: 'Правки истории' },
    { key: 'all',   label: 'Всё' }
  ];
  const PERIODS = [
    { key: 1, label: 'Сегодня' },
    { key: 7, label: '7 дней' },
    { key: 30, label: '30 дней' },
    { key: 0, label: 'Всё время' }
  ];

  function openFor(code) { rackCode = code; kind = 'move'; period = 30; }

  /* ---------------- отбор ---------------- */

  function matchKind(o) {
    const g = UI.opInfo(o.type).group;
    if (kind === 'all') return true;
    if (kind === 'sale') return o.type === 'sale';
    if (kind === 'in') return o.type === 'restock' || o.type === 'delivery' || o.type === 'cancel';
    if (kind === 'buy') return g === 'buy';
    if (kind === 'audit') return o.type === 'audit';
    if (kind === 'move') return g === 'move';
    return g === kind;
  }

  function list() {
    const q = query.trim().toLowerCase();
    const from = period ? startOfPeriod(period) : 0;
    return ctx.ops.filter(o => {
      if (period && new Date(o.created_at).getTime() < from) return false;
      if (rackCode !== 'all' && o.rack_code !== rackCode) return false;
      if (who !== 'all' && (o.user_login || '') !== who) return false;
      if (!matchKind(o)) return false;
      if (!q) return true;
      return ((o.item_name || '') + ' ' + (o.brand || '') + ' ' + (o.sku || '') + ' ' +
        (o.rack_code || '') + ' ' + (o.user_name || '') + ' ' + (o.note || '')).toLowerCase().includes(q);
    });
  }

  function startOfPeriod(days) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (days - 1));
    return d.getTime();
  }

  function totals(rows) {
    let soldQty = 0, revenue = 0, cost = 0, margin = 0, inQty = 0, inSum = 0, auditDiff = 0;
    let buyQty = 0, buySum = 0;
    rows.forEach(o => {
      if (o.type === 'sale' && !o.cancelled) {
        soldQty += o.qty;
        revenue += Number(o.amount || 0);
        cost += o.qty * Number(o.cost || 0);
        margin += Number(o.margin || 0);
      }
      if (o.type === 'restock' || o.type === 'delivery') {
        inQty += o.qty;
        inSum += Number(o.amount || 0);
      }
      if (o.type === 'purchase') { buyQty += o.qty; buySum += Number(o.amount || 0); }
      if (o.type === 'audit') auditDiff += o.qty;
    });
    return { soldQty, revenue, cost, margin, inQty, inSum, auditDiff, buyQty, buySum };
  }

  /* ---------------- отрисовка ---------------- */

  function render(host, context) {
    ctx = context;
    const rows = list();
    const t = totals(rows);
    const shown = rows.slice(0, 500);
    const alive = new Set(ctx.ops.map(o => o.id));
    Array.from(selected).forEach(id => { if (!alive.has(id)) selected.delete(id); });
    const allOn = shown.length > 0 && shown.every(o => selected.has(o.id));
    const rackName = rackCode === 'all' ? 'по всем стеллажам'
      : (() => { const r = ctx.racks.find(x => x.code === rackCode); return r ? r.code + ' · ' + r.station : rackCode; })();

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Движения товара</h1><p>Каждая штука: продажа, приход, сверка — ' + UI.esc(rackName) + '</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="mClear" style="color:var(--red)">' + UI.icon('trash', 15) + '<span>Очистить историю</span></button>' +
            '<button class="btn btn-ghost" id="mExport">' + UI.icon('down', 15) + '<span>Выгрузить в CSV</span></button>' +
          '</div>' +
        '</div>' +

        '<section class="kpi-grid six">' +
          kpi('Продано', UI.num(t.soldQty) + '<small> шт</small>') +
          kpi('Выручка', UI.money(t.revenue), '#F2B705') +
          kpi('Себестоимость', UI.money(t.cost), '#8494AC') +
          kpi('Маржа', UI.money(t.margin), t.margin >= 0 ? '#3DDC84' : '#FF5A5F') +
          kpi('Отгружено на точки', '+' + UI.num(t.inQty) + '<small> шт</small>',
            '#3DDC84', t.inSum ? 'на ' + UI.money(t.inSum) : '') +
          kpi('Закуплено', '+' + UI.num(t.buyQty) + '<small> шт</small>',
            '#7C8CF8', t.buySum ? 'на ' + UI.money(t.buySum) : '') +
        '</section>' +

        '<div class="toolbar">' +
          '<div class="filters" id="mPeriod">' +
            PERIODS.map(p => '<button class="chip' + (period === p.key ? ' active' : '') +
              '" data-period="' + p.key + '">' + p.label + '</button>').join('') +
          '</div>' +
          '<span class="divider-v"></span>' +
          '<div class="filters" id="mKind">' +
            KINDS.map(k => '<button class="chip' + (kind === k.key ? ' active' : '') +
              '" data-kind="' + k.key + '">' + k.label + '</button>').join('') +
          '</div>' +
          '<div class="grow"></div>' +
          '<select class="input sm" id="mRack" style="width:auto;min-width:190px">' +
            '<option value="all"' + (rackCode === 'all' ? ' selected' : '') + '>Все стеллажи</option>' +
            ctx.racks.map(r => '<option value="' + UI.esc(r.code) + '"' +
              (rackCode === r.code ? ' selected' : '') + '>' + UI.esc(r.code + ' · ' + r.station) + '</option>').join('') +
          '</select>' +
          (() => {
            const people = {};
            ctx.ops.forEach(o => { if (o.user_login && !people[o.user_login]) people[o.user_login] = o.user_name || o.user_login; });
            const list = Object.keys(people).sort((a, b) => people[a].localeCompare(people[b], 'ru'));
            return '<select class="input sm" id="mWho" style="width:auto;min-width:160px">' +
              '<option value="all">Все сотрудники</option>' +
              list.map(l => '<option value="' + UI.esc(l) + '"' + (who === l ? ' selected' : '') + '>' +
                UI.esc(people[l] + ' · ' + l) + '</option>').join('') + '</select>';
          })() +
          '<div class="search">' + UI.icon('search', 15, '#64748B', 1.8) +
            '<input id="mSearch" type="search" placeholder="Товар, артикул, продавец…" value="' + UI.esc(query) + '"></div>' +
        '</div>' +

        (selected.size
          ? '<div class="card flat row-between" style="padding:10px 14px;gap:12px;flex-wrap:wrap;border-color:rgba(255,90,95,.35)">' +
              '<span style="font-size:13px">Отмечено записей: <b>' + selected.size + '</b></span>' +
              '<div class="row" style="gap:8px">' +
                '<button class="btn btn-ghost btn-sm" id="mSelNone">Снять отметки</button>' +
                '<button class="btn btn-danger btn-sm" id="mSelDel">' + UI.icon('trash', 14) + '<span>Удалить отмеченные</span></button>' +
              '</div>' +
            '</div>'
          : '') +
        (rows.length
          ? '<div class="grid-wrap"><table class="grid"><thead><tr>' +
              '<th style="width:34px"><input type="checkbox" id="mAll" title="Отметить все на экране"' + (allOn ? ' checked' : '') + '></th>' +
              '<th>Когда</th><th>Стеллаж</th><th>Товар</th><th>Артикул</th><th>Операция</th>' +
              '<th class="r">Кол-во</th><th class="r">Цена</th><th class="r">Сумма</th>' +
              '<th class="r">Маржа</th><th class="r">Остаток после</th><th>Кто</th><th class="r"></th>' +
            '</tr></thead><tbody>' + shown.map(row).join('') + '</tbody></table></div>' +
            (rows.length > 500
              ? '<p style="margin:0;font-size:12px;color:#64748B">Показаны последние 500 из ' +
                UI.num(rows.length) + '. Сузьте период или выгрузите в CSV.</p>'
              : '<p style="margin:0;font-size:12px;color:#64748B">Записей: ' + UI.num(rows.length) + '</p>')
          : '<div class="empty-state">За выбранный период движений нет. Смените период или фильтр.</div>') +
      '</main>';

    bind(host);
  }

  function kpi(label, value, color, sub) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
      (sub ? '<span style="font-size:11px;color:#64748B">' + UI.esc(sub) + '</span>' : '') + '</div>';
  }

  function row(o) {
    const info = UI.opInfo(o.type);
    const sign = o.cancelled ? 0 : info.sign;
    const qtyTxt = o.qty
      ? (sign > 0 ? '+' + o.qty : sign < 0 ? '−' + o.qty : o.qty + '')
      : '—';
    const qtyCls = o.cancelled ? '' : (sign > 0 ? 'pos' : sign < 0 ? 'neg' : '');
    const isSale = o.type === 'sale' && !o.cancelled;

    return '<tr data-op="' + UI.esc(o.id) + '"' + (selected.has(o.id) ? ' style="background:rgba(255,90,95,.06)"' : '') + '>' +
      '<td><input type="checkbox" data-sel' + (selected.has(o.id) ? ' checked' : '') + '></td>' +
      '<td class="num" style="color:#8494AC;white-space:nowrap">' + UI.dateTime(o.created_at) + '</td>' +
      '<td><span class="sku" style="color:' + (o.rack_code ? 'var(--amber)' : '#64748B') + '">' +
        UI.esc(o.rack_code || 'склад') + '</span></td>' +
      '<td><div class="prod"><b' + (o.cancelled ? ' style="text-decoration:line-through;color:#64748B"' : '') + '>' +
        UI.esc(o.item_name || o.note || '—') + '</b>' +
        '<small>' + UI.esc(o.brand || (o.item_name ? '' : o.note) || '') + '</small></div></td>' +
      '<td><span class="sku">' + UI.esc(o.sku || '—') + '</span></td>' +
      '<td><span style="font-size:12px;color:' + info.color + '">' + info.label + '</span>' +
        (o.cancelled ? '<span class="pill sm neutral" style="margin-left:6px">отменено</span>' : '') +
        (o.note && o.item_name ? '<div style="font-size:11px;color:#4B5A75">' + UI.esc(o.note) + '</div>' : '') + '</td>' +
      '<td class="r ' + qtyCls + '">' + qtyTxt + '</td>' +
      '<td class="r" style="color:#64748B">' + (isSale ? UI.num(o.price) : (o.cost ? UI.num(o.cost) : '—')) + '</td>' +
      '<td class="r">' + (o.amount ? UI.num(o.amount) : '—') + '</td>' +
      '<td class="r ' + (o.margin > 0 && !o.cancelled ? 'pos' : '') + '">' +
        (isSale && o.margin ? '+' + UI.num(o.margin) : '—') + '</td>' +
      '<td class="r" style="color:#8494AC">' + (o.qty_after === null || o.qty_after === undefined ? '—' : o.qty_after) + '</td>' +
      '<td style="font-size:12px;color:#8494AC">' + UI.esc(o.user_name || '—') + '</td>' +
      '<td class="r"><div class="row-act">' +
        '<button class="icon-btn sm" data-op-act="edit" title="Исправить запись">' + UI.icon('edit', 14) + '</button>' +
        '<button class="icon-btn sm danger" data-op-act="del" title="Удалить запись">' + UI.icon('trash', 14) + '</button>' +
      '</div></td>' +
    '</tr>';
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const rerender = () => render(host, ctx);

    host.querySelector('#mPeriod').addEventListener('click', (e) => {
      const b = e.target.closest('[data-period]');
      if (!b) return;
      period = Number(b.dataset.period);
      rerender();
    });

    host.querySelector('#mKind').addEventListener('click', (e) => {
      const b = e.target.closest('[data-kind]');
      if (!b) return;
      kind = b.dataset.kind;
      rerender();
    });

    host.querySelector('#mRack').addEventListener('change', (e) => {
      rackCode = e.target.value;
      rerender();
    });

    host.querySelector('#mWho').addEventListener('change', (e) => {
      who = e.target.value;
      rerender();
    });

    host.querySelector('#mSearch').addEventListener('input', (e) => {
      query = e.target.value;
      rerender();
      const el = host.querySelector('#mSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });

    host.querySelector('#mExport').addEventListener('click', exportCsv);
    host.querySelector('#mClear').addEventListener('click', () => clearModal(ctx));

    const all = host.querySelector('#mAll');
    if (all) all.addEventListener('change', () => {
      list().slice(0, 500).forEach(o => { if (all.checked) selected.add(o.id); else selected.delete(o.id); });
      rerender();
    });
    const none = host.querySelector('#mSelNone');
    if (none) none.addEventListener('click', () => { selected.clear(); rerender(); });
    const bulk = host.querySelector('#mSelDel');
    if (bulk) bulk.addEventListener('click', () => deleteModal(Array.from(selected)));

    const table = host.querySelector('.grid');
    if (table) table.addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-op]');
      if (!tr) return;
      const id = tr.dataset.op;
      if (e.target.matches('[data-sel]')) {
        if (e.target.checked) selected.add(id); else selected.delete(id);
        rerender();
        return;
      }
      const b = e.target.closest('[data-op-act]');
      if (!b) return;
      if (b.dataset.opAct === 'del') deleteModal([id]);
      if (b.dataset.opAct === 'edit') editModal(id);
    });
  }

  /* ---------------- правка и удаление записей ---------------- */

  function describe(o) {
    return UI.opInfo(o.type).label + (o.item_name ? ' · ' + o.item_name : (o.note ? ' · ' + o.note : '')) +
      (o.qty ? ' · ' + o.qty + ' шт' : '') + (o.rack_code ? ' · ' + o.rack_code : '');
  }

  async function deleteModal(ids) {
    const ops = ctx.ops.filter(o => ids.indexOf(o.id) >= 0);
    if (!ops.length) return;
    const withShelf = ops.filter(o => STORE.opEffect(o) !== 0);
    const buys = ops.filter(o => o.type === 'purchase').length;
    let revert = null;

    await UI.modal({
      title: ops.length === 1 ? 'Удалить запись?' : 'Удалить записи: ' + ops.length + '?',
      subtitle: 'Строки исчезнут из истории, из выручки и итогов. В журнале останется одна отметка, что вы их удалили.',
      wide: true,
      body:
        '<div class="stack-sm" style="gap:12px">' +
          '<div class="card flat stack-sm" style="gap:5px;padding:12px 14px;max-height:200px;overflow:auto">' +
            ops.slice(0, 30).map(o => '<div style="font-size:12px"><span style="color:#64748B">' + UI.dateTime(o.created_at) +
              '</span> ' + UI.esc(describe(o)) + '</div>').join('') +
            (ops.length > 30 ? '<div style="font-size:12px;color:#64748B">и ещё ' + (ops.length - 30) + '…</div>' : '') +
          '</div>' +
          (withShelf.length
            ? '<label class="row" style="gap:10px;font-size:13px;cursor:pointer;align-items:flex-start">' +
                '<input type="checkbox" id="dRevert" checked style="margin-top:2px">' +
                '<span>Вернуть остатки на полках так, будто этих операций не было' +
                  '<small style="display:block;color:#64748B;font-size:11px;margin-top:2px">Например, удалили ошибочную продажу — ' +
                  'канистра вернётся на полку. Снимите галочку, если на полке и так верная цифра.</small></span></label>'
            : '') +
          (buys
            ? '<div style="font-size:12px;color:var(--orange)">Среди них ' + buys + ' записей о закупке. Здесь удаляется только строка ' +
              'журнала — чтобы убрать сам товар со склада, удалите закупку в разделе «Закупки».</div>'
            : '') +
        '</div>',
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Удалить', kind: 'btn-danger',
          onClick: (root) => { const c = root.querySelector('#dRevert'); revert = !!(c && c.checked); return true; }
        }
      ]
    });
    if (revert === null) return;
    const res = await ctx.act(() => STORE.deleteOps(ops.map(o => o.id), revert, ctx.user),
      (r) => 'Удалено записей: ' + r.count + (r.shifted ? ' · остатки на полках поправлены' : '') +
        (r.gone ? ' · ' + r.gone + ' позиций уже нет на стеллаже' : ''));
    if (res) ops.forEach(o => selected.delete(o.id));
  }

  async function editModal(id) {
    const o = ctx.ops.find(x => x.id === id);
    if (!o) return;
    const qtyEditable = ['sale', 'restock', 'delivery', 'cancel', 'unload', 'writeoff'].indexOf(o.type) >= 0 &&
      !o.cancelled && !!o.item_id;
    const isSale = o.type === 'sale';
    let data = null;

    await UI.modal({
      title: 'Исправить запись',
      subtitle: UI.dateTime(o.created_at) + ' · ' + describe(o) + (o.user_name ? ' · ' + o.user_name : ''),
      wide: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          (qtyEditable
            ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
                UI.field('Количество, шт', 'eQty', '1', 'number', o.qty) +
                (isSale ? UI.field('Цена продажи за 1 шт, ₽', 'ePrice', '0', 'number', o.price) : '<div></div>') +
              '</div>' +
              '<label class="row" style="gap:10px;font-size:13px;cursor:pointer;align-items:flex-start">' +
                '<input type="checkbox" id="eRevert" checked style="margin-top:2px">' +
                '<span>Поправить остаток на полке на разницу' +
                  '<small style="display:block;color:#64748B;font-size:11px;margin-top:2px">Было продано 2, исправили на 1 — ' +
                  'одна канистра вернётся на полку.</small></span></label>'
            : '<div style="font-size:12px;color:#64748B">У этой записи можно поправить только комментарий. ' +
              'Если операции не было — удалите запись.</div>') +
          UI.field('Комментарий', 'eNote', '', 'text', o.note || '') +
        '</div>',
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            data = { note: root.querySelector('#eNote').value };
            if (qtyEditable) {
              data.qty = Number(root.querySelector('#eQty').value);
              if (!(data.qty >= 1)) { UI.toast('Количество не меньше 1. Если операции не было — удалите запись.', 'err'); data = null; return false; }
              if (isSale) data.price = Number(root.querySelector('#ePrice').value);
              data.revert = root.querySelector('#eRevert').checked;
            }
            return true;
          }
        }
      ]
    });
    if (!data) return;
    ctx.act(() => STORE.editOp(id, data, ctx.user), 'Запись исправлена');
  }

  function exportCsv() {
    const rows = list();
    const out = [['Дата', 'Время', 'Стеллаж', 'Товар', 'Фирма', 'Артикул', 'Операция',
      'Знак', 'Кол-во', 'Цена', 'Сумма', 'Маржа', 'Остаток после', 'Кто', 'Комментарий', 'Отменено']];
    rows.forEach(o => {
      const info = UI.opInfo(o.type);
      out.push([
        UI.dateFull(o.created_at), UI.time(o.created_at), o.rack_code || '',
        o.item_name || '', o.brand || '', o.sku || '', info.label,
        o.cancelled ? '' : (info.sign > 0 ? '+' : info.sign < 0 ? '-' : ''),
        o.qty || 0, o.type === 'sale' ? (o.price || 0) : (o.cost || 0),
        o.amount || 0, o.type === 'sale' && !o.cancelled ? (o.margin || 0) : 0,
        o.qty_after === null || o.qty_after === undefined ? '' : o.qty_after,
        o.user_name || '', o.note || '', o.cancelled ? 'да' : ''
      ]);
    });
    UI.downloadFile('dvizheniya-' + UI.today() + '.csv', UI.csv(out));
    UI.toast('Движения выгружены: ' + rows.length + ' записей', 'ok');
  }

  /* ---------------- очистить историю целиком ---------------- */

  async function clearModal(c) {
    const context = c || ctx;
    const nOps = context.ops.length, nBuy = (context.purchases || []).length, nReq = (context.requests || []).length;
    const onShelves = context.racks.reduce((s, r) => s + r.items.reduce((t, i) => t + i.qty, 0), 0);
    let what = null;

    const cb = (id, on, title, sub) =>
      '<label class="row" style="gap:10px;font-size:13px;cursor:pointer;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px">' +
        '<input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + ' style="margin-top:2px">' +
        '<span><b>' + title + '</b><small style="display:block;color:#64748B;font-size:11px;margin-top:2px">' + sub + '</small></span></label>';

    await UI.modal({
      title: 'Очистить историю',
      subtitle: 'Начать учёт с чистого листа. Прайс, стеллажи и сотрудники остаются.',
      wide: true,
      body:
        '<div class="stack-sm" style="gap:10px">' +
          cb('cOps', true, 'Движения — ' + UI.num(nOps) + ' записей', 'Продажи, пополнения, списания, сверки, правки. Выручка и маржа обнулятся.') +
          cb('cBuy', true, 'Закупки — ' + UI.num(nBuy) + ' записей', 'Всё, что вносили в «Закупки», и оплаты поставщикам. Склад станет 0, долги поставщикам обнулятся. Справочник поставщиков и история цен в прайсе останутся.') +
          cb('cReq', true, 'Заявки и отметки «поставка собрана»', 'Сейчас открытых: ' + nReq + '.') +
          cb('cShelf', false, 'Обнулить остатки на полках — сейчас ' + UI.num(onShelves) + ' шт',
            'Позиции на стеллажах останутся, но с нулём. Не отмечайте, если товар на полках реально стоит.') +
          '<div style="font-size:12px;color:#8494AC;line-height:1.55">Не трогаем: прайс (' + context.catalog.length + ' поз.), ' +
            'стеллажи (' + context.racks.length + '), сотрудников, настройки.</div>' +
          cb('cBackup', true, 'Сначала скачать резервную копию (JSON)', 'На случай, если что-то понадобится вернуть или посмотреть.') +
          '<div class="field"><label for="cWord">Чтобы подтвердить, напишите: ОЧИСТИТЬ</label>' +
            '<input class="input sm" id="cWord" autocomplete="off" placeholder="ОЧИСТИТЬ"></div>' +
        '</div>',
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Очистить', kind: 'btn-danger',
          onClick: (root) => {
            const on = (id) => root.querySelector('#' + id).checked;
            if (root.querySelector('#cWord').value.trim().toUpperCase() !== 'ОЧИСТИТЬ') {
              UI.toast('Напишите слово ОЧИСТИТЬ — это защита от случайного нажатия', 'err'); return false;
            }
            what = { ops: on('cOps'), purchases: on('cBuy'), requests: on('cReq'), shelves: on('cShelf'), backup: on('cBackup') };
            if (!what.ops && !what.purchases && !what.requests && !what.shelves) {
              UI.toast('Отметьте, что очистить', 'err'); what = null; return false;
            }
            return true;
          }
        }
      ]
    });
    if (!what) return;

    if (what.backup) {
      const dump = {
        exported_at: new Date().toISOString(),
        catalog: context.catalog, racks: context.racks, purchases: context.purchases,
        ops: context.ops, requests: context.requests,
        suppliers: context.suppliers, supplier_payments: context.payments, price_history: context.priceHistory
      };
      UI.downloadFile('lube-control-kopiya-' + UI.today() + '.json', JSON.stringify(dump, null, 2), 'application/json');
    }
    selected.clear();
    context.act(() => STORE.clearHistory(what, context.user), (r) =>
      'Очищено: ' + [what.ops ? 'движений ' + r.ops : '', what.purchases ? 'закупок ' + r.purchases : '',
        what.requests ? 'заявок ' + r.requests : '', what.shelves ? 'на полках ' + r.shelves + ' шт' : '']
        .filter(Boolean).join(', '));
  }

  return { render, openFor, clearModal };
})();


/* ============================================================
   Lube Control — ДЕНЬГИ
   Всё про деньги на одном экране: сколько принёс каждый стеллаж,
   сколько отдаём продавцам, сколько потрачено на закупки и сколько
   денег сейчас лежит в товаре. Каждая цифра подписана простыми словами.
   ============================================================ */

window.LC_MONEY = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let ctx = null;
  let period = 'month';

  const PERIODS = [
    { key: 'today', label: 'Сегодня' },
    { key: 'week', label: '7 дней' },
    { key: 'month', label: 'Этот месяц' },
    { key: 'prev', label: 'Прошлый месяц' },
    { key: 'd30', label: '30 дней' },
    { key: 'year', label: 'Этот год' },
    { key: 'all', label: 'Всё время' }
  ];

  function range(key) {
    const now = new Date();
    const d0 = new Date(now); d0.setHours(0, 0, 0, 0);
    const end = new Date(d0); end.setDate(end.getDate() + 1);
    if (key === 'today') return { from: d0, to: end };
    if (key === 'week') { const f = new Date(d0); f.setDate(f.getDate() - 6); return { from: f, to: end }; }
    if (key === 'd30') { const f = new Date(d0); f.setDate(f.getDate() - 29); return { from: f, to: end }; }
    if (key === 'month') return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: end };
    if (key === 'prev') return { from: new Date(now.getFullYear(), now.getMonth() - 1, 1), to: new Date(now.getFullYear(), now.getMonth(), 1) };
    if (key === 'year') return { from: new Date(now.getFullYear(), 0, 1), to: end };
    return { from: new Date(2000, 0, 1), to: end };
  }

  const pct = () => Number(CFG.rules.bonusPercent) || 0;
  const isAdminLogin = (login) => login === 'admin' || (ctx.user && login === ctx.user.login);
  const inRange = (iso, r) => { const t = new Date(iso).getTime(); return t >= r.from.getTime() && t < r.to.getTime(); };
  const dateIn = (d, r) => { const t = new Date(String(d) + 'T12:00:00').getTime(); return t >= r.from.getTime() && t < r.to.getTime(); };

  /* ---------------- расчёт ---------------- */

  function blank() { return { qty: 0, revenue: 0, cogs: 0, bonus: 0, writeoff: 0, writeoffQty: 0 }; }
  function finish(x) {
    x.gross = x.revenue - x.cogs;
    x.net = x.gross - x.bonus - x.writeoff;
    x.marginPct = x.revenue ? Math.round(x.gross / x.revenue * 100) : 0;
    return x;
  }

  function compute(r) {
    const total = blank();
    const byRack = {}, bySeller = {}, byItem = {};
    const P = pct();

    ctx.ops.forEach(o => {
      if (!inRange(o.created_at, r)) return;
      if (o.type === 'sale' && !o.cancelled) {
        const qty = Number(o.qty) || 0;
        const revenue = Number(o.amount) || 0;
        const cogs = qty * (Number(o.cost) || 0);
        const bonus = isAdminLogin(o.user_login) ? 0 : revenue * P / 100;
        [total, byRack[o.rack_code] = byRack[o.rack_code] || blank()].forEach(x => {
          x.qty += qty; x.revenue += revenue; x.cogs += cogs; x.bonus += bonus;
        });
        const sk = o.user_login || '—';
        const s = bySeller[sk] = bySeller[sk] || Object.assign(blank(), { name: o.user_name || sk, racks: new Set(), admin: isAdminLogin(o.user_login) });
        s.qty += qty; s.revenue += revenue; s.cogs += cogs; s.bonus += bonus; if (o.rack_code) s.racks.add(o.rack_code);
        const ik = o.catalog_id || o.item_name;
        const it = byItem[ik] = byItem[ik] || Object.assign(blank(), { name: o.item_name, brand: o.brand || '' });
        it.qty += qty; it.revenue += revenue; it.cogs += cogs; it.bonus += bonus;
      }
      if (o.type === 'writeoff') {
        const loss = (Number(o.qty) || 0) * (Number(o.cost) || 0);
        [total, byRack[o.rack_code] = byRack[o.rack_code] || blank()].forEach(x => {
          x.writeoff += loss; x.writeoffQty += Number(o.qty) || 0;
        });
      }
    });

    const buys = (ctx.purchases || []).filter(p => dateIn(p.date, r));
    const spent = buys.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    // живые деньги поставщикам: оплачено сразу при закупке + оплаты долгов за период
    const paidNow = buys.reduce((s, p) => s + STORE.paidOf(p), 0);
    const pays = (ctx.payments || []).filter(p => dateIn(p.date, r));
    const paidLater = pays.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const byPay = {}, bySup = {};
    buys.forEach(p => {
      const k = p.payment || 'не указано'; byPay[k] = (byPay[k] || 0) + (Number(p.amount) || 0);
      const sk = p.supplier || 'не указан'; bySup[sk] = (bySup[sk] || 0) + (Number(p.amount) || 0);
    });

    return { total: finish(total), byRack, bySeller, byItem, spent, buysCount: buys.length, byPay, bySup,
      paidNow, paidLater, paidOut: paidNow + paidLater, pays };
  }

  /** Сколько денег сейчас лежит в товаре. */
  function inventory() {
    const stock = STORE.warehouse(ctx.purchases, ctx.ops);
    const byId = {};
    ctx.catalog.forEach(c => { byId[c.id] = c; });
    let whCost = 0, whQty = 0, whRetail = 0;
    Object.keys(stock).forEach(id => {
      const n = stock[id]; const c = byId[id];
      if (n > 0 && c) { whQty += n; whCost += n * (Number(c.cost) || 0); whRetail += n * (Number(c.price) || 0); }
    });
    let shQty = 0, shCost = 0, shRetail = 0;
    const perRack = {};
    ctx.racks.forEach(r => {
      let q = 0, c = 0, p = 0;
      r.items.forEach(i => { q += i.qty; c += i.qty * (Number(i.cost) || 0); p += i.qty * (Number(i.price) || 0); });
      perRack[r.code] = { qty: q, cost: c, retail: p };
      shQty += q; shCost += c; shRetail += p;
    });
    return { whCost, whQty, whRetail, shQty, shCost, shRetail, perRack };
  }

  function months() {
    const now = new Date();
    const out = [];
    for (let k = 11; k >= 0; k--) {
      const from = new Date(now.getFullYear(), now.getMonth() - k, 1);
      const to = new Date(now.getFullYear(), now.getMonth() - k + 1, 1);
      const c = compute({ from, to });
      if (c.total.revenue || c.spent || c.total.writeoff) {
        out.push({ label: from.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }), c });
      }
    }
    return out.reverse();
  }

  /* ---------------- отрисовка ---------------- */

  const m = (n) => UI.money(n);
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + UI.money(Math.abs(n));
  const tone = (n) => n > 0 ? 'var(--green)' : n < 0 ? 'var(--red)' : '#8494AC';

  function bigCard(label, value, color, explain, op) {
    return '<div class="card money-card">' +
      (op ? '<span class="money-op">' + op + '</span>' : '') +
      '<span class="label">' + label + '</span>' +
      '<span class="money-val" style="color:' + (color || 'var(--text)') + '">' + value + '</span>' +
      '<span class="money-exp">' + explain + '</span>' +
    '</div>';
  }

  function render(host, context) {
    ctx = context;
    const r = range(period);
    const d = compute(r);
    const t = d.total;
    const inv = inventory();
    const P = pct();
    const racks = ctx.racks.map(rk => {
      const x = finish(Object.assign(blank(), d.byRack[rk.code] || {}));
      return { rk, x, inv: inv.perRack[rk.code] || { qty: 0, cost: 0, retail: 0 } };
    }).sort((a, b) => b.x.net - a.x.net);
    const maxNet = Math.max(1, ...racks.map(x => Math.abs(x.x.net)));
    const sellers = Object.keys(d.bySeller).map(k => Object.assign({ login: k }, d.bySeller[k]))
      .sort((a, b) => b.bonus - a.bonus || b.revenue - a.revenue);
    const items = Object.keys(d.byItem).map(k => finish(d.byItem[k])).sort((a, b) => b.gross - a.gross).slice(0, 15);
    const cash = t.revenue - d.paidOut - t.bonus;
    const ledger = STORE.supplierLedger(ctx.suppliers, ctx.purchases, ctx.payments)
      .sort((a, b) => b.debt - a.debt || a.name.localeCompare(b.name, 'ru'));
    const owe = ledger.reduce((s, x) => s + Math.max(0, x.debt), 0);
    const overdue = ledger.filter(x => x.debt > 0 && x.overdueDays > 0);
    const periodLabel = PERIODS.find(p => p.key === period).label.toLowerCase();

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Деньги</h1><p>Сколько заработали, сколько отдаём продавцам, сколько потратили и сколько лежит в товаре.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="fExport">' + UI.icon('down', 15) + '<span>Выгрузить в CSV</span></button>' +
          '</div>' +
        '</div>' +

        '<div class="toolbar"><div class="filters" id="fPeriod">' +
          PERIODS.map(p => '<button class="chip' + (period === p.key ? ' active' : '') + '" data-p="' + p.key + '">' + p.label + '</button>').join('') +
        '</div><div class="grow"></div>' +
        '<span style="font-size:12px;color:#64748B">' + r.from.toLocaleDateString('ru-RU') + ' — ' +
          new Date(r.to.getTime() - 1).toLocaleDateString('ru-RU') + '</span></div>' +

        '<section class="stack-sm" style="gap:10px">' +
          '<div class="section-head"><h2>Прибыль · ' + periodLabel + '</h2>' +
            '<span style="font-size:12px;color:#64748B">бонус продавца сейчас ' + P + '% от выручки</span></div>' +
          '<div class="money-row">' +
            bigCard('Выручка', m(t.revenue), 'var(--amber)',
              'Столько заплатили покупатели. Продано ' + UI.num(t.qty) + ' шт.') +
            bigCard('Себестоимость', m(t.cogs), '#8494AC',
              'Столько этот товар стоил вам по закупке.', '−') +
            bigCard('Продавцам', m(t.bonus), 'var(--orange)',
              P + '% от выручки продавцов — это вы им должны. Ваши личные продажи без бонуса.', '−') +
            bigCard('Списания', m(t.writeoff), t.writeoff ? 'var(--red)' : '#8494AC',
              'Брак, протечки, потери' + (t.writeoffQty ? ': ' + t.writeoffQty + ' шт' : '') + ' — по закупочной цене.', '−') +
            bigCard('Чистая прибыль', signed(t.net), tone(t.net),
              'Остаётся вам: выручка − себестоимость − продавцам − списания.' +
              (t.revenue ? ' Это ' + Math.round(t.net / t.revenue * 100) + '% от выручки.' : ''), '=') +
          '</div>' +
        '</section>' +

        '<section class="stack-sm" style="gap:10px">' +
          '<div class="section-head"><h2>Деньги в движении · ' + periodLabel + '</h2></div>' +
          '<div class="money-row four">' +
            bigCard('Закуплено товара', m(d.spent), '#7C8CF8',
              d.buysCount ? d.buysCount + ' строк закупки. Заплачено поставщикам ' + m(d.paidOut) +
                (d.paidLater ? ' (из них долги прошлых закупок ' + m(d.paidLater) + ')' : '') + '.'
                : 'За период закупок не было.' + (d.paidLater ? ' Оплачено долгов: ' + m(d.paidLater) + '.' : '')) +
            bigCard('Пришло − ушло', signed(cash), tone(cash),
              'Выручка минус то, что реально заплатили поставщикам, минус продавцам. Товар, взятый в долг, сюда не входит — он в «Должен поставщикам».') +
            bigCard('Товар на складе', m(inv.whCost), '#B9C6DA',
              UI.num(inv.whQty) + ' шт по закупке, в продаже это ' + m(inv.whRetail) + '. Сейчас, без учёта периода.') +
            bigCard('Товар на полках СТО', m(inv.shCost), '#B9C6DA',
              UI.num(inv.shQty) + ' шт по закупке. Когда продадут — будет ' + m(inv.shRetail) + ' выручки.') +
          '</div>' +
        '</section>' +

        suppliersSection(ledger, owe, overdue, d, periodLabel) +

        '<section class="stack-sm" style="gap:10px">' +
          '<div class="section-head"><h2>Стеллажи — кто сколько приносит</h2>' +
            '<span style="font-size:12px;color:#64748B">по чистой прибыли, лучшие сверху</span></div>' +
          (racks.length
            ? '<div class="grid-wrap"><table class="grid money-grid"><thead><tr>' +
                '<th>Стеллаж</th><th class="r">Продано</th><th class="r">Выручка</th><th class="r">Себестоимость</th>' +
                '<th class="r">Валовая прибыль</th><th class="r">Продавцу ' + P + '%</th><th class="r">Списания</th>' +
                '<th class="r">Чистая прибыль</th><th class="r">Товар на полке</th>' +
              '</tr></thead><tbody>' +
              racks.map(({ rk, x, inv: ri }) =>
                '<tr>' +
                  '<td><div class="prod"><b>' + UI.esc(rk.code + ' · ' + rk.station) + '</b>' +
                    '<small>' + UI.esc([rk.address, rk.operator].filter(Boolean).join(' · ') || '—') + '</small></div></td>' +
                  '<td class="r">' + (x.qty ? x.qty + ' шт' : '—') + '</td>' +
                  '<td class="r">' + (x.revenue ? UI.num(Math.round(x.revenue)) : '—') + '</td>' +
                  '<td class="r" style="color:#8494AC">' + (x.cogs ? '−' + UI.num(Math.round(x.cogs)) : '—') + '</td>' +
                  '<td class="r">' + (x.revenue ? UI.num(Math.round(x.gross)) + ' <span style="color:#4B5A75">' + x.marginPct + '%</span>' : '—') + '</td>' +
                  '<td class="r" style="color:var(--orange)">' + (x.bonus ? '−' + UI.num(Math.round(x.bonus)) : '—') + '</td>' +
                  '<td class="r" style="color:var(--red)">' + (x.writeoff ? '−' + UI.num(Math.round(x.writeoff)) : '—') + '</td>' +
                  '<td class="r"><b style="color:' + tone(x.net) + '">' + (x.net ? signed(Math.round(x.net)) : '—') + '</b>' +
                    '<div class="net-bar"><i style="width:' + Math.round(Math.abs(x.net) / maxNet * 100) + '%;background:' + tone(x.net) + '"></i></div></td>' +
                  '<td class="r" style="color:#8494AC">' + (ri.qty ? ri.qty + ' шт · ' + UI.num(Math.round(ri.cost)) : '—') + '</td>' +
                '</tr>').join('') +
                '<tr class="total"><td><b>Итого</b></td>' +
                  '<td class="r"><b>' + t.qty + ' шт</b></td><td class="r"><b>' + UI.num(Math.round(t.revenue)) + '</b></td>' +
                  '<td class="r">−' + UI.num(Math.round(t.cogs)) + '</td><td class="r"><b>' + UI.num(Math.round(t.gross)) + '</b></td>' +
                  '<td class="r">' + (t.bonus ? '−' + UI.num(Math.round(t.bonus)) : '—') + '</td>' +
                  '<td class="r">' + (t.writeoff ? '−' + UI.num(Math.round(t.writeoff)) : '—') + '</td>' +
                  '<td class="r"><b style="color:' + tone(t.net) + '">' + signed(Math.round(t.net)) + '</b></td>' +
                  '<td class="r">' + inv.shQty + ' шт · ' + UI.num(Math.round(inv.shCost)) + '</td></tr>' +
              '</tbody></table></div>'
            : '<div class="empty-state">Стеллажей пока нет.</div>') +
        '</section>' +

        '<div class="money-2col">' +
          '<section class="stack-sm" style="gap:10px">' +
            '<div class="section-head"><h2>Продавцам к выплате</h2></div>' +
            (sellers.length
              ? '<div class="grid-wrap"><table class="grid" style="min-width:520px"><thead><tr>' +
                  '<th>Кто продавал</th><th class="r">Продано</th><th class="r">Выручка</th><th class="r">К выплате</th>' +
                '</tr></thead><tbody>' +
                sellers.map(sl => '<tr><td><div class="prod"><b>' + UI.esc(sl.name) + '</b><small>' +
                    UI.esc(Array.from(sl.racks).join(', ') || '—') + (sl.admin ? ' · вы сами, без бонуса' : '') + '</small></div></td>' +
                  '<td class="r">' + sl.qty + ' шт</td><td class="r">' + UI.num(Math.round(sl.revenue)) + '</td>' +
                  '<td class="r"><b style="color:var(--orange);font-size:14px">' + (sl.admin ? '—' : m(sl.bonus)) + '</b></td></tr>').join('') +
                '</tbody></table></div>'
              : '<div class="empty-state">Продаж за период нет.</div>') +
          '</section>' +

          '<section class="stack-sm" style="gap:10px">' +
            '<div class="section-head"><h2>Что приносит больше всего</h2><span style="font-size:12px;color:#64748B">по валовой прибыли</span></div>' +
            (items.length
              ? '<div class="grid-wrap"><table class="grid" style="min-width:520px"><thead><tr>' +
                  '<th>Товар</th><th class="r">Продано</th><th class="r">Выручка</th><th class="r">Прибыль</th><th class="r">С 1 шт</th>' +
                '</tr></thead><tbody>' +
                items.map(it => '<tr><td><div class="prod"><b>' + UI.esc(it.name) + '</b><small>' + UI.esc(it.brand || '—') + '</small></div></td>' +
                  '<td class="r">' + it.qty + ' шт</td><td class="r">' + UI.num(Math.round(it.revenue)) + '</td>' +
                  '<td class="r" style="color:' + tone(it.gross) + '">' + signed(Math.round(it.gross)) + '</td>' +
                  '<td class="r" style="color:#8494AC">' + (it.qty ? UI.num(Math.round(it.gross / it.qty)) : '—') + '</td></tr>').join('') +
                '</tbody></table></div>'
              : '<div class="empty-state">Продаж за период нет.</div>') +
          '</section>' +
        '</div>' +

        (() => {
          const ms = months();
          if (!ms.length) return '';
          return '<section class="stack-sm" style="gap:10px">' +
            '<div class="section-head"><h2>По месяцам</h2><span style="font-size:12px;color:#64748B">последние 12 месяцев, где что-то было</span></div>' +
            '<div class="grid-wrap"><table class="grid money-grid"><thead><tr>' +
              '<th>Месяц</th><th class="r">Выручка</th><th class="r">Себестоимость</th><th class="r">Продавцам</th>' +
              '<th class="r">Списания</th><th class="r">Чистая прибыль</th><th class="r">Потрачено на закупки</th>' +
            '</tr></thead><tbody>' +
            ms.map(x => '<tr><td style="text-transform:capitalize">' + x.label + '</td>' +
              '<td class="r">' + UI.num(Math.round(x.c.total.revenue)) + '</td>' +
              '<td class="r" style="color:#8494AC">−' + UI.num(Math.round(x.c.total.cogs)) + '</td>' +
              '<td class="r" style="color:var(--orange)">−' + UI.num(Math.round(x.c.total.bonus)) + '</td>' +
              '<td class="r" style="color:var(--red)">' + (x.c.total.writeoff ? '−' + UI.num(Math.round(x.c.total.writeoff)) : '—') + '</td>' +
              '<td class="r"><b style="color:' + tone(x.c.total.net) + '">' + signed(Math.round(x.c.total.net)) + '</b></td>' +
              '<td class="r" style="color:#7C8CF8">' + UI.num(Math.round(x.c.spent)) + '</td></tr>').join('') +
            '</tbody></table></div></section>';
        })() +

        '<div class="card flat" style="font-size:12px;color:#8494AC;line-height:1.6">' +
          '<b style="color:#B9C6DA">Как считается.</b> Выручка и себестоимость — по каждой продаже с ценами на момент продажи; ' +
          'отменённые продажи не считаются. Бонус продавца — текущий процент из «Настроек» от выручки его продаж; ' +
          'продажи, которые вы отметили сами, без бонуса. Списания — брак и потери по закупочной цене. ' +
          'Закупки — по дате поставки. Товар на складе и на полках — на сегодня, по закупочной цене.' +
        '</div>' +
      '</main>';

    host.querySelector('#fPeriod').addEventListener('click', (e) => {
      const b = e.target.closest('[data-p]');
      if (!b) return;
      period = b.dataset.p;
      render(host, ctx);
    });
    host.querySelector('#fExport').addEventListener('click', () => exportCsv(racks, sellers, t, d, periodLabel, ledger));
    bindSuppliers(host);
  }

  /* ---------------- поставщики: кому сколько должен ---------------- */

  const fmtDate = (s) => { const p = String(s || '').split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : (s || '—'); };
  const debtCell = (n) => '<span class="debt ' + (n > 0.009 ? 'pos' : n < -0.009 ? 'neg' : 'zero') + '">' +
    (n > 0.009 ? UI.money(n) : n < -0.009 ? 'аванс ' + UI.money(-n) : '0 ₽') + '</span>';

  function termCell(x) {
    if (x.debt <= 0.009) return '<span style="color:#4B5A75">—</span>';
    if (!x.terms_days) return '<span style="font-size:12px;color:#8494AC">с ' + fmtDate(x.firstDebtDate) + '</span>';
    if (x.overdueDays > 0) {
      return '<span class="pill sm empty">просрочено ' + x.overdueDays + ' дн</span>' +
        '<div style="font-size:11px;color:#64748B;margin-top:3px">надо было до ' + fmtDate(x.dueDate) + '</div>';
    }
    return '<span class="pill sm low">до ' + fmtDate(x.dueDate) + '</span>' +
      '<div style="font-size:11px;color:#64748B;margin-top:3px">отсрочка ' + x.terms_days + ' дн</div>';
  }

  function suppliersSection(ledger, owe, overdue, d, periodLabel) {
    const shown = ledger.filter(x => x.name !== 'не указан' || x.debt > 0.009 || x.taken);
    const noName = ledger.find(x => x.name === 'не указан' && x.debt > 0.009);
