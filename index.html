    return '<section class="stack-sm" style="gap:10px" id="supSection">' +
      '<div class="section-head"><h2>Поставщики — кому сколько должен</h2>' +
        '<div class="row" style="gap:8px;flex-wrap:wrap">' +
          '<button class="btn btn-ghost btn-sm" data-sup-act="new">' + UI.icon('plus', 14) + '<span>Поставщик</span></button>' +
          '<button class="btn btn-primary btn-sm" data-sup-act="pay">' + UI.icon('coins', 14, '#12161F', 2) + '<span>Внести оплату</span></button>' +
        '</div></div>' +
      '<div class="money-row four">' +
        bigCard('Должен поставщикам', m(owe), owe ? 'var(--red)' : '#8494AC',
          owe ? 'Сейчас, за всё время: закупки в долг минус оплаты. Должников-поставщиков: ' +
            ledger.filter(x => x.debt > 0.009).length + '.' : 'Долгов нет — все закупки оплачены.') +
        bigCard('Просрочено', overdue.length ? m(overdue.reduce((s, x) => s + x.debt, 0)) : '—',
          overdue.length ? 'var(--red)' : '#8494AC',
          overdue.length ? 'Прошёл срок отсрочки: ' + overdue.map(x => UI.esc(x.name)).join(', ') + '.'
            : 'Срок считается от самой старой неоплаченной закупки плюс отсрочка из карточки поставщика.') +
        bigCard('Оплачено долгов · ' + periodLabel, m(d.paidLater), '#7C8CF8',
          d.pays.length ? d.pays.length + ' оплат(ы) поставщикам.' : 'За период оплат долгов не было.') +
        bigCard('Взято в долг · ' + periodLabel, m(d.spent - d.paidNow), '#B9C6DA',
          'Закупки за период, не оплаченные сразу.') +
      '</div>' +
      (shown.length
        ? '<div class="grid-wrap"><table class="grid" style="min-width:860px"><thead><tr>' +
            '<th>Поставщик</th><th class="r">Взято всего</th><th class="r">Оплачено</th><th class="r">Долг</th>' +
            '<th>Срок</th><th>Последняя закупка</th><th class="r"></th>' +
          '</tr></thead><tbody>' +
          shown.map(x => '<tr data-sup="' + UI.esc(x.name) + '">' +
            '<td><div class="prod"><b style="cursor:pointer" data-sup-act="card">' + UI.esc(x.name) + '</b><small>' +
              UI.esc([x.phone, x.contact, x.terms_days ? 'отсрочка ' + x.terms_days + ' дн' : ''].filter(Boolean).join(' · ') ||
                (x.inDirectory ? '—' : 'нет в справочнике — нажмите ✎')) + '</small></div></td>' +
            '<td class="r">' + (x.taken ? UI.num(Math.round(x.taken)) : '—') + '</td>' +
            '<td class="r" style="color:#8494AC">' + (x.paidNow + x.paidLater ? UI.num(Math.round(x.paidNow + x.paidLater)) : '—') + '</td>' +
            '<td class="r">' + debtCell(x.debt) + '</td>' +
            '<td>' + termCell(x) + '</td>' +
            '<td style="font-size:12px;color:#8494AC">' + (x.lastDate ? fmtDate(x.lastDate) : '—') + '</td>' +
            '<td class="r"><div class="row-act always">' +
              (x.name !== 'не указан' && x.debt > 0.009
                ? '<button class="btn btn-ghost btn-sm" data-sup-act="pay">Оплатить</button>' : '') +
              '<button class="icon-btn sm" data-sup-act="card" title="Движение денег (акт сверки)">' + UI.icon('list', 14) + '</button>' +
              (x.name !== 'не указан' ? '<button class="icon-btn sm" data-sup-act="edit" title="Карточка поставщика">' + UI.icon('edit', 14) + '</button>' : '') +
            '</div></td></tr>').join('') +
          '</tbody></table></div>'
        : '<div class="empty-state">Поставщиков пока нет. Они появятся из закупок, или добавьте кнопкой «Поставщик».</div>') +
      (noName ? '<p style="margin:0;font-size:12px;color:var(--orange)">Есть закупки в долг без поставщика на ' + m(noName.debt) +
        ' — укажите поставщика в «Закупках», иначе этот долг некому оплатить.</p>' : '') +
      (d.pays.length
        ? '<details class="card flat" style="font-size:13px"><summary style="cursor:pointer;color:var(--amber)">Оплаты поставщикам · ' +
            periodLabel + ' — ' + d.pays.length + ' на ' + m(d.paidLater) + '</summary>' +
            '<div class="grid-wrap" style="margin-top:10px"><table class="grid" style="min-width:600px"><thead><tr>' +
              '<th>Дата</th><th>Поставщик</th><th class="r">Сумма</th><th>Как</th><th>Комментарий</th><th class="r"></th></tr></thead><tbody>' +
            d.pays.map(p => '<tr data-pay="' + UI.esc(p.id) + '"><td class="num">' + fmtDate(p.date) + '</td>' +
              '<td>' + UI.esc(p.supplier) + '</td><td class="r"><b>' + UI.num(p.amount) + '</b></td>' +
              '<td>' + (p.method ? '<span class="pill sm neutral">' + UI.esc(p.method) + '</span>' : '—') + '</td>' +
              '<td style="font-size:12px;color:#8494AC">' + UI.esc(p.note || '') + '</td>' +
              '<td class="r"><button class="icon-btn sm danger" data-sup-act="delpay" title="Удалить оплату">' + UI.icon('trash', 14) + '</button></td></tr>').join('') +
            '</tbody></table></div></details>'
        : '') +
    '</section>';
  }

  function bindSuppliers(host) {
    const sec = host.querySelector('#supSection');
    if (!sec) return;
    sec.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sup-act]');
      if (!b) return;
      const tr = b.closest('[data-sup]');
      const name = tr ? tr.dataset.sup : '';
      const a = b.dataset.supAct;
      if (a === 'new') editSupplier(null);
      if (a === 'pay') paymentModal(name);
      if (a === 'card') supplierCard(name);
      if (a === 'edit') editSupplier(name);
      if (a === 'delpay') {
        const id = b.closest('[data-pay]').dataset.pay;
        const p = (ctx.payments || []).find(x => x.id === id);
        if (p) removePayment(p);
      }
    });
  }

  const ledgerOf = (name) => STORE.supplierLedger(ctx.suppliers, ctx.purchases, ctx.payments).find(x => x.name === name) || null;
  const supplierNames = () => STORE.supplierLedger(ctx.suppliers, ctx.purchases, ctx.payments)
    .map(x => x.name).filter(n => n !== 'не указан').sort((a, b) => a.localeCompare(b, 'ru'));

  async function removePayment(p) {
    const ok = await UI.confirmBox('Удалить оплату ' + UI.money(p.amount) + '?',
      p.supplier + ' · ' + fmtDate(p.date) + '. Долг поставщику снова вырастет на эту сумму.', 'Удалить', 'btn-danger');
    if (!ok) return;
    ctx.act(() => STORE.deletePayment(p.id, ctx.user), 'Оплата удалена');
  }

  /** Карточка поставщика: телефон, контакт, отсрочка, заметка. */
  function editSupplier(name) {
    const x = name ? (ledgerOf(name) || { name }) : { name: '', phone: '', contact: '', terms_days: 0, note: '' };
    UI.modal({
      title: name ? 'Поставщик' : 'Новый поставщик',
      subtitle: name ? 'Если сменить название — оно поменяется и во всех закупках и оплатах' : 'Телефон и отсрочку можно заполнить потом',
      wide: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px">' +
            UI.combo('Название', 's-name', 'ООО «Смазка»', x.name, name ? [] : supplierNames()) +
            UI.field('Телефон', 's-phone', '+7 900 000-00-00', 'tel', x.phone) +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px">' +
            UI.field('Контактное лицо', 's-contact', 'Иван, менеджер', 'text', x.contact) +
            UI.field('Отсрочка платежа, дней', 's-terms', '0', 'number', x.terms_days || '',
              'через сколько дней после закупки нужно заплатить') +
          '</div>' +
          UI.field('Заметка', 's-note', 'реквизиты, условия, скидки…', 'text', x.note) +
        '</div>',
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            const get = (id) => root.querySelector('#' + id).value.trim();
            const data = { name: get('s-name'), phone: get('s-phone'), contact: get('s-contact'),
              terms_days: get('s-terms'), note: get('s-note') };
            if (!data.name) { UI.toast('Укажите название', 'err'); return false; }
            ctx.act(() => STORE.saveSupplier(data, name, ctx.user), 'Поставщик сохранён');
            return true;
          }
        }
      ]
    });
  }

  /** Оплата поставщику. supplier — кого подставить сразу. */
  function paymentModal(supplier) {
    const names = supplierNames();
    if (!names.length) {
      UI.confirmBox('Поставщиков пока нет', 'Оплата вносится поставщику из закупок или из справочника. ' +
        'Добавьте поставщика кнопкой «Поставщик» или внесите закупку.', 'Понятно');
      return;
    }
    const pick = supplier && names.indexOf(supplier) >= 0 ? supplier
      : (STORE.supplierLedger(ctx.suppliers, ctx.purchases, ctx.payments).filter(x => x.debt > 0.009 && x.name !== 'не указан')
          .sort((a, b) => b.debt - a.debt)[0] || { name: names[0] }).name;
    const debtOf = (n) => { const l = ledgerOf(n); return l ? l.debt : 0; };
    UI.modal({
      title: 'Оплата поставщику',
      subtitle: 'Гасит долг за товар, взятый в долг или с отсрочкой',
      wide: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div class="field"><label for="p-sup">Поставщик</label><select class="input sm" id="p-sup">' +
            names.map(n => '<option value="' + UI.esc(n) + '"' + (n === pick ? ' selected' : '') + '>' + UI.esc(n) +
              (debtOf(n) > 0.009 ? ' — долг ' + UI.money(debtOf(n)) : '') + '</option>').join('') +
          '</select><span class="hint" id="p-debt"></span></div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
            UI.field('Сумма, ₽', 'p-amount', '10000', 'number', debtOf(pick) > 0 ? Math.round(debtOf(pick) * 100) / 100 : '') +
            UI.field('Дата оплаты', 'p-date', '', 'date', UI.today()) +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            '<div class="field"><label for="p-method">Как платили</label><select class="input sm" id="p-method">' +
              (CFG.payments || []).filter(p => !/отсроч/i.test(p)).map(p => '<option>' + UI.esc(p) + '</option>').join('') +
              '<option value="">— не указано —</option></select></div>' +
            UI.field('Комментарий', 'p-note', 'номер платёжки, за какую накладную…', 'text', '') +
          '</div>' +
        '</div>',
      onOpen: (root) => {
        const sel = root.querySelector('#p-sup');
        const hint = root.querySelector('#p-debt');
        const amount = root.querySelector('#p-amount');
        const sync = (fill) => {
          const dbt = debtOf(sel.value);
          hint.textContent = dbt > 0.009 ? 'Сейчас должны ' + UI.money(dbt) : (dbt < -0.009 ? 'Уже переплачено ' + UI.money(-dbt) + ' — это будет аванс' : 'Долга нет — оплата пойдёт авансом');
          if (fill) amount.value = dbt > 0 ? Math.round(dbt * 100) / 100 : '';
        };
        sel.addEventListener('change', () => sync(true));
        sync(false);
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Записать оплату', kind: 'btn-primary',
          onClick: (root) => {
            const get = (id) => root.querySelector('#' + id).value.trim();
            const data = { supplier: get('p-sup'), amount: Number(get('p-amount')), date: get('p-date'),
              method: get('p-method'), note: get('p-note') };
            if (!(data.amount > 0)) { UI.toast('Укажите сумму', 'err'); return false; }
            if (!data.date) { UI.toast('Укажите дату', 'err'); return false; }
            ctx.act(() => STORE.addPayment(data, ctx.user), 'Оплата записана: ' + data.supplier + ' · ' + UI.money(data.amount));
            return true;
          }
        }
      ]
    });
  }

  /** Движение денег с поставщиком (акт сверки): закупки +, оплаты −, долг нарастающим итогом. */
  function supplierMoves(name) {
    const key = (s) => String(s || '').trim() || 'не указан';
    const rows = [];
    const byDay = {};
    (ctx.purchases || []).filter(p => key(p.supplier) === name).forEach(p => {
      const k = String(p.date);
      const g = byDay[k] = byDay[k] || { kind: 'buy', date: k, lines: 0, qty: 0, amount: 0, paidNow: 0, items: [] };
      g.lines += 1; g.qty += Number(p.qty) || 0; g.amount += Number(p.amount) || 0; g.paidNow += STORE.paidOf(p);
      g.items.push(p.name + ' ×' + p.qty);
    });
    Object.keys(byDay).forEach(k => rows.push(byDay[k]));
    (ctx.payments || []).filter(p => p.supplier === name).forEach(p =>
      rows.push({ kind: 'pay', date: String(p.date), amount: Number(p.amount) || 0, p }));
    rows.sort((a, b) => a.date.localeCompare(b.date) || (a.kind === 'buy' ? -1 : 1));
    let bal = 0;
    rows.forEach(r => {
      if (r.kind === 'buy') bal += r.amount - r.paidNow; else bal -= r.amount;
      r.bal = Math.round(bal * 100) / 100;
    });
    return rows;
  }

  function supplierCard(name) {
    const x = ledgerOf(name);
    if (!x) return;
    const rows = supplierMoves(name);
    UI.modal({
      title: name,
      subtitle: [x.phone, x.contact, x.terms_days ? 'отсрочка ' + x.terms_days + ' дн' : 'без отсрочки'].filter(Boolean).join(' · '),
      cls: 'xwide',
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div class="hist-kpis">' +
            '<div class="card flat"><span class="label">Взято товара</span><b>' + UI.money(x.taken) + '</b><small>' + x.lines + ' строк закупки</small></div>' +
            '<div class="card flat"><span class="label">Оплачено сразу</span><b>' + UI.money(x.paidNow) + '</b><small>при закупке</small></div>' +
            '<div class="card flat"><span class="label">Оплачено потом</span><b>' + UI.money(x.paidLater) + '</b><small>отдельными оплатами</small></div>' +
            '<div class="card flat"><span class="label">Долг сейчас</span><b>' + debtCell(x.debt) + '</b><small>' +
              (x.overdueDays ? 'просрочено ' + x.overdueDays + ' дн' : (x.dueDate ? 'заплатить до ' + fmtDate(x.dueDate) : '&nbsp;')) + '</small></div>' +
          '</div>' +
          (rows.length
            ? '<div class="grid-wrap" style="max-height:52vh;overflow:auto"><table class="grid ledger" style="min-width:720px"><thead><tr>' +
                '<th>Дата</th><th>Что</th><th class="r">Взяли</th><th class="r">Заплатили</th><th class="r">Долг после</th><th class="r"></th>' +
              '</tr></thead><tbody>' +
              rows.map(r => r.kind === 'buy'
                ? '<tr><td class="num">' + fmtDate(r.date) + '</td>' +
                    '<td><div class="prod"><b>Закупка · ' + r.qty + ' шт</b><small title="' + UI.esc(r.items.join('; ')) + '">' +
                      UI.esc(r.items.slice(0, 3).join('; ') + (r.items.length > 3 ? '; …ещё ' + (r.items.length - 3) : '')) + '</small></div></td>' +
                    '<td class="r">' + UI.num(Math.round(r.amount)) + '</td>' +
                    '<td class="r" style="color:#8494AC">' + (r.paidNow ? UI.num(Math.round(r.paidNow)) + ' <small>сразу</small>' : '—') + '</td>' +
                    '<td class="r bal">' + debtCell(r.bal) + '</td><td></td></tr>'
                : '<tr data-pay="' + UI.esc(r.p.id) + '"><td class="num">' + fmtDate(r.date) + '</td>' +
                    '<td><div class="prod"><b style="color:#9AA6FF">Оплата' + (r.p.method ? ' · ' + UI.esc(r.p.method) : '') + '</b><small>' +
                      UI.esc(r.p.note || '—') + '</small></div></td>' +
                    '<td class="r">—</td><td class="r"><b>' + UI.num(r.amount) + '</b></td>' +
                    '<td class="r bal">' + debtCell(r.bal) + '</td>' +
                    '<td class="r"><button class="icon-btn sm danger" data-delpay title="Удалить оплату">' + UI.icon('trash', 14) + '</button></td></tr>'
              ).join('') + '</tbody></table></div>'
            : '<div class="empty-state">С этим поставщиком пока ничего не было.</div>') +
        '</div>',
      onOpen: (root, close) => {
        root.addEventListener('click', (e) => {
          const b = e.target.closest('[data-delpay]');
          if (!b) return;
          const p = (ctx.payments || []).find(q => q.id === b.closest('[data-pay]').dataset.pay);
          if (p) { close(null); removePayment(p); }
        });
      },
      actions: [
        { label: 'Закрыть', value: null },
        { label: 'Скачать акт сверки', value: 'csv' },
        { label: 'Изменить поставщика', value: 'edit' },
        { label: 'Внести оплату', kind: 'btn-primary', value: 'pay' }
      ]
    }).then((v) => {
      if (v === 'pay') paymentModal(name);
      if (v === 'edit') editSupplier(name);
      if (v === 'csv') {
        const out = [['Акт сверки · ' + name + ' · на ' + UI.dateFull(new Date().toISOString())], [],
          ['Дата', 'Операция', 'Взяли товара', 'Заплатили', 'Долг после', 'Комментарий']];
        rows.forEach(r => out.push(r.kind === 'buy'
          ? [fmtDate(r.date), 'Закупка ' + r.qty + ' шт', Math.round(r.amount), Math.round(r.paidNow), r.bal, r.items.join('; ')]
          : [fmtDate(r.date), 'Оплата' + (r.p.method ? ' · ' + r.p.method : ''), 0, r.amount, r.bal, r.p.note || '']));
        out.push([], ['Итого', '', Math.round(x.taken), Math.round(x.paidNow + x.paidLater), x.debt]);
        UI.downloadFile('akt-sverki-' + name.replace(/[^\wа-яё-]+/gi, '_') + '-' + UI.today() + '.csv', UI.csv(out));
        UI.toast('Акт сверки скачан', 'ok');
      }
    });
  }

  function exportCsv(racks, sellers, t, d, label, ledger) {
    const R = (n) => Math.round(n);
    const rows = [['Деньги · ' + label], [],
      ['Стеллаж', 'СТО', 'Продано шт', 'Выручка', 'Себестоимость', 'Валовая прибыль', 'Продавцу', 'Списания', 'Чистая прибыль', 'Товар на полке шт', 'Товар на полке по закупке']];
    racks.forEach(({ rk, x, inv }) => rows.push([rk.code, rk.station, x.qty, R(x.revenue), R(x.cogs), R(x.gross), R(x.bonus), R(x.writeoff), R(x.net), inv.qty, R(inv.cost)]));
    rows.push(['Итого', '', t.qty, R(t.revenue), R(t.cogs), R(t.gross), R(t.bonus), R(t.writeoff), R(t.net)]);
    rows.push([], ['Потрачено на закупки', R(d.spent)], [], ['Продавец', 'Стеллажи', 'Продано шт', 'Выручка', 'К выплате']);
    sellers.forEach(s => rows.push([s.name, Array.from(s.racks).join(', '), s.qty, R(s.revenue), s.admin ? 0 : R(s.bonus)]));
    rows.push([], ['Поставщик', 'Взято всего', 'Оплачено', 'Долг', 'Просрочено дней', 'Последняя закупка']);
    (ledger || []).forEach(x => rows.push([x.name, R(x.taken), R(x.paidNow + x.paidLater), x.debt, x.overdueDays || '', x.lastDate]));
    UI.downloadFile('dengi-' + UI.today() + '.csv', UI.csv(rows));
    UI.toast('Отчёт выгружен', 'ok');
  }

  return { render };
})();



/* ============================================================
   Lube Control — СОТРУДНИКИ
   Учётные записи прямо с сайта: завести продавца, закрепить за ним
   стеллаж, сменить пароль, удалить. Без захода в Supabase.
   ============================================================ */

window.LC_USERS = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let ctx = null;
  let host = null;
  let users = null;
  let error = '';
  let loading = false;
  let loadedAt = 0;

  async function load(force) {
    if (loading) return;
    if (!force && Date.now() - loadedAt < 3000) return;
    loading = true;
    try { users = await STORE.listUsers(); error = ''; }
    catch (e) { error = e.message || 'Не удалось получить список'; if (!users) users = []; }
    loading = false;
    loadedAt = Date.now();
    if (ctx && ctx.page === 'users' && host) draw();
  }

  function render(h, context) {
    host = h; ctx = context;
    draw();
    load(false);
  }

  const rackLabel = (code) => {
    if (!code) return '';
    const r = ctx.racks.find(x => x.code === code);
    return r ? code + ' · ' + r.station : code + ' (стеллажа пока нет)';
  };

  function draw() {
    const list = (users || []).slice().sort((a, b) =>
      (a.role === 'admin' ? 0 : 1) - (b.role === 'admin' ? 0 : 1) || String(a.login).localeCompare(String(b.login)));
    const sellers = list.filter(u => u.role === 'seller' || !u.role);
    const couriers = list.filter(u => u.role === 'courier');
    const freeRacks = ctx.racks.filter(r => !sellers.some(u => u.rack_code === r.code));

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Сотрудники</h1><p>Кто входит на сайт. Продавец видит только свой стеллаж, администратор — всё.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-primary" id="uAdd">' + UI.icon('plus', 15, '#12161F', 2) + '<span>Добавить сотрудника</span></button>' +
          '</div>' +
        '</div>' +
        (STORE.cloud ? '' :
          '<div class="card flat" style="font-size:13px;color:#8494AC">Демо-режим: учётные записи хранятся только в этом браузере. ' +
          'С подключённой базой они будут общими для всех устройств.</div>') +
        (error ? '<div class="card flat" style="font-size:13px;color:var(--red)">' + UI.esc(error) + '</div>' : '') +
        '<section class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">' +
          kpi('Всего', list.length) +
          kpi('Продавцов', sellers.length) +
          kpi('Курьеров', couriers.length) +
          kpi('Администраторов', list.filter(u => u.role === 'admin').length) +
          kpi('Стеллажей без продавца', freeRacks.length, freeRacks.length ? 'var(--orange)' : '') +
        '</section>' +
        (users === null
          ? '<div class="empty-state">Загружаю список…</div>'
          : list.length
            ? '<div class="grid-wrap"><table class="grid" style="min-width:760px"><thead><tr>' +
                '<th>Сотрудник</th><th>Логин</th><th>Роль</th><th>Стеллаж</th><th>Последний вход</th><th class="r"></th>' +
              '</tr></thead><tbody>' + list.map(row).join('') + '</tbody></table></div>'
            : '<div class="empty-state">Пока никого. Добавьте первого продавца.</div>') +
      '</main>';
    bind();
  }

  function kpi(label, value, color) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span></div>';
  }

  function row(u) {
    const me = u.login === ctx.user.login;
    return '<tr data-login="' + UI.esc(u.login) + '">' +
      '<td><div class="prod"><b>' + UI.esc(u.name || u.login) + (me ? ' <span class="pill sm neutral">это вы</span>' : '') +
        '</b><small>' + UI.esc(u.title || '') + '</small></div></td>' +
      '<td><span class="sku">' + UI.esc(u.login) + '</span></td>' +
      '<td>' + (u.role === 'admin'
        ? '<span class="pill sm low">администратор</span>'
        : u.role === 'courier'
          ? '<span class="pill sm neutral" style="color:#7C8CF8">курьер</span>'
          : '<span class="pill sm ok">продавец</span>') + '</td>' +
      '<td style="font-size:13px">' + (u.role === 'admin' ? '<span style="color:#4B5A75">все</span>'
        : u.role === 'courier' ? '<span style="color:#4B5A75">все точки · доставка</span>'
        : (u.rack_code ? UI.esc(rackLabel(u.rack_code)) : '<span style="color:var(--orange)">не закреплён</span>')) + '</td>' +
      '<td style="font-size:12px;color:#8494AC">' + (u.last_sign_in_at ? UI.dateTime(u.last_sign_in_at)
        : (STORE.cloud ? 'ещё не входил' : '—')) + '</td>' +
      '<td class="r"><div class="row-act">' +
        '<button class="icon-btn sm" data-act="edit" title="Изменить">' + UI.icon('edit', 14) + '</button>' +
        '<button class="icon-btn sm" data-act="pass" title="Сменить пароль">' + UI.icon('key', 14) + '</button>' +
        (me ? '' : '<button class="icon-btn sm danger" data-act="del" title="Удалить">' + UI.icon('trash', 14) + '</button>') +
      '</div></td>' +
    '</tr>';
  }

  function bind() {
    host.querySelector('#uAdd').addEventListener('click', () => editModal(null));
    const t = host.querySelector('.grid');
    if (t) t.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const u = (users || []).find(x => x.login === b.closest('tr').dataset.login);
      if (!u) return;
      if (b.dataset.act === 'edit') editModal(u);
      if (b.dataset.act === 'pass') passModal(u);
      if (b.dataset.act === 'del') removeUser(u);
    });
  }

  /* ---------------- помощники ---------------- */

  const ROLE_HINT = {
    seller: '<b style="color:#B9C6DA">Продавец</b> видит только свой стеллаж: продаёт, отменяет свою продажу, делает сверку ' +
      '(только недостачу), отправляет заявку и принимает собранную поставку. Закупок, прибыли и других точек не видит.',
    courier: '<b style="color:#B9C6DA">Курьер</b> видит все точки, что где кончается, заявки и склад в штуках. ' +
      'Собирает поставку со склада (не больше, чем есть), везёт и ставит на полку. ' +
      'Не видит закупочных цен, выручки и чужих операций, не может продавать, списывать и менять прайс.',
    admin: '<b style="color:#B9C6DA">Администратор</b> может всё: прайс, закупки, деньги, сотрудники, настройки.'
  };

  function genPassword() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ', a = 'abcdefghijkmnpqrstuvwxyz', d = '23456789';
    const pick = (set, n) => {
      const buf = new Uint32Array(n);
      (window.crypto || window.msCrypto).getRandomValues(buf);
      return Array.from(buf, x => set[x % set.length]).join('');
    };
    return pick(A, 1) + pick(a, 4) + '-' + pick(d, 4);
  }

  function suggestLogin() {
    const taken = new Set((users || []).map(u => String(u.login).toLowerCase()));
    for (let n = 1; n < 1000; n++) if (!taken.has('seller' + n)) return 'seller' + n;
    return '';
  }

  function rackOptions(current) {
    const busy = {};
    (users || []).forEach(u => { if (u.role !== 'admin' && u.rack_code) busy[u.rack_code] = u.name || u.login; });
    const codes = ctx.racks.map(r => r.code);
    if (current && codes.indexOf(current) < 0) codes.unshift(current);
    return '<option value="">— не закреплять —</option>' + codes.map(c => {
      const r = ctx.racks.find(x => x.code === c);
      const who = busy[c] && c !== current ? ' — сейчас: ' + busy[c] : '';
      return '<option value="' + UI.esc(c) + '"' + (c === current ? ' selected' : '') + '>' +
        UI.esc(c + (r ? ' · ' + r.station : ' (нет стеллажа)') + who) + '</option>';
    }).join('');
  }

  function passField(id, value) {
    return '<div class="field"><label for="' + id + '">Пароль</label>' +
      '<div class="row" style="gap:8px"><input class="input sm grow mono" id="' + id + '" type="text" autocomplete="new-password" value="' + UI.esc(value) + '">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-gen="' + id + '">Придумать</button></div>' +
      '<span class="hint">Не короче 6 знаков. Покажем ещё раз после сохранения — чтобы переслать сотруднику.</span></div>';
  }

  function bindGen(root) {
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-gen]');
      if (b) root.querySelector('#' + b.dataset.gen).value = genPassword();
    });
  }

  async function showCredentials(login, password, name) {
    const url = location.origin + location.pathname;
    const text = 'Вход в ' + CFG.texts.brand + (name ? ' для ' + name : '') + '\n' + url + '\nЛогин: ' + login + '\nПароль: ' + password;
    await UI.modal({
      title: 'Данные для входа',
      subtitle: 'Перешлите сотруднику. Пароль в открытом виде больше нигде не показывается.',
      body: '<div class="card flat mono" style="white-space:pre-wrap;font-size:13px;line-height:1.7;padding:14px 16px" id="credBox">' +
        UI.esc(text) + '</div>',
      actions: [
        { label: 'Закрыть', value: null },
        {
          label: 'Скопировать', kind: 'btn-primary',
          onClick: () => {
            const done = () => UI.toast('Скопировано', 'ok');
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(done, () => UI.toast('Выделите текст и скопируйте вручную', 'err'));
            } else UI.toast('Выделите текст и скопируйте вручную', 'err');
            return false;
          }
        }
      ]
    });
  }

  /* ---------------- окна ---------------- */

  async function editModal(u) {
    const isNew = !u;
    const v = u || { login: suggestLogin(), name: '', title: '', role: 'seller', rack_code: '' };
    let data = null;

    await UI.modal({
      title: isNew ? 'Новый сотрудник' : (v.name || v.login),
      subtitle: isNew ? 'Логин и пароль — для входа на сайт. Продавца закрепите за стеллажом.' : 'Логин: ' + v.login,
      wide: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
            UI.field('Имя', 'u-name', 'Алексей П.', 'text', v.name) +
            UI.combo('Должность', 'u-title', 'Продавец', v.title,
              ['Продавец', 'Старший продавец', 'Курьер', 'Администратор', 'Владелец сети'].concat((users || []).map(u => u.title))) +
          '</div>' +
          (isNew
            ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
                UI.field('Логин', 'u-login', 'seller5', 'text', v.login, 'латиница и цифры, например seller5') +
                passField('u-pass', genPassword()) +
              '</div>'
            : '') +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
            '<div class="field"><label for="u-role">Роль</label><select class="input sm" id="u-role">' +
              '<option value="seller"' + (v.role !== 'admin' ? ' selected' : '') + '>Продавец — свой стеллаж</option>' +
              '<option value="courier"' + (v.role === 'courier' ? ' selected' : '') + '>Курьер — сборка и доставка</option>' +
              '<option value="admin"' + (v.role === 'admin' ? ' selected' : '') + '>Администратор — всё</option>' +
            '</select></div>' +
            '<div class="field" id="u-rack-box"><label for="u-rack">Стеллаж</label><select class="input sm" id="u-rack">' +
              rackOptions(v.rack_code || '') + '</select></div>' +
          '</div>' +
          '<div id="u-role-hint" class="card flat" style="font-size:12px;color:#8494AC;line-height:1.55;padding:10px 12px"></div>' +
        '</div>',
      onOpen: (root) => {
        bindGen(root);
        const role = root.querySelector('#u-role');
        const box = root.querySelector('#u-rack-box');
        const hint = root.querySelector('#u-role-hint');
        const sync = () => {
          box.style.visibility = role.value === 'seller' ? 'visible' : 'hidden';
          if (hint) hint.innerHTML = ROLE_HINT[role.value] || '';
        };
        role.addEventListener('change', sync);
        sync();
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: isNew ? 'Создать учётную запись' : 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            const get = (id) => { const el = root.querySelector('#' + id); return el ? el.value.trim() : ''; };
            data = {
              name: get('u-name'), title: get('u-title'), role: get('u-role'), rack: get('u-rack') || null,
              login: isNew ? get('u-login').toLowerCase() : v.login, password: isNew ? get('u-pass') : ''
            };
            if (!data.name) { UI.toast('Укажите имя', 'err'); return false; }
            if (isNew && !/^[a-z0-9._-]{2,32}$/.test(data.login)) {
              UI.toast('Логин — латинские буквы, цифры, точка или дефис', 'err'); return false;
            }
            if (isNew && data.password.length < 6) { UI.toast('Пароль — не короче 6 знаков', 'err'); return false; }
            return true;
          }
        }
      ]
    });

    if (!data) return;
    try {
      if (isNew) {
        const ok = await ctx.act(() => STORE.createUser(data, ctx.user), 'Сотрудник ' + data.login + ' заведён');
        if (!ok) return;
        await load(true);
        await showCredentials(data.login, data.password, data.name);
      } else {
        const ok = await ctx.act(() => STORE.updateUser(v.login, data, ctx.user), 'Сохранено');
        if (ok) await load(true);
      }
    } catch (e) { /* сообщение уже показано */ }
  }

  async function passModal(u) {
    let pw = null;
    await UI.modal({
      title: 'Новый пароль для ' + (u.name || u.login),
      subtitle: 'Логин: ' + u.login + '. Старый пароль перестанет работать сразу.',
      body: passField('p-pass', genPassword()),
      onOpen: (root) => bindGen(root),
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Сменить пароль', kind: 'btn-primary',
          onClick: (root) => {
            pw = root.querySelector('#p-pass').value.trim();
            if (pw.length < 6) { UI.toast('Пароль — не короче 6 знаков', 'err'); pw = null; return false; }
            return true;
          }
        }
      ]
    });
    if (!pw) return;
    try {
      const ok = await ctx.act(() => STORE.setPassword(u.login, pw, ctx.user), 'Пароль изменён');
      if (ok && u.login !== ctx.user.login) await showCredentials(u.login, pw, u.name);
    } catch (e) { /* сообщение уже показано */ }
  }

  async function removeUser(u) {
    const ok = await UI.confirmBox('Удалить учётную запись ' + u.login + '?',
      (u.name || u.login) + ' больше не сможет войти. Его продажи и движения в журнале останутся.',
      'Удалить', 'btn-danger');
    if (!ok) return;
    try {
      const ok = await ctx.act(() => STORE.deleteUser(u.login, ctx.user), 'Учётная запись удалена');
      if (ok) await load(true);
    } catch (e) { /* сообщение уже показано */ }
  }

  return { render };
})();



/* ============================================================
   Lube Control — НАСТРОЙКИ
   Меняем значения прямо на экране, видим результат сразу,
   потом скачиваем готовый config.js и кладём рядом с index.html.
   ============================================================ */

window.LC_SETTINGS = (function () {
  const UI = window.LC_UI;
  const STORE = window.LC_STORE;

  let ctx = null;

  // общие настройки сохраняются в базу с небольшой задержкой — сообщаем, чем кончилось
  window.addEventListener('lc-settings-saved', (e) => {
    const el = document.getElementById('sSaveState');
    if (e.detail.error) { UI.toast('Настройки не сохранились: ' + e.detail.error, 'err'); if (el) el.textContent = ''; return; }
    if (el) { el.textContent = 'Сохранено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); el.style.color = 'var(--green)'; }
  });

  /* ---------------- что можно крутить ---------------- */

  const RULES = [
    { key: 'lowThreshold',    label: 'Порог «низкий остаток»', unit: '%',  min: 5,  max: 90,   step: 5,
      hint: 'Ниже этой доли вместимости позиция подсвечивается оранжевым' },
    { key: 'cancelWindowMin', label: 'Окно отмены продажи',    unit: 'мин', min: 0, max: 120,  step: 5,
      hint: 'Сколько минут продавец может отменить свою продажу' },
    { key: 'bonusPercent',    label: 'Бонус продавца',         unit: '%',  min: 0,  max: 100,  step: 1,
      hint: 'Процент от выручки в блоке «Итоги смены»' },
    { key: 'defaultMax',      label: 'Вместимость по умолчанию', unit: 'шт', min: 1, max: 100, step: 1,
      hint: 'Подставляется, когда ставите новую позицию на стеллаж' },
    { key: 'routeDays',       label: 'Окно продаж в карточке', unit: 'дн', min: 1,  max: 90,   step: 1,
      hint: 'За сколько дней считать «продано» в карточке стеллажа' },
    { key: 'photoWidth',      label: 'Ширина фото стеллажа',   unit: 'px', min: 300, max: 1600, step: 50,
      hint: 'До какой ширины ужимать загруженный снимок' },
    { key: 'photoQuality',    label: 'Качество фото',          unit: '%',  min: 30, max: 95,   step: 1,
      hint: 'Меньше — легче файл, но заметнее зерно' },
    { key: 'minMargin',       label: 'Минимальная наценка',    unit: '%',  min: 0,  max: 80,   step: 1,
      hint: 'Товар с наценкой ниже подсвечивается в прайсе' }
  ];

  const COLORS = [
    { key: 'amber',  label: 'Фирменный (кнопки, акценты)' },
    { key: 'green',  label: 'Норма, приход, маржа' },
    { key: 'orange', label: 'Низкий остаток, продажа' },
    { key: 'red',    label: 'Пусто, ошибки' },
    { key: 'bg',     label: 'Фон страницы' },
    { key: 'card',   label: 'Фон карточек' },
    { key: 'line',   label: 'Границы' }
  ];

  const TEXTS = [
    { key: 'brand',          label: 'Название сервиса' },
    { key: 'adminTitle',     label: 'Заголовок у админа' },
    { key: 'adminSubtitle',  label: 'Подпись у админа' },
    { key: 'sellerTitle',    label: 'Заголовок у продавца' },
    { key: 'sellerSubtitle', label: 'Подпись у продавца' },
    { key: 'sellBtn',        label: 'Кнопка продажи' },
    { key: 'requestBtn',     label: 'Кнопка заявки' },
    { key: 'deliveryBtn',    label: 'Кнопка приёма поставки' },
    { key: 'auditBtn',       label: 'Кнопка сверки' },
    { key: 'shiftOpen',      label: 'Значок смены' },
    { key: 'hint',           label: 'Подсказка продавцу', long: true }
  ];

  /* ---------------- запись правки ---------------- */

  /** Кладёт значение и в живой конфиг, и в сохранённые правки. */
  function set(path, value) {
    const CFG = window.LC_CONFIG;
    const ov = window.LC_OVERRIDES.read();
    const parts = path.split('.');
    let a = CFG, b = ov;
    for (let i = 0; i < parts.length - 1; i++) {
      a = a[parts[i]] = a[parts[i]] || {};
      b = b[parts[i]] = b[parts[i]] || {};
    }
    a[parts[parts.length - 1]] = value;
    b[parts[parts.length - 1]] = value;
    window.LC_OVERRIDES.write(ov);
    window.LC_FLATTEN();
    UI.applyTheme();
  }

  /** Сколько правок сейчас поверх config.js. */
  function changedCount() {
    const flat = (obj, pre) => Object.keys(obj || {}).reduce((acc, k) => {
      const v = obj[k], p = pre ? pre + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v)) return acc.concat(flat(v, p));
      return acc.concat([p]);
    }, []);
    return flat(window.LC_OVERRIDES.read()).length;
  }

  /* ---------------- отрисовка ---------------- */

  function render(host, context) {
    ctx = context;
    const CFG = window.LC_CONFIG;
    const n = changedCount();

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Настройки</h1>' +
            (window.LC_OVERRIDES.shared
              ? '<p>Крутите значения — экран меняется сразу, правки сохраняются в общей базе и действуют у всех.</p></div>'
              : '<p>Крутите значения — экран меняется сразу. Чтобы правки увидели все, ' +
                'скачайте config.js и положите его рядом с index.html.</p></div>') +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="sReset">' + UI.icon('undo', 15) +
              '<span>Сбросить правки' + (n ? ' · ' + n : '') + '</span></button>' +
            '<button class="btn btn-primary" id="sDownload">' + UI.icon('down', 15, '#12161F', 2) +
              '<span>Скачать config.js</span></button>' +
          '</div>' +
        '</div>' +

        (window.LC_OVERRIDES.shared
          ? '<div class="card flat" style="display:flex;gap:12px;align-items:flex-start">' +
              UI.icon(STORE.settingsReady() ? 'check' : 'warn', 16, STORE.settingsReady() ? 'var(--green)' : 'var(--red)') +
              '<div style="font-size:13px;color:#B9C6DA;line-height:1.55">' +
              (STORE.settingsReady()
                ? 'Настройки хранятся <b>в общей базе</b>: бонус, пороги, надписи и цвета сразу видят все — ' +
                  'продавцу достаточно обновить страницу. <span id="sSaveState" style="color:#64748B"></span>'
                : '<b>В базе нет таблицы для общих настроек</b> — выполните fix-v7.sql в Supabase → SQL Editor. ' +
                  'Пока её нет, правки из этой панели продавцы не увидят.') +
              '</div></div>'
          : '') +
        (window.LC_OVERRIDES.shared ? '' :
        '<div class="card flat" style="display:flex;gap:12px;align-items:flex-start">' +
          UI.icon('warn', 16, 'var(--amber)') +
          '<div style="font-size:13px;color:#B9C6DA;line-height:1.55">' +
            'Правки из этой панели живут <b>только в вашем браузере</b> — так удобно подбирать значения. ' +
            (window.LC_HAS_FILE
              ? 'Файл config.js подключён: значения из него — база, панель правит их поверх. '
              : 'Файла config.js рядом с index.html <b>сейчас нет</b> — сайт работает на значениях по умолчанию. ') +
            'Подобрали — нажмите «Скачать config.js» и залейте файл в репозиторий: тогда эти значения увидят продавцы. ' +
            'Ключи Supabase применяются после перезагрузки страницы.' +
          '</div>' +
        '</div>') +

        '<section class="stack">' +
          '<div class="section-head"><h2>Связь с администрацией</h2>' +
            '<span style="font-size:12px;color:#64748B">кнопки видят продавцы и курьеры на своей странице</span></div>' +
          '<div class="set-grid">' +
            '<div class="set-row wide" data-contact="title">' +
              '<div class="set-label"><b>Заголовок блока</b><small>как подписать кнопки у сотрудников</small></div>' +
              '<div class="set-ctl"><input class="input sm" type="text" value="' +
                UI.esc((CFG.contacts || {}).title || 'Связь с администратором') + '"></div></div>' +
            UI.CONTACT_KINDS.map(contactRow).join('') +
          '</div>' +
          '<div class="card flat stack-sm" style="gap:10px">' +
            '<span style="font-size:12px;color:#64748B">Так увидит продавец:</span>' +
            '<div id="sContactPreview"></div>' +
          '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Правила</h2>' +
            '<span style="font-size:12px;color:#64748B">меняется на лету</span></div>' +
          '<div class="set-grid">' + RULES.map(ruleRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Цвета</h2>' +
            '<span style="font-size:12px;color:#64748B">перекрашивает сайт мгновенно</span></div>' +
          '<div class="set-grid">' + COLORS.map(colorRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Категории прайса</h2>' +
            '<span style="font-size:12px;color:#64748B">название и цвет; ключ трогать нельзя</span></div>' +
          '<div class="set-grid">' + CFG.categories.map(catRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Надписи</h2></div>' +
          '<div class="set-grid">' + TEXTS.map(textRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Общая база (Supabase)</h2>' +
            '<span style="font-size:12px;color:#64748B">применяется после перезагрузки</span></div>' +
          '<div class="set-grid">' +
            textField('supabaseUrl', 'Project URL', CFG.supabaseUrl, 'https://xxxx.supabase.co') +
            textField('supabaseAnonKey', 'anon / public key', CFG.supabaseAnonKey, 'eyJhbGciOi…') +
            textField('emailDomain', 'Домен логинов', CFG.emailDomain, 'lubecontrol.app') +
          '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Данные</h2></div>' +
          '<div class="card flat row" style="gap:12px;flex-wrap:wrap">' +
            '<button class="btn btn-ghost btn-sm" id="sDump">Скачать все данные (JSON)</button>' +
            '<button class="btn btn-danger btn-sm" id="sClearHist">Очистить историю…</button>' +
            (STORE.mode === 'demo'
              ? '<button class="btn btn-danger btn-sm" id="sSeed">Очистить все данные</button>'
              : '') +
            '<span style="font-size:12px;color:#64748B">Режим: ' +
              (STORE.mode === 'demo' ? 'демо, данные в браузере' : 'общая база Supabase') +
              ' · история — закупки, движения, заявки; прайс и сотрудники не трогаются</span>' +
          '</div>' +
        '</section>' +
      '</main>';

    bind(host);
  }

  function ruleRow(r) {
    const v = window.LC_CONFIG.rules[r.key];
    return '<div class="set-row" data-rule="' + r.key + '">' +
      '<div class="set-label"><b>' + UI.esc(r.label) + '</b><small>' + UI.esc(r.hint) + '</small></div>' +
      '<div class="set-ctl">' +
        '<input type="range" min="' + r.min + '" max="' + r.max + '" step="' + r.step + '" value="' + v + '">' +
        '<input class="input sm set-num" type="number" min="' + r.min + '" max="' + r.max +
          '" step="' + r.step + '" value="' + v + '">' +
        '<span class="set-unit">' + r.unit + '</span>' +
      '</div>' +
    '</div>';
  }

  function contactRow(k) {
    const v = (window.LC_CONFIG.contacts || {})[k.key] || '';
    return '<div class="set-row" data-contact="' + k.key + '">' +
      '<div class="set-label"><b style="display:flex;align-items:center;gap:8px">' + UI.icon(k.icon, 16, k.color, 1.8) + UI.esc(k.label) + '</b>' +
        '<small>' + UI.esc(k.hint) + '</small></div>' +
      '<div class="set-ctl" style="flex-direction:column;align-items:stretch;gap:4px">' +
        '<input class="input sm" type="text" value="' + UI.esc(v) + '" spellcheck="false" placeholder="' +
          (k.key === 'telegram' ? '@admin_oil' : k.key === 'vk' ? 'vk.com/…' : k.key === 'max' ? 'https://max.ru/…' : '+7 900 000-00-00') + '">' +
        '<small class="c-check" style="font-size:11px;color:#64748B;min-height:14px"></small>' +
      '</div>' +
    '</div>';
  }

  function paintContacts(host) {
    host.querySelectorAll('[data-contact]').forEach(row => {
      const key = row.dataset.contact;
      if (key === 'title') return;
      const val = row.querySelector('input').value.trim();
      const href = UI.contactHref(key, val);
      const box = row.querySelector('.c-check');
      box.innerHTML = !val ? 'не заполнено — кнопки не будет'
        : href ? 'ссылка: <a href="' + UI.esc(href) + '" target="_blank" rel="noopener">' + UI.esc(href) + '</a>'
          : '<span style="color:var(--red)">не похоже на номер или ссылку</span>';
    });
    const pv = host.querySelector('#sContactPreview');
    if (pv) pv.innerHTML = UI.contactsCard({ chat: true }) ||
      '<span style="font-size:13px;color:#8494AC">Заполните хотя бы одно поле.</span>';
  }

  function colorRow(c) {
    const v = window.LC_CONFIG.colors[c.key] || '#000000';
    return '<div class="set-row" data-color="' + c.key + '">' +
      '<div class="set-label"><b>' + UI.esc(c.label) + '</b><small>colors.' + c.key + '</small></div>' +
      '<div class="set-ctl">' +
        '<input class="set-swatch" type="color" value="' + v + '">' +
        '<input class="input sm mono set-hex" type="text" value="' + v + '" spellcheck="false">' +
      '</div>' +
    '</div>';
  }

  function catRow(c, i) {
    return '<div class="set-row" data-cat="' + i + '">' +
      '<div class="set-label"><b>' + UI.esc(c.label) + '</b><small>ключ: ' + UI.esc(c.key) + '</small></div>' +
      '<div class="set-ctl">' +
        '<input class="set-swatch" type="color" value="' + c.color + '">' +
        '<input class="input sm set-catname" type="text" value="' + UI.esc(c.label) + '">' +
      '</div>' +
    '</div>';
  }

  function textRow(t) {
    const v = (window.LC_CONFIG.texts || {})[t.key] || '';
    return '<div class="set-row' + (t.long ? ' wide' : '') + '" data-text="' + t.key + '">' +
      '<div class="set-label"><b>' + UI.esc(t.label) + '</b><small>texts.' + t.key + '</small></div>' +
      '<div class="set-ctl">' +
        (t.long
          ? '<textarea class="input sm" rows="3" style="height:auto;padding:10px 12px;resize:vertical">' + UI.esc(v) + '</textarea>'
          : '<input class="input sm" type="text" value="' + UI.esc(v) + '">') +
      '</div>' +
    '</div>';
  }

  function textField(key, label, value, placeholder) {
    return '<div class="set-row wide" data-root="' + key + '">' +
      '<div class="set-label"><b>' + UI.esc(label) + '</b><small>' + key + '</small></div>' +
      '<div class="set-ctl">' +
        '<input class="input sm mono" type="text" value="' + UI.esc(value || '') +
          '" placeholder="' + UI.esc(placeholder) + '" spellcheck="false">' +
      '</div>' +
    '</div>';
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const repaint = () => { if (ctx && ctx.repaint) ctx.repaint(); };

    // правила: ползунок и число ходят парой
    host.querySelectorAll('[data-rule]').forEach(row => {
      const key = row.dataset.rule;
      const range = row.querySelector('input[type=range]');
      const num = row.querySelector('.set-num');
      const apply = (v) => {
        const val = Number(v);
        if (Number.isNaN(val)) return;
        range.value = val; num.value = val;
        set('rules.' + key, val);
        repaint();
      };
      range.addEventListener('input', e => apply(e.target.value));
      num.addEventListener('input', e => apply(e.target.value));
    });

    // связь с администрацией
    host.querySelectorAll('[data-contact]').forEach(row => {
      const key = row.dataset.contact;
      const el = row.querySelector('input');
      el.addEventListener('input', () => {
        set('contacts.' + key, el.value.trim());
        paintContacts(host);
      });
    });
    paintContacts(host);

    // цвета
    host.querySelectorAll('[data-color]').forEach(row => {
      const key = row.dataset.color;
      const sw = row.querySelector('.set-swatch');
      const hex = row.querySelector('.set-hex');
      const apply = (v) => {
        if (!/^#[0-9a-f]{6}$/i.test(v)) return;
        sw.value = v; hex.value = v;
        set('colors.' + key, v);
      };
      sw.addEventListener('input', e => apply(e.target.value));
      hex.addEventListener('input', e => apply(e.target.value.trim()));
    });

    // категории
    host.querySelectorAll('[data-cat]').forEach(row => {
      const i = Number(row.dataset.cat);
      const sw = row.querySelector('.set-swatch');
      const name = row.querySelector('.set-catname');
      const push = () => {
        const cats = window.LC_CONFIG.categories.map(c => ({ key: c.key, label: c.label, color: c.color }));
        cats[i] = { key: cats[i].key, label: name.value, color: sw.value };
        set('categories', cats);
        repaint();
      };
      sw.addEventListener('input', push);
      name.addEventListener('input', push);
    });

    // надписи
    host.querySelectorAll('[data-text]').forEach(row => {
      const key = row.dataset.text;
      const el = row.querySelector('input, textarea');
      el.addEventListener('input', () => {
        set('texts.' + key, el.value);
        repaint();
      });
    });

    // ключи Supabase и домен
    host.querySelectorAll('[data-root]').forEach(row => {
      const key = row.dataset.root;
      const el = row.querySelector('input');
      el.addEventListener('change', () => {
        set(key, el.value.trim());
        UI.toast('Сохранено. Ключи применятся после перезагрузки страницы.', 'ok');
      });
    });

    host.querySelector('#sDownload').addEventListener('click', downloadConfig);

    host.querySelector('#sReset').addEventListener('click', async () => {
      const ok = await UI.confirmBox('Сбросить правки панели?',
        'Значения вернутся к тем, что лежат в config.js (или к заводским, если файла нет). ' +
        'Данные о стеллажах и продажах не трогаем.', 'Сбросить', 'btn-danger');
      if (!ok) return;
      try { await window.LC_OVERRIDES.clear(); } catch (e) { /* перезагрузка покажет, что вышло */ }
      location.reload();
    });

    host.querySelector('#sDump').addEventListener('click', () => {
      const dump = {
        exported_at: new Date().toISOString(),
        catalog: ctx.catalog, racks: ctx.racks, purchases: ctx.purchases,
        ops: ctx.ops, requests: ctx.requests,
        suppliers: ctx.suppliers, supplier_payments: ctx.payments, price_history: ctx.priceHistory
      };
      UI.downloadFile('lube-control-' + UI.today() + '.json', JSON.stringify(dump, null, 2), 'application/json');
      UI.toast('Данные выгружены', 'ok');
    });

    const ch = host.querySelector('#sClearHist');
    if (ch) ch.addEventListener('click', () => window.LC_MOVES.clearModal(ctx));

    const seed = host.querySelector('#sSeed');
    if (seed) seed.addEventListener('click', async () => {
      const ok = await UI.confirmBox('Очистить все данные?',
        'Прайс, стеллажи, закупки и все движения в этом браузере будут стёрты без возврата. ' +
        'Настройки и аккаунты останутся. Сначала имеет смысл скачать выгрузку в JSON.',
        'Стереть всё', 'btn-danger');
      if (!ok) return;
      STORE.clearAll();
      UI.toast('Данные очищены', 'ok');
      ctx.refresh();
    });
  }

  /* ---------------- готовый config.js ---------------- */

  function downloadConfig() {
    const C = window.LC_CONFIG;
    const q = (s) => "'" + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
    const L = [];

    L.push('/* ============================================================');
    L.push('   Lube Control — настройки сайта.');
    L.push('   Файл лежит рядом с index.html. Правьте прямо тут и заливайте');
    L.push('   в репозиторий — значения увидят все. Если файл удалить,');
    L.push('   сайт продолжит работать на значениях по умолчанию.');
    L.push('   Собрано ' + new Date().toLocaleString('ru-RU') + '');
    L.push('   ============================================================ */');
    L.push('');
    L.push('window.LC_CONFIG = {');
    L.push('');
    L.push('  /* ---------- Общая база ---------- */');
    L.push('  supabaseUrl: ' + q(C.supabaseUrl) + ',');
    L.push('  supabaseAnonKey: ' + q(C.supabaseAnonKey) + ',');
    L.push('  emailDomain: ' + q(C.emailDomain) + ',');
    L.push('');
    L.push('  /* ---------- Правила ---------- */');
    L.push('  rules: {');
    RULES.forEach((r, i) => {
      L.push('    ' + r.key + ': ' + C.rules[r.key] + (i < RULES.length - 1 ? ',' : '') +
        '  // ' + r.label.toLowerCase() + ', ' + r.unit);
    });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Цвета ---------- */');
    L.push('  colors: {');
    COLORS.forEach((c, i) => {
      L.push('    ' + c.key + ': ' + q(C.colors[c.key]) + (i < COLORS.length - 1 ? ',' : '') +
        '  // ' + c.label.toLowerCase());
    });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Надписи ---------- */');
    L.push('  texts: {');
    TEXTS.forEach((t, i) => {
      L.push('    ' + t.key + ': ' + q((C.texts || {})[t.key]) + (i < TEXTS.length - 1 ? ',' : ''));
    });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Категории прайса (ключ менять нельзя) ---------- */');
    L.push('  categories: [');
    C.categories.forEach((c, i) => {
      L.push('    { key: ' + q(c.key) + ', label: ' + q(c.label) + ', color: ' + q(c.color) + ' }' +
        (i < C.categories.length - 1 ? ',' : ''));
    });
    L.push('  ],');
    L.push('');
    L.push('  /* ---------- Связь с администрацией (кнопки у продавцов и курьеров) ---------- */');
    L.push('  contacts: {');
    const CK = ['title'].concat(UI.CONTACT_KINDS.map(k => k.key));
    CK.forEach((k, i) => { L.push('    ' + k + ': ' + q((C.contacts || {})[k] || '') + (i < CK.length - 1 ? ',' : '')); });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Способы оплаты закупок ---------- */');
    L.push('  payments: [' + (C.payments || []).map(q).join(', ') + '],');
    L.push('');
    L.push('  /* ---------- Аккаунты ----------');
    L.push('     Пароли работают только в демо-режиме. С Supabase пароль проверяет сервер,');
    L.push('     здесь остаются логин, роль, имя и закреплённый стеллаж. */');
    L.push('  accounts: [');
    C.accounts.forEach((a, i) => {
      L.push('    { login: ' + q(a.login) + ', password: ' + q(a.password || '') +
        ', role: ' + q(a.role) + ', name: ' + q(a.name) +
        ', title: ' + q(a.title || '') + ', rack: ' + (a.rack ? q(a.rack) : 'null') + ' }' +
        (i < C.accounts.length - 1 ? ',' : ''));
    });
    L.push('  ]');
    L.push('};');
    L.push('');

    UI.downloadFile('config.js', L.join('\n'), 'application/javascript');
    UI.toast('config.js скачан — положите его рядом с index.html', 'ok');
  }

  return { render, downloadConfig, changedCount };
})();



/* ============================================================
   Lube Control — ЧАТ С АДМИНИСТРАЦИЕЙ
   У администратора — раздел «Чат»: слева сотрудники, справа переписка,
   сверху канал «Всем сотрудникам» для объявлений.
   У продавца и курьера — кнопка «Чат» и выезжающая панель.
   ============================================================ */

window.LC_CHAT = (function () {
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let user = null;
  let messages = [];
  let people = [];          // для администратора: сотрудники из «Сотрудников»
  let peopleAt = 0;
  let current = null;       // открытая переписка у администратора (логин или '*')
  let host = null;          // страница «Чат» у администратора
  let drawer = null;        // панель у сотрудника
  let fab = null;
  let known = null;         // id уже виденных сообщений — чтобы показать тост о новом
  let onBadge = null;
  let loadErr = '';

  const isAdmin = () => user && user.role === 'admin';
  const newsKey = () => 'lc_news_seen_' + (user ? user.login : '');
  const newsSeen = () => { try { return localStorage.getItem(newsKey()) || ''; } catch (e) { return ''; } };
  const setNewsSeen = (iso) => { try { localStorage.setItem(newsKey(), iso); } catch (e) { /* нет доступа */ } };

  /* ---------------- данные ---------------- */

  async function load() {
    try {
      messages = await STORE.getMessages(user);
      loadErr = '';
    } catch (e) {
      loadErr = e.message || 'Не удалось загрузить сообщения';
    }
    if (isAdmin() && Date.now() - peopleAt > 60000) {
      try { people = await STORE.listUsers(); peopleAt = Date.now(); } catch (e) { /* покажем по логинам */ }
    }
  }

  function incoming(m) {
    return isAdmin() ? !m.from_admin : (m.from_admin && m.thread === user.login);
  }

  /** Сколько непрочитанных (у сотрудника — вместе с новыми объявлениями). */
  function unread(thread) {
    if (!user) return 0;
    if (isAdmin()) {
      return messages.filter(m => !m.from_admin && !m.read_at && m.thread !== '*' &&
        (thread === undefined || m.thread === thread)).length;
    }
    const seen = newsSeen();
    return messages.filter(m => (incoming(m) && !m.read_at) ||
      (m.thread === '*' && m.from_login !== user.login && String(m.created_at) > seen)).length;
  }

  async function update(first) {
    await load();
    const fresh = [];
    if (known) messages.forEach(m => { if (!known.has(m.id) && (incoming(m) || (!isAdmin() && m.thread === '*'))) fresh.push(m); });
    known = new Set(messages.map(m => m.id));
    if (!first && fresh.length) notify(fresh);
    paint();
  }

  function notify(list) {
    const m = list[list.length - 1];
    const open = isAdmin() ? (onChatPage() && current === m.thread) : !!drawer;
    if (open) return;
    const who = m.thread === '*' ? 'Объявление' : (isAdmin() ? nameOf(m.thread) : 'Администратор');
    UI.toast(who + ': ' + (m.body.length > 80 ? m.body.slice(0, 80) + '…' : m.body), 'ok');
  }

  function paint() {
    const n = unread();
    document.title = document.title.replace(/^\(\d+\)\s*/, '');
    if (n) document.title = '(' + n + ') ' + document.title;
    if (onBadge) onBadge(n);
    if (fab) fab.innerHTML = UI.icon('chat', 18, '#12161F', 2) + '<span>Чат</span>' + (n ? '<span class="badge">' + n + '</span>' : '');
    if (onChatPage()) paintAdmin(false);
    if (drawer) paintDrawer(false);
  }

  // страница «Чат» открыта, если в области просмотра стоит её разметка
  const onChatPage = () => !!(host && host.isConnected && host.querySelector('.chat-layout'));

  /* ---------------- общие куски ---------------- */

  function nameOf(login) {
    if (login === '*') return 'Всем сотрудникам';
    const p = people.find(u => u.login === login);
    if (p) return p.name || login;
    const m = messages.find(x => x.thread === login && !x.from_admin);
    return (m && m.from_name) || login;
  }

  const initials = (s) => String(s || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  const dayLabel = (iso) => {
    const d = new Date(iso), t = new Date();
    const same = (a, b) => a.toDateString() === b.toDateString();
    const y = new Date(t); y.setDate(t.getDate() - 1);
    if (same(d, t)) return 'Сегодня';
    if (same(d, y)) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  };

  function feedHtml(list, emptyText) {
    if (!list.length) return '<div class="empty-state" style="margin:auto;border:0">' + UI.esc(emptyText) + '</div>';
    let day = '';
    return list.map(m => {
      const d = dayLabel(m.created_at);
      const head = d !== day ? '<div class="chat-day">' + UI.esc(d) + '</div>' : '';
      day = d;
      const mine = m.from_login === user.login || (isAdmin() && m.from_admin);
      const news = m.thread === '*';
      const cls = news && !isAdmin() ? 'news' : (mine ? 'mine' : 'theirs');
      const meta = UI.time(m.created_at) + (isAdmin() && m.from_admin && m.from_login !== user.login ? ' · ' + m.from_name : '') +
        (mine && !news ? (m.read_at ? ' · прочитано' : ' · отправлено') : '');
      return head + '<div class="msg ' + cls + '">' +
        (cls === 'news' ? '<span class="tag">Объявление</span>' : '') +
        UI.esc(m.body) + '<small>' + UI.esc(meta) + '</small></div>';
    }).join('');
  }

  function inputHtml(placeholder) {
    return '<div class="chat-input"><textarea rows="1" data-chat-text placeholder="' + UI.esc(placeholder) + '" maxlength="4000"></textarea>' +
      '<button class="btn btn-primary" data-chat-send>' + UI.icon('send', 16, '#12161F', 2) + '<span>Отправить</span></button></div>';
  }

  function bindInput(root, send) {
    const ta = root.querySelector('[data-chat-text]');
    const btn = root.querySelector('[data-chat-send]');
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; };
    ta.addEventListener('input', grow);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(); }
    });
    btn.addEventListener('click', go);
    let busy = false;
    async function go() {
      const text = ta.value.trim();
      if (!text || busy) return;
      busy = true; btn.disabled = true;
      try {
        await send(text);
        ta.value = ''; grow();
        await update(false);
      } catch (e) {
        UI.toast(e.message || 'Не отправилось', 'err');
      } finally {
        busy = false; btn.disabled = false; ta.focus();
      }
    }
  }

  const scrollDown = (el) => { if (el) el.scrollTop = el.scrollHeight; };

  /* ---------------- администратор ---------------- */

  function threads() {
    const map = {};
    people.filter(u => u.role !== 'admin').forEach(u => {
      map[u.login] = { login: u.login, name: u.name || u.login, sub: u.role === 'courier' ? 'курьер' : (u.rack_code ? 'продавец · ' + u.rack_code : 'продавец'), last: null };
    });
    messages.forEach(m => {
      if (m.thread === '*') return;
      if (!map[m.thread]) map[m.thread] = { login: m.thread, name: nameOf(m.thread), sub: 'бывший сотрудник', last: null };
      map[m.thread].last = m;
    });
    const list = Object.keys(map).map(k => map[k]);
    list.sort((a, b) => String(b.last ? b.last.created_at : '').localeCompare(String(a.last ? a.last.created_at : '')) ||
      a.name.localeCompare(b.name, 'ru'));
    const news = messages.filter(m => m.thread === '*');
    return [{ login: '*', name: 'Всем сотрудникам', sub: 'объявления — видят все продавцы и курьеры', last: news[news.length - 1] || null }].concat(list);
  }

  function renderAdmin(h, ctx) {
    host = h;
    void ctx;
    paintAdmin(true);
    update(false);
  }

  function paintAdmin(full) {
    if (!host) return;
    const list = threads();
    if (current === null) {
      const firstUnread = list.find(t => t.login !== '*' && unread(t.login));
      current = firstUnread ? firstUnread.login : (list[1] ? list[1].login : '*');
    }
    const threadsHtml = list.map(t => {
      const n = t.login === '*' ? 0 : unread(t.login);
      const snip = t.last ? (t.last.from_admin ? 'Вы: ' : '') + t.last.body : t.sub;
      return '<button class="chat-thread' + (t.login === current ? ' on' : '') + '" data-thread="' + UI.esc(t.login) + '">' +
        '<span class="ava' + (t.login === '*' ? ' all' : '') + '">' + (t.login === '*' ? UI.icon('users', 16) : UI.esc(initials(t.name))) + '</span>' +
        '<span class="who"><b>' + UI.esc(t.name) + '</b><small>' + UI.esc(snip) + '</small></span>' +
        '<span class="stack-sm" style="gap:4px;align-items:flex-end">' +
          (t.last ? '<small style="font-size:10.5px;color:#64748B">' + UI.esc(UI.dateShort(t.last.created_at) === UI.dateShort(new Date().toISOString()) ? UI.time(t.last.created_at) : UI.dateShort(t.last.created_at)) + '</small>' : '') +
          (n ? '<span class="badge">' + n + '</span>' : '') +
        '</span></button>';
    }).join('');

    const cur = list.find(t => t.login === current) || list[0];
    const feed = messages.filter(m => m.thread === cur.login);

    if (full) {
      host.innerHTML =
        '<main class="page">' +
          '<div class="page-head"><div><h1>Чат</h1><p>Переписка с продавцами и курьерами. Объявление «Всем сотрудникам» увидят все.</p></div></div>' +
          (loadErr ? '<div class="card flat" style="font-size:13px;color:var(--red)">' + UI.esc(loadErr) + '</div>' : '') +
          '<div class="chat-layout">' +
            '<div class="chat-threads" id="chThreads"></div>' +
            '<section class="card chat-box">' +
              '<div class="chat-box-head" id="chHead"></div>' +
              '<div class="chat-feed" id="chFeed"></div>' +
              inputHtml('Сообщение…') +
            '</section>' +
          '</div>' +
        '</main>';
      host.querySelector('#chThreads').addEventListener('click', (e) => {
        const b = e.target.closest('[data-thread]');
        if (!b) return;
        current = b.dataset.thread;
        paintAdmin(false);
        const ta = host.querySelector('[data-chat-text]');
        if (ta) ta.focus();
      });
      host.querySelector('#chHead').addEventListener('click', async (e) => {
        if (!e.target.closest('[data-clear]')) return;
        const ok = await UI.confirmBox('Стереть переписку «' + nameOf(current) + '»?',
          'Сообщения удалятся у вас и у сотрудника. Вернуть нельзя.', 'Стереть', 'btn-danger');
        if (!ok) return;
        try { await STORE.clearThread(current); await update(false); UI.toast('Переписка стёрта', 'ok'); }
        catch (err) { UI.toast(err.message || 'Не получилось', 'err'); }
      });
      bindInput(host, (text) => STORE.sendMessage(current, text, user));
    }

    host.querySelector('#chThreads').innerHTML = threadsHtml;
    host.querySelector('#chHead').innerHTML =
      '<div style="min-width:0"><b style="font-size:15px">' + UI.esc(cur.name) + '</b>' +
        '<div style="font-size:12px;color:#64748B">' + UI.esc(cur.sub) + '</div></div>' +
      (feed.length ? '<button class="btn btn-ghost btn-sm" data-clear>' + UI.icon('trash', 14) + '<span>Стереть</span></button>' : '');
    const feedEl = host.querySelector('#chFeed');
    const atBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60;
    const prevThread = feedEl.dataset.thread;
    feedEl.innerHTML = feedHtml(feed, cur.login === '*'
      ? 'Объявлений ещё не было. Напишите — сообщение увидят все продавцы и курьеры.'
      : 'Переписки пока нет. Напишите первым.');
    feedEl.dataset.thread = cur.login;
    if (atBottom || prevThread !== cur.login) scrollDown(feedEl);
    const ta = host.querySelector('[data-chat-text]');
    if (ta) ta.placeholder = cur.login === '*' ? 'Объявление для всех сотрудников…' : 'Сообщение для ' + cur.name + '…';

    // открыли переписку — входящие прочитаны
    const toRead = feed.filter(m => !m.from_admin && !m.read_at).map(m => m.id);
    if (toRead.length) {
      messages.forEach(m => { if (toRead.indexOf(m.id) >= 0) m.read_at = new Date().toISOString(); });
      STORE.markMessagesRead(toRead).catch(() => {});
      setTimeout(paint, 0);
    }
  }

  /* ---------------- продавец и курьер ---------------- */

  function openDrawer() {
    if (drawer) return;
    const back = document.createElement('div');
    back.className = 'chat-drawer-back';
    back.innerHTML =
      '<div class="chat-drawer" role="dialog" aria-modal="true">' +
        '<div class="chat-box-head"><div><b style="font-size:15px">Чат с администратором</b>' +
          '<div style="font-size:12px;color:#64748B">Ответ придёт сюда же</div></div>' +
          '<button class="icon-btn" data-close aria-label="Закрыть">' + UI.icon('close', 16) + '</button></div>' +
        '<div class="chat-feed" id="chFeedMine"></div>' +
        inputHtml('Сообщение…') +
      '</div>';
    const close = () => {
      document.removeEventListener('keydown', onKey);
      back.remove(); drawer = null;
      if (fab) fab.style.display = '';
      paint();
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    drawer = back;
    if (fab) fab.style.display = 'none';
    bindInput(back, (text) => STORE.sendMessage(user.login, text, user));
    paintDrawer(true);
    update(false);
    setTimeout(() => { const ta = back.querySelector('[data-chat-text]'); if (ta) ta.focus(); }, 60);
  }

  function paintDrawer(first) {
    if (!drawer) return;
    const feedEl = drawer.querySelector('#chFeedMine');
    const atBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60;
    const list = messages.filter(m => m.thread === user.login || m.thread === '*');
    feedEl.innerHTML = (loadErr ? '<div style="font-size:13px;color:var(--red)">' + UI.esc(loadErr) + '</div>' : '') +
      feedHtml(list, 'Напишите администратору: что закончилось, что привезти, вопрос по товару.');
    if (first || atBottom) scrollDown(feedEl);

    const toRead = list.filter(m => m.from_admin && m.thread === user.login && !m.read_at).map(m => m.id);
    const lastNews = list.filter(m => m.thread === '*').map(m => m.created_at).sort().pop();
    let changed = false;
    if (lastNews && lastNews > newsSeen()) { setNewsSeen(lastNews); changed = true; }
    if (toRead.length) {
      messages.forEach(m => { if (toRead.indexOf(m.id) >= 0) m.read_at = new Date().toISOString(); });
      STORE.markMessagesRead(toRead).catch(() => {});
      changed = true;
    }
    if (changed) setTimeout(paint, 0);
  }

  /* ---------------- запуск ---------------- */

  /**
   * Подключить чат. opts.onBadge(n) — обновить счётчик непрочитанных;
   * opts.fab — показать круглую кнопку «Чат» (у продавца и курьера).
   */
  async function init(currentUser, opts) {
    const o = opts || {};
    user = currentUser;
    onBadge = o.onBadge || null;
    if (o.fab && !fab) {
      fab = document.createElement('button');
      fab.className = 'chat-fab';
      fab.type = 'button';
      fab.addEventListener('click', openDrawer);
      document.body.appendChild(fab);
    }
    await update(true);
    STORE.onMessages(() => update(false));
    // запасной опрос раз в минуту — если realtime отвалился (мобильный интернет)
    setInterval(() => update(false), 60000);
  }

  return { init, renderAdmin, openDrawer, unread };
})();



/* ============================================================
   Lube Control — рабочее место продавца
   ============================================================ */

window.LC_SELLER = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;
  const $ = (id) => document.getElementById(id);

  let user = null;
  let rack = null;
  let todayOps = [];
  let openRequest = null;
  let busy = false;

  const startOfDay = () => {
    const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString();
  };

  /* ---------------- загрузка ---------------- */

  async function load() {
    const racks = await STORE.getRacks();
    rack = racks.find(r => r.code === user.rack) || racks[0] || null;
    if (!rack) { todayOps = []; return; }
    const [ops, reqs] = await Promise.all([
      STORE.getOps({ rack: rack.code, since: startOfDay(), limit: 200 }),
      STORE.getRequests(true)
    ]);
    todayOps = ops;
    openRequest = reqs.find(r => r.rack_code === rack.code) || null;
  }

  /* ---------------- статус поставки ---------------- */

  /** Короткая строка: ждём / админ увидел / везём. */
  function supplyState() {
    const missing = rack.items.reduce((s, i) => s + (i.max - i.qty), 0);
    const empty = rack.items.filter(i => i.qty <= 0).length;

    if (openRequest && openRequest.status === 'packed') {
      return {
        cls: 'packed', icon: 'box', color: 'var(--green)',
        title: 'Поставка собрана, везём к вам',
        sub: UI.ago(openRequest.packed_at) +
          (openRequest.packed_by ? ' · ' + openRequest.packed_by : '') +
          ' · примите товар, когда привезут'
      };
    }
    if (openRequest && openRequest.seen_at) {
      return {
        cls: 'seen', icon: 'eye', color: 'var(--orange)',
        title: 'Администратор увидел заявку',
        sub: UI.ago(openRequest.seen_at) + ' · ждём сборку поставки'
      };
    }
    if (openRequest) {
      return {
        cls: 'wait', icon: 'clock', color: 'var(--amber)',
        title: 'Заявка отправлена',
        sub: UI.ago(openRequest.created_at) + (openRequest.note ? ' · ' + openRequest.note : '')
      };
    }
    if (empty) {
      return {
        cls: 'seen', icon: 'eye', color: 'var(--orange)',
        title: 'Администратор видит пустые позиции',
        sub: 'Остаток уходит к нему сразу. Нужен товар срочно — отправьте заявку'
      };
    }
    return {
      cls: 'wait', icon: 'truck', color: 'var(--amber)',
      title: missing ? 'До полного стеллажа ' + missing + ' шт' : 'Стеллаж заполнен',
      sub: 'Заявок нет'
    };
  }

  async function refresh() {
    try {
      await load();
      render();
    } catch (err) {
      UI.toast('Не удалось обновить данные: ' + err.message, 'err');
    }
  }

  /* ---------------- отрисовка ---------------- */

  function render() {
    if (!rack) {
      $('goods').innerHTML = '<div class="empty-state">За вами пока не закреплён стеллаж. Обратитесь к администратору.</div>';
      $('log').innerHTML = '';
      $('side').innerHTML = UI.contactsCard({ chat: true, unread: window.LC_CHAT.unread() });
      return;
    }

    $('rackTitle').textContent = 'Мой стеллаж · ' + rack.code;
    $('rackMeta').textContent = [rack.station, rack.address, rack.post].filter(Boolean).join(' · ');
    $('todayDate').textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

    $('rackPhoto').innerHTML = rack.photo
      ? '<figure class="photo-hero" style="margin:0" data-photo>' +
          '<img src="' + rack.photo + '" alt="Фото стеллажа ' + UI.esc(rack.code) + '">' +
          '<figcaption>' + UI.esc(rack.code + ' · ' + rack.station) + ' — так стеллаж должен выглядеть</figcaption>' +
        '</figure>'
      : '';

    $('goods').innerHTML = rack.items.length
      ? rack.items.map(goodCard).join('')
      : '<div class="empty-state">На стеллаже пока нет позиций. Администратор добавит их из прайса.</div>';
    renderLog();
    renderSide();
  }

  function goodCard(i) {
    const st = UI.itemStatus(i);
    const cls = st === 'empty' ? ' danger' : (st === 'low' ? ' warn' : '');
    const dim = st === 'empty';
    return '<article class="card good' + cls + '"' + (dim ? ' style="background:var(--card-2)"' : '') + '>' +
      '<div class="top">' +
        UI.icon('can', 22, dim ? 'var(--dim)' : 'var(--amber)', 1.5) +
        '<span class="pill sm ' + st + '">' +
          (st === 'ok' ? 'Норма' : st === 'low' ? 'Мало' : 'Закончилось') +
        '</span>' +
      '</div>' +
      '<div class="title"><b' + (dim ? ' style="color:#8494AC"' : '') + '>' + UI.esc(i.name) + '</b>' +
        '<small>' + UI.esc([i.brand, i.volume].filter(Boolean).join(' · ')) + '</small></div>' +
      '<div class="good-price' + (dim ? ' dim' : '') + '">' +
        (i.price ? UI.money(i.price) : '<span style="font-size:14px;color:var(--orange)">цена не указана</span>') +
        '<small>за 1 шт</small></div>' +
      '<div class="stack-sm" style="gap:7px">' +
        '<div class="row-between" style="align-items:baseline">' +
          '<span class="count"' + (st !== 'ok' ? ' style="color:' +
            (st === 'low' ? 'var(--orange)' : 'var(--red)') + '"' : '') + '>' +
            i.qty + '<small> / ' + i.max + '</small></span>' +
          '<span class="mono" style="font-size:11px;color:#64748B">' + UI.itemPct(i) + '%</span>' +
        '</div>' + UI.pips(i) +
      '</div>' +
      (i.qty > 0
        ? '<button class="btn btn-primary btn-lg btn-block" data-act="sell" data-item="' + i.id + '">' +
            UI.icon('minus', 15, '#12161F', 2.2) + '<span>' + UI.esc(CFG.texts.sellBtn) +
            (i.price ? ' · ' + UI.money(i.price) : '') + '</span></button>'
        : '<button class="btn btn-danger btn-lg btn-block" data-act="request" data-item="' + i.id + '">' +
            (openRequest
              ? (openRequest.status === 'packed' ? 'Поставка едет' : 'Заявка отправлена')
              : UI.esc(CFG.texts.requestBtn)) + '</button>') +
    '</article>';
  }

  function renderLog() {
    const sales = todayOps.filter(o => o.type === 'sale');
    if (!sales.length) {
      $('log').innerHTML = '<div style="font-size:13px;color:#64748B;padding:8px 0">' +
        'Сегодня продаж ещё не было. Отметьте первую — кнопкой на карточке масла.</div>';
      return;
    }
    $('log').innerHTML = '<div class="log-list">' + sales.map(o => {
      const ageMin = (Date.now() - new Date(o.created_at).getTime()) / 60000;
      const canCancel = !o.cancelled && ageMin <= CFG.cancelWindowMin;
      return '<div class="log-row" style="grid-template-columns:62px minmax(0,1fr) 92px auto">' +
        '<span class="mono" style="font-size:12px;color:#8494AC">' + UI.time(o.created_at) + '</span>' +
        '<span class="ellipsis"' + (o.cancelled ? ' style="color:#4B5A75;text-decoration:line-through"' : '') + '>' +
          UI.esc(o.item_name) + (o.brand ? ' · ' + UI.esc(o.brand) : '') + ' · ' + o.qty + ' шт</span>' +
        '<span class="mono" style="font-size:13px' + (o.cancelled ? ';color:#4B5A75' : '') + '">' +
          UI.money(o.amount) + '</span>' +
        (o.cancelled
          ? '<span style="font-size:12px;color:#64748B">отменено</span>'
          : canCancel
            ? '<button class="btn btn-ghost btn-sm" data-act="cancel" data-op="' + o.id + '">Отменить</button>'
            : '<span style="font-size:12px;color:#3DDC84">учтено</span>') +
      '</div>';
    }).join('') + '</div>';
  }

  function renderSide() {
    // в итоги смены и бонус — только свои продажи (продажи администратора на этой точке не в счёт)
    const sales = todayOps.filter(o => o.type === 'sale' && !o.cancelled && o.user_login === user.login);
