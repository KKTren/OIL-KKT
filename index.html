  return { mount, go, fillModal, ctx };
})();



/* ============================================================
   Lube Control — ПРАЙС
   Справочник всех жидкостей, которыми торгуем.
   Виден только администратору. Позиции отсюда ставятся на стеллажи.
   ============================================================ */

window.LC_PRICE = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let ctx = null;
  let query = '';
  let cat = 'all';
  let showArchived = false;
  let sort = { key: 'name', dir: 1 };

  /* ---------------- расчёты по позиции ---------------- */

  function stats(c) {
    const onRacks = [];
    ctx.racks.forEach(r => r.items.forEach(i => { if (i.catalog_id === c.id) onRacks.push({ r, i }); }));
    const capacity = onRacks.reduce((s, x) => s + x.i.max, 0);

    const from = Date.now() - 30 * 864e5;
    const sold = ctx.ops.filter(o =>
      o.type === 'sale' && !o.cancelled && o.item_name === c.name &&
      (!o.brand || !c.brand || o.brand === c.brand) &&
      new Date(o.created_at).getTime() >= from);
    const soldQty = sold.reduce((s, o) => s + o.qty, 0);
    const revenue = sold.reduce((s, o) => s + Number(o.amount || 0), 0);
    const lastSale = sold.length ? sold[0].created_at : null;

    const bought = (ctx.purchases || []).filter(p => p.catalog_id === c.id);
    const boughtQty = bought.reduce((s, p) => s + (Number(p.qty) || 0), 0);
    const lastBuy = bought.length ? bought[0] : null;
    const stock = (ctx.stock || {})[c.id] || 0;

    const margin = (Number(c.price) || 0) - (Number(c.cost) || 0);
    const marginPct = c.price ? Math.round(margin / c.price * 100) : 0;

    return { onRacks, onRacksQty: onRacks.reduce((s, x) => s + x.i.qty, 0), capacity,
      soldQty, revenue, lastSale, margin, marginPct, stock, boughtQty, lastBuy,
      points: new Set(onRacks.map(x => x.r.code)).size };
  }

  function rows() {
    const q = query.trim().toLowerCase();
    let list = ctx.catalog.filter(c => {
      if (!!c.archived !== showArchived) return false;
      if (cat !== 'all' && c.category !== cat) return false;
      if (!q) return true;
      return (c.name + ' ' + (c.brand || '') + ' ' + (c.sku || '') + ' ' + (c.volume || ''))
        .toLowerCase().includes(q);
    }).map(c => ({ c, s: stats(c) }));

    const get = {
      name: x => (x.c.name + ' ' + (x.c.brand || '')).toLowerCase(),
      brand: x => (x.c.brand || '').toLowerCase(),
      category: x => UI.catOf(x.c.category).label,
      cost: x => Number(x.c.cost) || 0,
      price: x => Number(x.c.price) || 0,
      margin: x => x.s.margin,
      stock: x => x.s.onRacksQty,
      wh: x => x.s.stock,
      bought: x => x.s.boughtQty,
      sold: x => x.s.soldQty,
      revenue: x => x.s.revenue,
      created: x => x.c.created_at || ''
    }[sort.key] || (x => x.c.name);

    list.sort((a, b) => {
      const va = get(a), vb = get(b);
      if (va < vb) return -sort.dir;
      if (va > vb) return sort.dir;
      return 0;
    });
    return list;
  }

  /* ---------------- отрисовка ---------------- */

  const TH = [
    { key: 'name', label: 'Товар' },
    { key: 'category', label: 'Категория' },
    { key: null, label: 'Объём' },
    { key: null, label: 'Артикул' },
    { key: 'cost', label: 'Закупка ₽', cls: 'r' },
    { key: 'price', label: 'Продажа ₽', cls: 'r' },
    { key: 'margin', label: 'Маржа', cls: 'r' },
    { key: 'wh', label: 'На складе', cls: 'r' },
    { key: 'stock', label: 'На стеллажах', cls: 'r' },
    { key: 'bought', label: 'Закуплено', cls: 'r' },
    { key: 'sold', label: 'Продано 30д', cls: 'r' },
    { key: 'revenue', label: 'Выручка 30д', cls: 'r' },
    { key: 'created', label: 'В прайсе с', cls: 'r' },
    { key: null, label: '', cls: 'r' }
  ];

  function render(host, context) {
    ctx = context;
    ctx.stock = STORE.warehouse(ctx.purchases, ctx.ops);   // склад считаем до таблицы
    const list = rows();
    const active = ctx.catalog.filter(c => !c.archived);
    const archivedCount = ctx.catalog.length - active.length;

    const stockSum = ctx.racks.reduce((s, r) =>
      s + r.items.reduce((t, i) => t + i.qty * (i.cost || 0), 0), 0);
    const byId = {};
    (ctx.catalog || []).forEach(c => { byId[c.id] = c; });
    let whQty = 0, whSum = 0;
    Object.keys(ctx.stock).forEach(id => {
      const n = ctx.stock[id];
      if (n > 0) { whQty += n; whSum += n * (Number((byId[id] || {}).cost) || 0); }
    });
    const sold30 = ctx.ops.filter(o => o.type === 'sale' && !o.cancelled &&
      new Date(o.created_at).getTime() >= Date.now() - 30 * 864e5);
    const revenue30 = sold30.reduce((s, o) => s + Number(o.amount || 0), 0);
    const margin30 = sold30.reduce((s, o) => s + Number(o.margin || 0), 0);
    const avgMargin = active.length
      ? Math.round(active.reduce((s, c) => s + (c.price ? ((c.price - c.cost) / c.price * 100) : 0), 0) / active.length)
      : 0;

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Прайс</h1><p>Все жидкости, которыми торгуем. Отсюда позиции ставятся на стеллажи.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="pExport">' + UI.icon('down', 15) + '<span>Выгрузить прайс</span></button>' +
            '<button class="btn btn-primary" id="pAdd">' + UI.icon('plus', 15, '#12161F', 2) + '<span>Позиция в прайс</span></button>' +
          '</div>' +
        '</div>' +

        '<section class="kpi-grid six">' +
          kpi('Позиций в прайсе', UI.num(active.length) + (archivedCount ? '<small> +' + archivedCount + ' в архиве</small>' : '')) +
          kpi('Средняя наценка', avgMargin + '<small> %</small>') +
          kpi('На складе', UI.num(whQty) + '<small> шт</small>', whQty ? 'var(--green)' : '#8494AC') +
          kpi('Товара на стеллажах', UI.money(stockSum), 'var(--amber)') +
          kpi('Выручка за 30 дней', UI.money(revenue30), '#3DDC84') +
          kpi('Маржа за 30 дней', UI.money(margin30), '#3DDC84') +
        '</section>' +

        '<div class="toolbar">' +
          '<div class="search">' + UI.icon('search', 15, '#64748B', 1.8) +
            '<input id="pSearch" type="search" placeholder="Название, фирма или артикул…" value="' + UI.esc(query) + '"></div>' +
          '<div class="filters" id="pCats">' +
            chip('all', 'Все', cat === 'all') +
            CFG.categories.map(c => chip(c.key, c.label, cat === c.key)).join('') +
          '</div>' +
          '<div class="grow"></div>' +
          '<button class="btn btn-ghost btn-sm" id="pArch">' + UI.icon('archive', 14) +
            '<span>' + (showArchived ? 'Показать рабочие' : 'Архив · ' + archivedCount) + '</span></button>' +
        '</div>' +

        (list.length
          ? '<div class="grid-wrap"><table class="grid"><thead><tr>' +
              TH.map(t => '<th class="' + (t.cls || '') + (t.key ? ' sortable' : '') +
                (sort.key === t.key ? ' sorted' : '') + '"' +
                (t.key ? ' data-sort="' + t.key + '"' : '') + '>' + t.label +
                (sort.key === t.key ? (sort.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>').join('') +
            '</tr></thead><tbody>' + list.map(row).join('') + '</tbody></table></div>'
          : '<div class="empty-state">' +
              (showArchived ? 'В архиве пусто.'
                : (ctx.catalog.length ? 'Ничего не найдено — измените поиск или фильтр.'
                  : 'Прайс пока пустой. Добавьте первую позицию — например «Антифриз G12, HEPU, 5 л».')) +
            '</div>') +
      '</main>';

    bind(host);
  }

  function kpi(label, value, color) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span></div>';
  }

  function chip(key, label, on) {
    return '<button class="chip' + (on ? ' active' : '') + '" data-cat="' + key + '">' + UI.esc(label) + '</button>';
  }

  function row(x) {
    const c = x.c, s = x.s;
    const stockCls = s.onRacksQty === 0 && s.onRacks.length ? ' neg' : '';
    return '<tr' + (c.archived ? ' class="archived"' : '') + ' data-id="' + c.id + '">' +
      '<td><div class="prod"><b>' + UI.esc(c.name) + '</b>' +
        '<small>' + UI.esc(c.brand || '—') + '</small></div></td>' +
      '<td>' + UI.catBadge(c.category) + '</td>' +
      '<td class="num">' + UI.esc(c.volume || '—') + '</td>' +
      '<td><span class="sku">' + UI.esc(c.sku || '—') + '</span></td>' +
      '<td class="r" style="color:#8494AC">' + UI.num(c.cost) + '</td>' +
      '<td class="r">' + UI.num(c.price) + '</td>' +
      '<td class="r ' + (s.margin > 0 ? 'pos' : s.margin < 0 ? 'neg' : '') + '">' +
        (s.margin > 0 ? '+' : '') + UI.num(s.margin) +
        ' <span style="color:#4B5A75">' + s.marginPct + '%</span></td>' +
      '<td class="r ' + (s.stock > 0 ? 'pos' : s.stock < 0 ? 'neg' : '') + '">' +
        (s.stock ? s.stock + ' шт' : '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r' + stockCls + '">' + (s.onRacks.length
        ? s.onRacksQty + ' / ' + s.capacity + ' <span style="color:#4B5A75">· ' + s.points + ' СТО</span>'
        : '<span style="color:#4B5A75">не стоит</span>') + '</td>' +
      '<td class="r">' + (s.boughtQty
        ? s.boughtQty + ' шт' + (s.lastBuy
            ? ' <span style="color:#4B5A75">· посл. ' + UI.num(s.lastBuy.cost) + '</span>' : '')
        : '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r">' + (s.soldQty || '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r">' + (s.revenue ? UI.num(s.revenue) : '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r" style="color:#64748B">' + (c.created_at ? UI.dateFull(c.created_at) : '—') + '</td>' +
      '<td class="r"><div class="row-act">' +
        (c.archived
          ? '<button class="icon-btn sm" data-act="restore" title="Вернуть в прайс">' + UI.icon('undo', 14) + '</button>' +
            '<button class="icon-btn sm danger" data-act="delete" title="Удалить насовсем">' + UI.icon('trash', 14) + '</button>'
          : '<button class="icon-btn sm" data-act="edit" title="Изменить">' + UI.icon('edit', 14) + '</button>' +
            '<button class="icon-btn sm danger" data-act="archive" title="Убрать из прайса">' + UI.icon('archive', 14) + '</button>') +
      '</div></td>' +
    '</tr>';
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const rerender = () => render(host, ctx);

    const s = host.querySelector('#pSearch');
    if (s) s.addEventListener('input', (e) => {
      query = e.target.value;
      rerender();
      const el = host.querySelector('#pSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });

    const cats = host.querySelector('#pCats');
    if (cats) cats.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      cat = b.dataset.cat;
      rerender();
    });

    const arch = host.querySelector('#pArch');
    if (arch) arch.addEventListener('click', () => { showArchived = !showArchived; rerender(); });

    const add = host.querySelector('#pAdd');
    if (add) add.addEventListener('click', () => editModal(null));

    const exp = host.querySelector('#pExport');
    if (exp) exp.addEventListener('click', exportCsv);

    const table = host.querySelector('.grid');
    if (!table) return;

    table.querySelectorAll('[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sort.key === key) sort.dir = -sort.dir;
        else sort = { key, dir: key === 'name' || key === 'category' ? 1 : -1 };
        rerender();
      });
    });

    table.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.closest('tr').dataset.id;
      const c = ctx.catalog.find(x => x.id === id);
      if (!c) return;
      const a = b.dataset.act;
      if (a === 'edit') editModal(c);
      if (a === 'archive') archive(c, true);
      if (a === 'restore') archive(c, false);
      if (a === 'delete') remove(c);
    });
  }

  async function archive(c, on) {
    if (on) {
      const s = stats(c);
      const ok = await UI.confirmBox('Убрать «' + c.name + '» из прайса?',
        s.onRacks.length
          ? 'Позиция стоит на ' + s.points + ' СТО — там она останется, но новые стеллажи ей заполнить будет нельзя. Вернуть из архива можно в любой момент.'
          : 'Позиция уйдёт в архив. История продаж и движений сохранится, вернуть можно в любой момент.',
        'Убрать в архив', 'btn-danger');
      if (!ok) return;
    }
    ctx.act(() => STORE.archiveCatalogItem(c.id, on, ctx.user),
      on ? 'Позиция убрана в архив' : 'Позиция вернулась в прайс');
  }

  async function remove(c) {
    const ok = await UI.confirmBox('Удалить «' + c.name + '» насовсем?',
      'Строка исчезнет из прайса полностью. Записи в движениях товара останутся.',
      'Удалить', 'btn-danger');
    if (!ok) return;
    ctx.act(() => STORE.deleteCatalogItem(c.id, ctx.user), 'Позиция удалена');
  }

  /* ---------------- окно заведения / правки ---------------- */

  function editModal(c) {
    const isNew = !c;
    const v = c || { category: 'motor', name: '', brand: '', volume: '', sku: '', cost: '', price: '' };

    UI.modal({
      title: isNew ? 'Позиция в прайс' : 'Изменить позицию',
      subtitle: isNew ? 'Название, фирма, объём — как на канистре' : (v.brand ? v.brand + ' · ' + v.name : v.name),
      wide: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div class="field"><label for="c-cat">Категория</label>' +
            '<select class="input sm" id="c-cat">' +
              CFG.categories.map(x => '<option value="' + x.key + '"' +
                (x.key === v.category ? ' selected' : '') + '>' + UI.esc(x.label) + '</option>').join('') +
            '</select></div>' +
          '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px">' +
            UI.field('Название', 'c-name', 'Антифриз G12', 'text', v.name) +
            UI.field('Фирма', 'c-brand', 'HEPU', 'text', v.brand) +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            UI.field('Объём', 'c-volume', '5 л', 'text', v.volume) +
            UI.field('Артикул', 'c-sku', 'P999-G12', 'text', v.sku) +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end">' +
            UI.field('Закупка, ₽', 'c-cost', '320', 'number', v.cost) +
            UI.field('Продажа, ₽', 'c-price', '490', 'number', v.price) +
            '<div class="field"><label>Маржа</label>' +
              '<div class="input sm mono" id="c-margin" style="display:flex;align-items:center;color:#3DDC84">—</div></div>' +
          '</div>' +
        '</div>',
      onOpen: (root) => {
        const calc = () => {
          const cost = Number(root.querySelector('#c-cost').value) || 0;
          const price = Number(root.querySelector('#c-price').value) || 0;
          const m = price - cost;
          const box = root.querySelector('#c-margin');
          box.textContent = price ? (m > 0 ? '+' : '') + UI.num(m) + ' ₽ · ' + Math.round(m / price * 100) + '%' : '—';
          box.style.color = m > 0 ? '#3DDC84' : m < 0 ? '#FF5A5F' : '#8494AC';
        };
        root.querySelector('#c-cost').addEventListener('input', calc);
        root.querySelector('#c-price').addEventListener('input', calc);
        calc();
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: isNew ? 'Добавить в прайс' : 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            const get = (id) => root.querySelector('#' + id).value.trim();
            const data = {
              category: get('c-cat'), name: get('c-name'), brand: get('c-brand'),
              volume: get('c-volume'), sku: get('c-sku'),
              cost: get('c-cost'), price: get('c-price')
            };
            if (!data.name) { UI.toast('Укажите название', 'err'); return false; }
            if (Number(data.price) < Number(data.cost)) {
              UI.toast('Цена продажи ниже закупки — проверьте', 'err');
            }
            ctx.act(
              () => isNew ? STORE.addCatalogItem(data, ctx.user) : STORE.updateCatalogItem(c.id, data, ctx.user),
              isNew ? 'Позиция добавлена в прайс' : 'Позиция обновлена'
            );
            return true;
          }
        }
      ]
    });
  }

  /* ---------------- выгрузка ---------------- */

  function exportCsv() {
    const list = rows();
    const out = [['Категория', 'Название', 'Фирма', 'Объём', 'Артикул', 'Закупка', 'Продажа',
      'Маржа ₽', 'Маржа %', 'На складе шт', 'На стеллажах шт', 'Вместимость шт', 'Точек',
      'Закуплено всего шт', 'Продано 30д', 'Выручка 30д', 'В прайсе с', 'Статус']];
    list.forEach(x => out.push([
      UI.catOf(x.c.category).label, x.c.name, x.c.brand || '', x.c.volume || '', x.c.sku || '',
      x.c.cost || 0, x.c.price || 0, x.s.margin, x.s.marginPct,
      x.s.stock, x.s.onRacksQty, x.s.capacity, x.s.points, x.s.boughtQty, x.s.soldQty, x.s.revenue,
      x.c.created_at ? UI.dateFull(x.c.created_at) : '',
      x.c.archived ? 'архив' : 'в работе'
    ]));
    UI.downloadFile('prays-' + UI.today() + '.csv', UI.csv(out));
    UI.toast('Прайс выгружен', 'ok');
  }

  return { render };
})();


/* ============================================================
   Lube Control — ЗАКУПКИ
   Что привезли на склад: дата, товар, поставщик, цена, количество, оплата.
   Со склада товар потом уезжает на стеллажи.
   ============================================================ */

window.LC_BUYS = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let ctx = null;
  let period = 90;          // дней; 0 — за всё время
  let cat = 'all';
  let supplier = 'all';
  let payment = 'all';
  let query = '';
  let sort = { key: 'date', dir: -1 };

  const PERIODS = [
    { key: 30, label: '30 дней' },
    { key: 90, label: '3 месяца' },
    { key: 365, label: 'Год' },
    { key: 0, label: 'Всё время' }
  ];

  /* ---------------- отбор ---------------- */

  function from() {
    if (!period) return 0;
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (period - 1));
    return d.getTime();
  }

  function rows() {
    const q = query.trim().toLowerCase();
    const since = from();
    const list = (ctx.purchases || []).filter(p => {
      if (period && new Date(p.date + 'T00:00:00').getTime() < since) return false;
      if (cat !== 'all' && p.category !== cat) return false;
      if (supplier !== 'all' && (p.supplier || '') !== supplier) return false;
      if (payment !== 'all' && (p.payment || '') !== payment) return false;
      if (!q) return true;
      return ((p.name || '') + ' ' + (p.brand || '') + ' ' + (p.sku || '') + ' ' +
        (p.supplier || '') + ' ' + (p.payment || '') + ' ' + (p.note || '')).toLowerCase().includes(q);
    });

    const get = {
      date: x => String(x.date || ''),
      name: x => (x.name + ' ' + (x.brand || '')).toLowerCase(),
      supplier: x => (x.supplier || '').toLowerCase(),
      category: x => UI.catOf(x.category).label,
      cost: x => Number(x.cost) || 0,
      qty: x => Number(x.qty) || 0,
      amount: x => Number(x.amount) || 0,
      payment: x => (x.payment || '').toLowerCase()
    }[sort.key] || (x => x.date);

    return list.sort((a, b) => {
      const va = get(a), vb = get(b);
      if (va < vb) return -sort.dir;
      if (va > vb) return sort.dir;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  }

  const suppliers = () => [...new Set((ctx.purchases || [])
    .map(p => (p.supplier || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));

  const payments = () => {
    const used = (ctx.purchases || []).map(p => (p.payment || '').trim()).filter(Boolean);
    return [...new Set((CFG.payments || []).concat(used))];
  };

  /* ---------------- отрисовка ---------------- */

  const TH = [
    { key: 'date', label: 'Дата поставки' },
    { key: 'name', label: 'Товар' },
    { key: 'supplier', label: 'Поставщик' },
    { key: 'category', label: 'Категория' },
    { key: null, label: 'Объём' },
    { key: null, label: 'Артикул' },
    { key: 'cost', label: 'Цена закуп. ₽', cls: 'r' },
    { key: 'qty', label: 'Кол-во', cls: 'r' },
    { key: 'amount', label: 'Сумма ₽', cls: 'r' },
    { key: 'payment', label: 'Оплата' },
    { key: null, label: '', cls: 'r' }
  ];

  function render(host, context) {
    ctx = context;
    const list = rows();

    const qty = list.reduce((s, p) => s + (Number(p.qty) || 0), 0);
    const sum = list.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const avg = qty ? Math.round(sum / qty) : 0;

    // остаток склада — по всем закупкам, а не только по выбранному периоду
    const left = STORE.warehouse(ctx.purchases, ctx.ops);
    const byId = {};
    (ctx.catalog || []).forEach(c => { byId[c.id] = c; });
    let stockQty = 0, stockSum = 0;
    Object.keys(left).forEach(id => {
      const n = left[id];
      if (n > 0) { stockQty += n; stockSum += n * (Number((byId[id] || {}).cost) || 0); }
    });

    // разбивка по способам оплаты
    const byPay = {};
    list.forEach(p => {
      const k = p.payment || 'не указан';
      byPay[k] = (byPay[k] || 0) + (Number(p.amount) || 0);
    });
    const payList = Object.entries(byPay).sort((a, b) => b[1] - a[1]);

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Закупки</h1>' +
            '<p>Что и почём привезли на склад. Отсюда товар уезжает на стеллажи.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="bExport">' + UI.icon('down', 15) + '<span>Выгрузить в CSV</span></button>' +
            '<button class="btn btn-primary" id="bAdd">' + UI.icon('plus', 15, '#12161F', 2) + '<span>Новая закупка</span></button>' +
          '</div>' +
        '</div>' +

        '<section class="kpi-grid five">' +
          kpi('Закуплено', UI.num(qty) + '<small> шт</small>') +
          kpi('Потрачено', UI.money(sum), 'var(--amber)') +
          kpi('Средняя цена', UI.money(avg), '#8494AC') +
          kpi('Поставщиков', String(suppliers().length)) +
          kpi('Сейчас на складе', UI.num(stockQty) + '<small> шт</small>',
            stockQty ? 'var(--green)' : '#8494AC', stockSum ? 'на ' + UI.money(stockSum) : 'всё разъехалось') +
        '</section>' +

        (payList.length
          ? '<div class="card flat row" style="gap:18px;flex-wrap:wrap">' +
              '<span style="font-size:12px;color:#64748B;letter-spacing:.08em;text-transform:uppercase;font-weight:600">' +
                'По оплате</span>' +
              payList.map(([k, v]) =>
                '<span class="row" style="gap:7px"><span style="font-size:13px;color:#B9C6DA">' + UI.esc(k) + '</span>' +
                '<b class="mono" style="font-size:13px">' + UI.money(v) + '</b></span>').join('') +
            '</div>'
          : '') +

        '<div class="toolbar">' +
          '<div class="filters" id="bPeriod">' +
            PERIODS.map(p => '<button class="chip' + (period === p.key ? ' active' : '') +
              '" data-period="' + p.key + '">' + p.label + '</button>').join('') +
          '</div>' +
          '<div class="grow"></div>' +
          select('bCat', cat, [{ v: 'all', t: 'Все категории' }]
            .concat(CFG.categories.map(c => ({ v: c.key, t: c.label })))) +
          select('bSupplier', supplier, [{ v: 'all', t: 'Все поставщики' }]
            .concat(suppliers().map(s => ({ v: s, t: s })))) +
          select('bPay', payment, [{ v: 'all', t: 'Любая оплата' }]
            .concat(payments().map(s => ({ v: s, t: s })))) +
          '<div class="search">' + UI.icon('search', 15, '#64748B', 1.8) +
            '<input id="bSearch" type="search" placeholder="Товар, поставщик, артикул…" value="' + UI.esc(query) + '"></div>' +
        '</div>' +

        (list.length
          ? '<div class="grid-wrap"><table class="grid"><thead><tr>' +
              TH.map(t => '<th class="' + (t.cls || '') + (t.key ? ' sortable' : '') +
                (sort.key === t.key ? ' sorted' : '') + '"' +
                (t.key ? ' data-sort="' + t.key + '"' : '') + '>' + t.label +
                (sort.key === t.key ? (sort.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>').join('') +
            '</tr></thead><tbody>' + list.map(row).join('') + '</tbody></table></div>' +
            '<p style="margin:0;font-size:12px;color:#64748B">Закупок: ' + UI.num(list.length) +
              ' · на сумму ' + UI.money(sum) + '</p>'
          : '<div class="empty-state">' +
              ((ctx.purchases || []).length
                ? 'За выбранный период закупок нет — смените период или фильтр.'
                : 'Закупок пока нет. Нажмите «Новая закупка» и внесите первую поставку.') +
            '</div>') +
      '</main>';

    bind(host);
  }

  function kpi(label, value, color, sub) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
      (sub ? '<span style="font-size:11px;color:#64748B">' + UI.esc(sub) + '</span>' : '') + '</div>';
  }

  function select(id, value, options) {
    return '<select class="input sm" id="' + id + '" style="width:auto;min-width:160px">' +
      options.map(o => '<option value="' + UI.esc(o.v) + '"' +
        (String(o.v) === String(value) ? ' selected' : '') + '>' + UI.esc(o.t) + '</option>').join('') +
      '</select>';
  }

  function row(p) {
    return '<tr data-id="' + UI.esc(p.id) + '">' +
      '<td class="num" style="white-space:nowrap">' + UI.esc(fmtDate(p.date)) + '</td>' +
      '<td><div class="prod"><b>' + UI.esc(p.name) + '</b>' +
        '<small>' + UI.esc(p.brand || '—') + '</small></div></td>' +
      '<td>' + (p.supplier
        ? UI.esc(p.supplier)
        : '<span style="color:#4B5A75">не указан</span>') + '</td>' +
      '<td>' + UI.catBadge(p.category) + '</td>' +
      '<td class="num">' + UI.esc(p.volume || '—') + '</td>' +
      '<td><span class="sku">' + UI.esc(p.sku || '—') + '</span></td>' +
      '<td class="r">' + UI.num(p.cost) + '</td>' +
      '<td class="r pos">+' + UI.num(p.qty) + '</td>' +
      '<td class="r"><b>' + UI.num(p.amount) + '</b></td>' +
      '<td>' + (p.payment
        ? '<span class="pill sm neutral">' + UI.esc(p.payment) + '</span>'
        : '<span style="color:#4B5A75">—</span>') +
        (p.note ? '<div style="font-size:11px;color:#4B5A75;margin-top:3px">' + UI.esc(p.note) + '</div>' : '') + '</td>' +
      '<td class="r"><div class="row-act">' +
        '<button class="icon-btn sm" data-act="edit" title="Изменить">' + UI.icon('edit', 14) + '</button>' +
        '<button class="icon-btn sm danger" data-act="del" title="Удалить">' + UI.icon('trash', 14) + '</button>' +
      '</div></td>' +
    '</tr>';
  }

  function fmtDate(d) {
    if (!d) return '—';
    const p = String(d).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : d;
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const rerender = () => render(host, ctx);

    host.querySelector('#bPeriod').addEventListener('click', (e) => {
      const b = e.target.closest('[data-period]');
      if (!b) return;
      period = Number(b.dataset.period);
      rerender();
    });

    host.querySelector('#bCat').addEventListener('change', e => { cat = e.target.value; rerender(); });
    host.querySelector('#bSupplier').addEventListener('change', e => { supplier = e.target.value; rerender(); });
    host.querySelector('#bPay').addEventListener('change', e => { payment = e.target.value; rerender(); });

    host.querySelector('#bSearch').addEventListener('input', (e) => {
      query = e.target.value;
      rerender();
      const el = host.querySelector('#bSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });

    host.querySelector('#bAdd').addEventListener('click', () => editModal(null));
    host.querySelector('#bExport').addEventListener('click', exportCsv);

    const table = host.querySelector('.grid');
    if (!table) return;

    table.querySelectorAll('[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sort.key === key) sort.dir = -sort.dir;
        else sort = { key, dir: key === 'name' || key === 'supplier' || key === 'payment' || key === 'category' ? 1 : -1 };
        rerender();
      });
    });

    table.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.closest('tr').dataset.id;
      const p = (ctx.purchases || []).find(x => x.id === id);
      if (!p) return;
      if (b.dataset.act === 'edit') editModal(p);
      if (b.dataset.act === 'del') remove(p);
    });
  }

  async function remove(p) {
    const ok = await UI.confirmBox(
      'Удалить закупку «' + p.name + '»?',
      fmtDate(p.date) + ' · ' + p.qty + ' шт на ' + UI.money(p.amount) +
      '. Остаток склада пересчитается.', 'Удалить', 'btn-danger');
    if (!ok) return;
    ctx.act(() => STORE.deletePurchase(p.id, ctx.user), 'Закупка удалена');
  }

  /* ---------------- окно закупки ---------------- */

  function editModal(p) {
    const isNew = !p;
    const active = (ctx.catalog || []).filter(c => !c.archived);

    if (!active.length) {
      UI.confirmBox('Прайс пустой',
        'Закупка заводится на товар из прайса. Сначала добавьте позицию в прайсе — ' +
        'название, фирму, объём и артикул.', 'Понятно').then(() => {});
      return;
    }

    let chosen = isNew ? null : p.catalog_id;
    const today = new Date().toISOString().slice(0, 10);
    const known = suppliers();
    const pays = payments();

    UI.modal({
      title: isNew ? 'Новая закупка' : 'Изменить закупку',
      subtitle: isNew ? 'Что привезли на склад' : p.name + ' · ' + fmtDate(p.date),
      wide: true,
      noFocus: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +

          '<div class="field"><label>Товар из прайса</label>' +
            '<div class="search" style="margin-bottom:8px"><input id="bPick" type="search" ' +
              'placeholder="Поиск: название, фирма, артикул…"></div>' +
            '<div class="picker" id="bPicker"></div>' +
            '<div id="bChosen" style="font-size:12px;color:#64748B;margin-top:6px"></div>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            UI.field('Дата поставки', 'b-date', '', 'date', isNew ? today : p.date) +
            '<div class="field"><label for="b-supplier">Поставщик</label>' +
              '<input class="input sm" id="b-supplier" list="bSuppliers" placeholder="ООО «Смазка»" value="' +
                UI.esc(isNew ? '' : (p.supplier || '')) + '">' +
              '<datalist id="bSuppliers">' + known.map(s => '<option value="' + UI.esc(s) + '">').join('') + '</datalist>' +
            '</div>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end">' +
            UI.field('Цена закупки, ₽', 'b-cost', '320', 'number', isNew ? '' : p.cost) +
            UI.field('Количество, шт', 'b-qty', '10', 'number', isNew ? '' : p.qty) +
            '<div class="field"><label>Сумма</label>' +
              '<div class="input sm mono" id="b-sum" style="display:flex;align-items:center;color:var(--amber)">—</div></div>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            '<div class="field"><label for="b-payment">Способ оплаты</label>' +
              '<select class="input sm" id="b-payment">' +
                pays.map(s => '<option value="' + UI.esc(s) + '"' +
                  (!isNew && p.payment === s ? ' selected' : '') + '>' + UI.esc(s) + '</option>').join('') +
                '<option value="">— не указан —</option>' +
              '</select></div>' +
            UI.field('Комментарий', 'b-note', 'номер накладной, договорённости…', 'text', isNew ? '' : (p.note || '')) +
          '</div>' +

          (isNew
            ? '<label class="row" style="gap:9px;cursor:pointer;font-size:13px;color:#B9C6DA">' +
                '<input type="checkbox" id="b-upd" checked style="width:16px;height:16px;accent-color:var(--amber)">' +
                '<span>Обновить цену закупки в прайсе по этой поставке</span></label>'
            : '') +
        '</div>',

      onOpen: (root) => {
        const picker = root.querySelector('#bPicker');
        const chosenBox = root.querySelector('#bChosen');
        const sumBox = root.querySelector('#b-sum');

        const showChosen = () => {
          const c = active.find(x => x.id === chosen);
          chosenBox.innerHTML = c
            ? 'Категория: <b style="color:#B9C6DA">' + UI.esc(UI.catOf(c.category).label) + '</b> · ' +
              'объём: <b style="color:#B9C6DA">' + UI.esc(c.volume || '—') + '</b> · ' +
              'артикул: <b style="color:#B9C6DA">' + UI.esc(c.sku || '—') + '</b> · ' +
              'в прайсе закупка ' + UI.money(c.cost)
            : 'Выберите товар — категория, объём и артикул подставятся из прайса.';
        };

        const paint = (q) => {
          const s = (q || '').trim().toLowerCase();
          const list = active.filter(c => !s ||
            (c.name + ' ' + (c.brand || '') + ' ' + (c.sku || '') + ' ' + (c.volume || '')).toLowerCase().includes(s));
          picker.innerHTML = list.length
            ? list.map(c =>
                '<button type="button" class="pick' + (chosen === c.id ? ' on' : '') + '" data-pick="' + c.id + '">' +
                  '<i class="cat-dot" style="background:' + UI.catOf(c.category).color + '"></i>' +
                  '<span class="t"><b>' + UI.esc(c.name) + '</b>' +
                    '<small>' + UI.esc([c.brand, c.volume, c.sku].filter(Boolean).join(' · ')) + '</small></span>' +
                  '<span class="p">' + UI.money(c.cost) + '</span>' +
                '</button>').join('')
            : '<div class="empty-state" style="padding:18px">Ничего не найдено</div>';
        };

        const recalc = () => {
          const cost = Number(root.querySelector('#b-cost').value) || 0;
          const qty = Number(root.querySelector('#b-qty').value) || 0;
          sumBox.textContent = cost && qty ? UI.money(cost * qty) : '—';
        };

        paint('');
        showChosen();
        recalc();

        root.querySelector('#bPick').addEventListener('input', e => paint(e.target.value));
        picker.addEventListener('click', (e) => {
          const b = e.target.closest('[data-pick]');
          if (!b) return;
          chosen = b.dataset.pick;
          picker.querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x.dataset.pick === chosen));
          showChosen();
          const costEl = root.querySelector('#b-cost');
          const c = active.find(x => x.id === chosen);
          if (c && !costEl.value) { costEl.value = c.cost || ''; recalc(); }
        });
        root.querySelector('#b-cost').addEventListener('input', recalc);
        root.querySelector('#b-qty').addEventListener('input', recalc);
      },

      actions: [
        { label: 'Отмена', value: null },
        {
          label: isNew ? 'Записать закупку' : 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            if (!chosen) { UI.toast('Выберите товар из прайса', 'err'); return false; }
            const get = (id) => root.querySelector('#' + id).value.trim();
            const qty = Number(get('b-qty'));
            if (!qty || qty <= 0) { UI.toast('Укажите количество', 'err'); return false; }
            if (!get('b-date')) { UI.toast('Укажите дату поставки', 'err'); return false; }
            const data = {
              catalog_id: chosen, date: get('b-date'), supplier: get('b-supplier'),
              cost: get('b-cost'), qty: qty, payment: get('b-payment'), note: get('b-note'),
              updateCost: isNew && root.querySelector('#b-upd') && root.querySelector('#b-upd').checked
            };
            ctx.act(
              () => isNew ? STORE.addPurchase(data, ctx.user) : STORE.updatePurchase(p.id, data, ctx.user),
              (r) => isNew ? 'Закупка записана: +' + r.qty + ' шт на ' + UI.money(r.amount) : 'Закупка обновлена'
            );
            return true;
          }
        }
      ]
    });
  }

  /* ---------------- выгрузка ---------------- */

  function exportCsv() {
    const list = rows();
    const out = [['Дата поставки', 'Товар', 'Фирма', 'Поставщик', 'Категория', 'Объём', 'Артикул',
      'Цена закупки', 'Количество', 'Сумма', 'Способ оплаты', 'Комментарий', 'Кто внёс']];
    list.forEach(p => out.push([
      fmtDate(p.date), p.name, p.brand || '', p.supplier || '', UI.catOf(p.category).label,
      p.volume || '', p.sku || '', p.cost || 0, p.qty || 0, p.amount || 0,
      p.payment || '', p.note || '', p.user_name || ''
    ]));
    UI.downloadFile('zakupki-' + UI.today() + '.csv', UI.csv(out));
    UI.toast('Закупки выгружены: ' + list.length + ' записей', 'ok');
  }

  return { render };
})();



/* ============================================================
   Lube Control — ДВИЖЕНИЯ ТОВАРА
   Что, когда, откуда и куда уехало. С фильтрами и итогами.
   ============================================================ */

window.LC_MOVES = (function () {
  const UI = window.LC_UI;

  let ctx = null;
  let period = 7;          // дней; 0 — за всё время
  let rackCode = 'all';
  let kind = 'move';       // move | sale | in | audit | setup | price | all
  let query = '';

  const KINDS = [
    { key: 'move',  label: 'Товар' },
    { key: 'sale',  label: 'Продажи' },
    { key: 'in',    label: 'Приход' },
    { key: 'buy',   label: 'Закупки' },
    { key: 'audit', label: 'Сверки' },
    { key: 'setup', label: 'Стеллажи' },
    { key: 'price', label: 'Прайс' },
    { key: 'all',   label: 'Всё' }
  ];
  const PERIODS = [
    { key: 1, label: 'Сегодня' },
    { key: 7, label: '7 дней' },
    { key: 30, label: '30 дней' },
    { key: 0, label: 'Всё время' }
  ];

  function openFor(code) { rackCode = code; kind = 'move'; period = 30; }

  /* ---------------- отбор ---------------- */

  function matchKind(o) {
    const g = UI.opInfo(o.type).group;
    if (kind === 'all') return true;
    if (kind === 'sale') return o.type === 'sale';
    if (kind === 'in') return o.type === 'restock' || o.type === 'delivery' || o.type === 'cancel';
    if (kind === 'buy') return g === 'buy';
    if (kind === 'audit') return o.type === 'audit';
    if (kind === 'move') return g === 'move';
    return g === kind;
  }

  function list() {
    const q = query.trim().toLowerCase();
    const from = period ? startOfPeriod(period) : 0;
    return ctx.ops.filter(o => {
      if (period && new Date(o.created_at).getTime() < from) return false;
      if (rackCode !== 'all' && o.rack_code !== rackCode) return false;
      if (!matchKind(o)) return false;
      if (!q) return true;
      return ((o.item_name || '') + ' ' + (o.brand || '') + ' ' + (o.sku || '') + ' ' +
        (o.rack_code || '') + ' ' + (o.user_name || '') + ' ' + (o.note || '')).toLowerCase().includes(q);
    });
  }

  function startOfPeriod(days) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (days - 1));
    return d.getTime();
  }

  function totals(rows) {
    let soldQty = 0, revenue = 0, cost = 0, margin = 0, inQty = 0, inSum = 0, auditDiff = 0;
    let buyQty = 0, buySum = 0;
    rows.forEach(o => {
      if (o.type === 'sale' && !o.cancelled) {
        soldQty += o.qty;
        revenue += Number(o.amount || 0);
        cost += o.qty * Number(o.cost || 0);
        margin += Number(o.margin || 0);
      }
      if (o.type === 'restock' || o.type === 'delivery') {
        inQty += o.qty;
        inSum += Number(o.amount || 0);
      }
      if (o.type === 'purchase') { buyQty += o.qty; buySum += Number(o.amount || 0); }
      if (o.type === 'audit') auditDiff += o.qty;
    });
    return { soldQty, revenue, cost, margin, inQty, inSum, auditDiff, buyQty, buySum };
  }

  /* ---------------- отрисовка ---------------- */

  function render(host, context) {
    ctx = context;
    const rows = list();
    const t = totals(rows);
    const rackName = rackCode === 'all' ? 'по всем стеллажам'
      : (() => { const r = ctx.racks.find(x => x.code === rackCode); return r ? r.code + ' · ' + r.station : rackCode; })();

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Движения товара</h1><p>Каждая штука: продажа, приход, сверка — ' + UI.esc(rackName) + '</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="mExport">' + UI.icon('down', 15) + '<span>Выгрузить в CSV</span></button>' +
          '</div>' +
        '</div>' +

        '<section class="kpi-grid six">' +
          kpi('Продано', UI.num(t.soldQty) + '<small> шт</small>') +
          kpi('Выручка', UI.money(t.revenue), '#F2B705') +
          kpi('Себестоимость', UI.money(t.cost), '#8494AC') +
          kpi('Маржа', UI.money(t.margin), t.margin >= 0 ? '#3DDC84' : '#FF5A5F') +
          kpi('Отгружено на точки', '+' + UI.num(t.inQty) + '<small> шт</small>',
            '#3DDC84', t.inSum ? 'на ' + UI.money(t.inSum) : '') +
          kpi('Закуплено', '+' + UI.num(t.buyQty) + '<small> шт</small>',
            '#7C8CF8', t.buySum ? 'на ' + UI.money(t.buySum) : '') +
        '</section>' +

        '<div class="toolbar">' +
          '<div class="filters" id="mPeriod">' +
            PERIODS.map(p => '<button class="chip' + (period === p.key ? ' active' : '') +
              '" data-period="' + p.key + '">' + p.label + '</button>').join('') +
          '</div>' +
          '<span class="divider-v"></span>' +
          '<div class="filters" id="mKind">' +
            KINDS.map(k => '<button class="chip' + (kind === k.key ? ' active' : '') +
              '" data-kind="' + k.key + '">' + k.label + '</button>').join('') +
          '</div>' +
          '<div class="grow"></div>' +
          '<select class="input sm" id="mRack" style="width:auto;min-width:190px">' +
            '<option value="all"' + (rackCode === 'all' ? ' selected' : '') + '>Все стеллажи</option>' +
            ctx.racks.map(r => '<option value="' + UI.esc(r.code) + '"' +
              (rackCode === r.code ? ' selected' : '') + '>' + UI.esc(r.code + ' · ' + r.station) + '</option>').join('') +
          '</select>' +
          '<div class="search">' + UI.icon('search', 15, '#64748B', 1.8) +
            '<input id="mSearch" type="search" placeholder="Товар, артикул, продавец…" value="' + UI.esc(query) + '"></div>' +
        '</div>' +

        (rows.length
          ? '<div class="grid-wrap"><table class="grid"><thead><tr>' +
              '<th>Когда</th><th>Стеллаж</th><th>Товар</th><th>Артикул</th><th>Операция</th>' +
              '<th class="r">Кол-во</th><th class="r">Цена</th><th class="r">Сумма</th>' +
              '<th class="r">Маржа</th><th class="r">Остаток после</th><th>Кто</th>' +
            '</tr></thead><tbody>' + rows.slice(0, 500).map(row).join('') + '</tbody></table></div>' +
            (rows.length > 500
              ? '<p style="margin:0;font-size:12px;color:#64748B">Показаны последние 500 из ' +
                UI.num(rows.length) + '. Сузьте период или выгрузите в CSV.</p>'
              : '<p style="margin:0;font-size:12px;color:#64748B">Записей: ' + UI.num(rows.length) + '</p>')
          : '<div class="empty-state">За выбранный период движений нет. Смените период или фильтр.</div>') +
      '</main>';

    bind(host);
  }

  function kpi(label, value, color, sub) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
      (sub ? '<span style="font-size:11px;color:#64748B">' + UI.esc(sub) + '</span>' : '') + '</div>';
  }

  function row(o) {
    const info = UI.opInfo(o.type);
    const sign = o.cancelled ? 0 : info.sign;
    const qtyTxt = o.qty
      ? (sign > 0 ? '+' + o.qty : sign < 0 ? '−' + o.qty : o.qty + '')
      : '—';
    const qtyCls = o.cancelled ? '' : (sign > 0 ? 'pos' : sign < 0 ? 'neg' : '');
    const isSale = o.type === 'sale' && !o.cancelled;

    return '<tr>' +
      '<td class="num" style="color:#8494AC;white-space:nowrap">' + UI.dateTime(o.created_at) + '</td>' +
      '<td><span class="sku" style="color:' + (o.rack_code ? 'var(--amber)' : '#64748B') + '">' +
        UI.esc(o.rack_code || 'склад') + '</span></td>' +
      '<td><div class="prod"><b' + (o.cancelled ? ' style="text-decoration:line-through;color:#64748B"' : '') + '>' +
        UI.esc(o.item_name || o.note || '—') + '</b>' +
        '<small>' + UI.esc(o.brand || (o.item_name ? '' : o.note) || '') + '</small></div></td>' +
      '<td><span class="sku">' + UI.esc(o.sku || '—') + '</span></td>' +
      '<td><span style="font-size:12px;color:' + info.color + '">' + info.label + '</span>' +
        (o.cancelled ? '<span class="pill sm neutral" style="margin-left:6px">отменено</span>' : '') +
        (o.note && o.item_name ? '<div style="font-size:11px;color:#4B5A75">' + UI.esc(o.note) + '</div>' : '') + '</td>' +
      '<td class="r ' + qtyCls + '">' + qtyTxt + '</td>' +
      '<td class="r" style="color:#64748B">' + (isSale ? UI.num(o.price) : (o.cost ? UI.num(o.cost) : '—')) + '</td>' +
      '<td class="r">' + (o.amount ? UI.num(o.amount) : '—') + '</td>' +
      '<td class="r ' + (o.margin > 0 && !o.cancelled ? 'pos' : '') + '">' +
        (isSale && o.margin ? '+' + UI.num(o.margin) : '—') + '</td>' +
      '<td class="r" style="color:#8494AC">' + (o.qty_after === null || o.qty_after === undefined ? '—' : o.qty_after) + '</td>' +
      '<td style="font-size:12px;color:#8494AC">' + UI.esc(o.user_name || '—') + '</td>' +
    '</tr>';
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const rerender = () => render(host, ctx);

    host.querySelector('#mPeriod').addEventListener('click', (e) => {
      const b = e.target.closest('[data-period]');
      if (!b) return;
      period = Number(b.dataset.period);
      rerender();
    });

    host.querySelector('#mKind').addEventListener('click', (e) => {
      const b = e.target.closest('[data-kind]');
      if (!b) return;
      kind = b.dataset.kind;
      rerender();
    });

    host.querySelector('#mRack').addEventListener('change', (e) => {
      rackCode = e.target.value;
      rerender();
    });

    host.querySelector('#mSearch').addEventListener('input', (e) => {
      query = e.target.value;
      rerender();
      const el = host.querySelector('#mSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });

    host.querySelector('#mExport').addEventListener('click', exportCsv);
  }

  function exportCsv() {
    const rows = list();
    const out = [['Дата', 'Время', 'Стеллаж', 'Товар', 'Фирма', 'Артикул', 'Операция',
      'Знак', 'Кол-во', 'Цена', 'Сумма', 'Маржа', 'Остаток после', 'Кто', 'Комментарий', 'Отменено']];
    rows.forEach(o => {
      const info = UI.opInfo(o.type);
      out.push([
        UI.dateFull(o.created_at), UI.time(o.created_at), o.rack_code || '',
        o.item_name || '', o.brand || '', o.sku || '', info.label,
        o.cancelled ? '' : (info.sign > 0 ? '+' : info.sign < 0 ? '-' : ''),
        o.qty || 0, o.type === 'sale' ? (o.price || 0) : (o.cost || 0),
        o.amount || 0, o.type === 'sale' && !o.cancelled ? (o.margin || 0) : 0,
        o.qty_after === null || o.qty_after === undefined ? '' : o.qty_after,
        o.user_name || '', o.note || '', o.cancelled ? 'да' : ''
      ]);
    });
    UI.downloadFile('dvizheniya-' + UI.today() + '.csv', UI.csv(out));
    UI.toast('Движения выгружены: ' + rows.length + ' записей', 'ok');
  }

  return { render, openFor };
})();


/* ============================================================
   Lube Control — НАСТРОЙКИ
   Меняем значения прямо на экране, видим результат сразу,

window.LC_SETTINGS = (function () {

  ];

  const COLORS = [
    { key: 'amber',  label: 'Фирменный (кнопки, акценты)' },
    { key: 'green',  label: 'Норма, приход, маржа' },
    { key: 'orange', label: 'Низкий остаток, продажа' },
    { key: 'red',    label: 'Пусто, ошибки' },
    { key: 'bg',     label: 'Фон страницы' },

    { key: 'line',   label: 'Границы' }
  ];

  const TEXTS = [
    { key: 'brand',          label: 'Название сервиса' },
    { key: 'adminTitle',     label: 'Заголовок у админа' },
    { key: 'adminSubtitle',  label: 'Подпись у админа' },
    { key: 'sellerTitle',    label: 'Заголовок у продавца' },
    { key: 'sellerSubtitle', label: 'Подпись у продавца' },
    { key: 'sellBtn',        label: 'Кнопка продажи' },
    { key: 'requestBtn',     label: 'Кнопка заявки' },
    { key: 'deliveryBtn',    label: 'Кнопка приёма поставки' },
    { key: 'auditBtn',       label: 'Кнопка сверки' },
    { key: 'shiftOpen',      label: 'Значок смены' },
    { key: 'hint',           label: 'Подсказка продавцу', long: true }
  ];

  /* ---------------- запись правки ---------------- */

  /** Кладёт значение и в живой конфиг, и в сохранённые правки. */
  function set(path, value) {
    const CFG = window.LC_CONFIG;
    const ov = window.LC_OVERRIDES.read();
    const parts = path.split('.');
    let a = CFG, b = ov;
    for (let i = 0; i < parts.length - 1; i++) {
      a = a[parts[i]] = a[parts[i]] || {};
      b = b[parts[i]] = b[parts[i]] || {};
    }
    a[parts[parts.length - 1]] = value;
    b[parts[parts.length - 1]] = value;
    window.LC_OVERRIDES.write(ov);
    window.LC_FLATTEN();
    UI.applyTheme();
  }

  /** Сколько правок сейчас поверх config.js. */
  function changedCount() {
    const flat = (obj, pre) => Object.keys(obj || {}).reduce((acc, k) => {
      const v = obj[k], p = pre ? pre + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v)) return acc.concat(flat(v, p));
      return acc.concat([p]);
    }, []);
    return flat(window.LC_OVERRIDES.read()).length;
  }

  /* ---------------- отрисовка ---------------- */

  function render(host, context) {
    ctx = context;
    const CFG = window.LC_CONFIG;
    const n = changedCount();

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Настройки</h1>' +
            '<p>Крутите значения — экран меняется сразу. Чтобы правки увидели все, ' +
            'скачайте config.js и положите его рядом с index.html.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="sReset">' + UI.icon('undo', 15) +
              '<span>Сбросить правки' + (n ? ' · ' + n : '') + '</span></button>' +
            '<button class="btn btn-primary" id="sDownload">' + UI.icon('down', 15, '#12161F', 2) +
              '<span>Скачать config.js</span></button>' +
          '</div>' +
        '</div>' +

        '<div class="card flat" style="display:flex;gap:12px;align-items:flex-start">' +
          UI.icon('warn', 16, 'var(--amber)') +
          '<div style="font-size:13px;color:#B9C6DA;line-height:1.55">' +
            'Правки из этой панели живут <b>только в вашем браузере</b> — так удобно подбирать значения. ' +
            (window.LC_HAS_FILE
              ? 'Файл config.js подключён: значения из него — база, панель правит их поверх. '
              : 'Файла config.js рядом с index.html <b>сейчас нет</b> — сайт работает на значениях по умолчанию. ') +
            'Подобрали — нажмите «Скачать config.js» и залейте файл в репозиторий: тогда эти значения увидят продавцы. ' +
            'Ключи Supabase применяются после перезагрузки страницы.' +
          '</div>' +
        '</div>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Правила</h2>' +
            '<span style="font-size:12px;color:#64748B">меняется на лету</span></div>' +
          '<div class="set-grid">' + RULES.map(ruleRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Цвета</h2>' +
            '<span style="font-size:12px;color:#64748B">перекрашивает сайт мгновенно</span></div>' +
          '<div class="set-grid">' + COLORS.map(colorRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Категории прайса</h2>' +
            '<span style="font-size:12px;color:#64748B">название и цвет; ключ трогать нельзя</span></div>' +
          '<div class="set-grid">' + CFG.categories.map(catRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Надписи</h2></div>' +
          '<div class="set-grid">' + TEXTS.map(textRow).join('') + '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Общая база (Supabase)</h2>' +
            '<span style="font-size:12px;color:#64748B">применяется после перезагрузки</span></div>' +
          '<div class="set-grid">' +
            textField('supabaseUrl', 'Project URL', CFG.supabaseUrl, 'https://xxxx.supabase.co') +
            textField('supabaseAnonKey', 'anon / public key', CFG.supabaseAnonKey, 'eyJhbGciOi…') +
            textField('emailDomain', 'Домен логинов', CFG.emailDomain, 'lubecontrol.app') +
          '</div>' +
        '</section>' +

        '<section class="stack">' +
          '<div class="section-head"><h2>Данные</h2></div>' +
          '<div class="card flat row" style="gap:12px;flex-wrap:wrap">' +
            '<button class="btn btn-ghost btn-sm" id="sDump">Скачать все данные (JSON)</button>' +
            (STORE.mode === 'demo'
              ? '<button class="btn btn-danger btn-sm" id="sSeed">Очистить все данные</button>'
              : '') +
            '<span style="font-size:12px;color:#64748B">Режим: ' +
              (STORE.mode === 'demo'
                ? 'демо, данные в браузере'
                : 'общая база Supabase — чистить только через панель Supabase') + '</span>' +
          '</div>' +
        '</section>' +
      '</main>';

    bind(host);
  }

  function ruleRow(r) {
    const v = window.LC_CONFIG.rules[r.key];
    return '<div class="set-row" data-rule="' + r.key + '">' +
      '<div class="set-label"><b>' + UI.esc(r.label) + '</b><small>' + UI.esc(r.hint) + '</small></div>' +
      '<div class="set-ctl">' +
        '<input type="range" min="' + r.min + '" max="' + r.max + '" step="' + r.step + '" value="' + v + '">' +
        '<input class="input sm set-num" type="number" min="' + r.min + '" max="' + r.max +
          '" step="' + r.step + '" value="' + v + '">' +
        '<span class="set-unit">' + r.unit + '</span>' +
      '</div>' +
    '</div>';
  }

  function colorRow(c) {
    const v = window.LC_CONFIG.colors[c.key] || '#000000';
    return '<div class="set-row" data-color="' + c.key + '">' +
      '<div class="set-label"><b>' + UI.esc(c.label) + '</b><small>colors.' + c.key + '</small></div>' +
      '<div class="set-ctl">' +
        '<input class="set-swatch" type="color" value="' + v + '">' +
        '<input class="input sm mono set-hex" type="text" value="' + v + '" spellcheck="false">' +
      '</div>' +
    '</div>';
  }

  function catRow(c, i) {
    return '<div class="set-row" data-cat="' + i + '">' +
      '<div class="set-label"><b>' + UI.esc(c.label) + '</b><small>ключ: ' + UI.esc(c.key) + '</small></div>' +
      '<div class="set-ctl">' +
        '<input class="set-swatch" type="color" value="' + c.color + '">' +
        '<input class="input sm set-catname" type="text" value="' + UI.esc(c.label) + '">' +
      '</div>' +
    '</div>';
  }

  function textRow(t) {
    const v = (window.LC_CONFIG.texts || {})[t.key] || '';
    return '<div class="set-row' + (t.long ? ' wide' : '') + '" data-text="' + t.key + '">' +
      '<div class="set-label"><b>' + UI.esc(t.label) + '</b><small>texts.' + t.key + '</small></div>' +
      '<div class="set-ctl">' +
        (t.long
          ? '<textarea class="input sm" rows="3" style="height:auto;padding:10px 12px;resize:vertical">' + UI.esc(v) + '</textarea>'
          : '<input class="input sm" type="text" value="' + UI.esc(v) + '">') +
      '</div>' +
    '</div>';
  }

  function textField(key, label, value, placeholder) {
    return '<div class="set-row wide" data-root="' + key + '">' +
      '<div class="set-label"><b>' + UI.esc(label) + '</b><small>' + key + '</small></div>' +
      '<div class="set-ctl">' +
        '<input class="input sm mono" type="text" value="' + UI.esc(value || '') +
          '" placeholder="' + UI.esc(placeholder) + '" spellcheck="false">' +
      '</div>' +
    '</div>';
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const repaint = () => { if (ctx && ctx.repaint) ctx.repaint(); };

    // правила: ползунок и число ходят парой
    host.querySelectorAll('[data-rule]').forEach(row => {
      const key = row.dataset.rule;
      const range = row.querySelector('input[type=range]');
      const num = row.querySelector('.set-num');
      const apply = (v) => {
        const val = Number(v);
        if (Number.isNaN(val)) return;
        range.value = val; num.value = val;
        set('rules.' + key, val);
        repaint();
      };
      range.addEventListener('input', e => apply(e.target.value));
      num.addEventListener('input', e => apply(e.target.value));
    });

    // цвета
    host.querySelectorAll('[data-color]').forEach(row => {
      const key = row.dataset.color;
      const sw = row.querySelector('.set-swatch');
      const hex = row.querySelector('.set-hex');
      const apply = (v) => {
        if (!/^#[0-9a-f]{6}$/i.test(v)) return;
        sw.value = v; hex.value = v;
        set('colors.' + key, v);
      };
      sw.addEventListener('input', e => apply(e.target.value));
      hex.addEventListener('input', e => apply(e.target.value.trim()));
    });

    // категории
    host.querySelectorAll('[data-cat]').forEach(row => {
      const i = Number(row.dataset.cat);
      const sw = row.querySelector('.set-swatch');
      const name = row.querySelector('.set-catname');
      const push = () => {
        const cats = window.LC_CONFIG.categories.map(c => ({ key: c.key, label: c.label, color: c.color }));
        cats[i] = { key: cats[i].key, label: name.value, color: sw.value };
        set('categories', cats);
        repaint();
      };
      sw.addEventListener('input', push);
      name.addEventListener('input', push);
    });

    // надписи
    host.querySelectorAll('[data-text]').forEach(row => {
      const key = row.dataset.text;
      const el = row.querySelector('input, textarea');
      el.addEventListener('input', () => {
        set('texts.' + key, el.value);
        repaint();
      });
    });

    // ключи Supabase и домен
    host.querySelectorAll('[data-root]').forEach(row => {
      const key = row.dataset.root;
      const el = row.querySelector('input');
      el.addEventListener('change', () => {
        set(key, el.value.trim());
        UI.toast('Сохранено. Ключи применятся после перезагрузки страницы.', 'ok');
      });
    });

    host.querySelector('#sDownload').addEventListener('click', downloadConfig);

    host.querySelector('#sReset').addEventListener('click', async () => {
      const ok = await UI.confirmBox('Сбросить правки панели?',
        'Значения вернутся к тем, что лежат в config.js (или к заводским, если файла нет). ' +
        'Данные о стеллажах и продажах не трогаем.', 'Сбросить', 'btn-danger');
      if (!ok) return;
      window.LC_OVERRIDES.clear();
      location.reload();
    });

    host.querySelector('#sDump').addEventListener('click', () => {
      const dump = {
        exported_at: new Date().toISOString(),
        catalog: ctx.catalog, racks: ctx.racks, purchases: ctx.purchases,
        ops: ctx.ops, requests: ctx.requests
      };
      UI.downloadFile('lube-control-' + UI.today() + '.json', JSON.stringify(dump, null, 2), 'application/json');
      UI.toast('Данные выгружены', 'ok');
    });

    const seed = host.querySelector('#sSeed');
    if (seed) seed.addEventListener('click', async () => {
      const ok = await UI.confirmBox('Очистить все данные?',
        'Прайс, стеллажи, закупки и все движения в этом браузере будут стёрты без возврата. ' +
        'Настройки и аккаунты останутся. Сначала имеет смысл скачать выгрузку в JSON.',
        'Стереть всё', 'btn-danger');
      if (!ok) return;
      STORE.clearAll();
      UI.toast('Данные очищены', 'ok');
      ctx.refresh();
    });
  }

  /* ---------------- готовый config.js ---------------- */

  function downloadConfig() {
    const C = window.LC_CONFIG;
    const q = (s) => "'" + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
    const L = [];

    L.push('/* ============================================================');
    L.push('   Lube Control — настройки сайта.');
    L.push('   Файл лежит рядом с index.html. Правьте прямо тут и заливайте');
    L.push('   в репозиторий — значения увидят все. Если файл удалить,');
    L.push('   сайт продолжит работать на значениях по умолчанию.');
    L.push('   Собрано ' + new Date().toLocaleString('ru-RU') + '');

    L.push('window.LC_CONFIG = {');
    L.push('');
    L.push('  /* ---------- Общая база ---------- */');
    L.push('  supabaseUrl: ' + q(C.supabaseUrl) + ',');
    L.push('  supabaseAnonKey: ' + q(C.supabaseAnonKey) + ',');
    L.push('  emailDomain: ' + q(C.emailDomain) + ',');
    L.push('');
    L.push('  /* ---------- Правила ---------- */');
    L.push('  rules: {');
    RULES.forEach((r, i) => {
      L.push('    ' + r.key + ': ' + C.rules[r.key] + (i < RULES.length - 1 ? ',' : '') +
        '  // ' + r.label.toLowerCase() + ', ' + r.unit);
    });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Цвета ---------- */');
    L.push('  colors: {');
    COLORS.forEach((c, i) => {
      L.push('    ' + c.key + ': ' + q(C.colors[c.key]) + (i < COLORS.length - 1 ? ',' : '') +
        '  // ' + c.label.toLowerCase());
    });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Надписи ---------- */');
    L.push('  texts: {');
    TEXTS.forEach((t, i) => {
      L.push('    ' + t.key + ': ' + q((C.texts || {})[t.key]) + (i < TEXTS.length - 1 ? ',' : ''));
    });
    L.push('  },');
    L.push('');
    L.push('  /* ---------- Категории прайса (ключ менять нельзя) ---------- */');
    L.push('  categories: [');
    C.categories.forEach((c, i) => {
      L.push('    { key: ' + q(c.key) + ', label: ' + q(c.label) + ', color: ' + q(c.color) + ' }' +
        (i < C.categories.length - 1 ? ',' : ''));
    });
    L.push('  ],');
    L.push('');
    L.push('  /* ---------- Способы оплаты закупок ---------- */');
    L.push('  payments: [' + (C.payments || []).map(q).join(', ') + '],');
    L.push('');
    L.push('  /* ---------- Аккаунты ----------');
    L.push('     Пароли работают только в демо-режиме. С Supabase пароль проверяет сервер,');
    L.push('     здесь остаются логин, роль, имя и закреплённый стеллаж. */');
    L.push('  accounts: [');
    C.accounts.forEach((a, i) => {
      L.push('    { login: ' + q(a.login) + ', password: ' + q(a.password || '') +
