        sku: row.sku, type: 'item_add', qty: row.qty, qty_after: row.qty,
        cost: row.cost, price: row.price, amount: row.qty * row.cost,
        user_login: user.login, user_name: user.name, note: 'вместимость ' + row.max });
      localChanged();
      return row;
    }
    const { data: exist, error: e0 } = await sb.from('items').select('id')
      .eq('rack_code', rackCode).eq('catalog_id', cat.id);
    if (e0) throw e0;
    if (exist && exist.length) throw new Error('Эта позиция уже стоит на стеллаже');
    await sbInsert('items', row);
    await logOp({ rack_code: rackCode, item_id: row.id, catalog_id: cat.id, item_name: row.name, brand: row.brand,
      sku: row.sku, type: 'item_add', qty: row.qty, qty_after: row.qty,
      cost: row.cost, price: row.price, amount: row.qty * row.cost,
      user_login: user.login, user_name: user.name, note: 'вместимость ' + row.max });
    return row;
  }

  /** Снять позицию со стеллажа (в прайсе она остаётся). */
  async function removeItem(itemId, user) {
    if (!cloud) {
      const st = readLocal();
      const it = st.items.find(i => i.id === itemId);
      if (!it) throw new Error('Позиция не найдена');
      st.items = st.items.filter(i => i.id !== itemId);
      writeLocal(st);
      await logOp({ rack_code: it.rack_code, item_id: it.id, catalog_id: it.catalog_id || null,
        item_name: it.name, brand: it.brand, sku: it.sku,
        type: 'item_remove', qty: it.qty, qty_after: 0, cost: it.cost || 0, price: it.price || 0,
        amount: it.qty * (it.cost || 0), user_login: user.login, user_name: user.name,
        note: it.qty ? 'остаток ' + it.qty + ' шт вернулся на склад' : '' });
      localChanged();
      return it;
    }
    const { data: it, error: e1 } = await sb.from('items').select('*').eq('id', itemId).single();
    if (e1) throw e1;
    // .select() возвращает удалённые строки: если база молча ничего не удалила
    // (нет прав), мы это увидим, а не покажем ложное «готово».
    const { data: gone, error } = await sb.from('items').delete().eq('id', itemId).select('id');
    if (error) throw (isRls(error) ? rlsError('items') : error);
    if (!gone || !gone.length) {
      throw new Error('База не дала снять позицию. Похоже, у вашей учётки нет роли администратора — ' +
        'выполните fix-v5.sql в Supabase → SQL Editor.');
    }
    await logOp({ rack_code: it.rack_code, item_id: it.id, catalog_id: it.catalog_id || null,
      item_name: it.name, brand: it.brand, sku: it.sku,
      type: 'item_remove', qty: it.qty, qty_after: 0, cost: it.cost || 0, price: it.price || 0,
      amount: it.qty * (it.cost || 0), user_login: user.login, user_name: user.name,
      note: it.qty ? 'остаток ' + it.qty + ' шт вернулся на склад' : '' });
    return it;
  }

  /** Изменить вместимость позиции на стеллаже. */
  async function setMax(itemId, max, user) {
    const value = Math.max(1, Number(max) || 1);
    if (!cloud) {
      const st = readLocal();
      const it = st.items.find(i => i.id === itemId);
      if (!it) throw new Error('Позиция не найдена');
      it.max = value;
      if (it.qty > value) it.qty = value;
      writeLocal(st);
      await logOp({ rack_code: it.rack_code, item_id: it.id, item_name: it.name, brand: it.brand,
        type: 'item_max', qty_after: it.qty, user_login: user.login, user_name: user.name,
        note: 'вместимость ' + value });
      localChanged();
      return it;
    }
    const { data: it, error: e1 } = await sb.from('items').select('*').eq('id', itemId).single();
    if (e1) throw e1;
    const qty = Math.min(it.qty, value);
    await sbUpdate('items', { max: value, qty }, q => q.eq('id', itemId));
    await logOp({ rack_code: it.rack_code, item_id: it.id, item_name: it.name, brand: it.brand,
      type: 'item_max', qty_after: qty, user_login: user.login, user_name: user.name,
      note: 'вместимость ' + value });
    return it;
  }

  /** Отмена продажи: возвращает товар на полку и помечает операцию отменённой. */
  async function cancelOp(opId, user) {
    const all = await getOps({ limit: 300 });
    const op = all.find(o => o.id === opId);
    if (!op) throw new Error('Операция не найдена');
    if (op.type !== 'sale') throw new Error('Отменить можно только продажу');
    if (op.cancelled) throw new Error('Эта продажа уже отменена');
    const ageMin = (Date.now() - new Date(op.created_at).getTime()) / 60000;
    if (ageMin > CFG.cancelWindowMin) throw new Error('Время на отмену истекло');

    await changeQty(op.item_id, op.qty, {
      type: 'cancel', user_login: user.login, user_name: user.name, note: 'отмена продажи', silent: true
    });

    if (!cloud) {
      const st = readLocal();
      const row = st.ops.find(o => o.id === opId);
      if (row) row.cancelled = true;
      writeLocal(st);
      localChanged();
      return;
    }
    await sbUpdate('ops', { cancelled: true }, q => q.eq('id', opId));
  }

  /* ---------------- ручная правка позиции администратором ----------------
     Администратор стоит у стеллажа и приводит полку в порядок:
     добавил штуку, снял штуку, поменял вместимость. Каждое действие
     пишется своим типом — НЕ продажей:
       restock  — поставил со склада (+)
       unload   — снял и увёз на склад (−, склад прибавляется)
       writeoff — списание: брак, протечка, потеря (−)
       audit    — сверка: просто привёл цифру к факту (±)
       sale     — продажа (−), только если админ действительно продал сам */

  const ADJUST_UP = ['restock', 'audit'];
  const ADJUST_DOWN = ['unload', 'writeoff', 'audit', 'sale'];

  async function getItemRow(itemId) {
    if (!cloud) {
      const it = readLocal().items.find(i => i.id === itemId);
      if (!it) throw new Error('Позиция не найдена');
      return it;
    }
    const { data, error } = await sb.from('items').select('*').eq('id', itemId).single();
    if (error) throw error;
    return data;
  }

  /** data: { qty, max, reason, note }. Возвращает { delta, reason }. */
  async function adjustItem(itemId, data, user) {
    const item = await getItemRow(itemId);
    let max = item.max;
    if (data.max !== undefined && Math.max(1, Number(data.max) || 1) !== item.max) {
      await setMax(itemId, data.max, user);
      max = Math.max(1, Number(data.max) || 1);
    }
    const cur = Math.min(item.qty, max);
    const next = Math.max(0, Math.min(max, Math.round(Number(data.qty))));
    if (isNaN(next)) throw new Error('Укажите количество');
    const delta = next - cur;
    if (!delta) { if (!cloud) localChanged(); return { delta: 0, reason: null }; }

    const reason = data.reason || (delta > 0 ? 'restock' : 'unload');
    if ((delta > 0 ? ADJUST_UP : ADJUST_DOWN).indexOf(reason) < 0) throw new Error('Выберите, что произошло с товаром');
    const base = { user_login: user.login, user_name: user.name, note: data.note || '', silent: true };

    if (reason === 'audit') {
      await setQty(itemId, next, Object.assign({}, base, { type: 'audit', note: data.note || 'сверка администратором' }));
    } else {
      await changeQty(itemId, delta, Object.assign({}, base, { type: reason }));
    }
    if (!cloud) localChanged();
    return { delta, reason };
  }

  /* ---------------- загрузка прайса из файла ----------------
     plan = { add: [ {category,name,brand,volume,sku,cost,price, id?} ],
              update: [ { id, patch: {cost, price, ...} } ], file }  */

  async function importCatalog(plan, user) {
    const now = Date.now();
    const add = (plan.add || []).map((d, i) => ({
      id: d.id || uid(),
      category: d.category || 'other',
      name: String(d.name || '').trim(),
      brand: String(d.brand || '').trim(),
      volume: String(d.volume || '').trim(),
      sku: String(d.sku || '').trim(),
      cost: Number(d.cost) || 0,
      price: Number(d.price) || 0,
      archived: false,
      created_at: new Date(now + i).toISOString()
    })).filter(r => r.name);

    const catalog = await getCatalog();
    const byId = {};
    catalog.forEach(c => { byId[c.id] = c; });
    const upd = (plan.update || [])
      .filter(u => byId[u.id])
      .map(u => Object.assign({}, byId[u.id], u.patch));

    if (!add.length && !upd.length) throw new Error('Загружать нечего — всё уже есть в прайсе с теми же ценами');
    const history = priceRows(upd.map(r => ({ old: byId[r.id], cost: r.cost, price: r.price })),
      plan.source || ('загрузка прайса' + (plan.file ? ' · ' + plan.file : '')), user);

    if (!cloud) {
      const st = readLocal();
      add.forEach(r => st.catalog.push(r));
      upd.forEach(r => {
        const c = st.catalog.find(x => x.id === r.id);
        if (!c) return;
        Object.assign(c, r);
        st.items.forEach(i => { if (i.catalog_id === c.id) Object.assign(i, fromCatalog(c)); });
      });
      writeLocal(st);
    } else {
      if (add.length) await sbWriteMany('catalog', add);
      if (upd.length) {
        await sbWriteMany('catalog', upd, true);
        const { data: onRacks } = await sb.from('items').select('id,catalog_id');
        const used = new Set((onRacks || []).map(i => i.catalog_id));
        for (const r of upd) {
          if (!used.has(r.id)) continue;
          const f = fromCatalog(r);
          delete f.catalog_id;
          await sbUpdate('items', f, q => q.eq('catalog_id', r.id));
        }
      }
    }
    await savePriceHistory(history);

    if (!plan.silent) {
      await logOp({ type: 'price_import', user_login: user.login, user_name: user.name,
        qty: add.length + upd.length,
        note: 'добавлено ' + add.length + ', обновлено ' + upd.length + (plan.file ? ' · ' + plan.file : '') });
    }
    if (!cloud && !plan.silent) localChanged();
    return { added: add.length, updated: upd.length };
  }

  /* ---------------- загрузка целой закупки из файла ----------------
     lines = [ { catalog_id | newCat:{...}, qty, cost, price?, supplier?, payment?, date? } ]
     meta  = { date, supplier, payment, updateCost, updatePrice, file }  */

  async function importPurchases(lines, meta, user) {
    const list = (lines || []).filter(l => Number(l.qty) > 0);
    if (!list.length) throw new Error('В файле нет строк с количеством больше нуля');

    // 1. Новые позиции прайса (если в прайсе такого товара не было)
    const toAdd = [];
    list.forEach(l => {
      if (l.catalog_id || !l.newCat) return;
      if (!l.newCat.id) {
        l.newCat.id = uid();
        toAdd.push(l.newCat);
      }
      l.catalog_id = l.newCat.id;
    });

    // 2. Свежие цены в прайс
    const catalogBefore = await getCatalog();
    const byId = {};
    catalogBefore.forEach(c => { byId[c.id] = c; });
    const updMap = {};
    list.forEach(l => {
      const c = byId[l.catalog_id];
      if (!c) return;
      const patch = {};
      if (meta.updateCost && Number(l.cost) > 0 && Number(l.cost) !== Number(c.cost)) patch.cost = Number(l.cost);
      if (meta.updatePrice && Number(l.price) > 0 && Number(l.price) !== Number(c.price)) patch.price = Number(l.price);
      if (Object.keys(patch).length) updMap[c.id] = Object.assign(updMap[c.id] || {}, patch);
    });
    const update = Object.keys(updMap).map(id => ({ id, patch: updMap[id] }));
    let created = 0, updated = 0;
    if (toAdd.length || update.length) {
      const r = await importCatalog({ add: toAdd, update, silent: true,
        source: 'накладная' + (meta.supplier ? ' от ' + meta.supplier : '') + (meta.file ? ' · ' + meta.file : '') }, user);
      created = r.added; updated = r.updated;
    }

    // 3. Строки закупки и движения
    const catalog = await getCatalog();
    const cat = {};
    catalog.forEach(c => { cat[c.id] = c; });
    const t0 = Date.now();
    const purchases = [], ops = [];
    list.forEach((l, i) => {
      const c = cat[l.catalog_id];
      if (!c) return;
      const lineCost = Number(l.cost) > 0 ? Number(l.cost) : Number(c.cost) || 0;
      const lineQty = Math.round(Number(l.qty) || 0);
      const row = purchaseRow({
        date: l.date || meta.date,
        supplier: l.supplier || meta.supplier,
        payment: l.payment || meta.payment,
        note: meta.file ? 'из файла ' + meta.file : '',
        cost: lineCost,
        qty: lineQty,
        // оплата всей накладной: сразу — строка оплачена; в долг или частично — долг, частичная оплата пишется отдельно
        paid: meta.paidMode === 'full' ? lineCost * lineQty : (meta.paidMode ? 0 : undefined),
        created_at: new Date(t0 + i).toISOString()
      }, c, user);
      purchases.push(row);
      ops.push(buildOp({
        type: 'purchase', rack_code: '', catalog_id: c.id,
        item_name: row.name, brand: row.brand, sku: row.sku,
        qty: row.qty, cost: row.cost, price: Number(c.price) || 0, amount: row.amount,
        user_login: user.login, user_name: user.name,
        note: [row.supplier, row.payment].filter(Boolean).join(' · '),
        created_at: row.created_at
      }));
    });
    if (!purchases.length) throw new Error('Не удалось сопоставить ни одной строки с прайсом');

    if (!cloud) {
      const st = readLocal();
      st.purchases = purchases.slice().reverse().concat(st.purchases);
      st.ops = ops.slice().reverse().concat(st.ops).slice(0, 2000);
      writeLocal(st);
      localChanged();
    } else {
      await sbWriteMany('purchases', purchases);
      await sbWriteMany('ops', ops);
    }
    const partAmount = meta.paidMode === 'part' ? Math.max(0, Number(meta.paidAmount) || 0) : 0;
    const partSupplier = meta.supplier || purchases[0].supplier;
    if (partAmount && partSupplier) {
      await addPayment({ supplier: partSupplier, amount: partAmount, date: meta.date || purchases[0].date,
        method: meta.payment || '', note: 'частичная оплата накладной' + (meta.file ? ' · ' + meta.file : '') }, user);
    }
    return {
      lines: purchases.length,
      qty: purchases.reduce((s, p) => s + p.qty, 0),
      sum: purchases.reduce((s, p) => s + p.amount, 0),
      created, updated
    };
  }

  /* ---------------- сотрудники (учётные записи) ----------------
     В общей базе — через функции admin_* из fix-v5.sql: они проверяют,
     что вызывает администратор, и заводят пользователя сразу подтверждённым.
     В демо-режиме — список в этом браузере поверх аккаунтов из config.js. */

  const ACC_KEY = 'lc_accounts_v1';
  function readAccounts() {
    try { return JSON.parse(localStorage.getItem(ACC_KEY)) || []; } catch (e) { return []; }
  }
  function writeAccounts(list) {
    try { localStorage.setItem(ACC_KEY, JSON.stringify(list)); } catch (e) { /* приватный режим */ }
  }
  /** Аккаунты демо-режима: config.js + заведённые на сайте. */
  function localAccounts() {
    const map = {};
    (CFG.accounts || []).forEach(a => { map[a.login.toLowerCase()] = Object.assign({}, a); });
    readAccounts().forEach(a => {
      const k = a.login.toLowerCase();
      if (a.deleted) delete map[k];
      else map[k] = Object.assign({}, map[k] || {}, a);
    });
    return Object.keys(map).map(k => map[k]);
  }
  function patchLocalAccount(login, patch) {
    const l = login.toLowerCase();
    const list = readAccounts().filter(a => a.login.toLowerCase() !== l);
    const was = localAccounts().find(a => a.login.toLowerCase() === l) || { login: l };
    list.push(Object.assign({}, was, patch));
    writeAccounts(list);
  }

  function rpcError(error) {
    if (error.code === 'PGRST202' || /could not find the function/i.test(error.message || '')) {
      return new Error('В базе ещё нет функций для учётных записей. Выполните fix-v5.sql в Supabase → SQL Editor.');
    }
    return new Error(error.message || 'Ошибка базы');
  }
  async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args || {});
    if (error) throw rpcError(error);
    return data;
  }

  // роли: admin — всё; seller — свой стеллаж; courier — сборка и доставка
  const ROLE_OF = (r) => (r === 'admin' || r === 'courier') ? r : 'seller';
  const ROLE_TITLE = { admin: 'Администратор', seller: 'Продавец', courier: 'Курьер' };

  function checkLogin(login) {
    const l = String(login || '').trim().toLowerCase();
    if (!/^[a-z0-9._-]{2,32}$/.test(l)) throw new Error('Логин — латинские буквы, цифры, точка или дефис, от 2 до 32 знаков');
    return l;
  }
  function checkPassword(pw) {
    if (String(pw || '').length < 6) throw new Error('Пароль — не короче 6 знаков');
    return String(pw);
  }

  async function listUsers() {
    if (!cloud) {
      return localAccounts().map(a => ({
        login: a.login, name: a.name, title: a.title || '', role: a.role,
        rack_code: a.rack || null, created_at: null, last_sign_in_at: null
      }));
    }
    return (await rpc('admin_list_users')) || [];
  }

  async function createUser(d, user) {
    const login = checkLogin(d.login);
    const password = checkPassword(d.password);
    const name = String(d.name || '').trim();
    if (!name) throw new Error('Укажите имя сотрудника');
    const role = ROLE_OF(d.role);
    const rack = role === 'seller' ? (d.rack || null) : null;
    const title = String(d.title || '').trim() || ROLE_TITLE[role];

    if (!cloud) {
      if (localAccounts().some(a => a.login.toLowerCase() === login)) throw new Error('Логин «' + login + '» уже занят');
      patchLocalAccount(login, { login, password, role, name, title, rack, deleted: false });
    } else {
      await rpc('admin_create_user', {
        p_login: login, p_password: password, p_name: name, p_role: role, p_rack: rack, p_title: title
      });
    }
    await logOp({ type: 'user_add', user_login: user.login, user_name: user.name,
      note: login + ' · ' + name + (rack ? ' · ' + rack : '') });
    if (!cloud) localChanged();
    return { login, password };
  }

  async function updateUser(login, d, user) {
    const role = ROLE_OF(d.role);
    const name = String(d.name || '').trim();
    if (!name) throw new Error('Укажите имя сотрудника');
    if (login === user.login && role !== 'admin') throw new Error('Себе роль администратора снять нельзя');
    const rack = role === 'seller' ? (d.rack || null) : null;
    const title = String(d.title || '').trim() || ROLE_TITLE[role];
    if (!cloud) patchLocalAccount(login, { role, name, title, rack });
    else await rpc('admin_update_user', { p_login: login, p_name: name, p_title: title, p_role: role, p_rack: rack });
    await logOp({ type: 'user_edit', user_login: user.login, user_name: user.name,
      note: login + ' · ' + name + (rack ? ' · ' + rack : '') });
    if (!cloud) localChanged();
    return true;
  }

  async function setPassword(login, password, user) {
    const pw = checkPassword(password);
    if (!cloud) patchLocalAccount(login, { password: pw });
    else await rpc('admin_set_password', { p_login: login, p_password: pw });
    await logOp({ type: 'user_password', user_login: user.login, user_name: user.name, note: login });
    if (!cloud) localChanged();
    return true;
  }

  async function deleteUser(login, user) {
    if (login === user.login) throw new Error('Свою учётную запись удалить нельзя');
    if (!cloud) patchLocalAccount(login, { deleted: true });
    else await rpc('admin_delete_user', { p_login: login });
    await logOp({ type: 'user_delete', user_login: user.login, user_name: user.name, note: login });
    if (!cloud) localChanged();
    return true;
  }

  /* ---------------- склад для курьера ----------------
     Курьер не видит закупок (там деньги), поэтому склад в штуках
     считает сама база — функция warehouse_stock(). */

  /** Сколько штук каждой позиции прайса лежит в собранных, но не доставленных поставках. */
  function reservedFrom(requests, racks, exceptRack) {
    const cat = {};
    (racks || []).forEach(r => r.items.forEach(i => { cat[i.id] = i.catalog_id; }));
    const out = {};
    (requests || []).forEach(r => {
      if (r.status !== 'packed' || r.rack_code === exceptRack || !Array.isArray(r.packed_items)) return;
      r.packed_items.forEach(x => {
        const cid = x.catalog_id || cat[x.item_id];
        if (cid) out[cid] = (out[cid] || 0) + (Number(x.qty) || 0);
      });
    });
    return out;
  }

  /** { qty: {catalog_id: шт на складе} } */
  async function getStock() {
    if (!cloud) {
      const st = readLocal();
      return { qty: warehouse(st.purchases, st.ops) };
    }
    const { data, error } = await sb.rpc('warehouse_stock');
    if (error) {
      if (error.code === 'PGRST202' || /could not find the function/i.test(error.message || '')) {
        throw new Error('В базе нет функции склада. Выполните fix-v8.sql в Supabase → SQL Editor.');
      }
      throw new Error(error.message);
    }
    const qty = {};
    (data || []).forEach(r => { qty[r.catalog_id] = Number(r.qty) || 0; });
    return { qty };
  }

  /* ---------------- очистка истории ----------------
     what = { purchases, ops, requests, shelves }:
       purchases — все закупки (склад обнулится)
       ops       — весь журнал движений (продажи, пополнения, правки)
       requests  — заявки и отметки «поставка собрана»
       shelves   — обнулить остатки на всех стеллажах (сами стеллажи и позиции остаются)
     Прайс, стеллажи и сотрудники не трогаются никогда. */

  async function wipe(table) {
    const before = await sb.from(table).select('id', { count: 'exact', head: true });
    if (before.error) { if (missingTable(before.error)) return 0; throw before.error; }
    if (!before.count) return 0;
    const { error } = await sb.from(table).delete().not('id', 'is', null);
    if (error) throw (isRls(error) ? rlsError(table) : error);
    const after = await sb.from(table).select('id', { count: 'exact', head: true });
    if (after.count) {
      throw new Error('База не дала очистить «' + table + '» (осталось ' + after.count + ' строк). ' +
        'Выполните fix-v7.sql в Supabase → SQL Editor.');
    }
    return before.count;
  }

  async function clearHistory(what, user) {
    const w = what || {};
    const res = { purchases: 0, ops: 0, requests: 0, shelves: 0 };
    if (!cloud) {
      const st = readLocal();
      if (w.purchases) { res.purchases = st.purchases.length; st.purchases = []; res.payments = (st.payments || []).length; st.payments = []; }
      if (w.ops) { res.ops = st.ops.length; st.ops = []; }
      if (w.requests) { res.requests = st.requests.length; st.requests = []; }
      if (w.shelves) st.items.forEach(i => { if (i.qty) { res.shelves += i.qty; i.qty = 0; } });
      writeLocal(st);
    } else {
      if (w.ops) res.ops = await wipe('ops');
      if (w.purchases) { res.purchases = await wipe('purchases'); res.payments = await wipe('supplier_payments'); }
      if (w.requests) res.requests = await wipe('requests');
      if (w.shelves) {
        const { data: items } = await sb.from('items').select('id,qty').gt('qty', 0);
        res.shelves = (items || []).reduce((s, i) => s + i.qty, 0);
        if ((items || []).length) await sbUpdate('items', { qty: 0 }, q => q.gt('qty', 0));
      }
    }
    const parts = [];
    if (w.purchases) parts.push('закупки: ' + res.purchases + (res.payments ? ', оплаты поставщикам: ' + res.payments : ''));
    if (w.ops) parts.push('движения: ' + res.ops);
    if (w.requests) parts.push('заявки: ' + res.requests);
    if (w.shelves) parts.push('обнулено на полках: ' + res.shelves + ' шт');
    await logOp({ type: 'history_clear', user_login: user.login, user_name: user.name,
      note: 'история очищена — ' + parts.join(', ') });
    if (!cloud) localChanged();
    return res;
  }

  /* ---------------- общие настройки ----------------
     Раньше правки из «Настроек» жили только в браузере администратора:
     он ставил бонус 50 %, а продавцы видели 10 % из config.js.
     Теперь в общей базе настройки лежат в таблице app_settings и действуют у всех. */

  let shared = null;            // null — ещё не загружали или таблицы нет
  let settingsTable = true;
  let saveTimer = null;
  const ROOT_KEYS = ['supabaseUrl', 'supabaseAnonKey', 'emailDomain'];

  function stripRoot(obj) {
    const o = JSON.parse(JSON.stringify(obj || {}));
    ROOT_KEYS.forEach(k => { delete o[k]; });
    return o;
  }

  function saveShared() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      let error = null;
      try {
        const res = await sb.from('app_settings')
          .upsert({ id: 'main', data: shared || {}, updated_at: new Date().toISOString() });
        error = res.error;
        if (error && missingTable(error)) { settingsTable = false; error = new Error('В базе нет таблицы app_settings. Выполните fix-v7.sql.'); }
        else if (error && isRls(error)) error = new Error('База не дала сохранить настройки — нужна роль администратора.');
      } catch (e) { error = e; }
      window.dispatchEvent(new CustomEvent('lc-settings-saved', { detail: { error: error ? (error.message || String(error)) : null } }));
    }, 600);
  }

  /** Загрузить общие настройки. user — если это админ, переносим его старые правки из браузера. */
  async function loadSettings(user) {
    if (!cloud) return;
    try {
      const { data, error } = await sb.from('app_settings').select('data').eq('id', 'main').maybeSingle();
      if (error) { if (missingTable(error)) settingsTable = false; return; }
      shared = (data && data.data) || {};
      const local = stripRoot(window.LC_OVERRIDES.local.read());
      if (user && user.role === 'admin' && !Object.keys(shared).length && Object.keys(local).length) {
        shared = local;               // перенос правок, которые раньше жили только в этом браузере
        saveShared();
      }
      window.LC_REBUILD(shared);
    } catch (e) { /* без общих настроек работаем на config.js */ }
  }

  // В общей базе панель «Настройки» пишет не в браузер, а в app_settings
  if (cloud) {
    const local = window.LC_OVERRIDES;
    window.LC_OVERRIDES = {
      local,
      shared: true,
      read: () => JSON.parse(JSON.stringify(shared || {})),
      write: (obj) => { shared = stripRoot(obj); saveShared(); return true; },
      clear: async () => {
        shared = {};
        clearTimeout(saveTimer);
        await sb.from('app_settings').upsert({ id: 'main', data: {}, updated_at: new Date().toISOString() });
      }
    };
  } else {
    window.LC_OVERRIDES.local = window.LC_OVERRIDES;
  }
  const settingsReady = () => cloud && settingsTable;

  /* ---------------- правка истории (только администратор) ----------------
     Запись журнала можно удалить или исправить. По желанию остаток на полке
     возвращается так, будто этой операции (или её старого количества) не было.
     Сами удаления и правки тоже пишутся в журнал — чтобы было видно, кто и что менял. */

  const EFFECT = { sale: -1, restock: 1, delivery: 1, cancel: 1, unload: -1, writeoff: -1 };

  /** На сколько штук эта запись изменила остаток на полке. */
  function opEffect(o) {
    if (!o || o.cancelled || !o.item_id) return 0;
    if (o.type === 'audit') {
      const m = /излишек \+(\d+)|недостача -(\d+)/.exec(o.note || '');
      if (!m) return 0;
      return m[1] ? Number(m[1]) : -Number(m[2]);
    }
    const sign = EFFECT[o.type];
    return sign ? sign * (Number(o.qty) || 0) : 0;
  }

  /** Сдвинуть остаток позиции без записи в журнал. null — позиции уже нет на стеллаже. */
  async function shiftItem(itemId, delta) {
    if (!delta) return 0;
    if (!cloud) {
      const st = readLocal();
      const it = st.items.find(i => i.id === itemId);
      if (!it) return null;
      const next = Math.max(0, Math.min(it.max, it.qty + delta));
      it.qty = next;
      writeLocal(st);
      return next;
    }
    const { data: it } = await sb.from('items').select('*').eq('id', itemId).maybeSingle();
    if (!it) return null;
    const next = Math.max(0, Math.min(it.max, it.qty + delta));
    await sbUpdate('items', { qty: next }, q => q.eq('id', itemId));
    return next;
  }

  async function findOps(ids) {
    const want = new Set(ids);
    const all = await getOps({ limit: 5000 });
    return all.filter(o => want.has(o.id));
  }

  /** Удалить записи журнала. revert — вернуть остатки на полках. */
  async function deleteOps(ids, revert, user) {
    const list = await findOps(ids || []);
    if (!list.length) throw new Error('Записи не найдены — возможно, их уже удалили');

    let shifted = 0, gone = 0;
    if (revert) {
      for (const o of list) {
        const e = opEffect(o);
        if (!e) continue;
        const r = await shiftItem(o.item_id, -e);
        if (r === null) gone++; else shifted++;
      }
    }

    const idList = list.map(o => o.id);
    if (!cloud) {
      const st = readLocal();
      const del = new Set(idList);
      st.ops = st.ops.filter(o => !del.has(o.id));
      writeLocal(st);
    } else {
      for (let i = 0; i < idList.length; i += 100) {
        const part = idList.slice(i, i + 100);
        const { data, error } = await sb.from('ops').delete().in('id', part).select('id');
        if (error) throw (isRls(error) ? rlsError('ops') : error);
        if ((data || []).length < part.length) {
          throw new Error('База не дала удалить записи журнала. Выполните fix-v6.sql в Supabase → SQL Editor.');
        }
      }
    }

    const names = list.slice(0, 3).map(o => (UI_OP_LABEL(o.type)) + (o.item_name ? ' ' + o.item_name : '') + (o.qty ? ' ' + o.qty + ' шт' : ''));
    await logOp({ type: 'op_delete', user_login: user.login, user_name: user.name, qty: list.length,
      note: 'удалено записей: ' + list.length + ' — ' + names.join('; ') + (list.length > 3 ? '…' : '') +
        (revert && shifted ? ' · остатки возвращены' : '') });
    if (!cloud) localChanged();
    return { count: list.length, shifted, gone };
  }

  /** Исправить запись: количество, цену (у продажи), комментарий. */
  async function editOp(id, data, user) {
    const op = (await findOps([id]))[0];
    if (!op) throw new Error('Запись не найдена');
    const patch = { note: String(data.note == null ? op.note || '' : data.note).trim(), type: op.type };
    const qtyEditable = EFFECT[op.type] && !op.cancelled && op.item_id;
    let shift = 0;

    if (qtyEditable && data.qty !== undefined) {
      const qty = Math.round(Number(data.qty) || 0);
      if (qty < 1) throw new Error('Количество не меньше 1. Если операции не было — удалите запись.');
      const price = op.type === 'sale' && data.price !== undefined ? Math.max(0, Number(data.price) || 0) : Number(op.price) || 0;
      const cost = Number(op.cost) || 0;
      patch.qty = qty;
      patch.price = price;
      patch.amount = qty * (op.type === 'sale' ? price : cost);
      patch.margin = op.type === 'sale' ? qty * (price - cost) : 0;
      if (data.revert) shift = opEffect(Object.assign({}, op, { qty })) - opEffect(op);
    }

    let shifted = null;
    if (shift) shifted = await shiftItem(op.item_id, shift);

    if (!cloud) {
      const st = readLocal();
      const row = st.ops.find(o => o.id === id);
      if (row) Object.assign(row, patch);
      writeLocal(st);
    } else {
      await sbUpdate('ops', patch, q => q.eq('id', id));
    }

    const was = UI_OP_LABEL(op.type) + (op.item_name ? ' ' + op.item_name : '');
    await logOp({ type: 'op_edit', user_login: user.login, user_name: user.name, rack_code: '',
      item_name: op.item_name || '', brand: op.brand || '', sku: op.sku || '',
      note: was + (patch.qty !== undefined && patch.qty !== op.qty ? ' · ' + op.qty + ' → ' + patch.qty + ' шт' : '') +
        (patch.price !== undefined && op.type === 'sale' && patch.price !== Number(op.price) ? ' · цена ' + op.price + ' → ' + patch.price : '') +
        (shift ? ' · полка ' + (shift > 0 ? '+' : '') + shift : '') });
    if (!cloud) localChanged();
    return { shifted, shift };
  }

  // подпись типа операции для журнала (UI-модуль к моменту вызова уже загружен)
  function UI_OP_LABEL(type) {
    return window.LC_UI ? window.LC_UI.opInfo(type).label : type;
  }

  /* ---------------- поставщики и долги ----------------
     Справочник поставщиков: телефон, отсрочка в днях, заметка.
     Ключ — название: оно же записано в закупках. Долг поставщику =
     закупки (сумма − оплачено сразу) − оплаты поставщику. */

  async function getSuppliers() {
    if (!cloud) return (readLocal().suppliers || []).slice().sort((a, b) => a.name.localeCompare(b.name));
    return await sbSelect('suppliers', q => q.order('name'));
  }

  async function saveSupplier(data, oldName, user) {
    const row = {
      name: String(data.name || '').trim(),
      phone: String(data.phone || '').trim(),
      contact: String(data.contact || '').trim(),
      terms_days: Math.max(0, Math.round(Number(data.terms_days) || 0)),
      note: String(data.note || '').trim()
    };
    if (!row.name) throw new Error('Укажите название поставщика');
    const was = String(oldName || '').trim();
    const renamed = was && was !== row.name;

    if (!cloud) {
      const st = readLocal();
      if (renamed && st.suppliers.some(s => s.name === row.name)) throw new Error('Поставщик «' + row.name + '» уже есть');
      const cur = st.suppliers.find(s => s.name === (was || row.name));
      if (cur) Object.assign(cur, row);
      else st.suppliers.push(Object.assign({ created_at: new Date().toISOString() }, row));
      if (renamed) {
        st.purchases.forEach(p => { if (p.supplier === was) p.supplier = row.name; });
        st.payments.forEach(p => { if (p.supplier === was) p.supplier = row.name; });
      }
      writeLocal(st);
      localChanged();
      return row;
    }
    if (renamed) {
      const { data: exists } = await sb.from('suppliers').select('name').eq('name', row.name).maybeSingle();
      if (exists) throw new Error('Поставщик «' + row.name + '» уже есть');
    }
    const res = await sb.from('suppliers').upsert(row, { onConflict: 'name' });
    if (res.error) {
      if (missingTable(res.error)) throw new Error('В базе нет таблицы поставщиков. Выполните fix-v9.sql в Supabase → SQL Editor.');
      if (isRls(res.error)) throw rlsError('suppliers');
      throw res.error;
    }
    if (renamed) {
      await sbUpdate('purchases', { supplier: row.name }, q => q.eq('supplier', was));
      await sbUpdate('supplier_payments', { supplier: row.name }, q => q.eq('supplier', was));
      await sb.from('suppliers').delete().eq('name', was);
    }
    return row;
  }

  async function getPayments() {
    const sortDesc = (a, b) => String(b.date).localeCompare(String(a.date)) ||
      String(b.created_at).localeCompare(String(a.created_at));
    if (!cloud) return (readLocal().payments || []).slice().sort(sortDesc);
    const out = [];
    for (let from = 0; from < 100000; from += 1000) {
      const part = await sbSelect('supplier_payments',
        q => q.order('date', { ascending: false }).order('created_at', { ascending: false }).range(from, from + 999));
      part.forEach(r => out.push(r));
      if (part.length < 1000) break;
    }
    return out;
  }

  /** Оплата поставщику: гасит долг. */
  async function addPayment(data, user) {
    const row = {
      id: uid(),
      date: data.date || new Date().toISOString().slice(0, 10),
      supplier: String(data.supplier || '').trim(),
      amount: Math.round((Number(data.amount) || 0) * 100) / 100,
      method: String(data.method || '').trim(),
      note: String(data.note || '').trim(),
      user_login: user.login, user_name: user.name,
      created_at: new Date().toISOString()
    };
    if (!row.supplier) throw new Error('Выберите поставщика');
    if (!(row.amount > 0)) throw new Error('Сумма оплаты должна быть больше нуля');
    if (!cloud) {
      const st = readLocal();
      st.payments.unshift(row);
      writeLocal(st);
    } else {
      await sbInsert('supplier_payments', row);
    }
    await logOp({ type: 'supplier_pay', item_name: row.supplier, amount: row.amount, user_login: user.login, user_name: user.name,
      note: [row.method, row.note].filter(Boolean).join(' · ') });
    if (!cloud) localChanged();
    return row;
  }

  async function deletePayment(id, user) {
    let p = null;
    if (!cloud) {
      const st = readLocal();
      p = st.payments.find(x => x.id === id) || null;
      st.payments = st.payments.filter(x => x.id !== id);
      writeLocal(st);
    } else {
      const got = await sb.from('supplier_payments').select('*').eq('id', id).maybeSingle();
      p = got.data || null;
      const { error } = await sb.from('supplier_payments').delete().eq('id', id);
      if (error) throw (isRls(error) ? rlsError('supplier_payments') : error);
    }
    if (p) await logOp({ type: 'supplier_pay_del', item_name: p.supplier, amount: p.amount, user_login: user.login, user_name: user.name,
      note: 'оплата от ' + p.date + ' удалена' });
    if (!cloud) localChanged();
  }

  /**
   * Сводка по поставщикам: взято, оплачено сразу, оплачено потом, долг, просрочка.
   * directory — справочник (getSuppliers), purchases, payments.
   */
  function supplierLedger(directory, purchases, payments) {
    const map = {};
    const get = (name) => {
      const k = String(name || '').trim() || 'не указан';
      if (!map[k]) {
        const d = (directory || []).find(s => s.name === k) || {};
        map[k] = { name: k, phone: d.phone || '', contact: d.contact || '', note: d.note || '',
          terms_days: Number(d.terms_days) || 0, inDirectory: !!d.name,
          taken: 0, paidNow: 0, paidLater: 0, lines: 0, lastDate: '', firstDebtDate: '', debt: 0, overdueDays: 0 };
      }
      return map[k];
    };
    (directory || []).forEach(d => get(d.name));
    (purchases || []).forEach(p => {
      const s = get(p.supplier);
      s.taken += Number(p.amount) || 0;
      s.paidNow += paidOf(p);
      s.lines += 1;
      if (String(p.date) > s.lastDate) s.lastDate = String(p.date);
    });
    (payments || []).forEach(p => { get(p.supplier).paidLater += Number(p.amount) || 0; });

    const today = new Date(); today.setHours(0, 0, 0, 0);
    Object.keys(map).forEach(k => {
      const s = map[k];
      s.debt = Math.round((s.taken - s.paidNow - s.paidLater) * 100) / 100;
      if (s.debt > 0.009) {
        // самая старая неоплаченная закупка: гасим долги по порядку дат (сначала старые)
        let pool = s.paidLater;
        const own = (purchases || []).filter(p => (String(p.supplier || '').trim() || 'не указан') === k)
          .slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
        for (const p of own) {
          const owe = (Number(p.amount) || 0) - paidOf(p);
          if (owe <= 0) continue;
          if (pool >= owe) { pool -= owe; continue; }
          s.firstDebtDate = String(p.date);
          break;
        }
        if (s.firstDebtDate && s.terms_days) {
          const due = new Date(s.firstDebtDate + 'T00:00:00');
          due.setDate(due.getDate() + s.terms_days);
          s.dueDate = due.toISOString().slice(0, 10);
          s.overdueDays = Math.max(0, Math.round((today - due) / 864e5));
        }
      }
    });
    return Object.keys(map).map(k => map[k]);
  }

  /* ---------------- чат с администрацией ----------------
     Одна переписка на сотрудника (thread = логин сотрудника) и общий канал
     объявлений (thread = '*'), куда пишет только администратор. */

  const msgListeners = [];
  let msgSub = null;

  function msgChanged() {
    try { localStorage.setItem('lc_msg_ping', String(Date.now())); } catch (e) { /* нет доступа */ }
    msgListeners.forEach(fn => fn());
  }
  window.addEventListener('storage', (e) => {
    if (e.key === 'lc_msg_ping') msgListeners.forEach(fn => fn());
  });

  async function getMessages(user) {
    const asc = (a, b) => String(a.created_at).localeCompare(String(b.created_at));
    if (!cloud) {
      let rows = (readLocal().messages || []).slice();
      if (!user || user.role !== 'admin') {
        rows = rows.filter(m => m.thread === '*' || (user && m.thread === user.login));
      }
      return rows.sort(asc);
    }
    // свежие 3000 сообщений (своих — для сотрудника, всех — для админа; права режет база)
    const out = [];
    for (let from = 0; from < 3000; from += 1000) {
      const part = await sbSelect('messages',
        q => q.order('created_at', { ascending: false }).range(from, from + 999));
      part.forEach(r => out.push(r));
      if (part.length < 1000) break;
    }
    return out.sort(asc);
  }

  async function sendMessage(thread, body, user) {
    const text = String(body || '').trim().slice(0, 4000);
    if (!text) throw new Error('Напишите сообщение');
    const isAdmin = user.role === 'admin';
    const row = {
      id: uid(),
      thread: isAdmin ? String(thread || '') : user.login,
      from_login: user.login,
      from_name: user.name,
      from_admin: isAdmin,
      body: text,
      read_at: null,
      created_at: new Date().toISOString()
    };
    if (!row.thread) throw new Error('Выберите, кому писать');
    if (!cloud) {
      const st = readLocal();
      st.messages.push(row);
      if (st.messages.length > 5000) st.messages = st.messages.slice(-5000);
      writeLocal(st);
      msgChanged();
      return row;
    }
    await sbInsert('messages', row);
    return row;
  }

  async function markMessagesRead(ids) {
    const list = (ids || []).filter(Boolean);
    if (!list.length) return;
    const now = new Date().toISOString();
    if (!cloud) {
      const st = readLocal();
      let n = 0;
      st.messages.forEach(m => { if (list.indexOf(m.id) >= 0 && !m.read_at) { m.read_at = now; n++; } });
      if (n) { writeLocal(st); msgChanged(); }
      return;
    }
    for (let i = 0; i < list.length; i += 100) {
      await sbUpdate('messages', { read_at: now }, q => q.in('id', list.slice(i, i + 100)).is('read_at', null));
    }
  }

  /** Стереть переписку (только администратор). */
  async function clearThread(thread) {
    if (!cloud) {
      const st = readLocal();
      st.messages = st.messages.filter(m => m.thread !== thread);
      writeLocal(st);
      msgChanged();
      return;
    }
    const { error } = await sb.from('messages').delete().eq('thread', thread);
    if (error) throw (isRls(error) ? rlsError('messages') : error);
  }

  /** Подписка только на сообщения — чтобы новое сообщение не перегружало весь экран. */
  function onMessages(fn) {
    msgListeners.push(fn);
    if (cloud && !msgSub) {
      let t = null;
      const bump = () => { clearTimeout(t); t = setTimeout(() => msgListeners.forEach(f => f()), 300); };
      msgSub = sb.channel('lc-messages')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, bump)
        .subscribe();
    }
    return () => {
      const i = msgListeners.indexOf(fn);
      if (i >= 0) msgListeners.splice(i, 1);
    };
  }

  /* ---------------- подписка на изменения ---------------- */

  function onChange(fn) {
    listeners.push(fn);
    if (cloud && !onChange._sub) {
      // при массовых изменениях (загрузка файла, очистка) событий сотни — перерисовываемся один раз
      let t = null;
      const bump = () => { clearTimeout(t); t = setTimeout(() => listeners.forEach(f => f()), 500); };
      onChange._sub = sb.channel('lc-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, bump)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ops' }, bump)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, bump)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'racks' }, bump)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'catalog' }, bump)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'purchases' }, bump)
        .subscribe();
    }
    return () => {
      const i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  /** Стереть всё: прайс, стеллажи, закупки, движения. Только для демо-режима. */
  function clearAll() {
    localStorage.removeItem(LS_KEY);
    readLocal();
    localChanged();
  }

  /**
   * Остаток на складе по каждой позиции прайса:
   * закупили − отгрузили на стеллажи (постановка позиции, пополнение, приём поставки).
   * Возвращает { catalog_id: шт }.
   */
  function warehouse(purchases, ops) {
    const left = {};
    (purchases || []).forEach(p => {
      if (!p.catalog_id) return;
      left[p.catalog_id] = (left[p.catalog_id] || 0) + (Number(p.qty) || 0);
    });
    (ops || []).forEach(o => {
      if (!o.catalog_id) return;
      if (o.type === 'restock' || o.type === 'delivery' || o.type === 'item_add') {
        left[o.catalog_id] = (left[o.catalog_id] || 0) - (Number(o.qty) || 0);
      }
      // снятое со стеллажа возвращается на склад
      if (o.type === 'unload' || o.type === 'item_remove') {
        left[o.catalog_id] = (left[o.catalog_id] || 0) + (Number(o.qty) || 0);
      }
    });
    return left;
  }

  window.LC_STORE = {
    mode: cloud ? 'cloud' : 'demo',
    cloud, sb,
    getRacks, getRack, getOps, getRequests,
    getCatalog, addCatalogItem, updateCatalogItem, archiveCatalogItem, deleteCatalogItem,
    getPurchases, addPurchase, updatePurchase, deletePurchase, warehouse,
    changeQty, setQty, restock, restockAll, logOp,

    addRack, updateRack, addItem, removeItem, setMax, cancelOp,

    getMessages, sendMessage, markMessagesRead, clearThread, onMessages,
    listUsers, createUser, updateUser, setPassword, deleteUser, localAccounts,
    onChange, clearAll, resetDemo: clearAll, uid
  };
})();

  /* ---------------- модальные окна ---------------- */

  function modal(opts) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      const actions = (opts.actions || [{ label: 'Закрыть', value: null }]).map((a, i) =>
        '<button class="btn ' + (a.kind || 'btn-ghost') + '" data-act="' + i + '">' + esc(a.label) + '</button>'
      ).join('');

      back.innerHTML =
        '<div class="modal' + (opts.wide ? ' wide' : '') + (opts.cls ? ' ' + opts.cls : '') + '" role="dialog" aria-modal="true">' +
          '<div class="modal-head">' +
            '<div><h3>' + esc(opts.title || '') + '</h3>' +
            (opts.subtitle ? '<p>' + esc(opts.subtitle) + '</p>' : '') + '</div>' +
            '<button class="icon-btn" data-close aria-label="Закрыть">' + icon('close', 16) + '</button>' +
          '</div>' +
          '<div class="modal-body">' + (opts.body || '') + '</div>' +
          (actions ? '<div class="modal-foot">' + actions + '</div>' : '') +
        '</div>';

      function close(val) {
        document.removeEventListener('keydown', onKey);
        back.remove();
        resolve(val);
      }
      function onKey(e) { if (e.key === 'Escape') close(null); }

      back.addEventListener('click', (e) => {
        if (e.target === back) close(null);
        if (e.target.closest('[data-close]')) close(null);
        const btn = e.target.closest('[data-act]');
        if (btn && back.contains(btn)) {
          const a = (opts.actions || [])[Number(btn.dataset.act)];
          if (a && a.onClick) {
            const res = a.onClick(back.querySelector('.modal'));
            if (res === false) return;      // валидация не прошла
            close(res === undefined ? a.value : res);
          } else {
            close(a ? a.value : null);
          }
        }
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(back);
      if (opts.onOpen) opts.onOpen(back.querySelector('.modal'), close);
      const first = back.querySelector('input:not([type=hidden]), select, textarea');
      if (first && !opts.noFocus) setTimeout(() => first.focus(), 40);
    });
  }

  /* ---------------- счётчик «по одной штуке» ---------------- */

  /** Разметка счётчика. data-stepper — id строки, max — потолок. */
  function stepper(id, value, max, plus) {
    return '<div class="stepper' + (plus ? ' plus' : '') + '" data-stepper="' + esc(id) + '" data-max="' + max + '">' +
      '<button type="button" data-step="-1" aria-label="Меньше">' + icon('minus', 15) + '</button>' +
      '<input type="number" inputmode="numeric" value="' + value + '" min="0" max="' + max + '" aria-label="Количество">' +
      '<button type="button" data-step="1" aria-label="Больше">' + icon('plus', 15) + '</button>' +
    '</div>';
  }

  /** Вешает обработчики −/+ на все счётчики внутри root. onChange() — после каждого изменения. */
  function bindSteppers(root, onChange) {
    const clamp = (box) => {
      const inp = box.querySelector('input');
      const max = Number(box.dataset.max);
      let v = Math.round(Number(inp.value) || 0);
      if (v < 0) v = 0;
      if (v > max) v = max;
      inp.value = v;
      box.querySelector('[data-step="-1"]').disabled = v <= 0;
      box.querySelector('[data-step="1"]').disabled = v >= max;
      return v;
    };
    root.querySelectorAll('[data-stepper]').forEach(clamp);
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-step]');
      if (!b) return;
      const box = b.closest('[data-stepper]');
      const inp = box.querySelector('input');
      inp.value = (Number(inp.value) || 0) + Number(b.dataset.step);
      clamp(box);
      if (onChange) onChange();
    });
    root.addEventListener('input', (e) => {
      const box = e.target.closest('[data-stepper]');
      if (!box) return;
      clamp(box);
      if (onChange) onChange();
    });
  }

  function stepperValues(root) {
    const out = {};
    root.querySelectorAll('[data-stepper]').forEach(box => {
      out[box.dataset.stepper] = Math.round(Number(box.querySelector('input').value) || 0);
    });
    return out;
  }

  /** Красит сайт по CFG.colors и подставляет надписи. Зовётся при старте и после правок. */
  function applyTheme() {
    const root = document.documentElement.style;
    const c = CFG.colors || {};
    const map = {
      '--amber': c.amber, '--green': c.green, '--orange': c.orange, '--red': c.red,
      '--bg': c.bg, '--card': c.card, '--line': c.line
    };
    Object.keys(map).forEach(k => { if (map[k]) root.setProperty(k, map[k]); });
    if (c.amber) root.setProperty('--amber-2', lighten(c.amber, 14));

    const brand = (CFG.texts && CFG.texts.brand) || 'Lube Control';
    document.querySelectorAll('#brandName, [data-brand]').forEach(el => { el.textContent = brand; });
    if (!document.title || /Lube Control|—/.test(document.title)) {
      const tail = document.title.split('—')[0].trim();
      document.title = tail && tail !== document.title ? tail + ' — ' + brand : brand;
    }
  }

  function lighten(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const up = (v) => Math.min(255, Math.round(v + (255 - v) * amount / 100));
    const r = up((n >> 16) & 255), g = up((n >> 8) & 255), b = up(n & 255);
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* ---------------- фото стеллажа ---------------- */

  /** Ужимает выбранный файл до ширины maxW и возвращает data:image/jpeg. */
  function compressImage(file, maxW, quality) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error('Файл не выбран'));
      if (!/^image\//.test(file.type)) return reject(new Error('Это не картинка'));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Не удалось открыть картинку'));
        img.onload = () => {
          const w = Math.min(img.width, maxW || 900);
          const h = Math.round(img.height * (w / img.width));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const g = cv.getContext('2d');
          g.fillStyle = '#0E1626';
          g.fillRect(0, 0, w, h);
          g.drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', Math.min(0.95, Math.max(0.3, (quality || 72) / 100))));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /**
   * Остаток квадратиками: сколько стоит на полке — цветные,
   * сколько не хватает до полного стеллажа — серые.
   * При большой вместимости квадратики мельчают, чтобы не расползались.
   */
  function pips(item) {
    const st = itemStatus(item);
    const max = Math.max(0, Number(item.max) || 0);
    const qty = Math.max(0, Math.min(max, Number(item.qty) || 0));
    const dense = max > 24;
    const cells = [];
    for (let i = 0; i < max; i++) cells.push('<i' + (i < qty ? ' class="on"' : '') + '></i>');
    return '<div class="pips ' + st + (dense ? ' dense' : '') +
      '" title="' + qty + ' из ' + max + ' шт">' + cells.join('') + '</div>';
  }

  /* ---------------- связь с администрацией ----------------

     целиком или коротко: @логин, номер телефона — ссылку соберём сами. */

  const CONTACT_KINDS = [
    { key: 'telegram', label: 'Telegram',  icon: 'send',        color: '#2AABEE', hint: '@логин, номер телефона или ссылка t.me/…' },
    { key: 'max',      label: 'MAX',       icon: 'bubble',      color: '#8C6CFF', hint: 'ссылка на профиль или чат из приложения MAX' },
    { key: 'whatsapp', label: 'WhatsApp',  icon: 'bubbleRound', color: '#25D366', hint: 'номер телефона или ссылка wa.me/…' },
    { key: 'vk',       label: 'ВКонтакте', icon: 'community',   color: '#2787F5', hint: 'короткое имя страницы или ссылка vk.com/…' },
    { key: 'viber',    label: 'Viber',     icon: 'phoneWave',   color: '#7360F2', hint: 'номер телефона' },
    { key: 'phone',    label: 'Позвонить', icon: 'phone',       color: '#F2B705', hint: 'номер для звонка' }
  ];

  function phoneDigits(v) {
    let d = String(v || '').replace(/\D/g, '');
    if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
    if (d.length === 10) d = '7' + d;
    return d;
  }

  /** Готовая ссылка для кнопки. '' — если вписано что-то непонятное. */
  function contactHref(kind, raw) {
    const v = String(raw || '').trim();
    if (!v) return '';
    const hasScheme = /^[a-z][a-z0-9+.-]*:/i.test(v);
    const looksUrl = hasScheme || /^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(v);
    const url = (u) => /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u.replace(/^\/+/, '');
    const isPhone = /^[+\d][\d\s()-]{8,}$/.test(v) && phoneDigits(v).length >= 10;
    if (kind === 'phone') return isPhone ? 'tel:+' + phoneDigits(v) : (hasScheme ? v : '');
    if (kind === 'viber') return hasScheme ? v : (isPhone ? 'viber://chat?number=%2B' + phoneDigits(v) : '');
    if (looksUrl) return url(v);
    if (kind === 'telegram') return isPhone ? 'https://t.me/+' + phoneDigits(v) : 'https://t.me/' + v.replace(/^@/, '');
    if (kind === 'whatsapp') return isPhone ? 'https://wa.me/' + phoneDigits(v) : '';
    if (kind === 'vk') return 'https://vk.com/' + v.replace(/^@/, '');
    if (kind === 'max') return 'https://max.ru/' + v.replace(/^@/, '');
    return '';
  }

  /** Что показать под названием: @логин, номер. */
  function contactShort(kind, raw) {
    const v = String(raw || '').trim();
    if (!v) return '';
    if (/^[+\d][\d\s()-]{8,}$/.test(v)) return '+' + phoneDigits(v);
    const m = /(?:t\.me|vk\.com|max\.ru|wa\.me)\/([^?#]+)/i.exec(v);
    if (m) {
      const last = m[1].replace(/\/+$/, '').split('/').pop().replace(/^\+/, '');
      if (kind === 'whatsapp') return '+' + last;
      return last.length > 18 ? 'открыть' : '@' + last;
    }
    if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.length > 28) return 'открыть';
    return v.charAt(0) === '@' ? v : '@' + v;
  }

  /** Заполненные контакты: [{ key, label, icon, color, href, short }]. */
  function contactList() {
    const c = CFG.contacts || {};
    return CONTACT_KINDS.map(k => Object.assign({}, k, { href: contactHref(k.key, c[k.key]), short: contactShort(k.key, c[k.key]) }))
      .filter(k => k.href);
  }

  function contactButton(k) {
    const ext = /^https?:/i.test(k.href);
    return '<a class="contact-btn" href="' + esc(k.href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') +
      ' style="--c:' + k.color + '">' +
      '<span class="contact-ic">' + icon(k.icon, 20, k.color, 1.8) + '</span>' +
      '<span class="contact-t"><b>' + esc(k.label) + '</b><small>' + esc(k.short) + '</small></span></a>';
  }

  /**
   * Карточка «Связь с администратором» для продавца и курьера.
   * chat — показать кнопку внутреннего чата; unread — сколько непрочитанных.
   */
  function contactsCard(opts) {
    const o = opts || {};
    const list = contactList();
    const title = (CFG.contacts && CFG.contacts.title) || 'Связь с администратором';
    if (!list.length && !o.chat) return '';
    return '<section class="card stack-sm contacts-card" style="gap:12px">' +
      '<span class="display" style="font-size:14px;font-weight:600">' + esc(title) + '</span>' +
      (o.chat
        ? '<button class="btn btn-primary btn-block" data-open-chat>' + icon('chat', 16, '#12161F', 2) +
            '<span>Написать в чат</span>' + (o.unread ? '<span class="badge">' + o.unread + '</span>' : '') + '</button>'
        : '') +
      (list.length ? '<div class="contact-grid">' + list.map(contactButton).join('') + '</div>' : '') +
    '</section>';
  }

  window.LC_UI = {
    combo, CONTACT_KINDS, contactHref, contactShort, contactList, contactsCard,
    icon, esc, money, num, time, dateShort, dateTime, dateFull, ago, csv, csvCell, today,
    itemStatus, itemPct, rackStatus, bar, pips, field,
    catOf, catBadge, opInfo, OPS,
    STATUS_LABEL, RACK_LABEL, ITEM_LABEL,
    toast, modal, confirmBox, renderTopbar, modeBanner, downloadFile,
    stepper, bindSteppers, stepperValues,
    applyTheme, lighten, compressImage, photoSize, photoModal
  };
})();



/* ============================================================
   Lube Control — вход и сессия
   ============================================================ */

(function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const SESSION_KEY = 'lc_session_v1';

  const findAccount = (login) => {
    const list = STORE.cloud ? (CFG.accounts || []) : STORE.localAccounts();
    return list.find(a => a.login.toLowerCase() === String(login || '').trim().toLowerCase()) || null;
  };

  const emailOf = (login) => login.toLowerCase() + '@' + CFG.emailDomain;

  function profileFrom(acc, extra) {
    return {
      login: acc.login,
      role: (extra && extra.role) || acc.role,
      rack: (extra && extra.rack_code) || acc.rack || null,
      name: (extra && extra.name) || acc.name,
      title: (extra && extra.title) || acc.title || (acc.role === 'admin' ? 'Администратор' : 'Продавец')
    };
  }

  function saveLocalSession(user) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) { /* нет доступа */ }
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) { /* нет доступа */ }
  }
  function readLocalSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function clearLocalSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* нет доступа */ }
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* нет доступа */ }
  }

  /**
   * Не даём запросу к базе висеть вечно: если сети нет или ключи чужие,
   * человек должен увидеть внятную надпись, а не крутящийся кружок.
   */
  function withTimeout(promise, ms, what) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(
        () => reject(new Error('База не ответила за ' + Math.round(ms / 1000) + ' с (' + what + '). ' +
          'Проверьте supabaseUrl и ключ в config.js и доступ к сети.')), ms))
    ]);
  }

  /** Вход. Возвращает профиль пользователя либо бросает ошибку с понятным текстом. */
  async function signIn(login, password) {
    const acc = findAccount(login);

    if (!STORE.cloud) {
      if (!acc || acc.password !== password) throw new Error('Неверный логин или пароль');
      const user = profileFrom(acc);
      saveLocalSession(user);
      return user;
    }

    const { data, error } = await withTimeout(STORE.sb.auth.signInWithPassword({
      email: emailOf(String(login || '').trim()),
      password: password
    }), 20000, 'вход');
    if (error) {
      if (/invalid login/i.test(error.message)) throw new Error('Неверный логин или пароль');
      if (/email not confirmed/i.test(error.message)) {
        throw new Error('Пользователь не подтверждён. В Supabase → Authentication → Users ' +
          'откройте его и включите Auto Confirm User.');
      }
      if (/failed to fetch|networkerror/i.test(error.message)) {
        throw new Error('Не достучались до базы. Проверьте supabaseUrl в config.js и интернет.');
      }
      throw new Error(error.message);
    }

    let profile = null;
    try {
      const res = await withTimeout(
        STORE.sb.from('profiles').select('*').eq('id', data.user.id).single(), 15000, 'профиль');
      profile = res.data;
    } catch (e) { /* профиля может не быть — возьмём данные из конфига */ }

    if (!acc && !profile) throw new Error('Пользователь не заведён в системе');
    const user = profileFrom(acc || { login: login, role: 'seller', name: login, rack: null }, profile);
    // без строки в profiles база не поймёт, кто это, и откажет в любой записи (RLS)
    user.noProfile = !profile;
    saveLocalSession(user);
    return user;
  }

  /** Текущий пользователь или null. */
  async function current() {
    if (!STORE.cloud) return readLocalSession();
    const { data } = await withTimeout(STORE.sb.auth.getSession(), 15000, 'сессия');
    if (!data || !data.session) { clearLocalSession(); return null; }
    const cached = readLocalSession();
    const login = (data.session.user.email || '').split('@')[0];
    const acc = findAccount(login);
    // Профиль перечитываем при каждом открытии: админ мог сменить сотруднику
    // стеллаж или роль. Если база не ответила — работаем по сохранённому.
    let profile = null, failed = false;
    try {
      const res = await withTimeout(
        STORE.sb.from('profiles').select('*').eq('id', data.session.user.id).maybeSingle(), 8000, 'профиль');
      if (res.error) failed = true;
      profile = res.data;
    } catch (e) { failed = true; }
    if (failed && cached) return cached;
    if (!acc && !profile) return null;
    const user = profileFrom(acc || { login, role: 'seller', name: login, rack: null }, profile);
    user.noProfile = !profile;
    saveLocalSession(user);
    return user;
  }

  async function signOut() {
    clearLocalSession();
    if (STORE.cloud) { try { await STORE.sb.auth.signOut(); } catch (e) { /* уже вышли */ } }
    location.reload();
  }

  window.LC_AUTH = { signIn, current, signOut, findAccount, emailOf, withTimeout };
})();



/* ============================================================
   Lube Control — панель администратора
   Три страницы: «Стеллажи», «Прайс», «Движения товара».

window.LC_ADMIN = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;
  const $ = (id) => document.getElementById(id);

  const ctx = {
    user: null,
    racks: [], ops: [], requests: [], catalog: [], purchases: [],
    suppliers: [], payments: [], priceHistory: [],
    chatUnread: 0,
    page: 'racks'
  };

  let filter = 'all';
  let query = '';

  /* ---------------- списки для выпадающих полей ---------------- */

  const postOptions = () => ['пост 1', 'пост 2', 'пост 3', 'касса', 'склад', 'у входа']
    .concat(ctx.racks.map(r => r.post));
  const operatorOptions = () => ctx.racks.map(r => r.operator)
    .concat((CFG.accounts || []).filter(a => a.role !== 'admin' && a.role !== 'courier').map(a => a.name))
    .concat(ctx.ops.filter(o => o.type === 'sale' && o.user_name).map(o => o.user_name));

  /* ---------------- загрузка ---------------- */

  async function load() {
    // журнал целиком: по нему считается склад и деньги (Supabase отдаём страницами)
    // поставщики, оплаты и история цен появились в версии 9: если fix-v9.sql
    // ещё не выполнен, эти списки просто пустые — остальное работает
    const soft = (p) => p.catch(() => []);
    const [racks, ops, requests, catalog, purchases, suppliers, payments, priceHistory] = await Promise.all([
      STORE.getRacks(),
      STORE.getOps({ limit: 50000 }),
      STORE.getRequests(true),
      STORE.getCatalog(),
      STORE.getPurchases(),
      soft(STORE.getSuppliers()),
      soft(STORE.getPayments()),
      soft(STORE.getPriceHistory())
    ]);
    ctx.racks = racks; ctx.ops = ops; ctx.requests = requests;
    ctx.catalog = catalog; ctx.purchases = purchases;
    ctx.suppliers = suppliers; ctx.payments = payments; ctx.priceHistory = priceHistory;

    // админ открыл панель — значит, заявки он увидел; продавцу это покажется сразу
    const fresh = requests.filter(r => !r.seen_at).map(r => r.id);
    if (fresh.length) {
      try {
        await STORE.markRequestsSeen(fresh);
        ctx.requests = await STORE.getRequests(true);
      } catch (e) { /* не критично */ }
    }
  }

  async function refresh() {
    try {
      await load();
      renderPage();
    } catch (err) {
      UI.toast('Не удалось обновить данные: ' + err.message, 'err');
    }
  }
  ctx.refresh = refresh;

  /** Выполнить действие, обновить экран, показать сообщение. */
  async function act(fn, okText) {
    try {
      const res = await fn();
      await load();
      renderPage();
      if (okText) UI.toast(typeof okText === 'function' ? okText(res) : okText, 'ok');
      return res;
    } catch (err) {
      UI.toast(err.message || 'Не получилось', 'err');
      throw err;
    }
  }
  ctx.act = (fn, okText) => act(fn, okText).catch(() => {});

  /* ---------------- расчёты ---------------- */

  const allItems = () => ctx.racks.reduce((acc, r) => acc.concat(r.items), []);
  const sales = () => ctx.ops.filter(o => o.type === 'sale' && !o.cancelled);

  function salesSince(days) {
    const from = Date.now() - days * 864e5;
    return sales().filter(o => new Date(o.created_at).getTime() >= from);
  }

  function visibleRacks() {
    const q = query.trim().toLowerCase();
    return ctx.racks.filter(r => {
      if (filter !== 'all' && UI.rackStatus(r) !== filter) return false;
      if (!q) return true;
      return (r.code + ' ' + r.station + ' ' + (r.address || '') + ' ' + (r.operator || ''))
        .toLowerCase().includes(q);
    });
  }
  ctx.salesSince = salesSince;

  /* ---------------- роутер ---------------- */

  function go(page) {
    ctx.page = page;
    renderTopbar();
    renderPage();
    window.scrollTo({ top: 0 });
  }

  const navItems = () => [
    { key: 'racks', label: 'Стеллажи', active: ctx.page === 'racks' },
    { key: 'money', label: 'Деньги', active: ctx.page === 'money' },
    { key: 'price', label: 'Прайс', active: ctx.page === 'price' },
    { key: 'buys', label: 'Закупки', active: ctx.page === 'buys' },
    { key: 'moves', label: 'Движения', active: ctx.page === 'moves' },
    { key: 'chat', label: 'Чат', active: ctx.page === 'chat', badge: ctx.chatUnread || 0 },
    { key: 'users', label: 'Сотрудники', active: ctx.page === 'users' },
    { key: 'settings', label: 'Настройки', active: ctx.page === 'settings' }
  ];

  function renderTopbar() {
    UI.renderTopbar($('topbar'), ctx.user, {
      nav: navItems()
    });
    bindTopbar();
  }

  function bindTopbar() {
    // шапка перерисовывается при каждом переходе — обработчик клика вешаем один раз
    if (!$('topbar').dataset.navBound) {
      $('topbar').dataset.navBound = '1';
      $('topbar').addEventListener('click', (e) => {
        const b = e.target.closest('[data-nav]');
        if (b) go(b.dataset.nav);
      });
    }
    const sel = $('topbar').querySelector('[data-nav-select]');
    if (sel) sel.addEventListener('change', (e) => go(e.target.value));
  }

  function renderPage() {
    if (ctx.page === 'price') { window.LC_PRICE.render($('view'), ctx); return; }
    if (ctx.page === 'buys') { window.LC_BUYS.render($('view'), ctx); return; }
    if (ctx.page === 'moves') { window.LC_MOVES.render($('view'), ctx); return; }
    if (ctx.page === 'users') { window.LC_USERS.render($('view'), ctx); return; }
    if (ctx.page === 'money') { window.LC_MONEY.render($('view'), ctx); return; }
    if (ctx.page === 'settings') { window.LC_SETTINGS.render($('view'), ctx); return; }
    if (ctx.page === 'chat') { window.LC_CHAT.renderAdmin($('view'), ctx); return; }
    renderRacksPage();
  }

  /** Перерисовать текущий экран, не трогая настройки самой панели. */
  ctx.repaint = () => {
    UI.renderTopbar($('topbar'), ctx.user, {
      nav: navItems()
    });
    bindTopbar();
    if (ctx.page === 'racks') { $('view').innerHTML = ''; renderRacksPage(); }
  };

  /* ---------------- страница «Стеллажи» ---------------- */

  const racksTemplate = () =>
    '<main class="page">' +
      '<div class="page-head">' +
        '<div><h1>' + UI.esc(CFG.texts.adminTitle) + '</h1><p id="subLine">' +
          UI.esc(CFG.texts.adminSubtitle) + '</p></div>' +
        '<div class="page-actions">' +
          '<button class="btn btn-ghost" id="btnExport"></button>' +
          '<button class="btn btn-primary" id="btnAddRack"></button>' +
        '</div>' +
      '</div>' +
      '<section class="kpi-grid five" id="kpis"></section>' +
      '<div class="split">' +
        '<div class="stack" id="leftCol">' +
          '<div class="section-head">' +
            '<h2>Точки</h2>' +
            '<div class="row" style="gap:10px;flex-wrap:wrap">' +
              '<div class="search"><span id="searchIcon"></span>' +
              '<input id="search" type="search" placeholder="СТО, адрес или код…" aria-label="Поиск по стеллажам"></div>' +
              '<div class="filters" id="filters"></div>' +
            '</div>' +
          '</div>' +
          '<div class="stack" id="racks"></div>' +
        '</div>' +
        '<aside class="stack" id="rightCol"></aside>' +
      '</div>' +
    '</main>';

  function renderRacksPage() {
    const host = $('view');
    if (!host.querySelector('#racks')) {
      host.innerHTML = racksTemplate();
      bindRacksPage();
    }
    renderKpis();
    renderFilters();
    renderRacks();
    renderRight();
    const s = $('search');
    if (s && s.value !== query) s.value = query;
    $('subLine').textContent = CFG.texts.adminSubtitle + ' · обновлено ' +
      new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function renderKpis() {
    const items = allItems();
    const total = items.reduce((s, i) => s + i.qty, 0);
    const lowRacks = ctx.racks.filter(r => UI.rackStatus(r) === 'low').length;
    const emptyItems = items.filter(i => i.qty <= 0).length;
    const emptyRacks = new Set(items.filter(i => i.qty <= 0).map(i => i.rack_code)).size;
    const okRacks = ctx.racks.filter(r => UI.rackStatus(r) === 'ok').length;
    const week = salesSince(7);
    const weekQty = week.reduce((s, o) => s + o.qty, 0);

    const left = STORE.warehouse(ctx.purchases, ctx.ops);
    const byId = {};
    (ctx.catalog || []).forEach(c => { byId[c.id] = c; });
    let whQty = 0, whSum = 0;
    Object.keys(left).forEach(id => {
      const n = left[id];
      if (n > 0) { whQty += n; whSum += n * (Number((byId[id] || {}).cost) || 0); }
    });

    $('kpis').innerHTML = [
      card('Стеллажей в норме', okRacks + '<small> / ' + ctx.racks.length + '</small>', '', spark()),
      card('Общий остаток', UI.num(total) + '<small> шт</small>',
        '<span style="font-size:12px;color:#64748B">продано за 7 дней: ' + UI.num(weekQty) + ' шт</span>'),
      card('Требуют пополнения', String(lowRacks + ctx.requests.length), '', UI.icon('warn', 22, '#FFA726', 1.6), 'warn', '#FFA726'),
      card('Пустые позиции', String(emptyItems),
        '<span style="font-size:12px;color:#64748B">на ' + emptyRacks + ' СТО</span>', '', 'danger', '#FF5A5F'),
      card('На складе', UI.num(whQty) + '<small> шт</small>',
        '<span style="font-size:12px;color:#64748B">' + (whSum ? UI.money(whSum) : 'закупок нет') + '</span>')
    ].join('');
  }

  function card(label, value, sub, right, cls, color) {
    return '<div class="card kpi ' + (cls || '') + '">' +
      '<span class="label">' + label + '</span>' +
      '<div class="row" style="align-items:flex-end;justify-content:space-between;gap:10px">' +
        '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span>' +
        (right || sub || '') +
      '</div></div>';
  }

  function spark() {
    const days = [6, 5, 4, 3, 2, 1, 0].map(d => {
      const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - d);
      const to = new Date(from); to.setDate(to.getDate() + 1);
      return sales().filter(o => {
        const t = new Date(o.created_at).getTime();
        return t >= from.getTime() && t < to.getTime();
      }).reduce((s, o) => s + o.qty, 0);
    });
    const max = Math.max(1, ...days);
    return '<div style="display:flex;align-items:flex-end;gap:3px;height:26px">' +
      days.map((v, i) => '<div style="width:6px;height:' + Math.max(3, Math.round(v / max * 26)) +
        'px;background:' + (i === 6 ? '#3DDC84' : '#26543D') + ';border-radius:2px"></div>').join('') +
      '</div>';
  }

  function renderFilters() {
    const counts = { all: ctx.racks.length, ok: 0, low: 0, empty: 0 };
    ctx.racks.forEach(r => { counts[UI.rackStatus(r)]++; });
    const defs = [
      { key: 'all', label: 'Все', cls: '' },
      { key: 'ok', label: 'Норма', cls: '' },
      { key: 'low', label: 'Низкий', cls: 'low' },
      { key: 'empty', label: 'Критично', cls: 'empty' }
    ];
    $('filters').innerHTML = defs.map(d =>
      '<button class="chip ' + d.cls + (filter === d.key ? ' active' : '') + '" data-filter="' + d.key + '">' +
      d.label + ' · ' + counts[d.key] + '</button>').join('');
  }

  function renderRacks() {
    const list = visibleRacks();
    if (!list.length) {
      $('racks').innerHTML = ctx.racks.length
        ? '<div class="empty-state">Ничего не найдено. Измените фильтр или поиск.</div>'
        : '<div class="empty-state">Стеллажей пока нет.<br><br>' +
          'Порядок такой: заведите товар в <b>Прайсе</b>, внесите поставку в <b>Закупках</b>, ' +
          'потом добавьте стеллаж и поставьте на него позиции.</div>';
      return;
    }
    $('racks').innerHTML = list.map(rackCard).join('');
  }

  function rackCard(r) {
    const st = UI.rackStatus(r);
    const cls = st === 'empty' ? ' danger' : (st === 'low' ? ' warn' : '');
    const lastOp = ctx.ops.find(o => o.rack_code === r.code);
    const req = ctx.requests.find(x => x.rack_code === r.code);
    const days = Number(CFG.rules.routeDays) || 7;
    const soldQty = salesSince(days).filter(o => o.rack_code === r.code).reduce((s, o) => s + o.qty, 0);
    const missing = r.items.reduce((s, i) => s + (i.max - i.qty), 0);
    const packed = req && req.status === 'packed';
    const code = UI.esc(r.code);

    let foot;
    if (packed) {
      const inVan = Array.isArray(req.packed_items) ? req.packed_items.reduce((s, x) => s + (Number(x.qty) || 0), 0) : 0;
      foot = '<span style="font-size:12px;color:var(--green)">Поставка собрана' + (inVan ? ' (' + inVan + ' шт)' : '') + ' · ' +

          (r.items.length
            ? '<button class="btn btn-ghost btn-sm" data-act="audit" data-rack="' + code + '" title="Пересчитать полку и вписать факт">Сверка</button>'

  /* ---------------- правая колонка ---------------- */

  function renderRight() {
    const route = ctx.racks
      .map(r => ({
        r,

          : '<div style="font-size:13px;color:#64748B;padding:8px 0">Все стеллажи заполнены — ехать некуда.</div>') +
