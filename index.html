  /* ---------------- пополнение по штукам ---------------- */

  function itemById(id) {
    for (const r of ctx.racks) {
      const it = r.items.find(i => i.id === id);
      if (it) return it;
    }
    return null;
  }

  /**
   * Общее окно «сколько штук» — пополнение, сборка поставки, приём поставки у продавца.
   * opts: { rack, title, subtitle, okLabel,
   *         stock   — { catalog_id: шт } остаток склада; не передан — склад не проверяем,
   *         initial — { item_id: шт } что подставить сразу,
   *         cap     — { item_id: шт } больше этого поставить нельзя (например, сколько собрано) }
   * Возвращает [{ item_id, add }] или null.
   */
  async function fillModal(opts) {
    const rack = opts.rack;
    const stock = opts.stock || null;
    const initial = opts.initial || {};
    const cap = opts.cap || null;
    const showCost = !opts.hideCost;      // продавцу закупочные цены не показываем

    const rows = rack.items.filter(i => i.max > i.qty).map(i => {
      const room = i.max - i.qty;
      const wh = stock ? Math.max(0, Math.floor(stock[i.catalog_id] || 0)) : null;
      let lim = room;
      if (wh !== null) lim = Math.min(lim, wh);
      if (cap) lim = Math.min(lim, Math.max(0, cap[i.id] || 0));
      return { i, room, wh, lim, init: Math.max(0, Math.min(lim, initial[i.id] || 0)) };
    }).filter(r => !cap || r.lim > 0 || (cap[r.i.id] || 0) > 0);

    if (!rows.length) { UI.toast(cap ? 'В сборке ничего нет' : 'Стеллаж уже полный', 'err'); return null; }
    const anything = rows.some(r => r.lim > 0);
    const fillLabel = stock ? 'Взять всё, что есть на складе' : (cap ? 'Как в сборке' : 'Заполнить всё до максимума');

    let applied = null;

    await UI.modal({
      title: opts.title,
      subtitle: opts.subtitle,
      wide: true,
      noFocus: true,
      body:
        (stock && !anything
          ? '<div class="card flat" style="font-size:13px;color:var(--orange);margin-bottom:12px">На складе нет ничего из того, ' +
            'что нужно этой точке. Сначала внесите закупку (раздел «Закупки»).</div>'
          : '') +
        '<div class="stack-sm" style="gap:0">' +
          rows.map(r => {
            const i = r.i;
            const whTxt = r.wh === null ? '' :
              '<span style="color:' + (r.wh <= 0 ? 'var(--red)' : r.wh < r.room ? 'var(--orange)' : 'var(--green)') + '">склад ' + r.wh + '</span>';
            const capTxt = cap ? '<span style="color:#B9C6DA">собрано ' + (cap[i.id] || 0) + '</span>' : '';
            return '<div class="fill-row">' +
              '<div class="t"><b>' + UI.esc(i.name) + '</b>' +
                '<small>' + UI.esc([i.brand, i.volume].filter(Boolean).join(' · ')) +
                (showCost && i.cost ? ' · закупка ' + UI.money(i.cost) : '') + '</small></div>' +
              '<div class="have">' + i.qty + ' / ' + i.max + ' шт<br>' +
                '<span style="color:#4B5A75">влезет +' + r.room + '</span>' +
                (whTxt || capTxt ? '<br>' + (whTxt || capTxt) : '') + '</div>' +
              (r.lim > 0
                ? UI.stepper(i.id, r.init, r.lim, true)
                : '<span style="font-size:12px;color:var(--red);width:118px;text-align:center">' +
                    (stock ? 'нет на складе' : 'нет в сборке') + '</span>') +
            '</div>';
          }).join('') +
          '<div class="row-between" style="padding-top:14px">' +
            '<b style="font-size:13px">Итого</b>' +
            '<b class="mono" id="fillTotal">0 шт</b>' +
          '</div>' +
        '</div>',
      onOpen: (root) => {
        const total = root.querySelector('#fillTotal');
        const recalc = () => {
          const vals = UI.stepperValues(root);
          let qty = 0, sum = 0;
          rows.forEach(r => { const v = vals[r.i.id] || 0; qty += v; sum += v * (r.i.cost || 0); });
          total.innerHTML = qty + ' шт' + (showCost && sum ? ' <span style="color:#64748B">· ' + UI.money(sum) + '</span>' : '');
        };
        UI.bindSteppers(root, recalc);
        recalc();
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: fillLabel, kind: 'btn-ghost',
          onClick: (root) => {
            root.querySelectorAll('[data-stepper]').forEach(box => {
              box.querySelector('input').value = box.dataset.max;
              box.dispatchEvent(new Event('input', { bubbles: true }));
            });
            return false; // окно не закрываем — человек видит числа и сам жмёт кнопку
          }
        },
        {
          label: opts.okLabel || 'Пополнить', kind: 'btn-primary',
          onClick: (root) => {
            const vals = UI.stepperValues(root);
            const plan = Object.keys(vals).filter(id => vals[id] > 0).map(id => ({ item_id: id, add: vals[id] }));
            if (!plan.length) { UI.toast('Укажите, сколько штук', 'err'); return false; }
            applied = plan;
            return true;
          }
        }
      ]
    });

    return applied;
  }

  /** Остаток склада по прайсу: закуплено − отгружено на стеллажи. */
  const stockMap = () => STORE.warehouse(ctx.purchases, ctx.ops);

  /**
   * Свободно на складе: остаток минус то, что уже собрано для других точек
   * и лежит в машине (со склада оно спишется, только когда его поставят на полку).
   * exceptRack — сборку этой точки не вычитаем (её как раз пересобираем).
   */
  function availMap(exceptRack) {
    const st = stockMap();
    const res = STORE.reservedFrom(ctx.requests, ctx.racks, exceptRack);
    const out = {};
    Object.keys(st).forEach(k => { out[k] = st[k]; });
    Object.keys(res).forEach(k => { out[k] = (out[k] || 0) - res[k]; });
    return out;
  }

  async function restockRack(code) {
    const rack = ctx.racks.find(r => r.code === code);
    if (!rack) return;
    const plan = await fillModal({
      rack,
      title: 'Пополнить ' + rack.code + ' со склада',
      subtitle: rack.station + (rack.address ? ' · ' + rack.address : '') +
        ' · поставить можно не больше, чем есть на складе',
      okLabel: 'Пополнить',
      stock: availMap()
    });
    if (!plan) return;
    await act(
      () => STORE.restock(code, plan, { type: 'restock', user_login: ctx.user.login, user_name: ctx.user.name }),
      (res) => 'Пополнено: +' + res.qty + ' шт на ' + UI.money(res.sum)
    ).catch(() => {});
  }

  /* ---------------- позиция из прайса ---------------- */

  /** Всё, что известно о позиции прайса: склад, где стоит, продажи, последняя закупка. */
  function catalogFacts(c, stock) {
    const on = [];
    ctx.racks.forEach(r => r.items.forEach(i => { if (i.catalog_id === c.id) on.push({ code: r.code, qty: i.qty, max: i.max }); }));
    const from = Date.now() - 30 * 864e5;
    const sold = ctx.ops.filter(o => o.type === 'sale' && !o.cancelled && o.catalog_id === c.id &&
      new Date(o.created_at).getTime() >= from);
    const buys = (ctx.purchases || []).filter(p => p.catalog_id === c.id);
    const cost = Number(c.cost) || 0, price = Number(c.price) || 0;
    return {
      wh: Math.max(0, Math.floor(stock[c.id] || 0)),
      on,
      sold: sold.reduce((s, o) => s + o.qty, 0),
      lastBuy: buys[0] || null,
      margin: price - cost,
      markup: price ? Math.round((price - cost) / price * 100) : 0   // как в прайсе: доля от цены продажи
    };
  }

  async function addItemModal(code) {
    const rack = ctx.racks.find(r => r.code === code);
    const used = new Set(rack.items.map(i => i.catalog_id));
    const list = ctx.catalog.filter(c => !c.archived && !used.has(c.id));

    if (!ctx.catalog.filter(c => !c.archived).length) {
      const goPrice = await UI.confirmBox('Прайс пустой',
        'Сначала заведите товар в прайсе — потом его можно будет ставить на стеллажи.',
        'Открыть прайс');
      if (goPrice) go('price');
      return;
    }
    if (!list.length) {
      UI.toast('Все позиции прайса уже стоят на этом стеллаже', 'err');
      return;
    }

    const stock = stockMap();
    const facts = {};
    list.forEach(c => { facts[c.id] = catalogFacts(c, stock); });
    let chosen = null;
    let catF = 'all';
    let onlyStock = list.some(c => facts[c.id].wh > 0);

    const cats = CFG.categories.filter(k => list.some(c => c.category === k.key));

    await UI.modal({
      title: 'Поставить позицию на ' + code,
      subtitle: rack.station + (rack.address ? ' · ' + rack.address : '') +
        ' · на полке сейчас ' + rack.items.length + ' поз.',
      cls: 'xwide',
      noFocus: true,
      body:
        '<div class="add-grid">' +
          '<div class="stack-sm" style="gap:10px;min-width:0">' +
            '<div class="search"><input id="pickSearch" type="search" placeholder="Поиск: название, фирма, артикул, объём…"></div>' +
            '<div class="filters" id="pickCats" style="flex-wrap:wrap">' +
              '<button type="button" class="chip active" data-pc="all">Все</button>' +
              cats.map(k => '<button type="button" class="chip" data-pc="' + k.key + '">' + UI.esc(k.label) + '</button>').join('') +
            '</div>' +
            '<label class="row" style="gap:8px;font-size:12px;color:#8494AC;cursor:pointer">' +
              '<input type="checkbox" id="pickStock"' + (onlyStock ? ' checked' : '') + '> только то, что есть на складе</label>' +
            '<div class="picker" id="picker" style="max-height:380px"></div>' +
          '</div>' +
          '<div id="pickInfo" class="card flat stack-sm" style="gap:12px;align-self:start"></div>' +
        '</div>',
      onOpen: (root) => {
        const picker = root.querySelector('#picker');
        const info = root.querySelector('#pickInfo');
        let q = '';

        const paintInfo = () => {
          const c = list.find(x => x.id === chosen);
          if (!c) {
            info.innerHTML = '<div style="font-size:13px;color:#64748B;line-height:1.6">Выберите позицию слева — ' +
              'здесь появятся цены, остаток на складе, где она уже стоит и как продаётся.</div>';
            return;
          }
          const f = facts[c.id];
          const cell = (label, value, color) => '<div class="stack-sm" style="gap:2px"><span style="font-size:11px;color:#64748B">' +
            label + '</span><b class="mono" style="font-size:15px' + (color ? ';color:' + color : '') + '">' + value + '</b></div>';
          const maxDef = Number(CFG.rules.defaultMax) || 10;

  /** Отметить, что товар для точки собран. Продавец увидит «везём». */
  /**
   * «Поставка собрана»: админ отмечает, СКОЛЬКО РЕАЛЬНО собрал по каждой позиции.
   * Больше, чем есть на складе, собрать нельзя. Продавец при приёме увидит эти же цифры.
   */
  async function markPacked(code) {
    const r = ctx.racks.find(x => x.code === code);
    if (!r) return;
    const stock = availMap(code);
    const initial = {};
    const cur = ctx.requests.find(x => x.rack_code === code && x.status === 'packed');
    if (cur && Array.isArray(cur.packed_items)) cur.packed_items.forEach(x => { initial[x.item_id] = Number(x.qty) || 0; });
    else r.items.forEach(i => { initial[i.id] = Math.min(i.max - i.qty, Math.max(0, Math.floor(stock[i.catalog_id] || 0))); });
    const plan = await fillModal({
      rack: r,
      title: 'Собрать поставку для ' + r.code,
      subtitle: r.station + (r.address ? ' · ' + r.address : '') +
        ' · укажите, сколько реально положили в машину. Продавец увидит «везём к вам».',
      okLabel: 'Поставка собрана',
      stock, initial
    });
    if (!plan) return;
    const items = plan.map(p => {
      const it = r.items.find(i => i.id === p.item_id);
      return { item_id: p.item_id, catalog_id: it ? it.catalog_id : null, name: it ? it.name : '', qty: p.add };
    });
    const already = ctx.requests.some(x => x.rack_code === code && x.status === 'packed');
    ctx.act(() => STORE.markPacked(code, ctx.user, null, items, already),
      'Собрано ' + items.reduce((s, x) => s + x.qty, 0) + ' шт — точка увидит «везём к вам»');
  }

  /** Автосборка для маршрута: по каждой точке берём сколько нужно, но не больше склада. */
  function autoPack(racks) {
    const left = Object.assign({}, availMap());
    const packedNow = new Set(ctx.requests.filter(x => x.status === 'packed').map(x => x.rack_code));
    return racks.filter(r => !packedNow.has(r.code)).map(r => ({
      code: r.code,
      items: r.items.filter(i => i.max > i.qty).map(i => {
        const have = Math.max(0, Math.floor(left[i.catalog_id] || 0));
        const qty = Math.min(i.max - i.qty, have);
        left[i.catalog_id] = have - qty;
        return { item_id: i.id, catalog_id: i.catalog_id, name: i.name, qty };
      }).filter(x => x.qty > 0)
    }));
  }

  /* ---------------- ручная правка позиции ----------------
     Администратор у стеллажа: снял штуку, поставил штуку, поправил
     количество или вместимость, убрал позицию совсем. Ничего из этого
     не записывается как продажа, если админ сам так не скажет. */

  const REASONS_DOWN = [
    { key: 'unload',   label: 'Снял и увёз на склад', hint: 'штука вернётся в остаток склада' },
    { key: 'writeoff', label: 'Списание: брак, протечка, потеря', hint: 'штука уходит из учёта' },
    { key: 'audit',    label: 'Сверка: в системе было неверно', hint: 'просто исправляем цифру' },
    { key: 'sale',     label: 'Продал сам', hint: 'пойдёт в выручку и маржу' }
  ];
  const REASONS_UP = [
    { key: 'restock', label: 'Поставил со склада', hint: 'со склада спишется столько же' },
    { key: 'audit',   label: 'Сверка: в системе было неверно', hint: 'склад не трогаем' }
  ];

  function reasonList(list, name, current) {
    return '<div class="stack-sm" style="gap:6px">' + list.map(r =>
      '<label class="row" style="gap:10px;cursor:pointer;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">' +
        '<input type="radio" name="' + name + '" value="' + r.key + '"' + (r.key === current ? ' checked' : '') + '>' +
        '<span class="grow">' + UI.esc(r.label) + '<small style="display:block;font-size:11px;color:#64748B">' +
          UI.esc(r.hint) + '</small></span>' +
      '</label>').join('') + '</div>';
  }

    let reason = null;
    await UI.modal({

      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Снять 1 шт', kind: 'btn-primary',

  }

  /** Окно позиции: точное количество, вместимость, снять со стеллажа. */
  async function itemModal(itemId) {
    const it = itemById(itemId);
    if (!it) return;
    let result = null;

    await UI.modal({
      title: it.name,
      subtitle: [it.brand, it.volume, it.sku].filter(Boolean).join(' · ') + ' · стеллаж ' + it.rack_code,
      wide: true,
      noFocus: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end">' +
            '<div class="stack-sm" style="gap:6px"><span style="font-size:12px;color:#8494AC">Сейчас на полке, шт</span>' +
              '<div id="imQtyBox">' + UI.stepper('imQty', it.qty, it.max) + '</div></div>' +
            UI.field('Вместимость, шт', 'imMax', '10', 'number', it.max) +
          '</div>' +
          '<div id="imReason"></div>' +
          '<div class="card flat row-between" style="padding:12px 14px;gap:12px;flex-wrap:wrap">' +
            '<div style="font-size:12px;color:#8494AC;max-width:420px">Убрать позицию со стеллажа совсем. ' +
              'В прайсе она останется' + (it.qty ? ', а ' + it.qty + ' шт с полки вернутся на склад' : '') + '.</div>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="imRemove" style="color:var(--red)">Снять позицию со стеллажа</button>' +
          '</div>' +
        '</div>',
      onOpen: (root, close) => {
        const box = root.querySelector('#imQtyBox');
        const maxInp = root.querySelector('#imMax');
        const reasonHost = root.querySelector('#imReason');
        let shownFor = 0;
        const paint = () => {
          const v = UI.stepperValues(box).imQty;
          const d = v - it.qty;
          const sign = d > 0 ? 1 : d < 0 ? -1 : 0;
          if (sign === shownFor) {
            const t = reasonHost.querySelector('[data-diff]');
            if (t) t.textContent = (d > 0 ? '+' : '−') + Math.abs(d) + ' шт';
            return;
          }
          shownFor = sign;
          reasonHost.innerHTML = !sign ? '' :
            '<div class="stack-sm" style="gap:8px"><div style="font-size:13px;color:#8494AC">Изменение <b data-diff style="color:var(--text)">' +
              (d > 0 ? '+' : '−') + Math.abs(d) + ' шт</b> — что произошло?</div>' +
              (d > 0 ? reasonList(REASONS_UP, 'imR', 'restock') : reasonList(REASONS_DOWN, 'imR', 'unload')) + '</div>';
        };
        UI.bindSteppers(box, paint);
        maxInp.addEventListener('input', () => {
          const m = Math.max(1, Math.round(Number(maxInp.value) || 1));
          const st = box.querySelector('[data-stepper]');
          st.dataset.max = m;
          st.querySelector('input').max = m;
          st.querySelector('input').dispatchEvent(new Event('input', { bubbles: true }));
        });
        paint();
        root.querySelector('#imRemove').addEventListener('click', () => {
          result = { remove: true };
          close(null);
        });
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            const qty = UI.stepperValues(root.querySelector('#imQtyBox')).imQty;
            const max = Math.round(Number(root.querySelector('#imMax').value) || 0);
            if (max < 1) { UI.toast('Вместимость должна быть больше нуля', 'err'); return false; }
            const r = root.querySelector('input[name="imR"]:checked');
            const reason = r ? r.value : null;
            const wh = Math.max(0, Math.floor(availMap()[it.catalog_id] || 0));
            if (reason === 'restock' && qty - it.qty > wh) {
              UI.toast('На складе только ' + wh + ' шт. Поставьте меньше, внесите закупку или выберите «Сверка».', 'err');
              return false;
            }
            result = { qty, max, reason };
            return true;
          }
        }
      ]
    });

    if (!result) return;
    if (result.remove) {
      const ok = await UI.confirmBox('Снять «' + it.name + '» со стеллажа ' + it.rack_code + '?',
        it.qty ? 'На полке ' + it.qty + ' шт — они вернутся на склад. Позиция останется в прайсе.' : 'Позиция останется в прайсе.',
        'Снять позицию', 'btn-danger');
      if (ok) ctx.act(() => STORE.removeItem(itemId, ctx.user), 'Позиция снята со стеллажа');
      return;
    }
    if (result.qty === it.qty && result.max === it.max) return;
    ctx.act(() => STORE.adjustItem(itemId, result, ctx.user), 'Позиция обновлена');
  }

  /** Сверка всей полки разом: пересчитал — вписал факт. */
  async function rackAuditModal(code) {
    const rack = ctx.racks.find(r => r.code === code);
    if (!rack || !rack.items.length) return;

        '<div class="fill-row">' +
          '<div class="t"><b>' + UI.esc(i.name) + '</b>' +
            '<small>' + UI.esc([i.brand, i.volume].filter(Boolean).join(' · ')) + '</small></div>' +
          '<div class="have">в системе<br><span style="color:#B9C6DA">' + i.qty + ' из ' + i.max + '</span></div>' +
          UI.stepper(i.id, i.qty, i.max) +
        '</div>').join('') + '</div>',
      onOpen: (root) => { UI.bindSteppers(root); },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Сохранить факт', kind: 'btn-primary',
          onClick: (root) => {
            const vals = UI.stepperValues(root);
            ctx.act(async () => {
              let changed = 0;
              for (const id of Object.keys(vals)) {

                if (!item || vals[id] === item.qty) continue;
                await STORE.setQty(id, vals[id], {
                  type: 'audit', user_login: ctx.user.login, user_name: ctx.user.name, note: 'сверка администратором'
                });
                changed++;
              }
              if (!changed) throw new Error('Расхождений нет — всё сходится');
              return changed;
            }, (n) => 'Сверка сохранена, исправлено позиций: ' + n);
            return true;
          }
        }
      ]
    });
  }

  /* ---------------- маршрут и выгрузка ---------------- */

  async function routeModal() {
    const route = ctx.racks
      .map(r => ({ r, st: UI.rackStatus(r), need: r.items.reduce((s, i) => s + (i.max - i.qty), 0) }))
      .filter(x => x.st !== 'ok')
      .sort((a, b) => (a.st === 'empty' ? -1 : 1) - (b.st === 'empty' ? -1 : 1) || b.need - a.need);

    const ok = await UI.modal({
      title: 'Маршрут на сегодня',
      subtitle: route.length + ' точек · ' + route.reduce((s, x) => s + x.need, 0) + ' шт к загрузке',
      wide: true,
      body: route.length
        ? '<div class="stack-sm">' + route.map((x, n) =>
            '<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            '<div class="row" style="gap:12px"><span class="mono" style="color:#64748B;width:18px">' + (n + 1) + '</span>' +
            '<div><div style="font-size:13px;font-weight:500">' + UI.esc(x.r.station) + ' · ' + UI.esc(x.r.code) + '</div>' +
            '<div style="font-size:12px;color:#64748B">' + UI.esc(x.r.address || '') + '</div></div></div>' +
            '<span class="mono" style="font-size:13px;color:' + (x.st === 'empty' ? '#FF5A5F' : '#FFA726') + '">' +
            x.need + ' шт</span></div>').join('') + '</div>'
        : '<div class="empty-state">Все стеллажи заполнены.</div>',
      actions: [
        { label: 'Закрыть', value: null },
        { label: 'Скачать список', kind: 'btn-ghost', value: 'csv' },
        { label: 'Всё собрано — уведомить точки', kind: 'btn-primary', value: 'packed' }
      ]
    });

    if (ok === 'csv') {
      const rows = [['№', 'Код', 'СТО', 'Адрес', 'К загрузке, шт']]
        .concat(route.map((x, n) => [n + 1, x.r.code, x.r.station, x.r.address || '', x.need]));
      UI.downloadFile('marshrut-' + UI.today() + '.csv', UI.csv(rows));
      UI.toast('Список маршрута скачан', 'ok');
    }

    if (ok === 'packed') {
      const packs = autoPack(route.map(x => x.r)).filter(p => p.items.length);
      if (!packs.length) { UI.toast('На складе нет товара ни для одной точки маршрута — внесите закупку', 'err'); return; }
      ctx.act(async () => {
        let n = 0;
        for (const p of packs) {
          try { await STORE.markPacked(p.code, ctx.user, null, p.items); n++; }
          catch (e) { /* уже отмечено — пропускаем */ }
        }
        if (!n) throw new Error('Все точки маршрута уже отмечены');
        return n;
      }, (n) => 'Собрано для точек: ' + n + ' (по остатку склада) — продавцы видят «везём»');
    }
  }

  function exportCsv() {
    const head = ['Код', 'СТО', 'Адрес', 'Продавец', 'Позиция', 'Фирма', 'Объём', 'Артикул',
      'Закупка', 'Продажа', 'Остаток', 'Вместимость', 'Заполнено,%', 'Статус', 'Сумма закупки'];
    const rows = [head];
    ctx.racks.forEach(r => r.items.forEach(i => {
      rows.push([
        r.code, r.station, r.address || '', r.operator || '',
        i.name, i.brand || '', i.volume || '', i.sku || '',
        i.cost || 0, i.price || 0, i.qty, i.max,
        UI.itemPct(i), UI.STATUS_LABEL[UI.itemStatus(i)], (i.qty * (i.cost || 0))
      ]);
    }));
    UI.downloadFile('ostatki-' + UI.today() + '.csv', UI.csv(rows));
    UI.toast('Отчёт по остаткам скачан', 'ok');
  }

  /* ---------------- события страницы «Стеллажи» ---------------- */

  function bindRacksPage() {
    $('btnExport').innerHTML = UI.icon('down', 15) + '<span>Экспорт остатков</span>';
    $('btnAddRack').innerHTML = UI.icon('plus', 15, '#12161F', 2) + '<span>Добавить стеллаж</span>';
    $('searchIcon').innerHTML = UI.icon('search', 15, '#64748B', 1.8);

    $('btnExport').addEventListener('click', exportCsv);
    $('btnAddRack').addEventListener('click', addRackModal);

    $('search').addEventListener('input', (e) => { query = e.target.value; renderRacks(); });

    $('filters').addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]');
      if (!b) return;
      filter = b.dataset.filter;
      renderFilters();
      renderRacks();
    });

    $('racks').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const a = b.dataset.act;
      if (a === 'restock') restockRack(b.dataset.rack);
      if (a === 'history') { window.LC_MOVES.openFor(b.dataset.rack); go('moves'); }
      if (a === 'add-item') addItemModal(b.dataset.rack);
      if (a === 'edit') editRackModal(b.dataset.rack);
      if (a === 'packed') markPacked(b.dataset.rack);
      if (a === 'photo') {
        const r = ctx.racks.find(x => x.code === b.dataset.rack);
        if (r) UI.photoModal(r.photo, r.code + ' · ' + r.station);
      }
      if (a === 'minus') minusOne(b.dataset.item);
      if (a === 'plus') {
        const it = itemById(b.dataset.item);
        const wh = it ? Math.floor(availMap()[it.catalog_id] || 0) : 0;
        if (it && wh <= 0) {
          UI.toast('На складе нет «' + it.name + '». Внесите закупку — или через ✎ → «Сверка», если канистра на полке уже была.', 'err');
          return;
        }
        ctx.act(() => STORE.changeQty(b.dataset.item, +1, {
          type: 'restock', user_login: ctx.user.login, user_name: ctx.user.name, note: 'поставлено администратором'
        }), 'Поставлено со склада: ' + (it ? it.name : '1 шт'));
      }
      if (a === 'item') itemModal(b.dataset.item);
      if (a === 'audit') rackAuditModal(b.dataset.rack);
    });

    $('rightCol').addEventListener('click', (e) => {
      if (e.target.closest('#btnRoute')) routeModal();
      if (e.target.closest('#btnFullLog')) go('moves');
    });
  }

  /* ---------------- запуск ---------------- */

  async function mount(currentUser) {
    ctx.user = currentUser;
    UI.applyTheme();
    document.title = 'Панель администратора — ' + CFG.texts.brand;
    renderTopbar();
    UI.modeBanner(ctx.user);
    await refresh();
    STORE.onChange(() => { if (ctx.page !== 'chat') refresh(); else load().catch(() => {}); });
    // чат: счётчик непрочитанных в меню
    window.LC_CHAT.init(ctx.user, {
      onBadge: (n) => { if (n !== ctx.chatUnread) { ctx.chatUnread = n; renderTopbar(); } }
    }).catch(() => {});
    void CFG;
  }

  return { mount, go, fillModal, ctx };
})();



/* ============================================================
   Lube Control — ЗАГРУЗКА ИЗ ФАЙЛА
   Прайс и закупки из CSV (Excel «CSV, разделитель ;»), а также XLSX.
   Сам находит строку заголовков, сопоставляет колонки по названиям,
   понимает кодировки UTF-8 и Windows-1251, запятую в ценах и пробелы
   в тысячах. Перед записью показывает, что будет сделано с каждой строкой.
   ============================================================ */

window.LC_IMPORT = (function () {
  const CFG = window.LC_CONFIG;
  const UI = window.LC_UI;

  /* ---------------- поля и их узнавание по заголовку ----------------
     Порядок важен: «Цена закупки» должна стать закупкой раньше,
     чем её перехватит общее слово «цена». */
  const FIELDS = [
    { key: 'cost',     label: 'Закупка, ₽',  re: [/закуп/, /вход/, /себест/, /опт/, /cost/, /приход/] },
    { key: 'price',    label: 'Продажа, ₽',  re: [/прода/, /розн/, /price/, /цена/, /стоимост/] },
    { key: 'qty',      label: 'Количество',  re: [/^кол/, /количеств/, /^шт/, /qty/, /quantity/] },
    { key: 'sku',      label: 'Артикул',     re: [/артик/, /^код/, /sku/, /^арт/, /каталожн/, /part/] },
    { key: 'category', label: 'Категория',   re: [/катег/, /групп/, /^тип/, /^вид/] },
    { key: 'brand',    label: 'Фирма',       re: [/бренд/, /фирм/, /производ/, /марка/, /brand/, /изготов/] },
    { key: 'volume',   label: 'Объём',       re: [/объ[её]м/, /литраж/, /фасов/, /volume/, /[её]мкост/] },
    { key: 'supplier', label: 'Поставщик',   re: [/поставщ/, /контраг/, /supplier/] },
    { key: 'payment',  label: 'Оплата',      re: [/оплат/, /payment/] },
    { key: 'date',     label: 'Дата',        re: [/дата/, /date/] },
    { key: 'name',     label: 'Название',    re: [/наимен/, /назв/, /товар/, /номенкл/, /^name/, /описан/, /позиц/] }
  ];
  const MODES = {
    price: {
      fields: ['name', 'brand', 'volume', 'sku', 'category', 'cost', 'price'],
      order:  ['category', 'name', 'brand', 'volume', 'sku', 'cost', 'price'],
      template: [['Категория', 'Название', 'Фирма', 'Объём', 'Артикул', 'Закупка', 'Продажа'],
                 ['Моторное масло', 'Magnatec 5W-30 A5', 'Castrol', '4 л', '15C94B', 3150, 4290],
                 ['Антифриз', 'Антифриз G12+ красный', 'Sintec', '5 кг', '990558', 780, 1190]]
    },
    buys: {
      fields: ['name', 'brand', 'volume', 'sku', 'category', 'cost', 'price', 'qty', 'supplier', 'payment', 'date'],
      order:  ['name', 'brand', 'volume', 'sku', 'qty', 'cost', 'price'],
      template: [['Название', 'Фирма', 'Объём', 'Артикул', 'Количество', 'Закупка', 'Продажа'],
                 ['Magnatec 5W-30 A5', 'Castrol', '4 л', '15C94B', 12, 3150, 4290],
                 ['Антифриз G12+ красный', 'Sintec', '5 кг', '990558', 20, 780, 1190]]
    }
  };
  const fieldLabel = (k) => (FIELDS.find(f => f.key === k) || {}).label || k;

  /* ---------------- чтение файла ---------------- */

  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = () => resolve();
      sc.onerror = () => reject(new Error('Не удалось загрузить модуль Excel. Сохраните файл как CSV (разделитель «;») и загрузите его.'));
      document.head.appendChild(sc);
    });
  }

  function parseCsv(text) {
    const first = text.split(/\r?\n/).slice(0, 5).join('\n');
    const count = (ch) => first.split(ch).length - 1;
    const cands = [';', '\t', ','];
    let delim = ';', best = -1;
    cands.forEach(c => { const n = count(c); if (n > best) { best = n; delim = c; } });

    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
        } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  async function readFile(file) {
    const name = (file.name || '').toLowerCase();
    const buf = await file.arrayBuffer();
    let rows;
    if (/\.(xlsx|xls|ods)$/.test(name)) {
      await loadXlsx();
      const wb = window.XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    } else {
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (e) { text = new TextDecoder('windows-1251').decode(buf); }   // Excel в России сохраняет CSV так
      rows = parseCsv(text.replace(/^\uFEFF/, ''));
    }
    rows = rows
      .map(r => (r || []).map(v => (v === null || v === undefined) ? '' : (typeof v === 'string' ? v.trim() : v)))
      .filter(r => r.some(v => String(v).trim() !== ''));
    if (!rows.length) throw new Error('Файл пустой');
    return rows;
  }

  /* ---------------- разбор значений ---------------- */

  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let t = String(v || '').replace(/[\s\u00a0]/g, '').replace(/[^0-9,.\-]/g, '');
    if (!t) return 0;
    const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
    if (lc >= 0 && ld >= 0) {
      const dec = Math.max(lc, ld);
      t = t.slice(0, dec).replace(/[.,]/g, '') + '.' + t.slice(dec + 1);
    } else if (lc >= 0) t = t.replace(/,/g, '.');
    const n = parseFloat(t);
    return isFinite(n) ? n : 0;
  }

  function date(v) {
    if (typeof v === 'number' && v > 20000 && v < 80000) {           // дата Excel
      const d = new Date(Math.round((v - 25569) * 864e5));
      return d.toISOString().slice(0, 10);
    }
    const t = String(v || '').trim();
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = /^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/.exec(t);
    if (m) {
      const y = m[3].length === 2 ? '20' + m[3] : m[3];
      return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    }
    return '';
  }

  const CAT_WORDS = [
    ['motor', /мотор|двигат|5w|0w|10w|15w|engine/],
    ['gear', /трансмис|кпп|акпп|мкпп|atf|cvt|вариат|редукт|75w|80w|85w|gear|гидроус|гур/],
    ['coolant', /антифриз|тосол|охлажд|coolant|g1[1-3]/],
    ['brake', /тормоз|dot ?[3-5]|brake/],
    ['washer', /омыват|незамерз|стеклоом|washer/]
  ];
  function category(text, name) {
    const t = String(text || '').trim().toLowerCase();
    if (t) {
      const byKey = CFG.categories.find(c => c.key === t);
      if (byKey) return byKey.key;
      const byLabel = CFG.categories.find(c => c.label.toLowerCase() === t || t.indexOf(c.label.toLowerCase()) >= 0);
      if (byLabel) return byLabel.key;
      const w = CAT_WORDS.find(x => x[1].test(t));
      if (w) return w[0];
    }
    const n = String(name || '').toLowerCase();
    const w = CAT_WORDS.find(x => x[1].test(n));
    return w ? w[0] : 'other';
  }

  function volume(v) {
    if (typeof v === 'number') return v + ' л';
    const t = String(v || '').trim();
    return /^\d+([.,]\d+)?$/.test(t) ? t.replace('.', ',') + ' л' : t;
  }

  /* ---------------- сопоставление с прайсом ---------------- */

  const norm = (v) => String(v || '').toLowerCase().replace(/ё/g, 'е').replace(/[\s\-_.,/\\]+/g, '');
  const volKey = (v) => String(v || '').toLowerCase().replace(',', '.').replace(/[^0-9.]/g, '');
  const itemKey = (name, brand, vol) => norm(name) + '|' + norm(brand) + '|' + volKey(vol);

  function catalogIndex(catalog) {
    const bySku = {}, byKey = {};
    catalog.slice().sort((a, b) => (a.archived ? 1 : 0) - (b.archived ? 1 : 0)).forEach(c => {
      const s = norm(c.sku);
      if (s && !bySku[s]) bySku[s] = c;
      const k = itemKey(c.name, c.brand, c.volume);
      if (!byKey[k]) byKey[k] = c;
    });
    return { bySku, byKey };
  }

  /* ---------------- заголовки ---------------- */

  function guessField(header, allowed, taken) {
    const h = String(header || '').toLowerCase().replace(/ё/g, 'е').trim();
    if (!h) return '';
    for (const f of FIELDS) {
      if (allowed.indexOf(f.key) < 0 || taken[f.key]) continue;
      if (f.re.some(r => r.test(h))) return f.key;
    }
    return '';
  }

  /** Ищет строку заголовков в первых 15 строках. */
  function detect(rows, mode) {
    const allowed = MODES[mode].fields;
    let bestRow = -1, bestMap = null, bestScore = 1;
    rows.slice(0, 15).forEach((r, idx) => {
      const taken = {};
      const map = r.map(h => {
        const f = guessField(h, allowed, taken);
        if (f) taken[f] = true;
        return f;
      });
      const score = map.filter(Boolean).length;
      if (score > bestScore && taken.name) { bestScore = score; bestRow = idx; bestMap = map; }
    });
    const width = Math.max(...rows.slice(0, 50).map(r => r.length));
    if (bestRow < 0) {
      // заголовков нет — считаем, что колонки идут как в шаблоне
      const order = MODES[mode].order;
      return { headerRow: -1, map: Array.from({ length: width }, (_, i) => order[i] || '') };
    }
    const map = bestMap.slice();
    while (map.length < width) map.push('');
    return { headerRow: bestRow, map };
  }

  /* ---------------- разбор строк ---------------- */

  function analyze(state, catalog, opts) {
    const idx = catalogIndex(catalog);
    const col = {};
    state.map.forEach((f, i) => { if (f && col[f] === undefined) col[f] = i; });
    const get = (r, f) => col[f] === undefined ? '' : r[col[f]];

    const seen = {};
    return state.rows.slice(state.headerRow + 1).map((r, n) => {
      const name = String(get(r, 'name') || '').trim();
      const x = {
        n: state.headerRow + 2 + n,
        name,
        brand: String(get(r, 'brand') || '').trim(),
        volume: volume(get(r, 'volume')),
        sku: String(get(r, 'sku') || '').trim(),
        category: category(get(r, 'category'), name),
        cost: num(get(r, 'cost')),
        price: num(get(r, 'price')),
        qty: Math.round(num(get(r, 'qty'))),
        supplier: String(get(r, 'supplier') || '').trim(),
        payment: String(get(r, 'payment') || '').trim(),
        date: date(get(r, 'date')),
        hasCost: col.cost !== undefined && String(get(r, 'cost')).trim() !== '',
        hasPrice: col.price !== undefined && String(get(r, 'price')).trim() !== ''
      };
      if (!name) return Object.assign(x, { status: 'skip', why: 'нет названия' });

      const match = (x.sku && idx.bySku[norm(x.sku)]) || idx.byKey[itemKey(x.name, x.brand, x.volume)] || null;
      x.match = match;

      if (opts.mode === 'price') {
        const k = x.sku ? 's:' + norm(x.sku) : 'k:' + itemKey(x.name, x.brand, x.volume);
        if (seen[k]) return Object.assign(x, { status: 'skip', why: 'повтор строки ' + seen[k] });
        seen[k] = x.n;
        if (!match) return Object.assign(x, opts.addNew
          ? { status: 'new', why: 'новая позиция' }
          : { status: 'skip', why: 'нет в прайсе' });
        const patch = {};
        if (opts.updatePrices && x.hasCost && x.cost > 0 && x.cost !== Number(match.cost)) patch.cost = x.cost;
        if (opts.updatePrices && x.hasPrice && x.price > 0 && x.price !== Number(match.price)) patch.price = x.price;
        if (x.sku && !match.sku) patch.sku = x.sku;
        if (!Object.keys(patch).length) return Object.assign(x, { status: 'same', why: 'уже в прайсе' });
        return Object.assign(x, { status: 'update', patch,
          why: [patch.cost !== undefined ? 'закупка ' + UI.num(match.cost) + ' → ' + UI.num(patch.cost) : '',
                patch.price !== undefined ? 'продажа ' + UI.num(match.price) + ' → ' + UI.num(patch.price) : '',
                patch.sku ? 'артикул' : ''].filter(Boolean).join(' · ') });
      }

      // закупка
      if (!(x.qty > 0)) return Object.assign(x, { status: 'skip', why: col.qty === undefined ? 'нет колонки «Количество»' : 'количество 0' });
      if (match) {
        const cost = x.cost > 0 ? x.cost : Number(match.cost) || 0;
        return Object.assign(x, { status: 'found', cost,
          why: x.cost > 0 && x.cost !== Number(match.cost) ? 'закупка ' + UI.num(match.cost) + ' → ' + UI.num(x.cost) : 'есть в прайсе' });
      }
      if (!opts.addNew) return Object.assign(x, { status: 'skip', why: 'нет в прайсе' });
      return Object.assign(x, { status: 'new', why: 'добавится в прайс' + (x.price > 0 ? '' : ' без цены продажи') });
    });
  }

  const STATUS = {
    new:    { label: 'новая',       cls: 'ok' },
    update: { label: 'обновится',   cls: 'low' },
    same:   { label: 'без изменений', cls: 'neutral' },
    found:  { label: 'в прайсе',    cls: 'ok' },
    skip:   { label: 'пропуск',     cls: 'empty' }
  };

  /* ---------------- окно загрузки ---------------- */

  /**
   * mode: 'price' | 'buys'. ctx — контекст панели администратора.
   * Возвращает промис; запись в базу делает сам через ctx.act.
   */
  async function open(mode, ctx) {
    const isBuys = mode === 'buys';
    const opts = { mode, addNew: true, updatePrices: true, updateCost: true, updatePrice: true };
    const meta = {
      date: new Date().toISOString().slice(0, 10), supplier: '',
      payment: (CFG.payments || [])[0] || '',
      paidMode: /отсроч|долг/i.test((CFG.payments || [])[0] || '') ? 'debt' : 'full', paidAmount: ''
    };
    let state = null;     // { file, rows, headerRow, map }
    let result = [];

    const suppliers = Array.from(new Set((ctx.purchases || []).map(p => p.supplier)
      .concat((ctx.suppliers || []).map(s => s.name)).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'ru'));

    function templateCsv() {
      UI.downloadFile((isBuys ? 'shablon-zakupki' : 'shablon-prays') + '.csv', UI.csv(MODES[mode].template));
      UI.toast('Шаблон скачан — заполните и загрузите обратно', 'ok');
    }

    function dropHtml(err) {
      return '<div class="stack-sm" style="gap:12px">' +
        '<div class="imp-drop" id="impDrop">' + UI.icon('up', 22) +
          '<b style="font-size:14px;color:var(--text)">Выберите файл или перетащите сюда</b>' +
          '<span>CSV из Excel (разделитель «;» или «,»), XLSX. Кодировку определим сами.</span>' +
        '</div>' +
        (err ? '<div style="font-size:13px;color:var(--red)">' + UI.esc(err) + '</div>' : '') +
        '<div style="font-size:12px;color:#64748B;line-height:1.55">' +
          (isBuys
            ? 'Нужны колонки: <b>Название</b> и <b>Количество</b>. Желательно: Фирма, Объём, Артикул, Закупка. ' +
              'Товар ищем в прайсе по артикулу, потом по названию + фирме + объёму. Чего нет — добавим в прайс.'
            : 'Нужна колонка <b>Название</b>. Желательно: Категория, Фирма, Объём, Артикул, Закупка, Продажа. ' +
              'Совпадения ищем по артикулу, потом по названию + фирме + объёму — у найденных обновим цены.') +
          ' Порядок колонок любой, лишние колонки не мешают.' +
          ' <a href="#" id="impTpl" style="color:var(--amber)">Скачать шаблон</a>' +
        '</div>' +
      '</div>';
    }

    function optsHtml() {
      const cb = (id, on, text) => '<label><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '> ' + text + '</label>';
      if (!isBuys) {
        return '<div class="imp-opts">' +
          cb('oNew', opts.addNew, 'Добавлять новые позиции') +
          cb('oUpd', opts.updatePrices, 'Обновлять закупку и продажу у позиций, которые уже есть (цены на стеллажах тоже обновятся)') +
        '</div>';
      }
      return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">' +
          UI.field('Дата поставки', 'mDate', '', 'date', meta.date) +
          '<div class="field"><label for="mSup">Поставщик</label>' +
            '<input class="input sm" id="mSup" list="mSupList" placeholder="Например, Автоформула" value="' + UI.esc(meta.supplier) + '">' +
            '<datalist id="mSupList">' + suppliers.map(s => '<option value="' + UI.esc(s) + '">').join('') + '</datalist></div>' +
          '<div class="field"><label for="mPay">Оплата</label><select class="input sm" id="mPay">' +
            (CFG.payments || []).map(p => '<option' + (p === meta.payment ? ' selected' : '') + '>' + UI.esc(p) + '</option>').join('') +
          '</select></div>' +
          '<div class="field"><label for="mPaid">Оплачено поставщику</label><select class="input sm" id="mPaid">' +
            [['full', 'Сразу, полностью'], ['debt', 'В долг'], ['part', 'Частично']].map(o =>
              '<option value="' + o[0] + '"' + (meta.paidMode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
          '</select></div>' +
          '<div class="field" id="mPaidBox"' + (meta.paidMode === 'part' ? '' : ' style="display:none"') + '>' +
            '<label for="mPaidAmt">Заплатили сразу, ₽</label>' +
            '<input class="input sm" id="mPaidAmt" type="number" placeholder="0" value="' + UI.esc(meta.paidAmount) + '"></div>' +
        '</div>' +
        '<div class="imp-opts" style="margin-top:4px">' +
          cb('oNew', opts.addNew, 'Товар, которого нет в прайсе, — добавить в прайс') +
          cb('oCost', opts.updateCost, 'Новую цену закупки записать в прайс') +
          cb('oPrice', opts.updatePrice, 'Цену продажи из файла записать в прайс (если колонка есть)') +
        '</div>';
    }

    function mapHtml() {
      const allowed = MODES[mode].fields;
      const head = state.headerRow >= 0 ? state.rows[state.headerRow] : [];
      const sample = state.rows[state.headerRow + 1] || [];
      return '<div class="imp-map">' + state.map.map((f, i) => {
        const title = String(head[i] || '').trim() || 'Колонка ' + (i + 1);
        const ex = String(sample[i] === undefined ? '' : sample[i]).slice(0, 24);
        return '<label title="' + UI.esc(title + (ex ? ' — например: ' + ex : '')) + '"><span>' +
            UI.esc(title) + (ex ? ' · <i style="color:#4B5A75">' + UI.esc(ex) + '</i>' : '') + '</span>' +
          '<select class="input" data-col="' + i + '">' +
            '<option value="">— не брать —</option>' +
            allowed.map(k => '<option value="' + k + '"' + (f === k ? ' selected' : '') + '>' + fieldLabel(k) + '</option>').join('') +
          '</select></label>';
      }).join('') + '</div>';
    }

    function previewHtml() {
      const counts = {};
      result.forEach(x => { counts[x.status] = (counts[x.status] || 0) + 1; });
      const go = result.filter(x => x.status !== 'skip' && x.status !== 'same');
      const qty = go.reduce((s, x) => s + (x.qty || 0), 0);
      const sum = go.reduce((s, x) => s + (x.qty || 0) * (x.cost || 0), 0);
      const noPrice = result.filter(x => x.status === 'new' && !(x.price > 0)).length;

      const pill = (st, n) => n ? '<span class="pill sm ' + STATUS[st].cls + '">' + STATUS[st].label + ': ' + n + '</span>' : '';
      const cols = isBuys
        ? ['Стр.', 'Статус', 'Товар', 'Объём', 'Артикул', 'Кол-во', 'Закупка', 'Сумма', 'Что будет']
        : ['Стр.', 'Статус', 'Товар', 'Категория', 'Объём', 'Артикул', 'Закупка', 'Продажа', 'Что будет'];

      return '<div class="imp-sum">' +
          pill('new', counts.new) + pill('update', counts.update) + pill('found', counts.found) +
          pill('same', counts.same) + pill('skip', counts.skip) +
          (isBuys && go.length ? '<span class="pill sm neutral">итого ' + UI.num(qty) + ' шт · ' + UI.money(sum) + '</span>' : '') +
        '</div>' +
        (noPrice ? '<div style="font-size:12px;color:var(--orange)">У ' + noPrice +
          ' новых позиций нет цены продажи — поставьте её потом в прайсе, иначе продажи пойдут по 0 ₽.</div>' : '') +
        '<div class="imp-prev"><table class="grid"><thead><tr>' +
          cols.map((c, i) => '<th' + (i >= 5 && i <= 7 ? ' class="r"' : '') + '>' + c + '</th>').join('') +
        '</tr></thead><tbody>' +
        result.slice(0, 300).map(x => {
          const st = STATUS[x.status];
          return '<tr' + (x.status === 'skip' ? ' style="opacity:.55"' : '') + '>' +
            '<td style="color:#4B5A75">' + x.n + '</td>' +
            '<td><span class="pill sm ' + st.cls + '">' + st.label + '</span></td>' +
            '<td><div class="prod"><b>' + UI.esc(x.name || '—') + '</b><small>' + UI.esc(x.brand || '') + '</small></div></td>' +
            (isBuys ? '' : '<td>' + UI.catBadge(x.category) + '</td>') +
            '<td>' + UI.esc(x.volume || '—') + '</td>' +
            '<td><span class="sku">' + UI.esc(x.sku || '—') + '</span></td>' +
            (isBuys
              ? '<td class="r">' + (x.qty || '—') + '</td><td class="r">' + (x.cost ? UI.num(x.cost) : '—') + '</td>' +
                '<td class="r">' + (x.qty && x.cost ? UI.num(x.qty * x.cost) : '—') + '</td>'
              : '<td class="r">' + (x.cost ? UI.num(x.cost) : '—') + '</td><td class="r">' + (x.price ? UI.num(x.price) : '—') + '</td>') +
            '<td style="font-size:11px;color:#8494AC">' + UI.esc(x.why || '') + '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>' +
        (result.length > 300 ? '<div style="font-size:12px;color:#64748B">Показаны первые 300 строк из ' + result.length + ' — загрузятся все.</div>' : '');
    }

    function bodyHtml() {
      if (!state) return '<div id="impBody">' + dropHtml('') + '</div>';
      return '<div id="impBody" class="stack-sm" style="gap:14px">' +
        '<div class="row-between" style="gap:10px;flex-wrap:wrap">' +
          '<div style="font-size:13px"><b>' + UI.esc(state.file) + '</b> <span style="color:#64748B">· строк: ' +
            (state.rows.length - state.headerRow - 1) + (state.headerRow >= 0 ? ' · заголовки в строке ' + (state.headerRow + 1) : ' · без заголовков') + '</span></div>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="impOther">Другой файл</button>' +
        '</div>' +
        optsHtml() +
        '<div class="stack-sm" style="gap:6px"><div style="font-size:12px;color:#8494AC">Какая колонка чем является — поправьте, если угадали неверно:</div>' + mapHtml() + '</div>' +
        '<div id="impPrev" class="stack-sm" style="gap:10px">' + previewHtml() + '</div>' +
      '</div>';
    }

    let root = null;
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.csv,.txt,.tsv,.xlsx,.xls,.ods,text/csv';

    function recompute() {
      result = analyze(state, ctx.catalog || [], opts);
      const p = root.querySelector('#impPrev');
      if (p) p.innerHTML = previewHtml();
    }

    function paint(err) {
      const host = root.querySelector('#impBody');
      host.outerHTML = state ? bodyHtml() : '<div id="impBody">' + dropHtml(err) + '</div>';
      wire();
    }

    async function takeFile(f) {
      if (!f) return;
      try {
        const rows = await readFile(f);
        const d = detect(rows, mode);
        state = { file: f.name, rows, headerRow: d.headerRow, map: d.map };
        result = analyze(state, ctx.catalog || [], opts);
        paint();
      } catch (e) {
        state = null;
        paint(e.message || 'Не удалось прочитать файл');
      }
    }

    function wire() {
      const drop = root.querySelector('#impDrop');
      if (drop) {
        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('over'));
        drop.addEventListener('drop', (e) => {
          e.preventDefault(); drop.classList.remove('over');
          takeFile(e.dataTransfer.files && e.dataTransfer.files[0]);
        });
      }
      const tpl = root.querySelector('#impTpl');
      if (tpl) tpl.addEventListener('click', (e) => { e.preventDefault(); templateCsv(); });
      const other = root.querySelector('#impOther');
      if (other) other.addEventListener('click', () => fileInput.click());

      root.querySelectorAll('[data-col]').forEach(sel => sel.addEventListener('change', () => {
        const i = Number(sel.dataset.col);
        if (sel.value) state.map = state.map.map((f, j) => (j !== i && f === sel.value) ? '' : f);
        state.map[i] = sel.value;
        root.querySelectorAll('[data-col]').forEach(s2 => { s2.value = state.map[Number(s2.dataset.col)] || ''; });
        recompute();
      }));
      const on = (id, fn) => { const el = root.querySelector('#' + id); if (el) el.addEventListener('change', () => { fn(el); recompute(); }); };
      on('oNew', el => { opts.addNew = el.checked; });
      on('oUpd', el => { opts.updatePrices = el.checked; });
      on('oCost', el => { opts.updateCost = el.checked; });
      on('oPrice', el => { opts.updatePrice = el.checked; });
      const inp = (id, key) => { const el = root.querySelector('#' + id); if (el) el.addEventListener('input', () => { meta[key] = el.value; }); };
      inp('mDate', 'date'); inp('mSup', 'supplier');
      const pay = root.querySelector('#mPay');
      const paidSel = root.querySelector('#mPaid');
      const paidBox = root.querySelector('#mPaidBox');
      const syncPaid = () => { if (paidBox) paidBox.style.display = meta.paidMode === 'part' ? '' : 'none'; };
      if (pay) pay.addEventListener('change', () => {
        meta.payment = pay.value;
        if (paidSel && /отсроч|долг/i.test(pay.value)) { meta.paidMode = 'debt'; paidSel.value = 'debt'; syncPaid(); }
      });
      if (paidSel) paidSel.addEventListener('change', () => { meta.paidMode = paidSel.value; syncPaid(); });
      inp('mPaidAmt', 'paidAmount');
    }

    fileInput.addEventListener('change', () => {
      takeFile(fileInput.files && fileInput.files[0]);
      fileInput.value = '';
    });

    let job = null;
    await UI.modal({
      title: isBuys ? 'Закупка из файла' : 'Прайс из файла',
      subtitle: isBuys
        ? 'Целая накладная или прайс поставщика одним файлом — каждая строка станет закупкой'
        : 'Загрузите прайс целиком — новые позиции добавятся, у найденных обновятся цены',
      cls: 'xwide',
      noFocus: true,
      body: bodyHtml(),
      onOpen: (r) => { root = r; wire(); },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: isBuys ? 'Провести закупку' : 'Загрузить в прайс', kind: 'btn-primary',
          onClick: () => {
            if (!state) { UI.toast('Сначала выберите файл', 'err'); return false; }
            if (!state.map.includes('name')) { UI.toast('Укажите, какая колонка — «Название»', 'err'); return false; }
            if (isBuys && !state.map.includes('qty')) { UI.toast('Укажите, какая колонка — «Количество»', 'err'); return false; }
            const go = result.filter(x => x.status !== 'skip' && x.status !== 'same');
            if (!go.length) { UI.toast('Загружать нечего — все строки пропускаются', 'err'); return false; }
            if (isBuys && !meta.date) { UI.toast('Укажите дату поставки', 'err'); return false; }
            if (isBuys && meta.paidMode !== 'full' && !String(meta.supplier || '').trim()) {
              UI.toast('Накладная в долг — укажите поставщика, иначе долг некому будет оплатить', 'err'); return false;
            }
            if (isBuys && meta.paidMode === 'part' && !(Number(meta.paidAmount) > 0)) {
              UI.toast('Укажите, сколько заплатили сразу', 'err'); return false;
            }
            job = go;
            return true;
          }
        }
      ]
    });

    if (!job) return;
    const STORE = window.LC_STORE;
    if (!isBuys) {
      const add = job.filter(x => x.status === 'new').map(x => ({
        category: x.category, name: x.name, brand: x.brand, volume: x.volume, sku: x.sku, cost: x.cost, price: x.price
      }));
      const update = job.filter(x => x.status === 'update').map(x => ({ id: x.match.id, patch: x.patch }));
      ctx.act(() => STORE.importCatalog({ add, update, file: state.file }, ctx.user),
        (r) => 'Прайс загружен: добавлено ' + r.added + ', обновлено ' + r.updated);
      return;
    }
    // одинаковые новые товары в разных строках — одна позиция прайса
    const fresh = {};
    const lines = job.map(x => {
      const line = { qty: x.qty, cost: x.cost, price: x.hasPrice ? x.price : 0,
        supplier: x.supplier, payment: x.payment, date: x.date };
      if (x.match) line.catalog_id = x.match.id;
      else {
        const k = x.sku ? 's:' + norm(x.sku) : 'k:' + itemKey(x.name, x.brand, x.volume);
        fresh[k] = fresh[k] || { category: x.category, name: x.name, brand: x.brand, volume: x.volume,
          sku: x.sku, cost: x.cost, price: x.price };
        line.newCat = fresh[k];
      }
      return line;
    });
    ctx.act(() => STORE.importPurchases(lines, Object.assign({}, meta, {
        updateCost: opts.updateCost, updatePrice: opts.updatePrice, file: state.file
      }), ctx.user),
      (r) => 'Закупка проведена: ' + r.lines + ' строк, ' + UI.num(r.qty) + ' шт на ' + UI.money(r.sum) +
        (r.created ? ' · новых в прайсе: ' + r.created : '') + (r.updated ? ' · цены обновлены: ' + r.updated : ''));
  }

  return { open, parseCsv, num, date, detect, analyze };
})();



/* ============================================================
   Lube Control — ПРАЙС
   Справочник всех жидкостей, которыми торгуем.
   Виден только администратору. Позиции отсюда ставятся на стеллажи.
   ============================================================ */

window.LC_PRICE = (function () {
  const CFG = window.LC_CONFIG;
  const STORE = window.LC_STORE;
  const UI = window.LC_UI;

  let ctx = null;
  let query = '';
  let cat = 'all';
  let showArchived = false;
  let sort = { key: 'name', dir: 1 };

  /* ---------------- расчёты по позиции ---------------- */

  function stats(c) {
    const onRacks = [];
    ctx.racks.forEach(r => r.items.forEach(i => { if (i.catalog_id === c.id) onRacks.push({ r, i }); }));
    const capacity = onRacks.reduce((s, x) => s + x.i.max, 0);

    const from = Date.now() - 30 * 864e5;
    const sold = ctx.ops.filter(o =>
      o.type === 'sale' && !o.cancelled && o.item_name === c.name &&
      (!o.brand || !c.brand || o.brand === c.brand) &&
      new Date(o.created_at).getTime() >= from);
    const soldQty = sold.reduce((s, o) => s + o.qty, 0);
    const revenue = sold.reduce((s, o) => s + Number(o.amount || 0), 0);
    const lastSale = sold.length ? sold[0].created_at : null;

    const bought = (ctx.purchases || []).filter(p => p.catalog_id === c.id)
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.created_at).localeCompare(String(a.created_at)));
    const boughtQty = bought.reduce((s, p) => s + (Number(p.qty) || 0), 0);
    const lastBuy = bought.length ? bought[0] : null;
    // последнее изменение цены закупки: последняя закупка против предыдущей с другой ценой
    let trend = null;
    if (lastBuy) {
      const prev = bought.find(p => p !== lastBuy && Number(p.cost) !== Number(lastBuy.cost));
      if (prev && Number(prev.cost)) {
        const diff = Number(lastBuy.cost) - Number(prev.cost);
        trend = { diff, pct: Math.round(diff / Number(prev.cost) * 1000) / 10, from: prev };
      }
    }
    const stock = (ctx.stock || {})[c.id] || 0;

    const margin = (Number(c.price) || 0) - (Number(c.cost) || 0);
    const marginPct = c.price ? Math.round(margin / c.price * 100) : 0;

    const minM = Number((CFG.rules || {}).minMargin) || 0;
    const warn = !c.archived && Number(c.price) > 0 && (marginPct < minM ||
      (lastBuy && Number(lastBuy.cost) > Number(c.cost)))
      ? (lastBuy && Number(lastBuy.cost) > Number(c.cost)
          ? 'Последняя закупка ' + UI.num(lastBuy.cost) + ' ₽ — дороже, чем в прайсе (' + UI.num(c.cost) + ' ₽). Проверьте цену продажи.'
          : 'Наценка ' + marginPct + '% — ниже порога ' + minM + '% из «Настроек».')
      : '';
    return { onRacks, onRacksQty: onRacks.reduce((s, x) => s + x.i.qty, 0), capacity, trend, warn,
      soldQty, revenue, lastSale, margin, marginPct, stock, boughtQty, lastBuy,
      points: new Set(onRacks.map(x => x.r.code)).size };
  }

  function rows() {
    const q = query.trim().toLowerCase();
    let list = ctx.catalog.filter(c => {
      if (!!c.archived !== showArchived) return false;
      if (cat !== 'all' && c.category !== cat) return false;
      if (!q) return true;
      return (c.name + ' ' + (c.brand || '') + ' ' + (c.sku || '') + ' ' + (c.volume || ''))
        .toLowerCase().includes(q);
    }).map(c => ({ c, s: stats(c) }));

    const get = {
      name: x => (x.c.name + ' ' + (x.c.brand || '')).toLowerCase(),
      brand: x => (x.c.brand || '').toLowerCase(),
      category: x => UI.catOf(x.c.category).label,
      cost: x => Number(x.c.cost) || 0,
      price: x => Number(x.c.price) || 0,
      margin: x => x.s.margin,
      stock: x => x.s.onRacksQty,
      wh: x => x.s.stock,
      bought: x => x.s.boughtQty,
      sold: x => x.s.soldQty,
      revenue: x => x.s.revenue,
      created: x => x.c.created_at || ''
    }[sort.key] || (x => x.c.name);

    list.sort((a, b) => {
      const va = get(a), vb = get(b);
      if (va < vb) return -sort.dir;
      if (va > vb) return sort.dir;
      return 0;
    });
    return list;
  }

  /* ---------------- отрисовка ---------------- */

  const TH = [
    { key: 'name', label: 'Товар', hint: 'Название и фирма' },
    { key: 'category', label: 'Категория' },
    { key: null, label: 'Объём' },
    { key: null, label: 'Артикул' },
    { key: 'cost', label: 'Закупка ₽', cls: 'r', hint: 'Почём вы покупаете 1 шт у поставщика. ▲ красным — последняя закупка дороже прошлой, ▼ зелёным — дешевле. Полная история — кнопка с часами или клик по названию' },
    { key: 'price', label: 'Продажа ₽', cls: 'r', hint: 'Почём продавец продаёт 1 шт клиенту' },
    { key: 'margin', label: 'Маржа', cls: 'r', hint: 'Сколько вы зарабатываете с 1 шт: продажа − закупка. Процент — доля от цены продажи' },
    { key: 'wh', label: 'На складе', cls: 'r', hint: 'Лежит у вас, ещё не отвезено: всё закупленное минус всё, что поставили на стеллажи' },
    { key: 'stock', label: 'На стеллажах', cls: 'r', hint: 'Стоит сейчас на полках СТО / сколько туда помещается · на скольких точках' },
    { key: 'bought', label: 'Закуплено', cls: 'r', hint: 'Сколько всего закупили за всё время · последняя цена закупки' },
    { key: 'sold', label: 'Продано 30д', cls: 'r', hint: 'Сколько штук продали на всех точках за последние 30 дней' },
    { key: 'revenue', label: 'Выручка 30д', cls: 'r', hint: 'Сколько денег получили за эти продажи' },
    { key: 'created', label: 'В прайсе с', cls: 'r', hint: 'Когда позицию завели в прайс' },
    { key: null, label: '', cls: 'r' }
  ];

  function render(host, context) {
    ctx = context;
    ctx.stock = STORE.warehouse(ctx.purchases, ctx.ops);   // склад считаем до таблицы
    const list = rows();
    const active = ctx.catalog.filter(c => !c.archived);
    const archivedCount = ctx.catalog.length - active.length;

    const stockSum = ctx.racks.reduce((s, r) =>
      s + r.items.reduce((t, i) => t + i.qty * (i.cost || 0), 0), 0);
    const byId = {};
    (ctx.catalog || []).forEach(c => { byId[c.id] = c; });
    let whQty = 0, whSum = 0;
    Object.keys(ctx.stock).forEach(id => {
      const n = ctx.stock[id];
      if (n > 0) { whQty += n; whSum += n * (Number((byId[id] || {}).cost) || 0); }
    });
    const sold30 = ctx.ops.filter(o => o.type === 'sale' && !o.cancelled &&
      new Date(o.created_at).getTime() >= Date.now() - 30 * 864e5);
    const revenue30 = sold30.reduce((s, o) => s + Number(o.amount || 0), 0);
    const margin30 = sold30.reduce((s, o) => s + Number(o.margin || 0), 0);
    const avgMargin = active.length
      ? Math.round(active.reduce((s, c) => s + (c.price ? ((c.price - c.cost) / c.price * 100) : 0), 0) / active.length)
      : 0;

    host.innerHTML =
      '<main class="page">' +
        '<div class="page-head">' +
          '<div><h1>Прайс</h1><p>Все жидкости, которыми торгуем. Отсюда позиции ставятся на стеллажи.</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn btn-ghost" id="pImport">' + UI.icon('up', 15) + '<span>Загрузить из файла</span></button>' +
            '<button class="btn btn-ghost" id="pExport">' + UI.icon('down', 15) + '<span>Выгрузить прайс</span></button>' +
            '<button class="btn btn-primary" id="pAdd">' + UI.icon('plus', 15, '#12161F', 2) + '<span>Позиция в прайс</span></button>' +
          '</div>' +
        '</div>' +

        '<section class="kpi-grid six">' +
          kpi('Позиций в прайсе', UI.num(active.length) + (archivedCount ? '<small> +' + archivedCount + ' в архиве</small>' : '')) +
          kpi('Средняя наценка', avgMargin + '<small> %</small>') +
          kpi('На складе', UI.num(whQty) + '<small> шт</small>', whQty ? 'var(--green)' : '#8494AC') +
          kpi('Товара на стеллажах', UI.money(stockSum), 'var(--amber)') +
          kpi('Выручка за 30 дней', UI.money(revenue30), '#3DDC84') +
          kpi('Маржа за 30 дней', UI.money(margin30), '#3DDC84') +
        '</section>' +

        '<div class="toolbar">' +
          '<div class="search">' + UI.icon('search', 15, '#64748B', 1.8) +
            '<input id="pSearch" type="search" placeholder="Название, фирма или артикул…" value="' + UI.esc(query) + '"></div>' +
          '<div class="filters" id="pCats">' +
            chip('all', 'Все', cat === 'all') +
            CFG.categories.map(c => chip(c.key, c.label, cat === c.key)).join('') +
          '</div>' +
          '<div class="grow"></div>' +
          '<button class="btn btn-ghost btn-sm" id="pArch">' + UI.icon('archive', 14) +
            '<span>' + (showArchived ? 'Показать рабочие' : 'Архив · ' + archivedCount) + '</span></button>' +
        '</div>' +

        '<details class="card flat" style="font-size:13px;color:#B9C6DA;line-height:1.6">' +
          '<summary style="cursor:pointer;color:var(--amber)">Как читать таблицу</summary>' +
          '<div class="stack-sm" style="gap:4px;margin-top:10px">' +
            TH.filter(t => t.hint).map(t => '<div><b>' + t.label + '</b> — ' + UI.esc(t.hint) + '.</div>').join('') +
            '<div style="margin-top:6px;color:#8494AC">Оранжевая полоса слева и ⚠ — наценка ниже ' + ((CFG.rules || {}).minMargin || 0) +
              '% (порог в «Настройках») или последняя закупка дороже, чем закупка в прайсе.</div>' +
            '<div style="margin-top:6px;color:#8494AC">Путь товара: <b>Закупки</b> (пришло на склад) → <b>Стеллажи</b> ' +
              '(со склада на полку) → <b>продажа</b> у продавца. Если в «На складе» стоит ⚠, значит на полки поставили больше, ' +
              'чем внесено закупок: внесите закупку или очистите историю в «Движениях».</div>' +
          '</div>' +
        '</details>' +
        (list.length
          ? '<div class="grid-wrap"><table class="grid"><thead><tr>' +
              TH.map(t => '<th class="' + (t.cls || '') + (t.key ? ' sortable' : '') +
                (sort.key === t.key ? ' sorted' : '') + '"' + (t.hint ? ' title="' + UI.esc(t.hint) + '"' : '') +
                (t.key ? ' data-sort="' + t.key + '"' : '') + '>' + t.label +
                (sort.key === t.key ? (sort.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>').join('') +
            '</tr></thead><tbody>' + list.map(row).join('') + '</tbody></table></div>'
          : '<div class="empty-state">' +
              (showArchived ? 'В архиве пусто.'
                : (ctx.catalog.length ? 'Ничего не найдено — измените поиск или фильтр.'
                  : 'Прайс пока пустой. Добавьте первую позицию — например «Антифриз G12, HEPU, 5 л».')) +
            '</div>') +
      '</main>';

    bind(host);
  }

  function kpi(label, value, color) {
    return '<div class="card kpi compact"><span class="label">' + label + '</span>' +
      '<span class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span></div>';
  }

  function chip(key, label, on) {
    return '<button class="chip' + (on ? ' active' : '') + '" data-cat="' + key + '">' + UI.esc(label) + '</button>';
  }

  function row(x) {
    const c = x.c, s = x.s;
    const stockCls = s.onRacksQty === 0 && s.onRacks.length ? ' neg' : '';
    const trend = s.trend
      ? ' <span class="trend ' + (s.trend.diff > 0 ? 'up' : 'down') + '" title="Последняя закупка ' +
          (s.trend.diff > 0 ? 'дороже' : 'дешевле') + ' прошлой на ' + UI.num(Math.abs(s.trend.diff)) + ' ₽ (' +
          (s.trend.diff > 0 ? '+' : '') + s.trend.pct + '%): было ' + UI.num(s.trend.from.cost) + ' у ' +
          UI.esc(s.trend.from.supplier || 'не указан') + '">' + (s.trend.diff > 0 ? '▲' : '▼') + Math.abs(s.trend.pct) + '%</span>'
      : '';
    return '<tr class="' + (c.archived ? 'archived' : '') + (s.warn ? ' low-margin' : '') + '" data-id="' + c.id + '"' +
      (s.warn ? ' title="' + UI.esc(s.warn) + '"' : '') + '>' +
      '<td><div class="prod"><b style="cursor:pointer" data-act="history">' + UI.esc(c.name) + '</b>' +
        '<small>' + UI.esc(c.brand || '—') + (s.warn ? ' · <span style="color:var(--orange)">⚠ наценка</span>' : '') + '</small></div></td>' +
      '<td>' + UI.catBadge(c.category) + '</td>' +
      '<td class="num">' + UI.esc(c.volume || '—') + '</td>' +
      '<td><span class="sku">' + UI.esc(c.sku || '—') + '</span></td>' +
      '<td class="r" style="color:#8494AC;white-space:nowrap">' + UI.num(c.cost) + trend + '</td>' +
      '<td class="r">' + UI.num(c.price) + '</td>' +
      '<td class="r ' + (s.margin > 0 ? 'pos' : s.margin < 0 ? 'neg' : '') + '">' +
        (s.margin > 0 ? '+' : '') + UI.num(s.margin) +
        ' <span style="color:#4B5A75">' + s.marginPct + '%</span></td>' +
      '<td class="r ' + (s.stock > 0 ? 'pos' : '') + '">' +
        (s.stock > 0 ? s.stock + ' шт'
          : s.stock < 0
            ? '<span title="На стеллажи поставлено на ' + (-s.stock) + ' шт больше, чем внесено закупок. ' +
                'Внесите закупку или очистите историю." style="color:var(--orange);cursor:help">0 ⚠ ' +
                '<small style="font-size:10px">без закупки ' + (-s.stock) + '</small></span>'
            : '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r' + stockCls + '">' + (s.onRacks.length
        ? s.onRacksQty + ' / ' + s.capacity + ' <span style="color:#4B5A75">· ' + s.points + ' СТО</span>'
        : '<span style="color:#4B5A75">не стоит</span>') + '</td>' +
      '<td class="r">' + (s.boughtQty
        ? s.boughtQty + ' шт' + (s.lastBuy
            ? ' <span style="color:#4B5A75">· посл. ' + UI.num(s.lastBuy.cost) + '</span>' : '')
        : '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r">' + (s.soldQty || '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r">' + (s.revenue ? UI.num(s.revenue) : '<span style="color:#4B5A75">0</span>') + '</td>' +
      '<td class="r" style="color:#64748B">' + (c.created_at ? UI.dateFull(c.created_at) : '—') + '</td>' +
      '<td class="r"><div class="row-act">' +
        '<button class="icon-btn sm" data-act="history" title="История товара: закупки, поставщики, цены">' + UI.icon('history', 14) + '</button>' +
        (c.archived
          ? '<button class="icon-btn sm" data-act="restore" title="Вернуть в прайс">' + UI.icon('undo', 14) + '</button>' +
            '<button class="icon-btn sm danger" data-act="delete" title="Удалить насовсем">' + UI.icon('trash', 14) + '</button>'
          : '<button class="icon-btn sm" data-act="edit" title="Изменить">' + UI.icon('edit', 14) + '</button>' +
            '<button class="icon-btn sm danger" data-act="archive" title="Убрать из прайса">' + UI.icon('archive', 14) + '</button>') +
      '</div></td>' +
    '</tr>';
  }

  /* ---------------- события ---------------- */

  function bind(host) {
    const rerender = () => render(host, ctx);

    const s = host.querySelector('#pSearch');
    if (s) s.addEventListener('input', (e) => {
      query = e.target.value;
      rerender();
      const el = host.querySelector('#pSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });

    const cats = host.querySelector('#pCats');
    if (cats) cats.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      cat = b.dataset.cat;
      rerender();
    });

    const arch = host.querySelector('#pArch');
    if (arch) arch.addEventListener('click', () => { showArchived = !showArchived; rerender(); });

    const add = host.querySelector('#pAdd');
    if (add) add.addEventListener('click', () => editModal(null));

    const exp = host.querySelector('#pExport');
    if (exp) exp.addEventListener('click', exportCsv);

    const imp = host.querySelector('#pImport');
    if (imp) imp.addEventListener('click', () => window.LC_IMPORT.open('price', ctx));

    const table = host.querySelector('.grid');
    if (!table) return;

    table.querySelectorAll('[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sort.key === key) sort.dir = -sort.dir;
        else sort = { key, dir: key === 'name' || key === 'category' ? 1 : -1 };
        rerender();
      });
    });

    table.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.closest('tr').dataset.id;
      const c = ctx.catalog.find(x => x.id === id);
      if (!c) return;
      const a = b.dataset.act;
      if (a === 'edit') editModal(c);
      if (a === 'history') historyModal(c);
      if (a === 'archive') archive(c, true);
      if (a === 'restore') archive(c, false);
      if (a === 'delete') remove(c);
    });
  }

  async function archive(c, on) {
    if (on) {
      const s = stats(c);
      const ok = await UI.confirmBox('Убрать «' + c.name + '» из прайса?',
        s.onRacks.length
          ? 'Позиция стоит на ' + s.points + ' СТО — там она останется, но новые стеллажи ей заполнить будет нельзя. Вернуть из архива можно в любой момент.'
          : 'Позиция уйдёт в архив. История продаж и движений сохранится, вернуть можно в любой момент.',
        'Убрать в архив', 'btn-danger');
      if (!ok) return;
    }
    ctx.act(() => STORE.archiveCatalogItem(c.id, on, ctx.user),
      on ? 'Позиция убрана в архив' : 'Позиция вернулась в прайс');
  }

  async function remove(c) {
    const ok = await UI.confirmBox('Удалить «' + c.name + '» насовсем?',
      'Строка исчезнет из прайса полностью. Записи в движениях товара останутся.',
      'Удалить', 'btn-danger');
    if (!ok) return;
    ctx.act(() => STORE.deleteCatalogItem(c.id, ctx.user), 'Позиция удалена');
  }

  /* ---------------- окно заведения / правки ---------------- */

  function editModal(c) {
    const isNew = !c;
    const v = c || { category: 'motor', name: '', brand: '', volume: '', sku: '', cost: '', price: '' };

    UI.modal({
      title: isNew ? 'Позиция в прайс' : 'Изменить позицию',
      subtitle: isNew ? 'Название, фирма, объём — как на канистре' : (v.brand ? v.brand + ' · ' + v.name : v.name),
      wide: true,
      body:
        '<div class="stack-sm" style="gap:14px">' +
          '<div class="field"><label for="c-cat">Категория</label>' +
            '<select class="input sm" id="c-cat">' +
              CFG.categories.map(x => '<option value="' + x.key + '"' +
                (x.key === v.category ? ' selected' : '') + '>' + UI.esc(x.label) + '</option>').join('') +
            '</select></div>' +
          '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px">' +
            UI.combo('Название', 'c-name', 'Антифриз G12', v.name, ctx.catalog.map(x => x.name)) +
            UI.combo('Фирма', 'c-brand', 'HEPU', v.brand, ctx.catalog.map(x => x.brand)) +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">' +
            UI.combo('Объём', 'c-volume', '5 л', v.volume,
              ['0,5 л', '1 л', '4 л', '5 л', '20 л', '60 л', '208 л'].concat(ctx.catalog.map(x => x.volume))) +
            UI.field('Артикул', 'c-sku', 'P999-G12', 'text', v.sku) +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end">' +
            UI.field('Закупка, ₽', 'c-cost', '320', 'number', v.cost) +
            UI.field('Продажа, ₽', 'c-price', '490', 'number', v.price) +
            '<div class="field"><label>Маржа</label>' +
              '<div class="input sm mono" id="c-margin" style="display:flex;align-items:center;color:#3DDC84">—</div></div>' +
          '</div>' +
        '</div>',
      onOpen: (root) => {
        const calc = () => {
          const cost = Number(root.querySelector('#c-cost').value) || 0;
          const price = Number(root.querySelector('#c-price').value) || 0;
          const m = price - cost;
          const box = root.querySelector('#c-margin');
          box.textContent = price ? (m > 0 ? '+' : '') + UI.num(m) + ' ₽ · ' + Math.round(m / price * 100) + '%' : '—';
          box.style.color = m > 0 ? '#3DDC84' : m < 0 ? '#FF5A5F' : '#8494AC';
        };
        root.querySelector('#c-cost').addEventListener('input', calc);
        root.querySelector('#c-price').addEventListener('input', calc);
        calc();
      },
      actions: [
        { label: 'Отмена', value: null },
        {
          label: isNew ? 'Добавить в прайс' : 'Сохранить', kind: 'btn-primary',
          onClick: (root) => {
            const get = (id) => root.querySelector('#' + id).value.trim();
            const data = {
              category: get('c-cat'), name: get('c-name'), brand: get('c-brand'),
              volume: get('c-volume'), sku: get('c-sku'),
              cost: get('c-cost'), price: get('c-price')
            };
            if (!data.name) { UI.toast('Укажите название', 'err'); return false; }
            if (Number(data.price) < Number(data.cost)) {
              UI.toast('Цена продажи ниже закупки — проверьте', 'err');
            }
            ctx.act(
              () => isNew ? STORE.addCatalogItem(data, ctx.user) : STORE.updateCatalogItem(c.id, data, ctx.user),
              isNew ? 'Позиция добавлена в прайс' : 'Позиция обновлена'

          }
        }
      ]
    });

  /* ---------------- история товара ----------------
     Все закупки (у кого, почём, сколько), лучшие и худшие цены по поставщикам,
     как менялись закупка и продажа в прайсе. Плюс график. */

  const fmtD = (s) => { const p = String(s || '').split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0].slice(2) : s; };
  const signedPct = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n) + '%';

  /** Как менялся прайс: [{ t, cost, price, source, user, costOld, priceOld }]. */
  function priceSteps(c) {
    const rows = (ctx.priceHistory || []).filter(h => h.catalog_id === c.id)
      .map(h => ({ t: h.created_at, cost: Number(h.cost_new) || 0, price: Number(h.price_new) || 0,
        costOld: Number(h.cost_old) || 0, priceOld: Number(h.price_old) || 0, source: h.source || '', user: h.user_name || '' }));
    if (!rows.length) {
      // до версии 9 изменения писались только в журнал: «закупка 320 / продажа 490»
      ctx.ops.filter(o => o.type === 'price_edit' && (o.catalog_id ? o.catalog_id === c.id : (o.item_name === c.name && (o.brand || '') === (c.brand || ''))))
        .forEach(o => {
          const m = /закупка (\d+(?:[.,]\d+)?) \/ продажа (\d+(?:[.,]\d+)?)/.exec(o.note || '');
          if (m) rows.push({ t: o.created_at, cost: Number(m[1].replace(',', '.')), price: Number(m[2].replace(',', '.')),
            costOld: null, priceOld: null, source: 'правка прайса', user: o.user_name || '' });
        });
    }
    return rows.sort((a, b) => String(a.t).localeCompare(String(b.t)));
  }

  function chartSvg(c, buys, steps) {
    const now = Date.now();
    const T = (s) => new Date(String(s).length === 10 ? s + 'T12:00:00' : s).getTime();
    const pts = buys.map(p => ({ t: T(p.date), v: Number(p.cost) || 0, p }));
    // линии прайса: от первого известного значения до сегодня, ступеньками
    const line = (key, oldKey) => {
      const out = [];
      steps.forEach((s, i) => {
        if (i === 0 && s[oldKey] !== null && s[oldKey] !== undefined) {
          out.push({ t: Math.min(T(c.created_at || s.t), T(s.t)), v: s[oldKey] });
        }
        out.push({ t: T(s.t), v: s[key] });
      });
      if (!out.length) out.push({ t: T(c.created_at || new Date(now).toISOString()), v: Number(c[key]) || 0 });
      out.push({ t: now, v: Number(c[key]) || 0 });
      return out;
    };
    const salePts = line('price', 'priceOld');
    const costPts = line('cost', 'costOld');
    const all = pts.concat(salePts, costPts).filter(x => x.v > 0 && isFinite(x.t));
    if (!all.length) return '';
    let t0 = Math.min.apply(null, all.map(x => x.t)), t1 = Math.max(now, Math.max.apply(null, all.map(x => x.t)));
    if (t1 - t0 < 864e5 * 7) t0 = t1 - 864e5 * 7;
    // линии прайса тянем от левого края: до первой правки цена была такой же
