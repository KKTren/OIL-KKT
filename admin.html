<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель администратора — Lube Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2B705' stroke-width='2'><path d='M12 3.5c3.2 3.6 5.5 6.4 5.5 9.2a5.5 5.5 0 0 1-11 0c0-2.8 2.3-5.6 5.5-9.2Z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar" id="topbar"></header>
<div data-mode-banner></div>

<main class="page">

  <div class="page-head">
    <div>
      <h1>Панель администратора</h1>
      <p id="subLine">Мониторинг остатков</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" id="btnExport"></button>
      <button class="btn btn-primary" id="btnAddRack"></button>
    </div>
  </div>

  <section class="kpi-grid" id="kpis"></section>

  <div class="split">
    <div class="stack" id="leftCol">
      <div class="section-head">
        <h2 id="listTitle">Стеллажи на СТО</h2>
        <div class="row" style="gap:10px;flex-wrap:wrap">
          <div class="search">
            <span id="searchIcon"></span>
            <input id="search" type="search" placeholder="СТО, адрес или код…" aria-label="Поиск по стеллажам">
          </div>
          <div class="filters" id="filters"></div>
        </div>
      </div>
      <div class="stack" id="racks"></div>
    </div>

    <aside class="stack" id="rightCol"></aside>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
