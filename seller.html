<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочее место продавца — Lube Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2B705' stroke-width='2'><path d='M12 3.5c3.2 3.6 5.5 6.4 5.5 9.2a5.5 5.5 0 0 1-11 0c0-2.8 2.3-5.6 5.5-9.2Z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar" id="topbar"></header>
<div data-mode-banner></div>

<main class="page">

  <div class="page-head">
    <div>
      <h1>Рабочее место продавца</h1>
      <p id="subLine">Отметьте продажу — остаток сразу увидит администратор</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" id="btnAudit">Сверка остатков</button>
      <button class="btn btn-warn" id="btnRequest"></button>
    </div>
  </div>

  <div class="split">
    <div class="stack">
      <div class="section-head">
        <h2 id="rackTitle">Мой стеллаж</h2>
        <span class="mono" style="font-size:12px;color:#64748B" id="rackMeta"></span>
      </div>
      <div class="goods-grid" id="goods"></div>

      <section class="card stack-sm" style="margin-top:4px">
        <div class="row-between">
          <span class="display" style="font-size:15px;font-weight:600">Продажи за смену</span>
          <span style="font-size:12px;color:#64748B" id="todayDate"></span>
        </div>
        <div id="log"></div>
      </section>
    </div>

    <aside class="stack" id="side"></aside>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/seller.js"></script>
</body>
</html>
